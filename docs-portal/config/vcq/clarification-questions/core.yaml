# Vendor Clarification Questions - Core Requirements
# These questions help assess the depth and completeness of vendor compliance.
#
# Usage: For each VCQ requirement, these sub-questions probe specific capabilities,
# lifecycle coverage, automation levels, and compliance evidence. Vendors should
# provide substantive answers, not just yes/no affirmations.

schemaVersion: 1
sourceFile: requirements/core.yaml
modelPasses:
  opus: true # Completed 2026-01-30 - All core requirements processed
  gemini: true # Completed 2026-01-30 - Gemini review pass finished

requirements:
  # ============================================================================
  # VEND-CORE-001: No-Storage Mandate
  # Requirement: Intermediaries shall not store data about the content of transactions
  # ============================================================================
  VEND-CORE-001:
    questions:
      - id: Q1
        text: "How does your platform technically enforce the no-storage mandate for wallet transaction data — what architectural controls prevent any persistence of PIDs, attestations, or user attributes beyond the forwarding operation?"
        dimension: architecture
      - id: Q2
        text: "What data elements, if any, are transiently processed during verification (e.g., in memory), and what is their maximum retention duration before guaranteed deletion?"
        dimension: data_handling
      - id: Q3
        text: "Do you maintain any logs, metadata, or derived data from wallet presentations (e.g., transaction success/failure status, timestamps, attribute names without values)? If so, describe exactly what is logged and the retention periods."
        dimension: data_handling
      - id: Q4
        text: "How can the organization verify that no transaction content is being stored — do you support independent architectural audits, provide third-party attestations (SOC 2), or offer real-time compliance dashboards?"
        dimension: auditability
      - id: Q5
        text: "If your service uses sub-processors or cloud infrastructure, how do you ensure they also comply with the no-storage mandate? What contractual and technical controls are in place?"
        dimension: supply_chain
      - id: Q6
        text: "What technical controls prevent accidental or intentional storage of transaction content by your personnel — do you use secure enclaves, memory scrubbing, or ephemeral compute environments?"
        dimension: security
      - id: Q7
        text: "How do you handle forwarding failures — if the intermediated RP is temporarily unreachable, is transaction data buffered, and if so, how is this reconciled with the no-storage mandate?"
        dimension: operational
      - id: Q8
        text: "Does the product prevent combining data from multiple transactions or across different intermediated RPs (ARF RPI_09)? What data isolation architecture enforces this?"
        dimension: architecture

  # ============================================================================
  # VEND-CORE-002: GDPR Article 28 Data Processing Agreement
  # Requirement: Implement a DPA meeting GDPR Article 28 requirements
  # ============================================================================
  VEND-CORE-002:
    questions:
      - id: Q1
        text: "Do you provide a standard Data Processing Agreement (DPA) that meets GDPR Article 28 requirements, or do you negotiate custom DPAs per customer? Can the organization review a template DPA before contract signing?"
        dimension: capability
      - id: Q2
        text: "Does your DPA explicitly address all eight Article 28(3) mandatory provisions: (a) processing instructions, (b) confidentiality, (c) security measures per Art 32, (d) sub-processor conditions, (e) data subject request assistance, (f) DPIA and breach notification support, (g) deletion/return at contract end, (h) audit rights?"
        dimension: compliance_completeness
      - id: Q3
        text: "How do you handle updates to the DPA when regulatory requirements change (e.g., new EDPB guidance, changes to eIDAS implementing acts)? Is the organization notified proactively?"
        dimension: lifecycle
      - id: Q4
        text: "Does the DPA specifically address the eIDAS Article 5b(10) no-storage mandate and the forward-only nature of intermediary data handling, or is it a generic GDPR DPA?"
        dimension: compliance_completeness
      - id: Q5
        text: "Are there any provisions in your standard DPA that limit the organization's audit rights beyond what GDPR Article 28(3)(h) permits?"
        dimension: contract_terms
      - id: Q6
        text: "Does the DPA specify the exact categories of personal data processed (e.g., PIDs, attestation attributes) and the specific processing operations performed (forwarding, verification, deletion)?"
        dimension: compliance_completeness
      - id: Q7
        text: "What is your process for approving and documenting the organization's specific processing instructions, and how are changes tracked over time?"
        dimension: operational

  # ============================================================================
  # VEND-CORE-003: Audit Rights
  # Requirement: Provide audit rights to the Relying Party
  # ============================================================================
  VEND-CORE-003:
    questions:
      - id: Q1
        text: "Do you permit on-site audits of your facilities and systems by the organization or its designated auditors? Are there any restrictions on audit scope (e.g., shared infrastructure, source code)?"
        dimension: capability
      - id: Q2
        text: "What third-party certifications or audit reports do you provide (e.g., SOC 2 Type II, ISO 27001, CSA STAR)? Do these cover the specific wallet intermediation service, or only your general infrastructure?"
        dimension: compliance_evidence
      - id: Q3
        text: "How frequently can the organization conduct audits, and what advance notice is required? Is there a limit on annual audit frequency?"
        dimension: operational
      - id: Q4
        text: "What is the cost structure for audits — are they included in the contract, charged at reasonable cost recovery, or separately priced?"
        dimension: commercial
      - id: Q5
        text: "How do you facilitate regulatory audits by supervisory authorities (e.g., national DPAs, DNB, ECB, ENISA) that may need to inspect the intermediation service?"
        dimension: regulatory_access
      - id: Q6
        text: "Can the organization audit your compliance with the eIDAS no-storage mandate specifically — including inspection of memory handling, log configurations, and data persistence controls?"
        dimension: auditability
      - id: Q7
        text: "If an instruction from the organization infringes GDPR, how do you notify them per Article 28(3) last paragraph? What is the escalation process?"
        dimension: compliance_monitoring
      - id: Q8
        text: "Do audit reports cover sub-processor compliance? Can the organization audit sub-processors directly or only through your audit reports?"
        dimension: supply_chain

  # ============================================================================
  # VEND-CORE-004: Relying Party Registration
  # Requirement: Register as a Relying Party indicating intermediary status
  # ============================================================================
  VEND-CORE-004:
    questions:
      - id: Q1
        text: "Does the product provide an automated Registration Management Interface to support the organization in completing, updating, and maintaining its registration as a Relying Party across all relevant Member States (via the TS5 REST API or equivalent)?"
        dimension: capability
      - id: Q2
        text: "Does the product support the full RP registration lifecycle per IR 2025/848: initial onboarding, updates to intended uses, modification of requested data elements, certificate retrieval, and deregistration?"
        dimension: lifecycle
      - id: Q3
        text: "In which Member States can you facilitate RP registrations? Can you support registrations in all Member States where the organization has legal entities?"
        dimension: geographic_scope
      - id: Q4
        text: "Is the registration process automated end-to-end, or does it require manual steps? If manual, describe the manual touchpoints and typical turnaround times."
        dimension: automation
      - id: Q5
        text: "How does the product populate the intermediary-specific fields required by IR 2025/848 Annex I — specifically point 14 (indication of reliance on an intermediary) and point 15 (relationship to intermediated RPs)?"
        dimension: compliance_completeness
      - id: Q6
        text: "Is the registration process fully auditable? Can you provide registration history, change logs, and certificate issuance records for compliance verification?"
        dimension: auditability
      - id: Q7
        text: "How do you handle registration renewals, expiration notifications, and discrepancies or rejections from national Registrars?"
        dimension: operational
      - id: Q8
        text: "How does the product handle cross-border scenarios where the intermediary is established in one Member State but intermediated RPs are established in others?"
        dimension: interoperability

  # ============================================================================
  # VEND-CORE-005: Relying Party Access Certificate
  # Requirement: Maintain a valid Relying Party Access Certificate
  # ============================================================================
  VEND-CORE-005:
    questions:
      - id: Q1
        text: "Does the product obtain and manage Relying Party Access Certificates on behalf of the organization, or does the organization manage certificates directly with the certificate authority?"
        dimension: capability
      - id: Q2
        text: "How does the product ensure certificates remain valid and are renewed before expiration? Is renewal automated, semi-automated (with alerts), or fully manual?"
        dimension: lifecycle
      - id: Q3
        text: "Which Access Certificate Authorities (ACAs) mandated by Member States do you currently support for certificate issuance? Do you support multiple ACAs across different Member States?"
        dimension: interoperability
      - id: Q4
        text: "How are certificate private keys protected? Describe the key management infrastructure (HSM, cloud KMS, software keystore) and its certification level."
        dimension: security
      - id: Q5
        text: "What monitoring and alerting is in place for certificate expiration, revocation, or potential compromise?"
        dimension: operational
      - id: Q6
        text: "How do you handle emergency certificate revocation and replacement — what is the expected time-to-recovery?"
        dimension: incident_response
      - id: Q7
        text: "Does the product include the access certificate in each presentation request by value (not by reference) as required by ARF RPA_02a, ensuring atomic self-contained transactions?"
        dimension: compliance_completeness
      - id: Q8
        text: "Does the product support multiple certificates for different intended uses or Member States? How is the correct certificate selected per presentation request?"
        dimension: flexibility
      - id: Q9
        text: "Does the access certificate comply with the Annex IV certificate policy requirements of IR 2025/848, including ETSI EN 319411-1 NCP? Can you provide compliance documentation?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-CORE-006: Technical and Organizational Security Measures
  # Requirement: Implement appropriate technical and organizational security measures
  # ============================================================================
  VEND-CORE-006:
    questions:
      - id: Q1
        text: "Describe your encryption approach: what data is encrypted at rest and in transit, and what algorithms/key lengths are used? Do you meet ETSI-approved algorithm requirements?"
        dimension: technical_implementation
      - id: Q2
        text: "What pseudonymization or anonymization techniques do you apply to wallet-related data, including transaction metadata and logs?"
        dimension: data_handling
      - id: Q3
        text: "How do you ensure the confidentiality, integrity, availability, and resilience of your processing systems as enumerated in Article 32(1)(b)?"
        dimension: security
      - id: Q4
        text: "What is your approach to regular security testing (penetration testing frequency, vulnerability scanning, red team exercises)? Do these tests specifically cover the wallet intermediation service?"
        dimension: security
      - id: Q5
        text: "Do you hold security certifications (ISO 27001, SOC 2 Type II, CSA STAR)? Does the certification scope explicitly cover the EUDI Wallet intermediation service?"
        dimension: compliance_evidence
      - id: Q6
        text: "How do you assess and document the appropriateness of your security measures relative to the risk, as required by Article 32(1) — do you maintain a formal risk assessment that addresses wallet intermediation processing?"
        dimension: risk_management
      - id: Q7
        text: "What physical security controls are in place at your data centers or processing facilities? Are you hosted in EU-based facilities with GDPR-compliant providers?"
        dimension: physical_security
      - id: Q8
        text: "What is your disaster recovery and business continuity capability — can you restore availability and access to data in a timely manner after a physical or technical incident (Art 32(1)(c))?"
        dimension: operational
      - id: Q9
        text: "How do you implement network segmentation and access controls between different RP tenants to prevent cross-tenant data leakage?"
        dimension: architecture

  # ============================================================================
  # VEND-CORE-007: Data Breach Notification
  # Requirement: Notify the RP of data breaches without undue delay
  # ============================================================================
  VEND-CORE-007:
    questions:
      - id: Q1
        text: "What is your committed timeframe for notifying the organization of a personal data breach after becoming aware of it? Is this contractually guaranteed (e.g., within 4 hours, 12 hours, 24 hours)?"
        dimension: sla
      - id: Q2
        text: "What information do you provide in breach notifications to enable the organization to fulfil its Article 33(3) obligations — do you include nature of breach, categories of affected data, approximate number of affected subjects, likely consequences, and remediation measures?"
        dimension: compliance_completeness
      - id: Q3
        text: "How do you detect potential data breaches — do you operate a 24/7 Security Operations Center (SOC) with SIEM, anomaly detection, and intrusion detection systems?"
        dimension: technical_implementation
      - id: Q4
        text: "Do you have a documented incident response plan specific to the wallet intermediation service? Can the organization review this plan and participate in tabletop exercises?"
        dimension: documentation
      - id: Q5
        text: "What is your escalation path for breach notification — do you have a dedicated incident contact for the organization, and is it available 24/7?"
        dimension: operational
      - id: Q6
        text: "How do you assist the organization in meeting its 72-hour notification obligation to supervisory authorities under GDPR Article 33(1) — do you provide pre-formatted regulatory notification templates?"
        dimension: regulatory_support
      - id: Q7
        text: "What post-incident support do you provide — forensic analysis, evidence preservation, root cause analysis, and remediation verification?"
        dimension: incident_response
      - id: Q8
        text: "In the EUDI Wallet intermediation context, how would you detect and respond to a breach involving compromise of access certificate private keys, failure of no-storage controls (accidental data persistence), or interception of wallet presentations during forwarding?"
        dimension: incident_response
      - id: Q9
        text: "How are breach notifications documented for regulatory audit purposes, and how long are incident records retained?"
        dimension: auditability

  # ============================================================================
  # VEND-CORE-008: Personnel Confidentiality
  # Requirement: Ensure personnel authorized to process data are bound by confidentiality
  # ============================================================================
  VEND-CORE-008:
    questions:
      - id: Q1
        text: "Are all personnel with access to wallet transaction data, system logs, cryptographic material, or production systems contractually bound by confidentiality obligations? Does this include employment contracts, NDAs, or statutory obligations?"
        dimension: compliance_completeness
      - id: Q2
        text: "What background checks and security vetting procedures do you apply to personnel with access to the wallet intermediation service, and how are vetting levels tiered based on access sensitivity?"
        dimension: security
      - id: Q3
        text: "How do you enforce role-based access control (RBAC) and the principle of least privilege? What is the process for granting, reviewing, and revoking access permissions?"
        dimension: architecture
      - id: Q4
        text: "What security awareness training do personnel receive specifically on EUDI Wallet data sensitivity, the no-storage mandate, and handling of PID attributes and attestation content during forwarding operations?"
        dimension: operational
      - id: Q5
        text: "How are confidentiality obligations extended to contractors, temporary staff, on-call engineers, and sub-processor personnel (per Art 28(4) flow-down)? Do sub-processor contracts mandate equivalent confidentiality provisions?"
        dimension: supply_chain
      - id: Q6
        text: "What procedures ensure immediate access revocation when personnel leave, change roles, or are terminated? Is access revocation automated through identity management systems?"
        dimension: lifecycle
      - id: Q7
        text: "How do you monitor and audit personnel access to sensitive systems — do you maintain access logs, detect anomalous access patterns, and conduct periodic access reviews?"
        dimension: auditability
      - id: Q8
        text: "In the EUDI Wallet intermediation context, can you confirm that no individual employee can access both PID attribute content in transit and access certificate private keys simultaneously (separation of duties)?"
        dimension: architecture
      - id: Q9
        text: "What disciplinary or legal consequences are in place for confidentiality breaches by personnel, and have any such incidents occurred in the past 3 years?"
        dimension: incident_response

  # ============================================================================
  # VEND-CORE-009: Processing Only on Documented Instructions
  # Requirement: Process personal data only on documented instructions from the RP
  # ============================================================================
  VEND-CORE-009:
    questions:
      - id: Q1
        text: "How do you document and track the organization's processing instructions? Is there a version-controlled instruction register, and how are changes to instructions recorded and acknowledged?"
        dimension: compliance_completeness
      - id: Q2
        text: "What technical and architectural controls prevent processing outside of documented instructions — for example, are there hard-coded restrictions that prevent analytics, profiling, or data repurposing even by privileged administrators?"
        dimension: architecture
      - id: Q3
        text: "Can you confirm that you do not process any wallet data for your own purposes (analytics, product improvement, ML training, marketing, benchmarking)? If any secondary processing occurs, describe the data, purpose, and legal basis."
        dimension: data_handling
      - id: Q4
        text: "Does your service involve any transfer of personal data to third countries or international organisations? If so, what safeguards are in place (Art 46 SCCs, Art 45 adequacy decisions, Art 49 derogations), and is the organization's explicit instruction required for all transfers?"
        dimension: interoperability
      - id: Q5
        text: "How do you implement the Art 28(3)(a) infringement notification obligation — if you believe an instruction from the organization would infringe GDPR, how do you communicate this, and what is the escalation process?"
        dimension: regulatory_support
      - id: Q6
        text: "How can the organization update or modify processing instructions, and what is the implementation timeframe? Is there a formal change management process, and do you commit to SLA-backed response times?"
        dimension: operational
      - id: Q7
        text: "In the EUDI Wallet intermediation context, how does the instruction-only principle interact with the ARF forward-only architecture (RPI_08)? Is the forwarding behaviour configurable per-RP, or is it a fixed platform behaviour?"
        dimension: architecture
      - id: Q8
        text: "How do you audit compliance with the instruction-only principle? Do you maintain logs showing that all processing operations were performed pursuant to documented instructions, and are these logs available to the organization?"
        dimension: auditability

  # ============================================================================
  # VEND-CORE-010: Data Subject Rights Support
  # Requirement: Support data subject rights requests
  # ============================================================================
  VEND-CORE-010:
    questions:
      - id: Q1
        text: "What technical capabilities do you provide to assist the organization in responding to data subject access requests (DSARs)? Can you produce a comprehensive report of all personal data held on a specific data subject across all systems?"
        dimension: capability
      - id: Q2
        text: "Given the no-storage mandate (Art 5b(10), VEND-CORE-001), what categories of personal data could you potentially hold that would be in scope for data subject requests — e.g., audit logs, transaction metadata, registration data, certificate records?"
        dimension: data_handling
      - id: Q3
        text: "What is your committed response time (SLA) for assisting with data subject requests? Can you meet the support timeline needed for the organization to respond within the Art 12(3) one-month deadline?"
        dimension: operational
      - id: Q4
        text: "How do you support erasure requests (right to be forgotten, Art 17) given the no-storage mandate? If transaction metadata or audit logs exist, can these be selectively erased per data subject?"
        dimension: data_handling
      - id: Q5
        text: "Can you support portability requests (Art 20) by providing data in a structured, commonly used, machine-readable format? What format is used (JSON, CSV, XML)?"
        dimension: capability
      - id: Q6
        text: "How do you handle requests for restriction of processing (Art 18) or objection to processing (Art 21) — can processing for a specific data subject be suspended without disrupting service for others?"
        dimension: architecture
      - id: Q7
        text: "What audit trail do you maintain of DSAR handling for compliance verification — including request receipt timestamp, internal processing steps, response delivery, and completion confirmation?"
        dimension: auditability
      - id: Q8
        text: "How do you verify the identity of the data subject making the request to prevent unauthorised disclosure, and how does this work in the intermediated EUDI Wallet context where the intermediary may not have direct user relationships?"
        dimension: security
      - id: Q9
        text: "How do you handle DSARs that span both your systems and sub-processor systems — do you coordinate with sub-processors, and what are the sub-processor SLAs for DSAR assistance?"
        dimension: supply_chain

  # ============================================================================
  # VEND-CORE-011: Display Both Intermediary and RP Identity
  # Requirement: Display both intermediary and RP identity to wallet users
  # ============================================================================
  VEND-CORE-011:
    questions:
      - id: Q1
        text: "How does your platform implement the dual-identity display required by Art 5b(8) and ARF RPI_06/RPI_07? Do you include both your own access certificate and the intermediated RP's RPRC_19a extension data in every presentation request?"
        dimension: architecture
      - id: Q2
        text: "What information about the intermediated Relying Party is displayed to the wallet user — do you include all five RPRC_19a fields (name, unique identifier, intended use description, Registrar URL, intended use identifier)?"
        dimension: compliance_completeness
      - id: Q3
        text: "How does the wallet user distinguish between your identity (as intermediary) and the intermediated RP's identity in the consent flow? Is the distinction clearly labelled and unambiguous?"
        dimension: capability
      - id: Q4
        text: "How do you handle the RPI_05 input — when the intermediated RP specifies its identity data for a presentation request, how is this data received, validated, and packaged into the RPRC_19a extension?"
        dimension: architecture
      - id: Q5
        text: "How do you handle scenarios where the intermediated RP's registered information changes (e.g., name change, merger, new intended use)? Are RPRC_19a extension fields updated dynamically from the Registrar, or cached?"
        dimension: lifecycle
      - id: Q6
        text: "Do you support the optional wallet-side verification mechanism (RPI_07a) where the wallet unit queries the Registrar to confirm the intermediary-RP relationship? How do you ensure your registration data supports this verification?"
        dimension: interoperability
      - id: Q7
        text: "If the intermediated RP does not have a registration certificate (it may be optional in some scenarios), how do you still ensure the RP's identity is conveyed to the wallet user through the RPRC_19a extension data alone?"
        dimension: architecture
      - id: Q8
        text: "How do you ensure the displayed RP information is accurate and matches the data registered at the Registrar? What reconciliation process exists to detect and correct mismatches?"
        dimension: auditability
      - id: Q9
        text: "How do you handle multi-language scenarios — if the RP operates across Member States, can the user-friendly name and intended use description be localised for the wallet user's language?"
        dimension: interoperability

  # ============================================================================
  # VEND-CORE-012: Notification of Legal Requirements Beyond Instructions
  # Requirement: Inform the RP of any legal requirement to process data beyond instructions
  # ============================================================================
  VEND-CORE-012:
    questions:
      - id: Q1
        text: "What is your documented process for evaluating and responding to legal requirements (court orders, law enforcement requests, regulatory demands) to process data beyond the organization's instructions? Is there a standing legal review procedure?"
        dimension: operational
      - id: Q2
        text: "Do you commit to notifying the organization before complying with such requests, unless legally prohibited? What is the notification mechanism and expected timeframe?"
        dimension: compliance_completeness
      - id: Q3
        text: "How do you document and track government or law enforcement data access requests — do you maintain a log of all requests received, their legal basis, your assessment, and the outcome?"
        dimension: auditability
      - id: Q4
        text: "Do you publish a transparency report disclosing statistics on government access requests received and complied with? If not, are you willing to provide this information to the organization under NDA?"
        dimension: compliance_evidence
      - id: Q5
        text: "In which jurisdictions are you subject to data access laws (including foreign surveillance laws such as FISA 702, CLOUD Act, or equivalent)? Do any of these potentially conflict with GDPR obligations?"
        dimension: interoperability
      - id: Q6
        text: "What is your policy on challenging overbroad, unlawful, or disproportionate government access requests? Do you have a track record of successfully challenging such requests?"
        dimension: contract_terms
      - id: Q7
        text: "In the EUDI Wallet intermediation context, given the no-storage mandate (VEND-CORE-001), what categories of data could realistically be subject to legal demands — transaction metadata, audit logs, registration data, certificate records?"
        dimension: data_handling
      - id: Q8
        text: "If a secrecy order prohibits you from informing the organization about a legal demand, how do you handle the conflict between the secrecy obligation and the Art 28(3)(a) pre-notification obligation? Do you seek judicial review of the secrecy order?"
        dimension: regulatory_support

  # ============================================================================
  # VEND-CORE-013: Sub-Processor Authorization
  # Requirement: Obtain RP authorization before engaging sub-processors
  # ============================================================================
  VEND-CORE-013:
    questions:
      - id: Q1
        text: "Do you currently use sub-processors for any part of your EUDI Wallet intermediary service? Provide a complete list with their legal names, roles (e.g., cloud hosting, HSM, monitoring), processing locations, and the data they access."
        dimension: supply_chain
      - id: Q2
        text: "Which authorisation model do you use — specific (per sub-processor approval) or general (blanket with notification of changes)? If general, what advance notice period do you provide before engaging new sub-processors?"
        dimension: contract_terms
      - id: Q3
        text: "Can the organization object to a proposed sub-processor change? If so, what is the process and timeline — and what happens if the organization objects (contract termination right, alternative sub-processor, etc.)?"
        dimension: contract_terms
      - id: Q4
        text: "How do you impose equivalent data protection obligations on sub-processors per Art 28(4)? Do sub-processor contracts include the no-storage mandate (Art 5b(10)), confidentiality obligations, audit rights, and breach notification obligations?"
        dimension: compliance_completeness
      - id: Q5
        text: "Given Art 28(4), you remain fully liable for sub-processor compliance. How do you monitor and verify ongoing sub-processor compliance — do you conduct audits, require certifications, or implement technical controls?"
        dimension: auditability
      - id: Q6
        text: "Do any of your sub-processors process data outside the EEA? If so, what international transfer safeguards are in place, and does the organization's DPA explicitly authorise these transfers?"
        dimension: interoperability
      - id: Q7
        text: "In the EUDI Wallet intermediation context, do any sub-processors have access to PID attributes, attestation content, or access certificate private keys — even transiently? How is the no-storage mandate enforced across the sub-processor chain?"
        dimension: data_handling
      - id: Q8
        text: "What is your incident response process if a sub-processor experiences a data breach? How quickly are you notified, and how does this feed into the Art 33(2) notification chain to the organization (VEND-CORE-007)?"
        dimension: incident_response
      - id: Q9
        text: "Can the organization audit sub-processors directly (either itself or through a mandated auditor), or must audits go through you? What provisions exist in sub-processor contracts for audit access?"
        dimension: auditability

  # ============================================================================
  # VEND-CORE-014: Data Deletion or Return at End of Contract
  # Requirement: Delete or return personal data at end of contract
  # ============================================================================
  VEND-CORE-014:
    questions:
      - id: Q1
        text: "Given the no-storage mandate (Art 5b(10), VEND-CORE-001), what categories of personal data might you hold at contract termination — e.g., configuration data, audit logs, registration data, certificate records, DPA documentation? Provide a comprehensive inventory."
        dimension: data_handling
      - id: Q2
        text: "What is your standard procedure for data return at contract termination? In what format is data returned (structured export, API access, manual handover), and is the return process automated or manual?"
        dimension: capability
      - id: Q3
        text: "What is your procedure for secure data deletion at contract termination? What deletion standards do you follow (e.g., NIST 800-88, DoD 5220.22-M), and how is deletion verified across all storage media?"
        dimension: security
      - id: Q4
        text: "Do you provide a formal deletion certificate or attestation upon completion? Is this signed by an authorised officer, and does it cover all data categories including backups?"
        dimension: compliance_evidence
      - id: Q5
        text: "What is the committed timeframe for completing data return or deletion after contract termination — for primary systems and for backup media (which may have a longer deletion cycle)?"
        dimension: operational
      - id: Q6
        text: "Are there any circumstances where you are legally required to retain data beyond contract termination? If so, specify which data, under which legal basis, for how long, and how retained data is isolated from active processing."
        dimension: regulatory_support
      - id: Q7
        text: "How do you ensure data in backups, disaster recovery sites, and cold storage is also deleted within the required timeframe? Can you verify deletion from immutable backup media (e.g., tape, WORM storage)?"
        dimension: security
      - id: Q8
        text: "What happens to audit logs and transaction metadata at contract termination that may be needed for regulatory compliance or dispute resolution — is there a grace period, and how is it governed?"
        dimension: contract_terms
      - id: Q9
        text: "How do you handle data deletion across sub-processors at contract termination? Do sub-processor contracts include equivalent deletion obligations and attestation requirements (Art 28(4) flow-down)?"
        dimension: supply_chain

  # ============================================================================
  # VEND-CORE-016: Register Each Intermediated RP at Appropriate Registrar
  # Requirement: Register each intermediated RP at the appropriate Registrar
  # Note: VEND-CORE-015 does not exist in source requirements
  # ============================================================================
  VEND-CORE-016:
    questions:
      - id: Q1
        text: "Per RPI_03, the intermediary must register each intermediated RP at the Registrar in the RP's Member State of establishment. Which Member State Registrars can you currently interface with, and what is your process for onboarding a new Registrar integration?"
        dimension: geographic_scope
      - id: Q2
        text: "How do you handle the Annex I data set submission for intermediated RPs, specifically point 14 (intermediary indication) and point 15 (intermediary-RP association)? Is data mapping and submission automated or manual?"
        dimension: technical_implementation
      - id: Q3
        text: "If the Registrar's associated certificate authority issues registration certificates (IR 2025/848 Art 8), do you obtain and manage these certificates for each registered intended use? How do you handle Member States that do not issue registration certificates?"
        dimension: capability
      - id: Q4
        text: "How do you ensure the accuracy of registration data (Art 5(2)) and propagate updates without undue delay (Art 5(3)) when an intermediated RP changes its intended uses, requested data elements, or establishment details?"
        dimension: lifecycle
      - id: Q5
        text: "What is your process for deregistering an intermediated RP when the contractual relationship terminates? How do you coordinate with the Registrar, certificate authority, and wallet ecosystem to ensure clean revocation?"
        dimension: lifecycle
      - id: Q6
        text: "Registration is a prerequisite for the dual-identity display (VEND-CORE-011) and wallet-side Registrar verification (RPI_07a). How do you handle the time gap between RP onboarding and Registrar registration completion — can presentation requests be made during this period?"
        dimension: operational
      - id: Q7
        text: "How do you manage cross-border registration when an intermediated RP operates in multiple Member States? Do you coordinate with multiple Registrars simultaneously, and how do you handle divergent national registration requirements?"
        dimension: interoperability
      - id: Q8
        text: "What monitoring do you have in place to detect registration suspension or cancellation by the Registrar (Art 9)? How quickly can you respond to a notification of suspension, and what is the impact on active presentation flows for the affected RP?"
        dimension: incident_response
      - id: Q9
        text: "Do you maintain an audit trail of all Registrar interactions (submissions, updates, certificate issuances, rejections) for compliance verification? How long are these records retained?"
        dimension: auditability

  # ============================================================================
  # VEND-CORE-017: Legal Evidence of RP Relationship
  # Requirement: Provide legal evidence of RP relationship when registering
  # ============================================================================
  VEND-CORE-017:
    questions:
      - id: Q1
        text: "Per RPI_04, what specific forms of legally valid evidence do you submit to Registrars to prove the intermediary-RP relationship (contract, power of attorney, letter of authorisation)? Does the form of evidence vary by Member State?"
        dimension: documentation
      - id: Q2
        text: "How do you prepare evidence to satisfy the four verification checks in IR 2025/848 Art 6(3): (a) accuracy/validity/authenticity, (b) power of attorney, (c) entitlement type per Annex III, and (d) absence of duplicate registration?"
        dimension: compliance_completeness
      - id: Q3
        text: "What is your process when a Registrar rejects the registration due to insufficient or invalid evidence (Art 6(6))? Do you have appeal or remediation procedures documented?"
        dimension: operational
      - id: Q4
        text: "How do you handle evidence updates when contracts between you and the intermediated RP are amended, renewed, or extended? Is there a proactive notification to the Registrar, or is re-verification triggered on next access?"
        dimension: lifecycle
      - id: Q5
        text: "The Registrar's evidence verification underpins the wallet-side trust chain (RPI_07a). How confident are you that the evidence you provide would withstand a wallet user's Registrar verification query? Have you tested this end-to-end?"
        dimension: compliance_evidence
      - id: Q6
        text: "Is the evidence submission and verification process automated (API-based) or manual (document upload)? What is the typical turnaround time from evidence submission to Registrar approval?"
        dimension: technical_implementation
      - id: Q7
        text: "How do you handle multi-jurisdictional evidence requirements where the intermediated RP is established in a different Member State from the intermediary, potentially with different legal instruments and language requirements?"
        dimension: interoperability
      - id: Q8
        text: "Do you retain copies of all evidence submitted to Registrars, including version history, for compliance audit purposes? How long are these records retained, and are they accessible to the intermediated RP for its own audit needs?"
        dimension: auditability
      - id: Q9
        text: "In the scenario where the intermediated RP terminates the relationship but the Registrar has not yet processed the deregistration, how do you prevent the stale evidence from being relied upon by wallet units?"
        dimension: security

  # ============================================================================
  # VEND-CORE-018: Attestation Verification
  # Requirement: Perform verification of attestations as agreed with RP
  # ============================================================================
  VEND-CORE-018:
    questions:
      - id: Q1
        text: "RPI_09 defines five verification dimensions (authenticity, revocation, device binding, user binding, wallet unit authenticity). Which of these do you support, and which are configurable per-RP as described by the 'as agreed' qualification?"
        dimension: capability
      - id: Q2
        text: "How do you manage and synchronize trust anchors (Trusted Lists) across multiple Member State trust frameworks? Describe your update frequency, failover strategy, and how you handle the transition period when a new Member State's trust framework is added or an existing issuer is removed."
        dimension: technical_implementation
      - id: Q3
        text: "Which revocation checking mechanisms do you support (Status Lists, OCSP, CRL)? How do you handle scenarios where the revocation infrastructure is temporarily unavailable — do you allow or block forwarding?"
        dimension: technical_implementation
      - id: Q4
        text: "Which attestation formats do you support for verification (mdoc per ISO 18013-5, SD-JWT VC per HAIP, or both)? If both, how do you handle format-specific verification differences (e.g., MSO signature validation vs JWS validation, mdoc deviceAuth vs SD-JWT Key Binding JWT)?"
        dimension: interoperability
      - id: Q5
        text: "Per RPI_08, if any agreed verification fails, you must not forward any attributes. How is this conditional forwarding implemented — is it atomic (all-or-nothing), and how are partial verification failures communicated to the wallet user and logged?"
        dimension: architecture
      - id: Q6
        text: "The RP retains ultimate legal responsibility for verification (Art 5b(9)). How do you provide verification evidence to the RP — do you include verification results, timestamps, and trust chain details in the forwarded response?"
        dimension: auditability

  # ============================================================================
  # VEND-CORE-019: PSD2 Strong Customer Authentication (TS12)
  # Requirement: Implement TS12 for PSD2 SCA when processing payment transactions
  # ============================================================================
  VEND-CORE-019:
    questions:
      - id: Q1
        text: "Do you implement the EUDI Wallet-based Strong Customer Authentication flow as specified in ARF Technical Specification 12 (TS12)? If not yet implemented, what is your roadmap?"
        dimension: capability
      - id: Q2
        text: "How do you map the PSD2 SCA elements (knowledge, possession, inherence) to the EUDI Wallet's cryptographic mechanisms? Specifically, which wallet capabilities satisfy each SCA element?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you achieve dynamic linking of the authentication to a specific transaction amount and payee (PSD2 RTS Art 5)? Is the transaction detail included in the signed wallet presentation, or is a separate binding mechanism used?"
        dimension: technical_implementation
      - id: Q4
        text: "How do you ensure independence of SCA elements (PSD2 RTS Art 9) — that compromise of one element does not reveal another? Does the WSCD-backed key architecture provide sufficient hardware separation for your implementation?"
        dimension: security
      - id: Q5
        text: "Which SCA exemptions do you support (low-value transactions under Art 16, recurring transactions under Art 14, trusted beneficiaries under Art 13)? How is exemption eligibility determined and documented per transaction?"
        dimension: compliance_completeness
      - id: Q6
        text: "Which payment scenarios does your TS12 implementation cover: in-store (proximity), online card-not-present, account-to-account, or all three? Are there any payment scenarios you explicitly do not support?"
        dimension: capability
      - id: Q7
        text: "What integration is required with the organization's existing payment infrastructure (PSP acquirer, card scheme, payment gateway)? Do you support the standard TS5 (OpenID4VP) flow extended for payment context, or a separate protocol?"
        dimension: interoperability
      - id: Q8
        text: "What transaction monitoring and fraud detection mechanisms are in place to detect and prevent manipulation of the payment authentication flow? Does this include velocity checks, anomaly detection, or device fingerprinting?"
        dimension: security
      - id: Q9
        text: "Have you obtained or are you pursuing PSD2 SCA certification or attestation? Have you been tested by any NCA (national competent authority) for SCA compliance in a wallet context?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-CORE-020: OpenID4VCI for Attestation Issuance (TS6)
  # Requirement: Implement TS6 (OpenID4VCI) for attestation issuance into EUDI Wallets
  # ============================================================================
  VEND-CORE-020:
    questions:
      - id: Q1
        text: "Do you implement the OpenID for Verifiable Credential Issuance (OpenID4VCI) protocol as specified in ARF Technical Specification 6 (TS6)? Which draft version of the specification have you implemented?"
        dimension: capability
      - id: Q2
        text: "Which OpenID4VCI flows do you support: pre-authorized code (issuer-initiated), authorization code (wallet-initiated), and/or deferred issuance? Which flow is the default for your implementation?"
        dimension: technical_implementation
      - id: Q3
        text: "Which credential formats do you support for issuance (SD-JWT-VC, mdoc/mDL, or both)? How do you determine which format to issue based on the attestation type and requesting wallet's capabilities?"
        dimension: interoperability
      - id: Q4
        text: "How do you verify the Wallet Unit Attestation (WUA, per TS3/VEND-CORE-025) during issuance to ensure credentials are bound to a legitimate, certified wallet? What happens if WUA verification fails?"
        dimension: security
      - id: Q5
        text: "How is key binding implemented — are issued credentials bound to the wallet unit's WSCD-backed key pair? Do you support proof-of-possession during the credential request?"
        dimension: security
      - id: Q6
        text: "Do you support both same-device (app-to-app) and cross-device (QR code/deep link) issuance flows? How do you handle the security differences between these models (especially for cross-device where the issuance session spans two devices)?"
        dimension: architecture
      - id: Q7
        text: "How do you handle issuance failures, network interruptions, and retry scenarios? For deferred issuance, what is the maximum polling duration and how is the user informed of credential readiness?"
        dimension: operational
      - id: Q8
        text: "Do you support batch issuance of multiple credentials in a single session (e.g., PID + driving licence)? If so, is each credential independently bound and signed?"
        dimension: capability
      - id: Q9
        text: "Have you participated in OpenID4VCI interoperability testing events (EU plugfests, OIDF conformance testing)? Which wallet implementations have you successfully tested credential issuance with?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-CORE-021: Data Deletion Request Interface (TS7)
  # Requirement: Implement TS7 data deletion request interface for GDPR Article 17 compliance
  # ============================================================================
  VEND-CORE-021:
    questions:
      - id: Q1
        text: "Do you implement the TS7 common data deletion request interface? Which of the three request channels (URL/web form, email draft, phone call) do you support, per DATA_DLT_02?"
        dimension: capability
      - id: Q2
        text: "How do you authenticate users submitting deletion requests before executing deletion (DATA_DLT_07)? Do you use the wallet's own authentication/signature facilities as recommended by the ARF, or an alternative mechanism?"
        dimension: security
      - id: Q3
        text: "What is your committed response time for processing data deletion requests? How does this align with the GDPR Art 17(1) 'without undue delay' obligation, and the Art 12(3) one-month response deadline?"
        dimension: sla
      - id: Q4
        text: "How do you handle deletion request exceptions under Art 17(3) (legal obligation, public interest, legal claims, archiving)? Do you document the specific legal basis for each refusal and communicate it to the requesting user?"
        dimension: compliance_completeness
      - id: Q5
        text: "In the intermediary context, given the no-storage mandate (VEND-CORE-001), what categories of data could be subject to deletion requests — transaction metadata, audit logs, registration data? How do you scope the deletion response appropriately?"
        dimension: data_handling
      - id: Q6
        text: "How do you ensure deletion is propagated to all systems including backups, disaster recovery sites, and logs? Can you certify deletion from immutable storage (tape, WORM) within a defined timeframe?"
        dimension: data_handling
      - id: Q7
        text: "Do you provide confirmation to the wallet user upon completion of deletion? Is this confirmation machine-readable (for wallet dashboard logging per DATA_DLT_05-06) or human-readable only?"
        dimension: user_experience
      - id: Q8
        text: "What audit logging is maintained for deletion request processing? Do your logs capture the request timestamp, requesting user identifier, data categories deleted, and completion attestation?"
        dimension: auditability
      - id: Q9
        text: "If the intermediated RP is the data controller and you receive a deletion request as processor, how do you coordinate with the RP — do you forward the request, execute autonomously per DPA instructions, or require RP approval before deletion?"
        dimension: contract_terms

  # ============================================================================
  # VEND-CORE-022: Attestation Schema Registration (TS11)
  # Requirement: Register attestation schemas in the catalogue per TS11
  # ============================================================================
  VEND-CORE-022:
    questions:
      - id: Q1
        text: "Have you registered your attestation types in the EU catalogue of attributes and attestations as specified in Technical Specification 11 (TS11)? If not yet, what is your registration timeline relative to the 2027-11-21 deadline?"
        dimension: capability
      - id: Q2
        text: "What attestation types do you currently issue, and does each attestation's schema comply with the TS11 common data model — attribute names, types, encodings, and validity rules?"
        dimension: compliance_completeness
      - id: Q3
        text: "Do you follow sector-specific rulebooks for your attestation structures (e.g., mobile driving licence per ISO 18013-5, payment credentials, health records)? How do you ensure rulebook compliance as rulebooks are updated?"
        dimension: interoperability
      - id: Q4
        text: "How do you manage schema versioning? When you update an attestation schema, how do you ensure backward compatibility with wallets and verifiers that may still expect the previous version?"
        dimension: lifecycle
      - id: Q5
        text: "How do RPs and wallets discover your attestation types through the catalogue? Do you publish supplementary metadata (issuer endpoints, supported formats, trust chain) alongside the schema registration?"
        dimension: interoperability
      - id: Q6
        text: "What is your process for registering new attestation types when you expand your issuance portfolio? Is catalogue registration integrated into your attestation development lifecycle, or is it a separate compliance step?"
        dimension: operational
      - id: Q7
        text: "How do you handle cross-border interoperability of your registered schemas — can a verifier in a different Member State reliably validate attestations issued under your registered schema?"
        dimension: interoperability
      - id: Q8
        text: "Do you validate your schemas against the TS11 conformance test suite (if available)? How do you ensure ongoing compliance as the TS11 specification and catalogue structure evolve?"
        dimension: compliance_evidence
      - id: Q9
        text: "If you issue both SD-JWT-VC and mdoc formats for the same attestation type, do you register separate schemas or a unified schema with format-specific encoding profiles? How is format selection communicated to wallets?"
        dimension: architecture

  # ============================================================================
  # VEND-CORE-023: Open Standards Implementation (TS1)
  # Requirement: Implement open standards per TS1 for EUDI Wallet interoperability
  # ============================================================================
  VEND-CORE-023:
    questions:
      - id: Q1
        text: "Do you implement the full set of open standards mapped in Technical Specification 1 (TS1)? Provide a matrix of which TS1-mapped standards you implement and their version/draft level."
        dimension: capability
      - id: Q2
        text: "Do you support both SD-JWT-VC and mdoc credential formats for verification? For issuers, which format(s) do you issue in, and how is format selection determined per attestation type?"
        dimension: interoperability
      - id: Q3
        text: "Have you participated in EU-organised plugfest events or OIDF conformance testing? Provide details of results, including any interoperability issues discovered and their resolution."
        dimension: compliance_evidence
      - id: Q4
        text: "Which wallet implementations (EUDI reference implementation, national wallets, Apple, Google) have you tested interoperability with for both issuance (OpenID4VCI) and presentation (OpenID4VP) flows?"
        dimension: interoperability
      - id: Q5
        text: "Several EUDI technical standards are still being finalized (e.g., ETSI specifications referenced by TS12 for PSD2 SCA, TS3 for WUA profiles, and future Commission implementing acts). How do you track specification changes, and what is your process for adopting breaking changes while maintaining backward compatibility with deployed wallets and issuers?"
        dimension: lifecycle
      - id: Q6
        text: "Are there any proprietary extensions, vendor-specific features, or deviations from the TS1-mapped standard implementations in your product? If so, document each deviation with its justification and impact on interoperability."
        dimension: limitations
      - id: Q7
        text: "Article 5a(23) eIDAS requires open standards specifically to prevent vendor lock-in. How do you demonstrate that your implementation achieves this — can an organisation migrate from your product to a competitor's without data loss or service interruption?"
        dimension: architecture
      - id: Q8
        text: "How do you handle the duality of credential formats (SD-JWT-VC vs mdoc) in verification scenarios where the incoming credential format is determined by the wallet, not the verifier? Can your verifier auto-detect and process either format?"
        dimension: technical_implementation
      - id: Q9
        text: "What conformance test suites do you use to validate your implementations against TS1-mapped standards? Do you run automated regression tests against these suites as part of your CI/CD pipeline?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-CORE-024: Provider Information Publication (TS2)
  # Requirement: Publish provider information per TS2 for discovery by wallets and RPs
  # ============================================================================
  VEND-CORE-024:
    questions:
      - id: Q1
        text: "Do you publish provider information endpoints as specified in Technical Specification 2 (TS2)? Provide the well-known URL(s) where your issuer metadata is published and confirm they follow the OpenID4VCI issuer metadata specification."
        dimension: capability
      - id: Q2
        text: "What metadata elements do you publish? Provide a complete inventory including: issuer identifier, supported credential types (with catalogue links), credential formats (SD-JWT-VC / mdoc), signing algorithms, trust chain to EUDI Wallet trust anchors, and all endpoint URLs (credential, authorization, token, deferred)."
        dimension: technical_implementation
      - id: Q3
        text: "How frequently is your published metadata updated when your service configuration changes (e.g., new credential types, algorithm rotations, endpoint migrations)? Is metadata publication automated or manual, and what is the maximum propagation delay?"
        dimension: lifecycle
      - id: Q4
        text: "How do wallets and Relying Parties discover your published metadata? Do you support automatic discovery via well-known URIs, or do you rely on out-of-band distribution? How does your metadata integrate with the catalogue of attestations (TS11)?"
        dimension: interoperability
      - id: Q5
        text: "What is the availability SLA for your metadata endpoint? What redundancy and failover mechanisms are in place? If the metadata endpoint is unreachable, how does this affect wallet and RP operations?"
        dimension: sla
      - id: Q6
        text: "How do you handle metadata versioning when transitioning between configurations (e.g., adding a new credential format or deprecating an old signing algorithm)? Do you support concurrent old and new configurations during transition periods?"
        dimension: operational
      - id: Q7
        text: "Is your published metadata digitally signed, and if so, using which key and trust chain? How can consumers verify the authenticity and integrity of the metadata they retrieve?"
        dimension: security
      - id: Q8
        text: "For intermediary deployments, how does the intermediary's metadata relate to the metadata of the underlying issuer? Does the intermediary publish its own metadata, relay the issuer's metadata, or both?"
        dimension: architecture
      - id: Q9
        text: "How do you monitor metadata endpoint health and detect stale or incorrect metadata? What alerting is in place for metadata publication failures?"
        dimension: operational

  # ============================================================================
  # VEND-CORE-025: Wallet Unit Attestation Verification (TS3)
  # Requirement: Verify Wallet Unit Attestation (WUA) per TS3 before issuing credentials
  # ============================================================================
  VEND-CORE-025:
    questions:
      - id: Q1
        text: "Do you verify the Wallet Unit Attestation (WUA) before issuing credentials as specified in Technical Specification 3? Describe the verification flow — at which stage in the OpenID4VCI issuance flow (TS6) does WUA verification occur, and what happens to the credential request if verification fails?"
        dimension: capability
      - id: Q2
        text: "Enumerate the WUA verification checks you perform: (a) signature validation against the Wallet Provider's signing key, (b) certificate chain validation to the Trusted List, (c) revocation status check, (d) WSCD certification verification, (e) key possession proof. Which of these do you implement, and which are you unable to perform?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you handle issuance requests from wallet instances with invalid, expired, or revoked WUAs? Do you return a specific error code? Do you log the failed attempt for security monitoring? Is the user informed of the reason for rejection?"
        dimension: operational
      - id: Q4
        text: "How do you stay updated on the list of certified WSCDs and WUA trust anchors? What is your process for integrating new trust anchors (e.g., when a new wallet provider onboards) and for removing trust anchors (e.g., when a wallet provider is de-certified)?"
        dimension: lifecycle
      - id: Q5
        text: "What is the latency impact of WUA verification on the issuance process? Have you optimised the verification flow (e.g., caching trust anchors, pre-fetching revocation status) to minimise added latency?"
        dimension: sla
      - id: Q6
        text: "How do you handle scenarios where the WUA revocation status check is inconclusive (e.g., revocation endpoint unavailable, status unknown)? Do you fail open (issue anyway), fail closed (reject), or defer (retry later)?"
        dimension: security
      - id: Q7
        text: "Does your WUA verification distinguish between different WSCD types (internal, external, remote)? If so, do you apply different trust policies or issuance constraints based on the WSCD type?"
        dimension: architecture
      - id: Q8
        text: "How do you handle WUA verification for cross-device issuance scenarios where the wallet unit presenting the WUA may be on a different device than the one initiating the issuance flow?"
        dimension: interoperability
      - id: Q9
        text: "What evidence of WUA verification do you retain for compliance auditing? Do you log the verification outcome, the WUA details (without storing the WUA itself), and the trust chain used?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-CORE-026: Remote Signing Protocol (TS8)
  # Requirement: Implement TS8 remote signing protocol for QES/QESeal via EUDI Wallet
  # ============================================================================
  VEND-CORE-026:
    questions:
      - id: Q1
        text: "Do you support remote qualified electronic signature (QES) and/or qualified electronic seal (QESeal) creation via EUDI Wallet as specified in Technical Specification 8 (TS8)? Specify which signing types you support and whether the protocol is fully implemented or partially."
        dimension: capability
      - id: Q2
        text: "How do you ensure sole control of the signatory over the remote signing process? Describe the Sole Control Interface (SCI) architecture — how does the wallet authorise each signing operation, and what multi-factor authentication is required?"
        dimension: security
      - id: Q3
        text: "Are signing keys generated and stored exclusively in certified QSCDs (HSMs meeting Art 29(1) eIDAS requirements)? Provide the certification details and standards met (e.g., EN 419 241-2, Common Criteria EAL4+)."
        dimension: compliance_evidence
      - id: Q4
        text: "How is the What You See Is What You Sign (WYSIWYS) principle implemented? Who renders the document — the wallet, the SSA, or both? How do you prevent tampering between the displayed document and the signed document?"
        dimension: user_experience
      - id: Q5
        text: "What document and signature formats do you support? Cover at minimum PAdES (PDF), XAdES (XML), CAdES (binary), and JAdES (JSON). Which signature levels are supported (B-B, B-T, B-LT, B-LTA)?"
        dimension: interoperability
      - id: Q6
        text: "How do you handle batch and automated signing scenarios while maintaining sole control per Art 26(1)(c)? Is per-document consent required, or can the user authorise a batch? What is the maximum batch size?"
        dimension: flexibility
      - id: Q7
        text: "How is the link between the signing key and the user's identity established? Is the user's PID from the wallet used for this purpose, and if so, how is the PID verified before key binding?"
        dimension: technical_implementation
      - id: Q8
        text: "Is your Server Signing Application (SSA) independently certified as part of a QSCD? Provide certification body, certificate ID, and validity period. How does recertification work when the SSA is updated?"
        dimension: compliance_evidence
      - id: Q9
        text: "What audit trail is generated for each signing operation? Does the trail include the signatory's identity (pseudonymised), the document hash, the signing timestamp, and the authorisation mechanism used?"
        dimension: auditability

  # ============================================================================
  # VEND-CORE-027: Pseudonym Attestations (TS9)
  # Requirement: Support pseudonym attestations per TS9 for privacy-preserving identification
  # ============================================================================
  VEND-CORE-027:
    questions:
      - id: Q1
        text: "Do you support pseudonym attestations as specified in Technical Specification 9 (TS9)? Indicate which of the following you support: User Pseudonyms (UP), Wallet-RP Pseudonyms (WRP), Zero-Knowledge Proofs (ZKP), and age-over / threshold predicates."
        dimension: capability
      - id: Q2
        text: "For User Pseudonyms (UP): how do you generate, store, and manage persistent pseudonymous identifiers? How do you ensure a UP remains stable across sessions with the same RP but unlinkable to UPs used with other RPs?"
        dimension: technical_implementation
      - id: Q3
        text: "For Wallet-RP Pseudonyms (WRP): how do you ensure that each transaction generates a fresh pseudonym? What cryptographic mechanisms prevent correlation between sessions, even for the same RP?"
        dimension: security
      - id: Q4
        text: "Article 5b(9) prohibits RPs from refusing pseudonyms where identification is not required by law. How does your system enforce this — can the RP be technically prevented from demanding real identity when pseudonymous presentation is sufficient?"
        dimension: compliance_completeness
      - id: Q5
        text: "How do you ensure pseudonyms cannot be correlated across different Relying Parties or transactions? What technical and operational controls prevent side-channel linkability (e.g., timing analysis, IP-based correlation)?"
        dimension: privacy
      - id: Q6
        text: "Can pseudonymous users be re-identified if legally required (e.g., court order, Article 5b(9) exception)? What is your process, and how do you verify the legal basis before re-identification?"
        dimension: legal_requirements
      - id: Q7
        text: "For the intermediary context: when forwarding a pseudonymous presentation from the wallet to the RP, how do you ensure the intermediary does not de-pseudonymise the user or add correlatable metadata (e.g., user session IDs, IP addresses)?"
        dimension: architecture
      - id: Q8
        text: "How do you handle the transition when an RP that previously accepted pseudonyms now requires identification (or vice versa)? Is there a mechanism for identity escalation from pseudonymous to identified within the same session?"
        dimension: lifecycle
      - id: Q9
        text: "What audit evidence do you retain for pseudonymous transactions? How do you balance the need for audit trails with the requirement to not undermine pseudonymity through logging?"
        dimension: auditability

  # ============================================================================
  # VEND-CORE-028: Data Export Capability (TS10)
  # Requirement: Provide data export capability per TS10 for GDPR portability compliance
  # ============================================================================
  VEND-CORE-028:
    questions:
      - id: Q1
        text: "Do you provide data export capabilities as specified in Technical Specification 10 (TS10) for GDPR Article 20 portability? Describe the scope of exportable data: transaction logs, consent records, credential metadata, RP relationship data, and any other user data you hold."
        dimension: capability
      - id: Q2
        text: "In what formats is data exported? Do you support at least one structured, commonly used, and machine-readable format (JSON, XML, CSV)? Is the export format documented so that another system can parse and import the data?"
        dimension: interoperability
      - id: Q3
        text: "How do users request data export? Is it self-service (e.g., dashboard button) or requires manual processing? What authentication is required before initiating an export? Is there a limit on export frequency?"
        dimension: user_experience
      - id: Q4
        text: "What is the response time for fulfilling data export requests? Do you meet the GDPR Art 12(3) one-month deadline? For large datasets, do you support progressive/streaming export?"
        dimension: sla
      - id: Q5
        text: "How is exported data secured during transmission and storage? Is the export encrypted? Can the user specify a destination (download link, direct transfer to another controller per Art 20(2))?"
        dimension: security
      - id: Q6
        text: "For the intermediary context: given the no-storage mandate (VEND-CORE-001), what data does the intermediary actually hold that is subject to portability? Is it limited to transaction metadata and audit logs, or does it include any cached presentation data?"
        dimension: data_handling
      - id: Q7
        text: "How do you handle data export requests that span data held by both the intermediary and the intermediated RP? Is the user required to make separate requests, or can the intermediary coordinate a unified export?"
        dimension: architecture
      - id: Q8
        text: "Does your data export include data about the user that was derived or inferred (e.g., risk scores, fraud flags) as opposed to directly provided? How do you distinguish between 'provided by' the data subject and 'generated by' the controller for Art 20 scope?"
        dimension: compliance_completeness
      - id: Q9
        text: "What audit trail is generated for data export requests? Do you log the request timestamp, the data categories exported, the export format, and the delivery mechanism?"
        dimension: auditability

  # ============================================================================
  # VEND-CORE-029: Registration Certificate Verification
  # Requirement: Verify registration certificates presented by counterparties
  # ============================================================================
  VEND-CORE-029:
    questions:
      - id: Q1
        text: "How do you verify registration certificates presented by PID Providers, Attestation Providers, or other Relying Parties? Describe the full verification chain: signature validation, certificate chain to trusted anchor, revocation status, and structural validation against Annex V of IR 2025/848."
        dimension: technical_implementation
      - id: Q2
        text: "Do you validate certificate signatures against the Trusted List published by each Member State? How do you handle the federation of multiple national Trusted Lists — do you maintain a local aggregate, or query per-Member-State endpoints dynamically?"
        dimension: security
      - id: Q3
        text: "How frequently do you update your local copy of Trusted Lists? What is the maximum staleness window, and how do you handle the period between a revocation event and your next Trusted List refresh?"
        dimension: lifecycle
      - id: Q4
        text: "What happens when a counterparty presents an invalid, expired, or revoked registration certificate? Is the transaction blocked, degraded, or flagged for review? Is the user informed, and how?"
        dimension: operational
      - id: Q5
        text: "Do you support certificate verification for registration certificates from all 27 Member States, or only specific ones? If limited, what is your coverage roadmap, and how do you handle presentation requests from unsupported Member States?"
        dimension: geographic_scope
      - id: Q6
        text: "Per RPRC_11, registration certificates must contain data deletion contact information. Do you extract and use this information to facilitate user data deletion requests (integration with VEND-CORE-021)?"
        dimension: interoperability
      - id: Q7
        text: "Per RPRC_12, registration certificates must contain DPA contact information for reporting suspicious requests. Do you surface this information to users, and do you have automated mechanisms for flagging potentially suspicious attribute requests?"
        dimension: compliance_completeness
      - id: Q8
        text: "Per RPRC_10, RPs must distribute registration certificates to all their RP Instances. For intermediary deployments with multiple RP instances, how do you ensure consistent certificate distribution and synchronised revocation handling?"
        dimension: architecture
      - id: Q9
        text: "What audit trail do you maintain for registration certificate verification outcomes? Do you log verification successes, failures, and the specific checks that failed for compliance reporting?"
        dimension: auditability

  # ============================================================================
  # VEND-CORE-030: Attestation Authenticity and Validity Verification
  # Requirement: Verify attestation authenticity and validity before acceptance
  # ============================================================================
  VEND-CORE-030:
    questions:
      - id: Q1
        text: "How do you verify the cryptographic signature on attestations received from wallets? Do you distinguish between attestation types (PID, QEAA, Pub-EAA, non-qualified EAA) and apply the appropriate trust anchor source for each type (OIA_12 through OIA_15)?"
        dimension: technical_implementation
      - id: Q2
        text: "How do you verify that attestations have not expired? Do you check both the validity period of the attestation itself and the validity of the issuer's signing certificate?"
        dimension: technical_implementation
      - id: Q3
        text: "What revocation status checking mechanisms do you support for attestation validation? Do you support Status Lists, OCSP, or both? What is the freshness guarantee for revocation checks?"
        dimension: technical_implementation
      - id: Q4
        text: "How do you verify the issuer's access certificate chain back to the appropriate trust anchor? Do you maintain separate trust anchor stores for each attestation type, and how do you keep them synchronised with the Trusted Lists?"
        dimension: security
      - id: Q5
        text: "Per OIA_16, the RP SHALL discard unique elements (ISSU_35 elements + timestamps) as soon as no longer needed and SHALL NOT communicate these to the RP backend. How do you implement this requirement technically? How do you verify that unique elements are genuinely discarded from memory and not persisted in logs?"
        dimension: privacy
      - id: Q6
        text: "What is the end-to-end latency of your attestation verification process? Have you optimised verification (e.g., parallelising signature check, revocation check, and chain validation) to minimise user-facing delay?"
        dimension: sla
      - id: Q7
        text: "How do you handle attestations from issuers not yet in your trust list (e.g., a newly onboarded QEAA Provider)? Is there a graceful degradation path, or is the attestation rejected outright?"
        dimension: operational
      - id: Q8
        text: "For non-qualified EAAs (per OIA_15), the trust anchor may be specified in a sector-specific Rulebook rather than a national Trusted List. How do you manage the integration and updates of Rulebook-specified trust anchors alongside national trust anchors?"
        dimension: interoperability
      - id: Q9
        text: "For intermediary deployments: do you perform the full verification chain before forwarding attestation attributes to the intermediated RP (per VEND-CORE-018, RPI_09), or is any verification deferred to the RP? How do you communicate the verification outcome to the RP?"
        dimension: architecture

  # ============================================================================
  # VEND-CORE-031: Intended Use Registration and Access Certificate Policies
  # Requirement: Register intended uses and comply with access certificate policies
  # ============================================================================
  VEND-CORE-031:
    questions:
      - id: Q1
        text: "Do you support registration of multiple intended uses for the organisation? Describe how intended uses are defined, validated against the data catalogue (TS11), and how many distinct intended uses your system can manage per RP."
        dimension: capability
      - id: Q2
        text: "How do you ensure the organisation's intended uses remain aligned with the access certificate policies of each ACA? Describe the monitoring process — is it manual review, automated policy checking, or both?"
        dimension: compliance_monitoring
      - id: Q3
        text: "What process is followed when an intended use needs to be added, modified, or removed? What is the lead time for each operation, and does it require re-issuance of the access certificate?"
        dimension: lifecycle
      - id: Q4
        text: "How are access certificate policy updates from ACAs communicated and operationalised? Do you receive automated notifications of policy changes, or do you rely on manual monitoring of ACA publications?"
        dimension: operational
      - id: Q5
        text: "How do you handle revocation procedures required by access certificate policies (per Reg_15)? Specifically, how quickly can you respond to: (a) Registrar suspension/cancellation, (b) requests from competent national authorities, and (c) voluntary RP-initiated revocation?"
        dimension: incident_response
      - id: Q6
        text: "Per Art 5b(3), RPs shall not request data other than that indicated in their registration. How does your system enforce this at the technical level — does the connector validate the presentation request against the access certificate's intended use before sending it to the wallet?"
        dimension: security
      - id: Q7
        text: "For intermediary deployments: how do you manage the intended uses of each intermediated RP? Does the intermediary's access certificate contain a superset of all intermediated RPs' intended uses, or does it use per-RP registration certificates (RPRC) to distinguish individual RP scopes?"
        dimension: architecture
      - id: Q8
        text: "How are the intended use names and unique identifiers (per Reg_31 and Reg_32) displayed to the wallet user? Do you ensure these are human-readable and meaningful enough for the user to make an informed consent decision?"
        dimension: user_experience
      - id: Q9
        text: "What audit evidence do you maintain showing that your actual data requests have consistently matched your registered intended uses? Can you produce a compliance report demonstrating no unauthorised attribute requests over a given period?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-CORE-032: RP Access Certificate for Wallet Authentication
  # Requirement: Use valid RP Access Certificate for Wallet Unit authentication
  # ============================================================================
  VEND-CORE-032:
    questions:
      - id: Q1
        text: "How do you present the organisation's RP Access Certificate to Wallet Units during presentation requests? Per RPA_02a, access certificates must be included **by value, not by reference** — confirm your implementation conforms to this requirement and explain the rationale (atomicity, offline support)."
        dimension: technical_implementation
      - id: Q2
        text: "How do you ensure the presented certificate is current and not expired or revoked? What pre-flight checks are performed before including the certificate in a presentation request? Do you monitor certificate expiry proactively?"
        dimension: lifecycle
      - id: Q3
        text: "What information from the access certificate is displayed to wallet users (per RPA_06)? Confirm that the RP name and requested attributes are shown. For intermediary deployments, are both the intermediary and intermediated RP names displayed (per RPI_07)?"
        dimension: user_experience
      - id: Q4
        text: "How do you handle certificate rotation or renewal without service interruption? Is there a overlap window where both old and new certificates are accepted? What is the maximum downtime during rotation?"
        dimension: operational
      - id: Q5
        text: "Do you support different access certificates for different intended uses, or does a single certificate cover all your data requests? If multiple certificates, how do you select the appropriate one for each presentation request?"
        dimension: flexibility
      - id: Q6
        text: "Per RPA_06a, if RP authentication fails, the wallet must notify the user and either block or give the user a choice. How do you minimise authentication failures on your side (certificate chain validation, correct trust anchor configuration)?"
        dimension: security
      - id: Q7
        text: "For intermediary deployments: does the intermediary present its own access certificate, the intermediated RP's certificate, or both? How does the wallet distinguish between the intermediary and the intermediated RP?"
        dimension: architecture
      - id: Q8
        text: "How do you handle scenarios where the access certificate's intended use does not match the actual data request? Is there a validation step in the connector that prevents sending mismatched requests?"
        dimension: compliance_completeness
      - id: Q9
        text: "What certificate transparency requirements apply to your access certificates (per CT_06)? Do your certificates include valid Signed Certificate Timestamps (SCTs)? What happens if they don't?"
        dimension: security

  # ============================================================================
  # VEND-CORE-033: Pseudonym Presentation Handling
  # Requirement: Support and correctly handle pseudonym-based presentations
  # ============================================================================
  VEND-CORE-033:
    questions:
      - id: Q1
        text: "Do you correctly process pseudonym-based presentations when users choose to present them? Confirm that pseudonymous presentations follow the same processing flow as identified presentations (no separate code path that could leak identity information)."
        dimension: capability
      - id: Q2
        text: "How do you validate that the pseudonym belongs to the presenting user (PA_13)? Describe the binding verification mechanism — do you verify the wallet unit's proof-of-possession for the pseudonym key?"
        dimension: security
      - id: Q3
        text: "Per PA_15, the RP SHALL NOT be able to derive the User's true identity from the Pseudonym value. What technical controls prevent your system or personnel from attempting to derive real identity? Is there a code-level restriction, or is it policy-based?"
        dimension: privacy
      - id: Q4
        text: "Per PA_17, it SHALL NOT be possible to correlate Pseudonyms based on their values or metadata — colluding RPs SHALL NOT be able to conclude that different Pseudonyms belong to the same User. How do you prevent correlation through side channels (IP address, User-Agent, timing, session metadata)?"
        dimension: privacy
      - id: Q5
        text: "How do you verify that the user is registering or authenticating a Pseudonym using a non-revoked Wallet Unit (PA_10, PA_11)? Is the wallet revocation check part of the pseudonym verification flow, or is it a separate step?"
        dimension: security
      - id: Q6
        text: "Do you maintain logs of pseudonym presentations? If so, how do you ensure that logging does not create a correlation vector? Are pseudonym values hashed or excluded from logs entirely?"
        dimension: auditability
      - id: Q7
        text: "How does your system handle the refusal prohibition under Art 5b(9)? If the RP's service does not legally require user identification, can the RP technically be prevented from rejecting a pseudonym presentation and demanding real identity?"
        dimension: compliance_completeness
      - id: Q8
        text: "For intermediary deployments: when forwarding pseudonymous presentations to the intermediated RP, does the intermediary strip or preserve the pseudonym? How do you prevent the intermediary from injecting correlatable metadata into the forwarded request?"
        dimension: architecture
      - id: Q9
        text: "How do you handle the edge case where a user has previously identified themselves to the RP and now wants to interact pseudonymously? Can the RP be forced to 'forget' the association between the real identity and the pseudonym?"
        dimension: lifecycle

  # ============================================================================
  # VEND-CORE-034: RP Trust Anchor Publication
  # Requirement: Publish RP trust anchor information for Wallet verification
  # ============================================================================
  VEND-CORE-034:
    questions:
      - id: Q1
        text: "Do you ensure that your access certificates can be authenticated using the trust anchors of an Access Certificate Authority (ACA) notified to the Commission (per RPACANot_03)? Identify the ACA(s) you use and confirm their notification status."
        dimension: capability
      - id: Q2
        text: "If registration certificates have been issued to you, do you ensure they can be authenticated using the trust anchors of a notified Provider of registration certificates (per RPACANot_03a)? Identify the Provider(s) and their notification status."
        dimension: capability
      - id: Q3
        text: "How are trust anchor updates (e.g., ACA key rotations) coordinated? What is the process when your ACA updates its trust anchors, and how do you ensure wallet units can still verify your certificates during the transition?"
        dimension: lifecycle
      - id: Q4
        text: "How quickly are trust anchor updates propagated to Wallet Units? What is the maximum window during which a wallet might reject your certificate due to a stale trust anchor?"
        dimension: sla
      - id: Q5
        text: "How do you handle trust anchor revocation if your ACA loses its notification status or is de-certified? What is your contingency plan, and how quickly can you migrate to another notified ACA?"
        dimension: incident_response
      - id: Q6
        text: "Per Art 5b(5), your registration information must be publicly available in electronically signed or sealed form suitable for automated processing. Confirm that your published trust anchor information meets this requirement and describe the format used."
        dimension: compliance_completeness
      - id: Q7
        text: "For multi-Member-State deployments: do you use the same ACA across all Member States, or different ACAs per jurisdiction? How do you manage the operational complexity of multiple ACA relationships?"
        dimension: geographic_scope
      - id: Q8
        text: "How do you monitor the validity and accessibility of your published trust anchor information? Is there automated checking to verify that wallet units can successfully authenticate your certificates at any time?"
        dimension: operational
      - id: Q9
        text: "For intermediary deployments: does the intermediary's trust anchor information cover the intermediated RP, or must the intermediated RP maintain its own ACA relationship independently?"
        dimension: architecture

  # ============================================================================
  # VEND-CORE-035: Data Deletion Request Processing
  # Requirement: Process data deletion requests from Users within required timeframes
  # ============================================================================
  VEND-CORE-035:
    questions:
      - id: Q1
        text: "What is your standard response time for processing GDPR Article 17 deletion requests? Do you meet the Art 12(3) one-month deadline? For wallet-mediated deletion requests via TS7, is the response time faster than for manual requests?"
        dimension: sla
      - id: Q2
        text: "How do you verify the identity of users submitting deletion requests (per DATA_DLT_07)? Do you support wallet-based authentication for deletion requests, and if so, does the user present their PID or a pseudonymous attestation to authenticate?"
        dimension: security
      - id: Q3
        text: "How do you provide confirmation of deletion to the requesting user? For TS7 wallet-mediated requests, does the confirmation follow the standardised response format? Is the confirmation digitally signed?"
        dimension: user_experience
      - id: Q4
        text: "What valid grounds for refusal do you recognise under Art 17(3) (freedom of expression, legal obligation, public interest, health, archiving/research, legal claims)? How are refusals communicated to the user, and can they be challenged?"
        dimension: legal_requirements
      - id: Q5
        text: "How do you ensure all copies of the data, including backups and replicated data, are deleted? What is the timeline for backup deletion? Do you support 'crypto-shredding' (deleting encryption keys rather than data) for backup systems?"
        dimension: data_handling
      - id: Q6
        text: "What audit trail is maintained for deletion request processing and completion? Does the audit trail itself contain personal data (creating a retention paradox), and if so, how do you handle the eventual deletion of the audit trail?"
        dimension: auditability
      - id: Q7
        text: "Is the TS7 common interface fully implemented for wallet-mediated deletion requests? Can the user initiate deletion directly from the wallet, and if so, does the flow include the wallet's authentication/signature facilities per DATA_DLT_07?"
        dimension: technical_implementation
      - id: Q8
        text: "For intermediary deployments: when a deletion request is received, does the intermediary forward it to the intermediated RP? How do you coordinate deletion across both the intermediary and the RP to ensure complete data removal?"
        dimension: architecture
      - id: Q9
        text: "How do you handle deletion requests for data that has already been shared with third parties (Art 17(2))? Do you notify downstream processors, and if so, what mechanism do you use?"
        dimension: compliance_completeness

  # ============================================================================
  # VEND-CORE-038: W3C Digital Credentials API Support
  # Requirement: Support W3C Digital Credentials API for presentation requests
  # Note: VEND-CORE-036 and 037 do not exist in source requirements
  # ============================================================================
  VEND-CORE-038:
    questions:
      - id: Q1
        text: "Do you support the W3C Digital Credentials API for browser-mediated presentation requests? If so, is this the primary browser flow, or is it offered alongside deep-link / QR-code based flows? Which version of the API specification do you implement?"
        dimension: capability
      - id: Q2
        text: "Which browsers are supported for the Digital Credentials API flow? Provide a compatibility matrix (Chrome, Firefox, Safari, Edge) with version numbers. How do you handle updates when browser vendors release new API versions?"
        dimension: interoperability
      - id: Q3
        text: "How do you handle fallback for browsers that do not support the Digital Credentials API? Is the fallback automatic (detect and redirect to alternative flow), or does the user need to manually switch? What is the alternative flow (deep-link, QR code)?"
        dimension: operational
      - id: Q4
        text: "Per OIA_08c, the presentation request SHALL NOT be processed by the browser/OS for market analysis purposes. How do you verify that the browser is not using the request data for prohibited purposes? Do you have any contractual or technical controls with browser vendors?"
        dimension: privacy
      - id: Q5
        text: "How is the credential exchange flow secured against man-in-the-middle attacks? What cross-origin protections are in place (CORS, Content-Security-Policy, origin binding)? How is the session between the RP and the wallet authenticated through the browser?"
        dimension: security
      - id: Q6
        text: "What user experience considerations have you implemented for the browser-mediated flow? Is the flow seamless (no page redirects), and how do you handle scenarios where the wallet app is not installed or not responsive?"
        dimension: user_experience
      - id: Q7
        text: "How does the W3C Digital Credentials API interact with your OpenID4VP implementation? Can the same presentation request be served through both the Digital Credentials API (same-device browser) and OpenID4VP (cross-device QR)? Is the request format shared?"
        dimension: architecture
      - id: Q8
        text: "How do you handle mobile browser scenarios where the wallet is on the same device? Does the Digital Credentials API correctly invoke the wallet app, and how do you handle the return flow after the user approves the presentation?"
        dimension: technical_implementation
      - id: Q9
        text: "For intermediary deployments: when the intermediary serves the presentation request via the Digital Credentials API, who is shown as the requesting party in the browser UI — the intermediary, the intermediated RP, or both?"
        dimension: architecture

  # ============================================================================
  # VEND-CORE-039: Revocation Status Unavailability Handling
  # Requirement: Handle revocation status unavailability gracefully
  # ============================================================================
  VEND-CORE-039:
    questions:
      - id: Q1
        text: "How does your system behave when revocation status information is temporarily unavailable? Do you fail open (accept the attestation anyway), fail closed (reject it), or use a cached version of the status list? How is this decision configured?"
        dimension: operational
      - id: Q2
        text: "Do you implement rate limiting to avoid repeatedly requesting unavailable status lists? Describe your backoff strategy (fixed, exponential, jitter-based) and the maximum number of retries before giving up."
        dimension: technical_implementation
      - id: Q3
        text: "Per VCR_15, the RP SHOULD NOT request the status list each time an attestation is presented. Instead, the RP SHOULD download each new version once, at a time and location unrelated to the presentation. Confirm your implementation follows this privacy-preserving pattern and describe how you decouple status list fetching from presentation events."
        dimension: privacy
      - id: Q4
        text: "Per VCR_15, the RP SHOULD distribute downloaded status lists to all its RP Instances using an internal distribution mechanism. How do you distribute status lists across your RP Instances? What is the synchronisation latency, and how do you handle instances that miss an update?"
        dimension: architecture
      - id: Q5
        text: "How long do you cache revocation status information, and what is your refresh strategy? Do you respect HTTP cache headers from the status list endpoint, or do you use a custom refresh interval?"
        dimension: technical_implementation
      - id: Q6
        text: "How is the organisation notified of revocation status unavailability events? What alerting thresholds are configured, and what is the escalation path when unavailability exceeds the threshold?"
        dimension: alerting
      - id: Q7
        text: "What is your fail-open vs fail-closed policy for different service risk levels? Can this policy be configured per attestation type (e.g., strict for PID verification, lenient for loyalty card attestations)?"
        dimension: security
      - id: Q8
        text: "How do you handle the scenario where a status list was recently updated to revoke an attestation, but your cached copy is stale? What is the maximum window during which a revoked attestation could be accepted?"
        dimension: sla
      - id: Q9
        text: "For intermediary deployments: does the intermediary maintain its own status list cache independently from the intermediated RP, or do they share a cache? How is cache consistency ensured across the intermediary and RP?"
        dimension: architecture

  # ============================================================================
  # VEND-CORE-040: Proximity Identification Flows (Optional)
  # Requirement: Support proximity identification flows (optional)
  # ============================================================================
  VEND-CORE-040:
    questions:
      - id: Q1
        text: "Do you support proximity identification flows (BLE/NFC) for local credential presentation? If so, in which scenarios (border control, age verification, point-of-sale, in-branch)? Is proximity flow support a standard feature or an add-on module?"
        dimension: capability
      - id: Q2
        text: "Per ProxId_01a, RP Instances supporting proximity flows SHALL support device retrieval as specified in ISO/IEC 18013-5. Which specific transports do you implement — BLE (mandatory), NFC (optional), or both? Which device engagement methods are supported (QR code, NFC tap)?"
        dimension: technical_implementation
      - id: Q3
        text: "What hardware is required at the Relying Party location for proximity flows? Do you provide or certify specific reader devices, or is the proximity flow software-only running on standard mobile devices or tablets?"
        dimension: operational
      - id: Q4
        text: "How do proximity flows operate without internet connectivity? Specifically, how do you handle trust anchor verification and revocation checking when the reader device is offline? Do you pre-load issuer trust anchors and cache revocation status lists (connecting to VEND-CORE-039)?"
        dimension: technical_implementation
      - id: Q5
        text: "What is the effective range and reliability of the proximity communication? For BLE: what is the maximum range, and how do you handle interference in crowded environments (airports, concert venues)? For NFC: what reader positioning requirements exist?"
        dimension: sla
      - id: Q6
        text: "How is security maintained in the proximity flow? Do you implement the full ISO/IEC 18013-5 security model (HKDF key derivation, AES-256-GCM encryption, ECDSA device authentication)? How do you prevent relay attacks where an attacker forwards the BLE signal?"
        dimension: security
      - id: Q7
        text: "Can proximity and remote flows coexist in the same RP Instance, or are they separate deployments? If coexistent, how does the RP Instance determine which flow to use for a given transaction?"
        dimension: architecture
      - id: Q8
        text: "How do you handle the user consent flow in proximity scenarios? Is the consent displayed on the user's wallet device, and how do you handle scenarios where the user walks away before completing the flow (physical timeout)?"
        dimension: user_experience
      - id: Q9
        text: "For intermediary deployments: can an intermediary's reader device perform proximity identification on behalf of the intermediated RP? How is the intermediary/RP distinction communicated to the wallet in the proximity flow?"
        dimension: architecture

  # ============================================================================
  # VEND-CORE-041: Registration Certificate Lifecycle
  # Requirement: Handle registration certificate updates and renewals
  # ============================================================================
  VEND-CORE-041:
    questions:
      - id: Q1
        text: "How do you handle updates to the organisation's registration certificates? Per RPRC_19, the RP Instance must include a single registration certificate applicable for its current intended use in each presentation request. How do you ensure the correct, current certificate is always used?"
        dimension: lifecycle
      - id: Q2
        text: "What is the process for certificate renewal before expiration? Do you monitor certificate notBefore/notAfter dates proactively, and how far in advance of expiry do you initiate renewal?"
        dimension: lifecycle
      - id: Q3
        text: "How do you handle emergency certificate revocation situations? What is the maximum time between discovering a compromised certificate and removing it from all RP Instances?"
        dimension: incident_response
      - id: Q4
        text: "Per RPRC_10, registration certificates must be distributed to all RP Instances. How are updated certificates distributed across your deployment topology? What is the propagation latency, and how do you handle instances that are temporarily offline during an update?"
        dimension: operational
      - id: Q5
        text: "What notifications are sent for upcoming certificate expirations? Who receives the alerts (operations team, RP customer, both)? What escalation path exists if an expiry alert is not acted upon?"
        dimension: alerting
      - id: Q6
        text: "Is the certificate lifecycle fully automated or does it require manual intervention? Can the product automatically request, install, and distribute new registration certificates from the Provider of registration certificates?"
        dimension: automation
      - id: Q7
        text: "Per RPRC_19a, each presentation request must include extension fields (RP name, RP identifier, intended use description, Registrar URL, intended use identifier). How do you ensure these fields remain consistent with the registration certificate content after updates?"
        dimension: compliance_completeness
      - id: Q8
        text: "How do you handle the scenario where a Provider of registration certificates rotates its signing key? How do you coordinate with wallet units that may still be verifying against the old trust anchor?"
        dimension: security
      - id: Q9
        text: "For intermediary deployments: does the intermediary manage registration certificates on behalf of the intermediated RP (per RPI_03/RPI_06), or does the RP manage its own certificates independently?"
        dimension: architecture

  # ============================================================================
  # VEND-CORE-042: Personal Data Safeguards by Default
  # Requirement: Apply personal data safeguards by default to all attestation processing
  # ============================================================================
  VEND-CORE-042:
    questions:
      - id: Q1
        text: "Does your platform apply GDPR-compliant data handling (encryption, access controls, audit logging) to ALL attestation processing by default, regardless of whether the specific attestation content appears to be personal data?"
        dimension: security
      - id: Q2
        text: "Do you have separate processing paths that bypass security controls for 'non-personal data' attestations (e.g., attestations related to legal persons or objects)? If so, describe the criteria for selecting the bypass path and the controls that are relaxed."
        dimension: architecture
      - id: Q3
        text: "How do you handle attestations relating to legal persons or objects (per eIDAS Art 3(43)) that are processed alongside personal data context (session tokens, wallet identifiers, IP addresses)? Do you apply the 'Compliance by Environment' principle where the combination is treated as personal data?"
        dimension: data_handling
      - id: Q4
        text: "What guidance do you provide to customers (RPs) regarding DPIA requirements for different attestation types? Do you provide a template DPIA, and does it cover the specific processing scenarios enabled by your product?"
        dimension: documentation
      - id: Q5
        text: "How do you document exceptions for truly anonymous processing scenarios (e.g., pure boolean ZKP proofs with high unlinkability, device-only attestations with no wallet user context)? Who is responsible for determining that an exception applies — the product or the customer?"
        dimension: flexibility
      - id: Q6
        text: "Do you implement 'Compliance by Environment' principles where session context (IP address, wallet identifier, User-Agent, timing metadata) is treated as personal data even when the attestation content is not personal? How are these contextual data elements handled?"
        dimension: architecture
      - id: Q7
        text: "What encryption is applied to attestation data at rest and in transit? Are different encryption levels applied based on the sensitivity of the attestation content (e.g., health data vs. age-over-18 boolean)?"
        dimension: security
      - id: Q8
        text: "How do you ensure that access controls on attestation data follow the principle of least privilege? Can individual connector operators/administrators access raw attestation data, or is it encrypted at the product level?"
        dimension: security
      - id: Q9
        text: "For intermediary deployments: does the intermediary's processing of attestation data require its own GDPR basis, or does the intermediated RP's legal basis cover the intermediary's processing? How does the product enforce data minimisation at the intermediary layer?"
        dimension: compliance_completeness

  # ============================================================================
  # VEND-CORE-043: OID4VP Conformance Testing
  # Requirement: Validate product against OIDF conformance suite for OID4VP
  # Added: 2026-02-09 (Stakeholder feedback Item 2)
  # ============================================================================
  VEND-CORE-043:
    questions:
      - id: Q1
        text: "Which credential formats were tested against the OIDF OID4VP conformance suite — SD-JWT VC, ISO mDoc, or both? Were both the HAIP (High Assurance Interoperability Profile) and standard OID4VP profiles tested?"
        dimension: interoperability
      - id: Q2
        text: "Which version of the OID4VP specification was tested against (1.0 Final, ID2, draft-24)? As the spec evolves, do you re-run conformance tests against updated versions?"
        dimension: technical_implementation
      - id: Q3
        text: "Were both direct_post and direct_post.jwt (encrypted) response modes tested in the conformance suite? The ARF mandates both modes — confirm which mode your product defaults to and whether the mode is configurable per RP."
        dimension: technical_implementation
      - id: Q4
        text: "Were both cross-device (QR code scanning) and same-device (app-to-app) presentation flows tested? For same-device, was the W3C Digital Credentials API transport also tested (connects to VEND-CORE-038)?"
        dimension: capability
      - id: Q5
        text: "Was DCQL (Digital Credentials Query Language) support tested in addition to presentation_definition? The ARF supports both query mechanisms — which does your product default to, and is the choice configurable?"
        dimension: technical_implementation
      - id: Q6
        text: "Can you provide the OIDF conformance test results or report for OID4VP verification? Are results publicly available or available under NDA? When was the most recent test run?"
        dimension: compliance_evidence
      - id: Q7
        text: "Was the x509_san_dns client_id_scheme (as specified in the ARF) specifically tested? This is the mandatory client_id_scheme for the EUDI Wallet ecosystem — confirm it is supported and tested."
        dimension: compliance_completeness
      - id: Q8
        text: "Was signed request_uri tested? The ARF requires request objects to be signed — confirm that your product supports and has tested signed request objects (request_uri with signed JWT)."
        dimension: security
      - id: Q9
        text: "How frequently do you re-run OID4VP conformance tests? Is conformance testing part of your CI/CD pipeline, or is it a periodic manual activity? What is your process when a new version of the conformance suite reveals a regression?"
        dimension: lifecycle

  # ============================================================================
  # VEND-CORE-044: OID4VCI Conformance Testing
  # Requirement: Validate product against OIDF conformance suite for OID4VCI
  # Added: 2026-02-09 (Stakeholder feedback Item 2)
  # ============================================================================
  VEND-CORE-044:
    questions:
      - id: Q1
        text: "Which credential formats were tested against the OIDF OID4VCI conformance suite — SD-JWT VC, ISO mDoc, or both? Were both tested successfully, and are the test results available for each format independently?"
        dimension: interoperability
      - id: Q2
        text: "Was OAuth 2.0 Attestation-Based Client Authentication tested as part of the conformance validation? This is a critical requirement for the EUDI Wallet ecosystem — confirm the draft version tested against (draft 05 or later)."
        dimension: technical_implementation
      - id: Q3
        text: "Does the product support and test batch credential issuance flows in the conformance suite? For issuers handling high-volume scenarios (government PID issuance), what is the batch throughput (credentials/second)?"
        dimension: capability
      - id: Q4
        text: "Does the product support deferred issuance (asynchronous credential delivery) and was this tested? Deferred issuance is important for scenarios where credential creation requires offline processing — describe the notification mechanism when the credential is ready."
        dimension: capability
      - id: Q5
        text: "Can you provide the OIDF conformance test results or report for OID4VCI issuance? When was the most recent test run, and which draft version of the OID4VCI spec was tested?"
        dimension: compliance_evidence
      - id: Q6
        text: "Does the product support credential refresh/re-issuance flows? When an issued credential approaches expiry, can the wallet automatically request a refreshed credential using the OID4VCI refresh mechanism?"
        dimension: lifecycle
      - id: Q7
        text: "How does the product handle issuer metadata discovery and validation? Does it correctly implement the well-known endpoint for credential issuer metadata per the OID4VCI spec?"
        dimension: technical_implementation
      - id: Q8
        text: "Was the notification endpoint tested? The OID4VCI spec includes an optional notification mechanism for the wallet to inform the issuer about credential usage — does your product support this?"
        dimension: capability
      - id: Q9
        text: "How frequently do you re-run OID4VCI conformance tests, and is this part of your CI/CD pipeline? What is your process when a new version of the conformance suite reveals a regression?"
        dimension: lifecycle

  # ============================================================================
  # VEND-CORE-045: TS5 RP Registration API
  # Requirement: Implement the TS5 REST API for RP registration
  # Added: 2026-02-09 (Stakeholder feedback Item 3)
  # ============================================================================
  VEND-CORE-045:
    questions:
      - id: Q1
        text: "Does the product implement the full TS5 OpenAPI v3 specification, or a subset? Which endpoints are supported? List any TS5 endpoints that are NOT implemented and explain why."
        dimension: technical_implementation
      - id: Q2
        text: "Does the product provide a management UI for registration data, or only the programmatic REST API? If a UI is provided, does it support all CRUD operations (create, read, update, delete) and lifecycle events?"
        dimension: capability
      - id: Q3
        text: "Can the product register with multiple Member State registries simultaneously for cross-border operations? How does the product handle differences in registry requirements across Member States (e.g., different entitlement schemas, different validation rules)?"
        dimension: interoperability
      - id: Q4
        text: "Does the product validate JWS signatures on registry responses per IETF RFC 7515? How does it handle responses with invalid or expired signatures?"
        dimension: security
      - id: Q5
        text: "Does the product support the full registration lifecycle — initial registration, updates, and de-registration? When registration data changes (e.g., new intended use, updated privacy policy), is the update propagated to all relevant registries automatically?"
        dimension: lifecycle
      - id: Q6
        text: "Does the product support configuring entitlements and sub-entitlements per Member State requirements? Are Member State-specific entitlement schemas pre-loaded, or must they be manually configured?"
        dimension: regulatory_variability
      - id: Q7
        text: "If the RP uses an intermediary, does the product correctly flag this in the registration data (per RPI requirements)? Does it support registering the intermediary relationship with the specific intermediated RP identifiers?"
        dimension: compliance_completeness
      - id: Q8
        text: "Does the product support automated registration renewal, or is manual intervention required? What happens if a registration expires before renewal is initiated — does the product alert operators, or does it gracefully degrade?"
        dimension: automation
      - id: Q9
        text: "How does the product handle registry API downtime or unavailability? Is there a retry mechanism, and does the product cache the last known registration state to prevent disruption to ongoing operations?"
        dimension: operational

  # ============================================================================
  # VEND-CORE-046: Intended Use Selection and Management
  # Requirement: Support intended use selection and management in presentation requests
  # Added: 2026-02-09 (Stakeholder feedback Item 4)
  # ============================================================================
  VEND-CORE-046:
    questions:
      - id: Q1
        text: "Does the product support configuring multiple intended uses per Relying Party customer? How many intended uses can be configured, and is there a practical limit?"
        dimension: capability
      - id: Q2
        text: "How does the product select the correct intended use (and associated registration certificate) when constructing a presentation request? Is the selection automatic (based on the attributes being requested), manual (configured per transaction type), or both?"
        dimension: technical_implementation
      - id: Q3
        text: "Does the product support adding, modifying, or deactivating intended uses without service disruption? Can intended uses be versioned, and if so, does the product retain historical versions for audit purposes?"
        dimension: lifecycle
      - id: Q4
        text: "Per RPRC_21, the wallet may verify that requested attributes match what is registered for the selected intended use. Does the product verify this alignment locally before sending the presentation request, preventing mismatched requests from reaching the wallet?"
        dimension: compliance_completeness
      - id: Q5
        text: "Per RPRC_20a, the RPRC_19a fields must be transferred via protocol extensions defined in ETSI TS 119 472-2 — NOT via the standard OID4VP `purpose` parameter. Does your product implement the ETSI-defined extensions for both OpenID4VP and ISO 18013-5 (proximity)? If you currently use the OID4VP `purpose` field, how will you migrate to the ETSI extension?"
        dimension: compliance_completeness
      - id: Q6
        text: "What happens when an RP customer initiates a presentation request but no matching intended use or registration certificate is configured? Does the product fail fast with a clear error, or does it send the request without the intended use metadata (risking wallet-side rejection)?"
        dimension: operational
      - id: Q7
        text: "How does the product handle the user-friendly description of the intended use across multiple languages? Does it support localisation, and if so, which language is selected for the presentation request (user's wallet locale, RP's default, or another mechanism)?"
        dimension: user_experience
      - id: Q8
        text: "For intermediary deployments: per RPI_05, the intermediated RP must specify its intended use identifier and description to the intermediary. How does the product facilitate this communication — API call, configuration file, or management UI?"
        dimension: architecture
      - id: Q9
        text: "How does the product handle intended use changes that require re-registration with the Registrar? If an intended use is modified (e.g., new attributes added), does the product trigger a TS5 API update to the registry automatically?"
        dimension: lifecycle
      - id: Q10
        text: "Per RPA_10, the wallet displays the privacy policy link 'if available' — sourced from the registration certificate or from a TS5 Registrar query. How does your product ensure the privacy policy URL is included in either the registration certificate or the TS5 registration data? What user experience results if neither source provides the privacy policy link?"
        dimension: user_experience
      - id: Q11
        text: "Per RPRC_21, attribute-to-registration mismatch triggers a wallet-side warning (not a block) — and only when the user has opted in to RP verification (RPRC_16). Does your product pre-validate that requested attributes align with the RP's registered entitlements before sending the presentation request, to proactively prevent these wallet warnings?"
        dimension: compliance_completeness

  # ============================================================================
  # VEND-CORE-047: User Rejection and Timeout Event Surfacing
  # Requirement: Surface user rejection, consent denial, and session timeout events
  # Added: 2026-02-10 (Stakeholder feedback Item 7)
  # ============================================================================
  VEND-CORE-047:
    questions:
      - id: Q1
        text: "What distinct outcome states does the product surface to the integrating application (e.g., SUCCESS, REJECTED, FAILED, TIMEOUT, ERROR)? How are these distinguished at the API level — distinct error codes, different HTTP status codes, or structured response bodies?"
        dimension: technical_implementation
      - id: Q2
        text: "How does the product handle the OID4VP 'access_denied' error response — does it distinguish between user-refused consent, missing credentials, and failed wallet authentication? Can the integrating application determine the specific reason for denial?"
        dimension: technical_implementation
      - id: Q3
        text: "What session timeout mechanism does the product implement for cases where the wallet never responds (user abandonment)? Is the timeout value configurable per RP or per use case? What is the default timeout, and what is the recommended range for different scenarios (web, kiosk, call centre)?"
        dimension: operational
      - id: Q4
        text: "How does the product notify the integrating application of outcome events — callback/webhook, polling API, real-time push (WebSocket/SSE), or other mechanism? Which notification mechanisms are supported concurrently, and which is recommended for low-latency channel integrations?"
        dimension: technical_implementation
      - id: Q5
        text: "What metadata is included with each outcome event (timestamp, error code, error description, session ID, correlation ID, X-Request-ID)? Is the metadata schema documented for integrators, and is it extensible for custom fields?"
        dimension: technical_implementation
      - id: Q6
        text: "Does the product support configurable retry or fallback logic when a timeout or rejection occurs — for example, automatic retry with a different credential type, or escalation to an alternative verification method (e.g., manual document check)?"
        dimension: capability
      - id: Q7
        text: "How are rejection, timeout, and error events logged for audit purposes? Per GDPR data minimisation, are user-identifying data elements (wallet identifier, IP address, pseudonym) excluded from logs, or are they anonymised/pseudonymised?"
        dimension: compliance_completeness
      - id: Q8
        text: "For channel integrations (call centre, kiosk, in-branch), does the product provide real-time status updates during the wallet interaction (e.g., 'request sent', 'waiting for user', 'user responding') or only the final outcome? What is the latency of status updates?"
        dimension: capability
      - id: Q9
        text: "How does the product handle partial completions — e.g., the user approves presentation of some attributes but not others? Does the product surface this as a PARTIAL_SUCCESS state, or does it treat it as a REJECTED outcome?"
        dimension: technical_implementation
