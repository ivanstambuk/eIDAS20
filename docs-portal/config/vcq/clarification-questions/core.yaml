        dimension: interoperability
      - id: Q2
        text: "Was OAuth 2.0 Attestation-Based Client Authentication tested as part of the conformance validation?"
        dimension: technical_implementation
      - id: Q3
        text: "Does the product support and test batch credential issuance flows in the conformance suite?"
        dimension: capability
      - id: Q4
        text: "Does the product support deferred issuance (asynchronous credential delivery) and was this tested?"
        dimension: capability
      - id: Q5
        text: "Can you provide the OIDF conformance test results or report for OID4VCI issuance?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-CORE-045: TS5 RP Registration API
  # Requirement: Implement the TS5 REST API for RP registration
  # Added: 2026-02-09 (Stakeholder feedback Item 3)
  # ============================================================================
  VEND-CORE-045:
    questions:
      - id: Q1
        text: "Does the product implement the full TS5 OpenAPI v3 specification, or a subset? Which endpoints are supported?"
        dimension: technical_implementation
      - id: Q2
        text: "Does the product provide a management UI for registration data, or only the programmatic REST API?"
        dimension: capability
      - id: Q3
        text: "Can the product register with multiple Member State registries simultaneously for cross-border operations?"
        dimension: interoperability
      - id: Q4
        text: "Does the product validate JWS signatures on registry responses per IETF RFC 7515?"
        dimension: security
      - id: Q5
        text: "Does the product support the full registration lifecycle — initial registration, updates, and de-registration?"
        dimension: lifecycle
      - id: Q6
        text: "Does the product support configuring entitlements and sub-entitlements per Member State requirements?"
        dimension: regulatory_variability
      - id: Q7
        text: "If the RP uses an intermediary, does the product correctly flag this in the registration data?"
        dimension: compliance_completeness
      - id: Q8
        text: "Does the product support automated registration renewal, or is manual intervention required?"
        dimension: automation

  # ============================================================================
  # VEND-CORE-046: Intended Use Selection and Management
  # Requirement: Support intended use selection and management in presentation requests
  # Added: 2026-02-09 (Stakeholder feedback Item 4)
  # ============================================================================
  VEND-CORE-046:
    questions:
      - id: Q1
        text: "Does the product support configuring multiple intended uses per Relying Party customer?"
        dimension: capability
      - id: Q2
        text: "How does the product select the correct intended use (and associated registration certificate) when constructing a presentation request?"
        dimension: technical_implementation
      - id: Q3
        text: "Does the product support adding, modifying, or deactivating intended uses without service disruption?"
        dimension: lifecycle
      - id: Q4
        text: "Does the product verify that the attributes requested in a presentation request align with what is registered for the selected intended use?"
        dimension: compliance_completeness
      - id: Q5
        text: "How does the product populate the RPRC_19a extension fields (intended use identifier, user-friendly description, Registrar URL) in presentation requests?"
        dimension: technical_implementation
      - id: Q6
        text: "What happens when an RP customer initiates a presentation request but no matching intended use or registration certificate is configured?"
        dimension: operational

  # ============================================================================
  # VEND-CORE-047: User Rejection and Timeout Event Surfacing
  # Requirement: Surface user rejection, consent denial, and session timeout events
  # Added: 2026-02-10 (Stakeholder feedback Item 7)
  # ============================================================================
  VEND-CORE-047:
    questions:
      - id: Q1
        text: "What distinct outcome states does the product surface to the integrating application (e.g., success, rejected, failed, timeout, error)? How are these distinguished?"
        dimension: technical_implementation
      - id: Q2
        text: "How does the product handle the OID4VP 'access_denied' error response — does it distinguish between user-refused consent, missing credentials, and failed wallet authentication?"
        dimension: technical_implementation
      - id: Q3
        text: "What session timeout mechanism does the product implement for cases where the wallet never responds (user abandonment)? Is the timeout value configurable per RP or per use case?"
        dimension: operational
      - id: Q4
        text: "How does the product notify the integrating application of outcome events — callback/webhook, polling API, real-time push (WebSocket/SSE), or other mechanism?"
        dimension: technical_implementation
      - id: Q5
        text: "What metadata is included with each outcome event (timestamp, error code, error description, session ID, correlation ID) to support downstream decision-making?"
        dimension: technical_implementation
      - id: Q6
        text: "Does the product support configurable retry or fallback logic when a timeout or rejection occurs — for example, automatic retry with a different credential type, or escalation to an alternative verification method?"
        dimension: capability
      - id: Q7
        text: "How are rejection, timeout, and error events logged for audit purposes, and how does this logging comply with the GDPR data minimization principle (no user-identifying data in logs)?"
        dimension: compliance_completeness
      - id: Q8
        text: "For channel integrations (call centre, kiosk, in-branch), does the product provide real-time status updates during the wallet interaction (e.g., 'request sent', 'waiting for user', 'user responding') or only the final outcome?"
        dimension: capability
