# ============================================================================
# VCQ Clarification Questions: Issuer Requirements
# Generated by: Opus (Phase 2)
# Date: 2026-01-30
# ============================================================================
# This file contains detailed clarification questions designed to probe vendor
# implementations beyond simple compliance claims. Questions enable objective
# scoring based on depth of implementatioarchitecturen, lifecycle coverage, automation,
# and operational maturity.
# ============================================================================

schemaVersion: 1
sourceFile: requirements/issuer.yaml
modelPasses:
  opus: true # Completed 2026-01-30 - All issuer requirements processed
  gemini: true # Completed 2026-01-30 - Gemini review pass finished

requirements:
  # ============================================================================
  # VEND-ISS-001: Attestation Provider Registration
  # Requirement: Register as an Attestation Provider with the competent authority
  # ============================================================================
  VEND-ISS-001:
    questions:
      - id: Q1
        text: "Do you provide tooling or services to register the organisation as an Attestation Provider with Member State authorities? Is the registration workflow automated or manual?"
        dimension: capability
      - id: Q2
        text: "Which Member States do you currently support for Attestation Provider registration? Is multi-jurisdiction registration managed from a single platform?"
        dimension: geographic_scope
      - id: Q3
        text: "What documentation and prerequisites must the organisation provide for registration? Do you generate the Reg_01a common data set automatically from platform configuration?"
        dimension: operational
      - id: Q4
        text: "What is the typical timeline from application to inclusion in Trusted Lists? Does this vary significantly across Member States?"
        dimension: sla
      - id: Q5
        text: "How do you track and alert on registration status and renewal requirements? Are alerts sent proactively with sufficient lead time before expiry?"
        dimension: lifecycle
      - id: Q6
        text: "Do you manage ongoing compliance with registration conditions on behalf of the organisation — including monitoring for regulatory changes that affect registration requirements?"
        dimension: compliance_monitoring
      - id: Q7
        text: "How do you handle registration failures or rejections — is there a structured remediation process with guidance on addressing the rejection reasons?"
        dimension: incident_response
      - id: Q8
        text: "Can you register an organisation for multiple roles simultaneously (e.g., as both a PID Provider and a QEAA Provider) through a single process?"
        dimension: flexibility
      - id: Q9
        text: "How do you ensure that the attestation type(s) registered with the Registrar (per Reg_01a) remain synchronised with the types actually issued by the platform?"
        dimension: compliance_completeness

  # ============================================================================
  # VEND-ISS-002: Provider Information Publication
  # Requirement: Publish Provider Information according to the standard schema
  # ============================================================================
  VEND-ISS-002:
    questions:
      - id: Q1
        text: "Do you publish machine-readable Provider Information according to the data model in Annex I of Regulation 2024/2981? Is the information automatically generated from platform configuration?"
        dimension: capability
      - id: Q2
        text: "What metadata do you publish — supported attestation types, issuance policies, data sources, endpoints, credential formats? Does this cover the full Annex I schema?"
        dimension: technical_implementation
      - id: Q3
        text: "How is the Provider Information discovered by wallets and Relying Parties — via OpenID4VCI credential issuer metadata endpoint, Registrar lookup, or Common Catalogue (TS11)?"
        dimension: interoperability
      - id: Q4
        text: "Is the Provider Information endpoint highly available? What is the uptime SLA, and what happens if the endpoint is temporarily unavailable?"
        dimension: sla
      - id: Q5
        text: "How do you validate that published information conforms to the required Annex I schema — automated validation in CI/CD, or manual review?"
        dimension: compliance_monitoring
      - id: Q6
        text: "Per ISSU_29, do you ensure non-discrimination between Wallet Solutions? How do you verify that your Provider Information does not exclude specific wallets (except for SUA attestations)?"
        dimension: compliance_completeness
      - id: Q7
        text: "Is the Provider Information versioned? Can wallets and RPs determine when the information was last updated and detect stale cached versions?"
        dimension: technical_implementation
      - id: Q8
        text: "How do you handle the discoverability of newly deployed attestation types — are they automatically published to the metadata endpoint, or is a manual step required?"
        dimension: automation
      - id: Q9
        text: "Do you support localised Provider Information for different Member States (e.g., different supported attestation types or policies per jurisdiction)?"
        dimension: geographic_scope

  # ============================================================================
  # VEND-ISS-003: Provider Information Update Timeliness
  # Requirement: Update Provider Information within 24 hours of changes
  # ============================================================================
  VEND-ISS-003:
    questions:
      - id: Q1
        text: "How do you ensure Provider Information is updated within 24 hours when operational changes occur? Is update latency measured and monitored?"
        dimension: sla
      - id: Q2
        text: "Is the update process automated when configuration changes are made (e.g., new attestation type deployed), or does it require manual intervention?"
        dimension: automation
      - id: Q3
        text: "What audit trail exists for Provider Information updates — timestamp, change description, triggering user/system, diff of changed fields?"
        dimension: auditability
      - id: Q4
        text: "How are organisations alerted when an update is required but has not yet been published — automated monitoring alert, manual review, or dashboard check?"
        dimension: alerting
      - id: Q5
        text: "What types of changes trigger a Provider Information update — do you have a comprehensive list of change triggers (endpoint URL, attestation types, format support, policy changes)?"
        dimension: compliance_completeness
      - id: Q6
        text: "Do you have a staging/preview mechanism to review Provider Information changes before they go live, to prevent publishing incorrect metadata?"
        dimension: operational
      - id: Q7
        text: "How do you handle the scenario where a change occurs outside business hours — is the 24-hour update window still met through automated processes?"
        dimension: operational
      - id: Q8
        text: "Do you support rollback of Provider Information changes if an error is detected after publication?"
        dimension: incident_response
      - id: Q9
        text: "How do you ensure cache-busting for consumers (wallets, RPs) that may have cached stale Provider Information after an update?"
        dimension: technical_implementation

  # ============================================================================
  # VEND-ISS-004: Trusted List Inclusion (Qualified Attestations)
  # Requirement: Obtain inclusion in national or EU Trusted Lists if issuing qualified attestations
  # ============================================================================
  VEND-ISS-004:
    questions:
      - id: Q1
        text: "Do you support the organisation's application for QTSP status and Trusted List inclusion? Is the application workflow guided or self-service?"
        dimension: capability
      - id: Q2
        text: "Which Member States' Trusted Lists can you support for inclusion? Do requirements vary significantly across Member States?"
        dimension: geographic_scope
      - id: Q3
        text: "What assistance do you provide for the conformity assessment audit required for QTSP status — audit preparation, documentation generation, gap analysis, mock audits?"
        dimension: compliance_evidence
      - id: Q4
        text: "How do you monitor Trusted List status and alert on any changes affecting the organisation — removal, suspension, or status downgrades?"
        dimension: lifecycle
      - id: Q5
        text: "What is your experience with QTSP certification timelines in different Member States? What is the typical duration from application to Trusted List inclusion?"
        dimension: operational
      - id: Q6
        text: "Do you support the biennial re-assessment requirement for QTSP status? How do you prepare the organisation for each re-assessment cycle?"
        dimension: lifecycle
      - id: Q7
        text: "How do you handle the scenario where QTSP status is suspended or revoked — what is the impact on in-flight attestations, and what is the recovery procedure?"
        dimension: incident_response
      - id: Q8
        text: "Can the platform distinguish between QEAA and non-qualified EAA issuance modes, enforcing QTSP status requirements only for qualified attestations?"
        dimension: flexibility
      - id: Q9
        text: "How quickly is the Trusted List entry propagated to wallets and RPs after inclusion — is there a typical propagation delay?"
        dimension: interoperability

  # ============================================================================
  # VEND-ISS-005: Dual Credential Format Support (mDoc + SD-JWT-VC)
  # Requirement: Issue attestations in BOTH mandated credential formats (mDoc and SD-JWT-VC)
  # ============================================================================
  VEND-ISS-005:
    questions:
      - id: Q1
        text: "Do you support issuing attestations in BOTH ISO 18013-5 (mDoc) and SD-JWT-VC formats simultaneously? Is dual-format issuance the default or opt-in?"
        dimension: capability
      - id: Q2
        text: "When a wallet requests issuance, do you automatically issue in all mandated formats per ISSU_12a, or must each format be requested separately?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you ensure format parity — that both mDoc and SD-JWT-VC contain identical attribute data with consistent encoding and semantic meaning?"
        dimension: interoperability
      - id: Q4
        text: "Do you publish supported formats in Provider Information per ARF ISSU_12a? Is the format list automatically synchronised with actual issuance capabilities?"
        dimension: compliance_completeness
      - id: Q5
        text: "Which wallet implementations have you tested format compatibility with (e.g., EUDI reference wallet, Apple, Google, third-party)? Have you participated in plugfest events?"
        dimension: interoperability
      - id: Q6
        text: "Have you participated in EUDI Wallet plugfest or interoperability testing events? What were the results for dual-format issuance?"
        dimension: compliance_evidence
      - id: Q7
        text: "What is the measured latency overhead of generating both mDoc and SD-JWT-VC formats simultaneously compared to a single format? Is this acceptable for user experience?"
        dimension: performance
      - id: Q8
        text: "How do you handle Rulebook-driven format mandates (per ARB_02) — if a Rulebook mandates mDoc for proximity, do you enforce this at the attestation type configuration level?"
        dimension: compliance_completeness
      - id: Q9
        text: "Do you support additional attestation formats beyond mDoc and SD-JWT-VC (e.g., W3C VCDM for non-qualified EAAs per ARB_01a)? Is format extensibility built into the architecture?"
        dimension: roadmap

  # ============================================================================
  # VEND-ISS-006: Cryptographic Device Binding
  # Requirement: Bind attestations to the Wallet Unit's cryptographic device
  # ============================================================================
  VEND-ISS-006:
    questions:
      - id: Q1
        text: "How do you cryptographically bind issued attestations to the Wallet Unit's WSCD? Is the binding mechanism consistent across mDoc (DeviceAuth) and SD-JWT-VC (kb-jwt/cnf)?"
        dimension: technical_implementation
      - id: Q2
        text: "What proof-of-possession mechanism do you use during issuance to verify key ownership — challenge-response, signed nonce, or OpenID4VCI DPoP proof?"
        dimension: security
      - id: Q3
        text: "Do you support both single-attestation keys and wallet-wide device keys for binding? Can the organisation configure the binding strategy per attestation type?"
        dimension: flexibility
      - id: Q4
        text: "How is device binding verified during the issuance flow before the attestation is issued? Is the proof-of-possession validated server-side or delegated?"
        dimension: technical_implementation
      - id: Q5
        text: "Do you support key import (Bring Your Own Key) for device binding keys, or must keys be generated within the WSCD only?"
        dimension: flexibility
      - id: Q6
        text: "Can your issuance pipeline distinguish between keys bound to a Secure Element (SE) versus a Trusted Execution Environment (TEE) for LoA enforcement? How is this determined from the WUA?"
        dimension: security
      - id: Q7
        text: "How do you handle the mDoc-specific DeviceAuth structure — do you include the device public key in the MSO during issuance, and verify the key type (EC P-256 vs P-384)?"
        dimension: technical_implementation
      - id: Q8
        text: "For SD-JWT-VC, how is the `cnf` (confirmation) claim structured — do you support JWK-based confirmation, and which key types are supported?"
        dimension: technical_implementation
      - id: Q9
        text: "How do you handle the scenario where the WSCD is compromised or the device is lost — can the binding be revoked independently of the attestation content?"
        dimension: incident_response

  # ============================================================================
  # VEND-ISS-007: OpenID4VCI Protocol Implementation (TS6)
  # Requirement: Implement the OpenID4VCI issuance protocol (TS6)
  # ============================================================================
  VEND-ISS-007:
    questions:
      - id: Q1
        text: "Do you fully implement the OpenID for Verifiable Credential Issuance (OpenID4VCI) protocol as profiled by the High Assurance Interoperability Profile (HAIP) per ISSU_01a?"
        dimension: capability
      - id: Q2
        text: "Which OpenID4VCI grant types do you support — pre-authorized code flow, authorization code flow, or both? Is the grant type configurable per attestation type?"
        dimension: technical_implementation
      - id: Q3
        text: "Do you support deferred credential issuance for asynchronous processing (e.g., when authentic source verification takes time)? What is the maximum deferral period?"
        dimension: capability
      - id: Q4
        text: "What credential offer mechanisms do you support — QR codes, deep links, pushed authorization requests (PAR)? Are all three implemented for maximum wallet compatibility?"
        dimension: interoperability
      - id: Q5
        text: "Which wallet implementations have you tested OpenID4VCI compatibility with? Have you validated against the EUDI Reference Implementation test suite?"
        dimension: interoperability
      - id: Q6
        text: "How do you handle issuance errors, retries, and partial failures — does the protocol gracefully recover, or must the user restart the entire flow?"
        dimension: operational
      - id: Q7
        text: "Do you support the OID4VCI Batch Issuance Endpoint to reduce round-trips when issuing multiple formats (mDoc + SD-JWT-VC) simultaneously per ISSU_12/ISSU_12a?"
        dimension: technical_implementation
      - id: Q8
        text: "How do you handle the credential issuer metadata endpoint — is it automatically generated from platform configuration and kept in sync with Provider Information (VEND-ISS-002)?"
        dimension: automation
      - id: Q9
        text: "Do you support issuance via both same-device and cross-device flows (e.g., user scans QR code from laptop with wallet on phone)? How are these flows secured against phishing?"
        dimension: security

  # ============================================================================
  # VEND-ISS-008: Batch Issuance
  # Requirement: Support batch issuance for multiple attestations
  # ============================================================================
  VEND-ISS-008:
    questions:
      - id: Q1
        text: "Do you support batch issuance of multiple attestations in a single OID4VCI session? Is this implemented via the Batch Issuance Endpoint or multiple sequential Credential Requests?"
        dimension: capability
      - id: Q2
        text: "Is batch issuance processed synchronously (all credentials returned in one response) or asynchronously with deferred polling per credential?"
        dimension: technical_implementation
      - id: Q3
        text: "Do you offer a bulk upload interface (CSV, JSON, API) for high-volume batch issuance from enterprise systems (e.g., HR onboarding, educational institution graduation)?"
        dimension: capability
      - id: Q4
        text: "What is the maximum batch size you have tested in production? What is the sustained throughput (credentials/second) for batch issuance jobs?"
        dimension: scalability
      - id: Q5
        text: "How are failures handled in batch issuance — does one failure abort the entire batch, or does the system support partial success with per-credential error reporting?"
        dimension: operational
      - id: Q6
        text: "Can different attestation types be combined in a single batch issuance (e.g., PID + professional qualification + mandate in one session)?"
        dimension: flexibility
      - id: Q7
        text: "How does batch issuance interact with dual-format requirements (ISSU_12/ISSU_12a) — does each credential in the batch automatically produce both mDoc and SD-JWT-VC?"
        dimension: compliance_completeness
      - id: Q8
        text: "Are you tracking the W3C Digital Credentials API (per ISSU_03)? If it becomes a W3C Recommendation, how quickly could you support browser-based batch issuance through it?"
        dimension: roadmap
      - id: Q9
        text: "How do you handle authentication deduplication in batch issuance — is user identity verified once for the entire batch, or per credential?"
        dimension: security

  # ============================================================================
  # VEND-ISS-009: User Identity Verification
  # Requirement: Verify user identity before issuing attestations
  # ============================================================================
  VEND-ISS-009:
    questions:
      - id: Q1
        text: "What identity verification methods do you support — video identification, national eID, face-to-face, document scan + liveness? Which methods achieve High LoA per Commission Implementing Regulation (EU) 2015/1502?"
        dimension: capability
      - id: Q2
        text: "What levels of assurance (LoA) can you achieve for identity proofing — Low, Substantial, High? Is the LoA configurable per attestation type?"
        dimension: compliance_completeness
      - id: Q3
        text: "Do you support identity verification using an existing PID in the user's wallet (PID-based verification)? Does this eliminate the need for independent proofing for non-PID attestations?"
        dimension: flexibility
      - id: Q4
        text: "Do you support FIDO2/WebAuthn for authentication during identity verification flows? Is this used as a second factor or primary?  "
        dimension: capability
      - id: Q5
        text: "How do you verify the identity of legal persons (organisations) requesting attestations — business register lookup, representative mandate verification, or both?"
        dimension: capability
      - id: Q6
        text: "What audit trail is maintained for identity verification decisions — verification method used, evidence captured, LoA achieved, timestamp, operator (if applicable)?"
        dimension: auditability
      - id: Q7
        text: "How do you handle the ISSU_05 PID activation requirement — what is the activation process, and how do you verify the PID was delivered to the correct WSCA/WSCD?"
        dimension: compliance_completeness
      - id: Q8
        text: "Can your identity verification pipeline adapt based on the requested attestation type (e.g., stricter proofing for qualified attestations, lighter for non-qualified)?"
        dimension: flexibility
      - id: Q9
        text: "How do you handle identity verification failures or inconclusive results — retry, fallback to alternative method, manual review, or rejection?"
        dimension: incident_response

  # ============================================================================
  # VEND-ISS-010: Authentic Source Data Provenance
  # Requirement: Obtain data from authentic sources with verified provenance
  # ============================================================================
  VEND-ISS-010:
    questions:
      - id: Q1
        text: "Which authentic sources do you connect to for attestation data (national registries, authoritative databases)? Do you support the QTSPAS_02 verification interface for QEAA Providers?"
        dimension: capability
      - id: Q2
        text: "Do you support authentic sources in multiple EU Member States? How many cross-border authentic source integrations are operational?"
        dimension: geographic_scope
      - id: Q3
        text: "Do you use mutual TLS (mTLS) or equivalent secure channels when connecting to authentic sources? Is certificate management automated?"
        dimension: security
      - id: Q4
        text: "Do you maintain cryptographic audit trails linking issued attestations to the original authentic source queries — including query timestamp, attributes retrieved, and verification result?"
        dimension: auditability
      - id: Q5
        text: "How do you handle authentic source unavailability or data freshness issues — fallback to cached data, deferred issuance, or immediate failure?"
        dimension: operational
      - id: Q6
        text: "Can the organisation integrate additional authentic sources through your platform — via standard APIs, custom connectors, or only through pre-built integrations?"
        dimension: flexibility
      - id: Q7
        text: "How do you handle data discrepancies between multiple authentic sources for the same attribute (e.g., address from civil registry vs tax authority)?"
        dimension: technical_implementation
      - id: Q8
        text: "Do you support push-based authentic source notifications (the source alerts you of changes) in addition to pull-based queries, per VCR_09?"
        dimension: technical_implementation
      - id: Q9
        text: "How do you ensure data minimisation — do you only query the specific attributes needed for the requested attestation, or do you retrieve broader data sets from the authentic source?"
        dimension: privacy

  # ============================================================================
  # VEND-ISS-011: Attestation Validity Period
  # Requirement: Include attestation validity period and issuance timestamp
  # ============================================================================
  VEND-ISS-011:
    questions:
      - id: Q1
        text: "Do you include clearly defined validity periods (valid_from, valid_until) in all issued attestations? Is this consistent across both mDoc (MSO validFrom/validUntil) and SD-JWT-VC (iat/nbf/exp)?"
        dimension: capability
      - id: Q2
        text: "How are validity periods determined for different attestation types — configurable per type, derived from Rulebook requirements, or fixed platform-wide?"
        dimension: technical_implementation
      - id: Q3
        text: "Can the organisation configure attestation validity periods per attestation type? What is the minimum and maximum validity period supported?"
        dimension: flexibility
      - id: Q4
        text: "How do you handle clock synchronisation between issuer, wallet, and verifier to ensure accurate validity checks? Do you use NTP, and what clock skew tolerance is applied?"
        dimension: technical_implementation
      - id: Q5
        text: "Do you inform the Wallet Unit about the optimal re-issuance timing relative to expiry, per ISSU_50? How is the renewal window communicated?"
        dimension: compliance_completeness
      - id: Q6
        text: "Do you notify users when their attestations are approaching expiry? How far in advance, and through which channels?"
        dimension: user_experience
      - id: Q7
        text: "How do you handle attestations that expire during a presentation flow — does the wallet warn the user, or is the expired attestation still presented (per ISSU_50 note)?"
        dimension: technical_implementation
      - id: Q8
        text: "After re-issuance, does your system automatically compare attribute values between the old and new attestation and alert the user of differences per ISSU_59?"
        dimension: compliance_completeness
      - id: Q9
        text: "Can validity periods differ between the mDoc and SD-JWT-VC formats of the same attestation, or are they always identical?"
        dimension: interoperability

  # ============================================================================
  # VEND-ISS-012: Attestation Renewal and Re-issuance
  # Requirement: Support attestation renewal and re-issuance workflows
  # ============================================================================
  VEND-ISS-012:
    questions:
      - id: Q1
        text: "Do you support workflows for renewing attestations before expiry? Is the renewal flow seamless (no re-verification required) or does it require full re-authentication?"
        dimension: capability
      - id: Q2
        text: "Can attestations be re-issued when the underlying data changes (e.g., address change, name change) — is this triggered automatically from authentic source notifications (per VCR_09) or only on user request?"
        dimension: capability
      - id: Q3
        text: "How do users receive notifications of upcoming expiry — push notification, email, in-app banner? What is the configurable lead time before expiry?"
        dimension: user_experience
      - id: Q4
        text: "Is renewal automated (silent re-issuance with fresh authentic source data) or does it require explicit user action? Is this configurable per attestation type?"
        dimension: automation
      - id: Q5
        text: "When an attestation is renewed, is the old attestation automatically revoked per VCR_09 to prevent duplicate active attestations? Is the revocation synchronous with re-issuance?"
        dimension: lifecycle
      - id: Q6
        text: "After re-issuance, does your system perform full attribute comparison (per ISSU_59) and present differences to the user for acknowledgement?"
        dimension: compliance_completeness
      - id: Q7
        text: "How do you handle the scenario where re-issuance fails (e.g., authentic source unavailable) but the existing attestation is about to expire — is the user warned, or does the expiring attestation silently become invalid?"
        dimension: incident_response
      - id: Q8
        text: "Can the organisation configure different renewal policies per attestation type (e.g., auto-renew for low-risk attestations, manual approval for high-value ones)?"
        dimension: flexibility
      - id: Q9
        text: "How does the renewal flow handle format parity — is the renewed attestation re-issued in both mDoc and SD-JWT-VC simultaneously, or can formats be renewed independently?"
        dimension: interoperability

  # ============================================================================
  # VEND-ISS-013: Attestation Status Lists (Revocation)
  # Requirement: Publish attestation status lists for revocation checking
  # ============================================================================
  VEND-ISS-013:
    questions:
      - id: Q1
        text: "Do you maintain and publish attestation status lists for revocation checking? Do you support both the Attestation Status List mechanism and the Attestation Revocation List mechanism per VCR_11/VCR_12?"
        dimension: capability
      - id: Q2
        text: "What status list formats do you support — IETF Token Status List, compressed bitstring lists, identifier-based revocation lists? Are all formats published simultaneously?"
        dimension: technical_implementation
      - id: Q3
        text: "How frequently are status lists updated? Is the update frequency configurable, and what is the minimum update interval for critical revocations?"
        dimension: sla
      - id: Q4
        text: "Is status list publication highly available? What is the uptime SLA, and do you have geographic redundancy for the status list endpoints?"
        dimension: sla
      - id: Q5
        text: "How do Relying Parties discover and access your status list endpoints — is the endpoint embedded in the attestation itself, discoverable via Provider Information, or both?"
        dimension: interoperability
      - id: Q6
        text: "Do you support privacy-preserving status checks (e.g., using signed status assertions, unlinkable checks, or oblivious HTTP) to prevent the issuer from tracking presentation events?"
        dimension: privacy
      - id: Q7
        text: "Per VCR_03, you are the sole party responsible for revocation. If you outsource the status list operation to a third party, how is the delegation governed and audited?"
        dimension: compliance_completeness
      - id: Q8
        text: "Are status lists signed by the provider? What signing algorithm and key management is used for status list integrity?"
        dimension: security
      - id: Q9
        text: "How large can your status lists grow before performance deteriorates? What is the maximum number of attestation entries per status list, and do you support sharding?"
        dimension: scalability

  # ============================================================================
  # VEND-ISS-014: Revocation Propagation Timeliness
  # Requirement: Update revocation status within defined time limits
  # ============================================================================
  VEND-ISS-014:
    questions:
      - id: Q1
        text: "What is the maximum propagation time for standard attestation revocations? Does this meet the VCR_09 requirement of revoking within 24 hours of attribute changes?"
        dimension: sla
      - id: Q2
        text: "Do you support immediate revocation for critical security situations (e.g., WSCD compromise, fraud detection)? What is the measured time from revocation trigger to status list update?"
        dimension: incident_response
      - id: Q3
        text: "How is revocation propagation time measured and audited? Do you log the timestamp of the revocation trigger, status list generation, and status list publication as separate events?"
        dimension: auditability
      - id: Q4
        text: "What caching strategy is used for status lists (Cache-Control, max-age)? How does RP-side caching affect effective revocation propagation time, and can you force cache invalidation for critical revocations?"
        dimension: technical_implementation
      - id: Q5
        text: "How do you handle revocation during status list endpoint outages — is there a failover mechanism, or do RPs fall back to the last-known status list?"
        dimension: operational
      - id: Q6
        text: "Per VCR_09, how do you ensure authentic sources notify you of attribute value changes? Do you implement push-based notifications, periodic polling, or both?"
        dimension: compliance_completeness
      - id: Q7
        text: "Can Attestation Rulebook-specific propagation requirements (potentially stricter than 24 hours) be configured per attestation type?"
        dimension: flexibility
      - id: Q8
        text: "How do you handle the scenario where an attestation has been presented to an RP but then revoked before the RP’s transaction completes — is there a grace period or immediate rejection?"
        dimension: technical_implementation
      - id: Q9
        text: "Do you publish metrics on your revocation propagation performance (e.g., P50/P99 latencies) for transparency and compliance auditing?"
        dimension: auditability

  # ============================================================================
  # VEND-ISS-015: User Notification on Revocation
  # Requirement: Notify wallet users when their attestations are revoked
  # ============================================================================
  VEND-ISS-015:
    questions:
      - id: Q1
        text: "Do you notify users when their attestations are revoked? Is notification mandatory for all revocations, or only when user contact details are available (per VCR_09 SHOULD)?"
        dimension: capability
      - id: Q2
        text: "Through what channels are revocation notifications sent — push notification (wallet app), email, SMS, in-app banner? Do you support multi-channel delivery for critical revocations?"
        dimension: technical_implementation
      - id: Q3
        text: "How quickly are notifications sent after revocation occurs? Is the notification synchronous with the status list update, or is there a separate notification pipeline with its own SLA?"
        dimension: sla
      - id: Q4
        text: "Does the notification include the reason for revocation, guidance for resolution (re-issuance instructions), and expected timeline for re-issuance availability?"
        dimension: user_experience
      - id: Q5
        text: "How do you handle notification delivery failures — retry with exponential backoff, fallback to alternative channel, or manual escalation?"
        dimension: operational
      - id: Q6
        text: "Do you track notification delivery status per revocation event? Can the organisation view a delivery receipt dashboard?"
        dimension: auditability
      - id: Q7
        text: "For VCR_09 attribute-change revocations, does the notification specifically state which attributes changed and suggest the user re-request the attestation with updated data?"
        dimension: compliance_completeness
      - id: Q8
        text: "Can the organisation customise notification templates, branding, and language for their specific attestation types?"
        dimension: flexibility
      - id: Q9
        text: "How do you handle notifications for users who have multiple wallet instances — is the notification sent to all instances, or only the one holding the revoked attestation?"
        dimension: technical_implementation

  # ============================================================================
  # VEND-ISS-016: Attestation Suspension and Reinstatement
  # Requirement: Support suspension and reinstatement of attestations
  # ============================================================================
  VEND-ISS-016:
    questions:
      - id: Q1
        text: "Do you support temporary suspension of attestations as distinct from permanent revocation? Is the tri-state (active/suspended/revoked) reflected in your status list mechanism?"
        dimension: capability
      - id: Q2
        text: "What triggers can initiate attestation suspension — fraud investigation, user request, authority order, authentic source data discrepancy? Are triggers configurable per attestation type?"
        dimension: operational
      - id: Q3
        text: "Can suspended attestations be reinstated? What is the reinstatement process — automatic after timeout, manual approval, re-verification against authentic source?"
        dimension: lifecycle
      - id: Q4
        text: "How is suspension status reflected in the status lists — a distinct bit/status code separate from revocation, or re-use of the revocation bit with metadata?"
        dimension: technical_implementation
      - id: Q5
        text: "Are users notified when their attestations are suspended and when they are reinstated? Do notifications include the reason and expected resolution timeline?"
        dimension: user_experience
      - id: Q6
        text: "Is there a maximum suspension duration after which the attestation is automatically revoked (to prevent indefinite suspension)?"
        dimension: lifecycle
      - id: Q7
        text: "How do wallets and RPs differentiate between suspended and revoked attestations during presentation — do both result in rejection, or is suspension handled differently (e.g., with a warning)?"
        dimension: interoperability
      - id: Q8
        text: "Can suspension be initiated programmatically (API call) as well as through a management UI? Is there an approval workflow for reinstatement?"
        dimension: automation
      - id: Q9
        text: "What audit trail exists for suspension and reinstatement events — who initiated, when, why, and the resolution outcome?"
        dimension: auditability

  # ============================================================================
  # VEND-ISS-017: Signing Key Protection
  # Requirement: Protect attestation signing keys in secure cryptographic devices
  # ============================================================================
  VEND-ISS-017:
    questions:
      - id: Q1
        text: "Are attestation signing keys stored and used within Hardware Security Modules (HSMs) or equivalent secure cryptographic devices?"
        dimension: capability
      - id: Q2
        text: "What certification level do your cryptographic modules have (FIPS 140-2/3 Level 3, Common Criteria EAL4+)?"
        dimension: compliance_evidence
      - id: Q3
        text: "Do you support Bring Your Own Key (BYOK) for organizations that want to manage their own signing keys?"
        dimension: flexibility
      - id: Q4
        text: "Do you require multi-person approval (quorum/four-eye principle) for sensitive key operations?"
        dimension: security
      - id: Q5
        text: "Do you offer cloud-hosted HSM or require on-premises HSM deployment?"
        dimension: operational
      - id: Q6
        text: "How are HSM backup and disaster recovery handled without exposing keys?"
        dimension: operational

  # ============================================================================
  # VEND-ISS-018: Approved Signing Algorithms
  # Requirement: Use signing algorithms from the approved list
  # ============================================================================
  VEND-ISS-018:
    questions:
      - id: Q1
        text: "Which signing algorithms do you support from the approved list (ECDSA P-256, EdDSA Ed25519, RSA-PSS)?"
        dimension: technical_implementation
      - id: Q2
        text: "How do you ensure only approved algorithms are used for attestation signing?"
        dimension: compliance_monitoring
      - id: Q3
        text: "Do you support algorithm agility to transition when new algorithms are approved or deprecated?"
