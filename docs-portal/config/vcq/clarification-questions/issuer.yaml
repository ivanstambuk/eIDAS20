# implementations beyond simple compliance claims. Questions enable objective
# scoring based on depth of implementation, architecture, lifecycle coverage,
# automation, and operational maturity.
# ============================================================================

schemaVersion: 1
sourceFile: requirements/issuer.yaml
modelPasses:
  opus: true # Completed 2026-01-30 - All issuer requirements processed
  gemini: true # Completed 2026-01-30 - Gemini review pass finished

requirements:
  # ============================================================================
  # VEND-ISS-001: Attestation Provider Registration
  # Requirement: Register as an Attestation Provider with the competent authority
  # ============================================================================
  VEND-ISS-001:
    questions:
      - id: Q1
        text: "Do you provide tooling or services to register the organisation as an Attestation Provider with Member State authorities? Is the registration workflow automated or manual?"
        dimension: capability
      - id: Q2
        text: "Which Member States do you currently support for Attestation Provider registration? Is multi-jurisdiction registration managed from a single platform?"
        dimension: geographic_scope
      - id: Q3
        text: "What documentation and prerequisites must the organisation provide for registration? Do you generate the AS-MS-27-002 common data set automatically from platform configuration?"
        dimension: operational
      - id: Q4
        text: "What is the typical timeline from application to inclusion in Trusted Lists? Does this vary significantly across Member States?"
        dimension: sla
      - id: Q5
        text: "How do you track and alert on registration status and renewal requirements? Are alerts sent proactively with sufficient lead time before expiry?"
        dimension: lifecycle
      - id: Q6
        text: "Do you manage ongoing compliance with registration conditions on behalf of the organisation — including monitoring for regulatory changes that affect registration requirements?"
        dimension: compliance_monitoring
      - id: Q7
        text: "How do you handle registration failures or rejections — is there a structured remediation process with guidance on addressing the rejection reasons?"
        dimension: incident_response
      - id: Q8
        text: "Can you register an organisation for multiple roles simultaneously (e.g., as both a PID Provider and a QEAA Provider) through a single process?"
        dimension: flexibility
      - id: Q9
        text: "How do you ensure that the attestation type(s) registered with the Registrar (per AS-MS-27-002) remain synchronised with the types actually issued by the platform?"
        dimension: compliance_completeness

  # ============================================================================
  # VEND-ISS-002: Provider Information Publication
  # Requirement: Publish Provider Information according to the standard schema
  # ============================================================================
  VEND-ISS-002:
    questions:
      - id: Q1
        text: "Do you publish machine-readable Provider Information according to the data model in Annex I of Regulation 2024/2981? Is the information automatically generated from platform configuration?"
        dimension: capability
      - id: Q2
        text: "What metadata do you publish — supported attestation types, issuance policies, data sources, endpoints, credential formats? Does this cover the full Annex I schema?"
        dimension: technical_implementation
      - id: Q3
        text: "How is the Provider Information discovered by wallets and Relying Parties — via OpenID4VCI credential issuer metadata endpoint, Registrar lookup, or Common Catalogue (TS11)?"
        dimension: interoperability
      - id: Q4
        text: "Is the Provider Information endpoint highly available? What is the uptime SLA, and what happens if the endpoint is temporarily unavailable?"
        dimension: sla
      - id: Q5
        text: "How do you validate that published information conforms to the required Annex I schema — automated validation in CI/CD, or manual review?"
        dimension: compliance_monitoring
      - id: Q6
        text: "Per AS-AP-10-044, do you ensure non-discrimination between Wallet Solutions? How do you verify that your Provider Information does not exclude specific wallets (except for SUA attestations)?"
        dimension: compliance_completeness
      - id: Q7
        text: "Is the Provider Information versioned? Can wallets and RPs determine when the information was last updated and detect stale cached versions?"
        dimension: technical_implementation
      - id: Q8
        text: "How do you handle the discoverability of newly deployed attestation types — are they automatically published to the metadata endpoint, or is a manual step required?"
        dimension: automation
      - id: Q9
        text: "Do you support localised Provider Information for different Member States (e.g., different supported attestation types or policies per jurisdiction)?"
        dimension: geographic_scope

  # ============================================================================
  # VEND-ISS-003: Provider Information Update Timeliness
  # Requirement: Update Provider Information within 24 hours of changes
  # ============================================================================
  VEND-ISS-003:
    questions:
      - id: Q1
        text: "How do you ensure Provider Information is updated within 24 hours when operational changes occur? Is update latency measured and monitored?"
        dimension: sla
      - id: Q2
        text: "Is the update process automated when configuration changes are made (e.g., new attestation type deployed), or does it require manual intervention?"
        dimension: automation
      - id: Q3
        text: "What audit trail exists for Provider Information updates — timestamp, change description, triggering user/system, diff of changed fields?"
        dimension: auditability
      - id: Q4
        text: "How are organisations alerted when an update is required but has not yet been published — automated monitoring alert, manual review, or dashboard check?"
        dimension: alerting
      - id: Q5
        text: "What types of changes trigger a Provider Information update — do you have a comprehensive list of change triggers (endpoint URL, attestation types, format support, policy changes)?"
        dimension: compliance_completeness
      - id: Q6
        text: "Do you have a staging/preview mechanism to review Provider Information changes before they go live, to prevent publishing incorrect metadata?"
        dimension: operational
      - id: Q7
        text: "How do you handle the scenario where a change occurs outside business hours — is the 24-hour update window still met through automated processes?"
        dimension: operational
      - id: Q8
        text: "Do you support rollback of Provider Information changes if an error is detected after publication?"
        dimension: incident_response
      - id: Q9
        text: "How do you ensure cache-busting for consumers (wallets, RPs) that may have cached stale Provider Information after an update?"
        dimension: technical_implementation

  # ============================================================================
  # VEND-ISS-004: Trusted List Inclusion (Qualified Attestations)
  # Requirement: Obtain inclusion in national or EU Trusted Lists if issuing qualified attestations
  # ============================================================================
  VEND-ISS-004:
    questions:
      - id: Q1
        text: "Do you support the organisation's application for QTSP status and Trusted List inclusion? Is the application workflow guided or self-service?"
        dimension: capability
      - id: Q2
        text: "Which Member States' Trusted Lists can you support for inclusion? Do requirements vary significantly across Member States?"
        dimension: geographic_scope
      - id: Q3
        text: "What assistance do you provide for the conformity assessment audit required for QTSP status — audit preparation, documentation generation, gap analysis, mock audits?"
        dimension: compliance_evidence
      - id: Q4
        text: "How do you monitor Trusted List status and alert on any changes affecting the organisation — removal, suspension, or status downgrades?"
        dimension: lifecycle
      - id: Q5
        text: "What is your experience with QTSP certification timelines in different Member States? What is the typical duration from application to Trusted List inclusion?"
        dimension: operational
      - id: Q6
        text: "Do you support the biennial re-assessment requirement for QTSP status? How do you prepare the organisation for each re-assessment cycle?"
        dimension: lifecycle
      - id: Q7
        text: "How do you handle the scenario where QTSP status is suspended or revoked — what is the impact on in-flight attestations, and what is the recovery procedure?"
        dimension: incident_response
      - id: Q8
        text: "Can the platform distinguish between QEAA and non-qualified EAA issuance modes, enforcing QTSP status requirements only for qualified attestations?"
        dimension: flexibility
      - id: Q9
        text: "How quickly is the Trusted List entry propagated to wallets and RPs after inclusion — is there a typical propagation delay?"
        dimension: interoperability

  # ============================================================================
  # VEND-ISS-005: Dual Credential Format Support (mDoc + SD-JWT-VC)
  # Requirement: Issue attestations in BOTH mandated credential formats (mDoc and SD-JWT-VC)
  # ============================================================================
  VEND-ISS-005:
    questions:
      - id: Q1
        text: "Do you support issuing attestations in BOTH ISO 18013-5 (mDoc) and SD-JWT-VC formats simultaneously? Is dual-format issuance the default or opt-in?"
        dimension: capability
      - id: Q2
        text: "When a wallet requests issuance, do you automatically issue in all mandated formats per AS-AP-10-014, or must each format be requested separately?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you ensure format parity — that both mDoc and SD-JWT-VC contain identical attribute data with consistent encoding and semantic meaning?"
        dimension: interoperability
      - id: Q4
        text: "Do you publish supported formats in Provider Information per ARF AS-AP-10-014? Is the format list automatically synchronised with actual issuance capabilities?"
        dimension: compliance_completeness
      - id: Q5
        text: "Which wallet implementations have you tested dual-format issuance compatibility with (e.g., EUDI reference wallet, Apple, Google, third-party national wallets)? Provide a compatibility matrix showing which wallets successfully accepted each format."
        dimension: interoperability
      - id: Q6
        text: "Have you participated in EU-organised EUDI Wallet plugfest or interoperability testing events specifically for dual-format issuance? Provide the test results, including any format-specific interoperability issues discovered and their resolution status."
        dimension: compliance_evidence
      - id: Q7
        text: "What is the measured latency overhead of generating both mDoc and SD-JWT-VC formats simultaneously compared to a single format? Is this acceptable for user experience?"
        dimension: performance
      - id: Q8
        text: "How do you handle Rulebook-driven format mandates (per EW-DM-12-003) — if a Rulebook mandates mDoc for proximity, do you enforce this at the attestation type configuration level?"
        dimension: compliance_completeness
      - id: Q9
        text: "Do you support additional attestation formats beyond mDoc and SD-JWT-VC (e.g., W3C VCDM for non-qualified EAAs per EW-DM-12-001)? Is format extensibility built into the architecture?"
        dimension: roadmap

  # ============================================================================
  # VEND-ISS-006: Cryptographic Device Binding
  # Requirement: Bind attestations to the Wallet Unit's cryptographic device
  # ============================================================================
  VEND-ISS-006:
    questions:
      - id: Q1
        text: "How do you cryptographically bind issued attestations to the Wallet Unit's WSCD? Is the binding mechanism consistent across mDoc (DeviceAuth) and SD-JWT-VC (kb-jwt/cnf)?"
        dimension: technical_implementation
      - id: Q2
        text: "What proof-of-possession mechanism do you use during issuance to verify key ownership — challenge-response, signed nonce, or OpenID4VCI DPoP proof?"
        dimension: security
      - id: Q3
        text: "Do you support both single-attestation keys and wallet-wide device keys for binding? Can the organisation configure the binding strategy per attestation type?"
        dimension: flexibility
      - id: Q4
        text: "How is device binding verified during the issuance flow before the attestation is issued? Is the proof-of-possession validated server-side or delegated?"
        dimension: technical_implementation
      - id: Q5
        text: "Do you support key import (Bring Your Own Key) for device binding keys, or must keys be generated within the WSCD only?"
        dimension: flexibility
      - id: Q6
        text: "Can your issuance pipeline distinguish between keys bound to a Secure Element (SE) versus a Trusted Execution Environment (TEE) for LoA enforcement? How is this determined from the WUA?"
        dimension: security
      - id: Q7
        text: "How do you handle the mDoc-specific DeviceAuth structure — do you include the device public key in the MSO during issuance, and verify the key type (EC P-256 vs P-384)?"
        dimension: technical_implementation
      - id: Q8
        text: "For SD-JWT-VC, how is the `cnf` (confirmation) claim structured — do you support JWK-based confirmation, and which key types are supported?"
        dimension: technical_implementation
      - id: Q9
        text: "How do you handle the scenario where the WSCD is compromised or the device is lost — can the binding be revoked independently of the attestation content?"
        dimension: incident_response

  # ============================================================================
  # VEND-ISS-007: OpenID4VCI Protocol Implementation (TS6)
  # Requirement: Implement the OpenID4VCI issuance protocol (TS6)
  # ============================================================================
  VEND-ISS-007:
    questions:
      - id: Q1
        text: "Do you fully implement the OpenID for Verifiable Credential Issuance (OpenID4VCI) protocol as profiled by the High Assurance Interoperability Profile (HAIP) per AS-AP-10-001?"
        dimension: capability
      - id: Q2
        text: "Which OpenID4VCI grant types do you support — pre-authorized code flow, authorization code flow, or both? Is the grant type configurable per attestation type?"
        dimension: technical_implementation
      - id: Q3
        text: "Do you support deferred credential issuance for asynchronous processing (e.g., when authentic source verification takes time)? What is the maximum deferral period?"
        dimension: capability
      - id: Q4
        text: "What credential offer mechanisms do you support — QR codes, deep links, pushed authorization requests (PAR)? Are all three implemented for maximum wallet compatibility?"
        dimension: interoperability
      - id: Q5
        text: "Which wallet implementations have you tested OpenID4VCI compatibility with? Have you validated against the EUDI Reference Implementation test suite?"
        dimension: interoperability
      - id: Q6
        text: "How do you handle issuance errors, retries, and partial failures — does the protocol gracefully recover, or must the user restart the entire flow?"
        dimension: operational
      - id: Q7
        text: "Do you support the OID4VCI Batch Issuance Endpoint to reduce round-trips when issuing multiple formats (mDoc + SD-JWT-VC) simultaneously per AS-AP-10-013/AS-AP-10-014?"
        dimension: technical_implementation
      - id: Q8
        text: "How do you handle the credential issuer metadata endpoint — is it automatically generated from platform configuration and kept in sync with Provider Information (VEND-ISS-002)?"
        dimension: automation
      - id: Q9
        text: "Do you support issuance via both same-device and cross-device flows (e.g., user scans QR code from laptop with wallet on phone)? How are these flows secured against phishing?"
        dimension: security

  # ============================================================================
  # VEND-ISS-008: Batch Issuance
  # Requirement: Support batch issuance for multiple attestations
  # ============================================================================
  VEND-ISS-008:
    questions:
      - id: Q1
        text: "Do you support batch issuance of multiple attestations in a single OID4VCI session? Is this implemented via the Batch Issuance Endpoint or multiple sequential Credential Requests?"
        dimension: capability
      - id: Q2
        text: "Is batch issuance processed synchronously (all credentials returned in one response) or asynchronously with deferred polling per credential?"
        dimension: technical_implementation
      - id: Q3
        text: "Do you offer a bulk upload interface (CSV, JSON, API) for high-volume batch issuance from enterprise systems (e.g., HR onboarding, educational institution graduation)?"
        dimension: capability
      - id: Q4
        text: "What is the maximum batch size you have tested in production? What is the sustained throughput (credentials/second) for batch issuance jobs?"
        dimension: scalability
      - id: Q5
        text: "How are failures handled in batch issuance — does one failure abort the entire batch, or does the system support partial success with per-credential error reporting?"
        dimension: operational
      - id: Q6
        text: "Can different attestation types be combined in a single batch issuance (e.g., PID + professional qualification + mandate in one session)?"
        dimension: flexibility
      - id: Q7
        text: "How does batch issuance interact with dual-format requirements (AS-AP-10-013/AS-AP-10-014) — does each credential in the batch automatically produce both mDoc and SD-JWT-VC?"
        dimension: compliance_completeness
      - id: Q8
        text: "Are you tracking the W3C Digital Credentials API (per AS-AP-10-003)? If it becomes a W3C Recommendation, how quickly could you support browser-based batch issuance through it?"
        dimension: roadmap
      - id: Q9
        text: "How do you handle authentication deduplication in batch issuance — is user identity verified once for the entire batch, or per credential?"
        dimension: security

  # ============================================================================
  # VEND-ISS-009: User Identity Verification
  # Requirement: Verify user identity before issuing attestations
  # ============================================================================
  VEND-ISS-009:
    questions:
      - id: Q1
        text: "What identity verification methods do you support — video identification, national eID, face-to-face, document scan + liveness? Which methods achieve High LoA per Commission Implementing Regulation (EU) 2015/1502?"
        dimension: capability
      - id: Q2
        text: "What levels of assurance (LoA) can you achieve for identity proofing — Low, Substantial, High? Is the LoA configurable per attestation type?"
        dimension: compliance_completeness
      - id: Q3
        text: "Do you support identity verification using an existing PID in the user's wallet (PID-based verification)? Does this eliminate the need for independent proofing for non-PID attestations?"
        dimension: flexibility
      - id: Q4
        text: "Do you support FIDO2/WebAuthn for authentication during identity verification flows? Is this used as a second factor or primary authenticator?"
        dimension: capability
      - id: Q5
        text: "How do you verify the identity of legal persons (organisations) requesting attestations — business register lookup, representative mandate verification, or both?"
        dimension: capability
      - id: Q6
        text: "What audit trail is maintained for identity verification decisions — verification method used, evidence captured, LoA achieved, timestamp, operator (if applicable)?"
        dimension: auditability
      - id: Q7
        text: "How do you handle the AS-AP-10-005 PID activation requirement — what is the activation process, and how do you verify the PID was delivered to the correct WSCA/WSCD?"
        dimension: compliance_completeness
      - id: Q8
        text: "Can your identity verification pipeline adapt based on the requested attestation type (e.g., stricter proofing for qualified attestations, lighter for non-qualified)?"
        dimension: flexibility
      - id: Q9
        text: "How do you handle identity verification failures or inconclusive results — retry, fallback to alternative method, manual review, or rejection?"
        dimension: incident_response

  # ============================================================================
  # VEND-ISS-010: Authentic Source Data Provenance
  # Requirement: Obtain data from authentic sources with verified provenance
  # ============================================================================
  VEND-ISS-010:
    questions:
      - id: Q1
        text: "Which authentic sources do you connect to for attestation data (national registries, authoritative databases)? Do you support the AS-AP-42-002 verification interface for QEAA Providers?"
        dimension: capability
      - id: Q2
        text: "Do you support authentic sources in multiple EU Member States? How many cross-border authentic source integrations are operational?"
        dimension: geographic_scope
      - id: Q3
        text: "Do you use mutual TLS (mTLS) or equivalent secure channels when connecting to authentic sources? Is certificate management automated?"
        dimension: security
      - id: Q4
        text: "Do you maintain cryptographic audit trails linking issued attestations to the original authentic source queries — including query timestamp, attributes retrieved, and verification result?"
        dimension: auditability
      - id: Q5
        text: "How do you handle authentic source unavailability or data freshness issues — fallback to cached data, deferred issuance, or immediate failure?"
        dimension: operational
      - id: Q6
        text: "Can the organisation integrate additional authentic sources through your platform — via standard APIs, custom connectors, or only through pre-built integrations?"
        dimension: flexibility
      - id: Q7
        text: "How do you handle data discrepancies between multiple authentic sources for the same attribute (e.g., address from civil registry vs tax authority)?"
        dimension: technical_implementation
      - id: Q8
        text: "Do you support push-based authentic source notifications (the source alerts you of changes) in addition to pull-based queries, per AS-AP-07-015?"
        dimension: technical_implementation
      - id: Q9
        text: "How do you ensure data minimisation — do you only query the specific attributes needed for the requested attestation, or do you retrieve broader data sets from the authentic source?"
        dimension: privacy

  # ============================================================================
  # VEND-ISS-011: Attestation Validity Period
  # Requirement: Include attestation validity period and issuance timestamp
  # ============================================================================
  VEND-ISS-011:
    questions:
      - id: Q1
        text: "Do you include clearly defined validity periods (valid_from, valid_until) in all issued attestations? Is this consistent across both mDoc (MSO validFrom/validUntil) and SD-JWT-VC (iat/nbf/exp)?"
        dimension: capability
      - id: Q2
        text: "How are validity periods determined for different attestation types — configurable per type, derived from Rulebook requirements, or fixed platform-wide?"
        dimension: technical_implementation
      - id: Q3
        text: "Can the organisation configure attestation validity periods per attestation type? What is the minimum and maximum validity period supported?"
        dimension: flexibility
      - id: Q4
        text: "How do you handle clock synchronisation between issuer, wallet, and verifier to ensure accurate validity checks? Do you use NTP, and what clock skew tolerance is applied?"
        dimension: technical_implementation
      - id: Q5
        text: "Do you inform the Wallet Unit about the optimal re-issuance timing relative to expiry, per AS-AP-10-074? How is the renewal window communicated?"
        dimension: compliance_completeness
      - id: Q6
        text: "Do you notify users when their attestations are approaching expiry? How far in advance, and through which channels?"
        dimension: user_experience
      - id: Q7
        text: "How do you handle attestations that expire during a presentation flow — does the wallet warn the user, or is the expired attestation still presented (per AS-AP-10-074 note)?"
        dimension: technical_implementation
      - id: Q8
        text: "After re-issuance, does your system automatically compare attribute values between the old and new attestation and alert the user of differences per AS-AP-10-085?"
        dimension: compliance_completeness
      - id: Q9
        text: "Can validity periods differ between the mDoc and SD-JWT-VC formats of the same attestation, or are they always identical?"
        dimension: interoperability

  # ============================================================================
  # VEND-ISS-012: Attestation Renewal and Re-issuance
  # Requirement: Support attestation renewal and re-issuance workflows
  # ============================================================================
  VEND-ISS-012:
    questions:
      - id: Q1
        text: "Do you support workflows for renewing attestations before expiry? Is the renewal flow seamless (no re-verification required) or does it require full re-authentication?"
        dimension: capability
      - id: Q2
        text: "Can attestations be re-issued when the underlying data changes (e.g., address change, name change) — is this triggered automatically from authentic source notifications (per AS-AP-07-015) or only on user request?"
        dimension: capability
      - id: Q3
        text: "How do users receive notifications of upcoming expiry — push notification, email, in-app banner? What is the configurable lead time before expiry?"
        dimension: user_experience
      - id: Q4
        text: "Is renewal automated (silent re-issuance with fresh authentic source data) or does it require explicit user action? Is this configurable per attestation type?"
        dimension: automation
      - id: Q5
        text: "When an attestation is renewed, is the old attestation automatically revoked per AS-AP-07-015 to prevent duplicate active attestations? Is the revocation synchronous with re-issuance?"
        dimension: lifecycle
      - id: Q6
        text: "After re-issuance, does your system perform full attribute comparison (per AS-AP-10-085) and present differences to the user for acknowledgement?"
        dimension: compliance_completeness
      - id: Q7
        text: "How do you handle the scenario where re-issuance fails (e.g., authentic source unavailable) but the existing attestation is about to expire — is the user warned, or does the expiring attestation silently become invalid?"
        dimension: incident_response
      - id: Q8
        text: "Can the organisation configure different renewal policies per attestation type (e.g., auto-renew for low-risk attestations, manual approval for high-value ones)?"
        dimension: flexibility
      - id: Q9
        text: "How does the renewal flow handle format parity — is the renewed attestation re-issued in both mDoc and SD-JWT-VC simultaneously, or can formats be renewed independently?"
        dimension: interoperability

  # ============================================================================
  # VEND-ISS-013: Attestation Status Lists (Revocation)
  # Requirement: Publish attestation status lists for revocation checking
  # ============================================================================
  VEND-ISS-013:
    questions:
      - id: Q1
        text: "Do you maintain and publish attestation status lists for revocation checking? Do you support both the Attestation Status List mechanism and the Attestation Revocation List mechanism per AS-AP-07-017/AS-AP-07-018?"
        dimension: capability
      - id: Q2
        text: "What status list formats do you support — IETF Token Status List (draft-ietf-oauth-status-list), compressed bitstring lists, identifier-based revocation lists? Are all formats published simultaneously?"
        dimension: technical_implementation
      - id: Q3
        text: "How frequently are status lists updated? Is the update frequency configurable, and what is the minimum update interval for critical revocations?"
        dimension: sla
      - id: Q4
        text: "Is status list publication highly available? What is the uptime SLA, and do you have geographic redundancy for the status list endpoints?"
        dimension: sla
      - id: Q5
        text: "How do Relying Parties discover and access your status list endpoints — is the endpoint embedded in the attestation itself, discoverable via Provider Information, or both?"
        dimension: interoperability
      - id: Q6
        text: "Do you support privacy-preserving status checks (e.g., using signed status assertions, unlinkable checks, or oblivious HTTP) to prevent the issuer from tracking presentation events?"
        dimension: privacy
      - id: Q7
        text: "Per AS-AP-07-004, you are the sole party responsible for revocation. If you outsource the status list operation to a third party, how is the delegation governed and audited?"
        dimension: compliance_completeness
      - id: Q8
        text: "Are status lists signed by the provider? What signing algorithm and key management is used for status list integrity?"
        dimension: security
      - id: Q9
        text: "How large can your status lists grow before performance deteriorates? What is the maximum number of attestation entries per status list, and do you support sharding?"
        dimension: scalability

  # ============================================================================
  # VEND-ISS-014: Revocation Propagation Timeliness
  # Requirement: Update revocation status within defined time limits
  # ============================================================================
  VEND-ISS-014:
    questions:
      - id: Q1
        text: "What is the maximum propagation time for standard attestation revocations? Does this meet the AS-AP-07-015 requirement of revoking within 24 hours of attribute changes?"
        dimension: sla
      - id: Q2
        text: "Do you support immediate revocation for critical security situations (e.g., WSCD compromise, fraud detection)? What is the measured time from revocation trigger to status list update?"
        dimension: incident_response
      - id: Q3
        text: "How is revocation propagation time measured and audited? Do you log the timestamp of the revocation trigger, status list generation, and status list publication as separate events?"
        dimension: auditability
      - id: Q4
        text: "What caching strategy is used for status lists (Cache-Control, max-age)? How does RP-side caching affect effective revocation propagation time, and can you force cache invalidation for critical revocations?"
        dimension: technical_implementation
      - id: Q5
        text: "How do you handle revocation during status list endpoint outages — is there a failover mechanism, or do RPs fall back to the last-known status list?"
        dimension: operational
      - id: Q6
        text: "Per AS-AP-07-015, how do you ensure authentic sources notify you of attribute value changes? Do you implement push-based notifications, periodic polling, or both?"
        dimension: compliance_completeness
      - id: Q7
        text: "Can Attestation Rulebook-specific propagation requirements (potentially stricter than 24 hours) be configured per attestation type?"
        dimension: flexibility
      - id: Q8
        text: "How do you handle the scenario where an attestation has been presented to an RP but then revoked before the RP’s transaction completes — is there a grace period or immediate rejection?"
        dimension: technical_implementation
      - id: Q9
        text: "Do you publish metrics on your revocation propagation performance (e.g., P50/P99 latencies) for transparency and compliance auditing?"
        dimension: auditability

  # ============================================================================
  # VEND-ISS-015: User Notification on Revocation
  # Requirement: Notify wallet users when their attestations are revoked
  # ============================================================================
  VEND-ISS-015:
    questions:
      - id: Q1
        text: "Do you notify users when their attestations are revoked? Is notification mandatory for all revocations, or only when user contact details are available (per AS-AP-07-015 SHOULD)?"
        dimension: capability
      - id: Q2
        text: "Through what channels are revocation notifications sent — push notification (wallet app), email, SMS, in-app banner? Do you support multi-channel delivery for critical revocations?"
        dimension: technical_implementation
      - id: Q3
        text: "How quickly are notifications sent after revocation occurs? Is the notification synchronous with the status list update, or is there a separate notification pipeline with its own SLA?"
        dimension: sla
      - id: Q4
        text: "Does the notification include the reason for revocation, guidance for resolution (re-issuance instructions), and expected timeline for re-issuance availability?"
        dimension: user_experience
      - id: Q5
        text: "How do you handle notification delivery failures — retry with exponential backoff, fallback to alternative channel, or manual escalation?"
        dimension: operational
      - id: Q6
        text: "Do you track notification delivery status per revocation event? Can the organisation view a delivery receipt dashboard?"
        dimension: auditability
      - id: Q7
        text: "For AS-AP-07-015 attribute-change revocations, does the notification specifically state which attributes changed and suggest the user re-request the attestation with updated data?"
        dimension: compliance_completeness
      - id: Q8
        text: "Can the organisation customise notification templates, branding, and language for their specific attestation types?"
        dimension: flexibility
      - id: Q9
        text: "How do you handle notifications for users who have multiple wallet instances — is the notification sent to all instances, or only the one holding the revoked attestation?"
        dimension: technical_implementation

  # ============================================================================
  # VEND-ISS-016: Attestation Suspension and Reinstatement
  # Requirement: Support suspension and reinstatement of attestations
  # ============================================================================
  VEND-ISS-016:
    questions:
      - id: Q1
        text: "Do you support temporary suspension of attestations as distinct from permanent revocation? Is the tri-state (active/suspended/revoked) reflected in your status list mechanism?"
        dimension: capability
      - id: Q2
        text: "What triggers can initiate attestation suspension — fraud investigation, user request, authority order, authentic source data discrepancy? Are triggers configurable per attestation type?"
        dimension: operational
      - id: Q3
        text: "Can suspended attestations be reinstated? What is the reinstatement process — automatic after timeout, manual approval, re-verification against authentic source?"
        dimension: lifecycle
      - id: Q4
        text: "How is suspension status reflected in the status lists — a distinct bit/status code separate from revocation, or re-use of the revocation bit with metadata?"
        dimension: technical_implementation
      - id: Q5
        text: "Are users notified when their attestations are suspended and when they are reinstated? Do notifications include the reason and expected resolution timeline?"
        dimension: user_experience
      - id: Q6
        text: "Is there a maximum suspension duration after which the attestation is automatically revoked (to prevent indefinite suspension)?"
        dimension: lifecycle
      - id: Q7
        text: "How do wallets and RPs differentiate between suspended and revoked attestations during presentation — do both result in rejection, or is suspension handled differently (e.g., with a warning)?"
        dimension: interoperability
      - id: Q8
        text: "Can suspension be initiated programmatically (API call) as well as through a management UI? Is there an approval workflow for reinstatement?"
        dimension: automation
      - id: Q9
        text: "What audit trail exists for suspension and reinstatement events — who initiated, when, why, and the resolution outcome?"
        dimension: auditability

  # ============================================================================
  # VEND-ISS-017: Signing Key Protection
  # Requirement: Protect attestation signing keys in secure cryptographic devices
  # ============================================================================
  VEND-ISS-017:
    questions:
      - id: Q1
        text: "Are attestation signing keys stored and used exclusively within Hardware Security Modules (HSMs) or equivalent secure cryptographic devices? What HSM vendor(s) do you support?"
        dimension: capability
      - id: Q2
        text: "What certification level do your cryptographic modules have — FIPS 140-2/3 Level 3, Common Criteria EAL4+ with AVA_VAN.5, or EN 419 221-5 (for cloud HSM)? Can certificates be provided upon request?"
        dimension: compliance_evidence
      - id: Q3
        text: "Do you support Bring Your Own Key (BYOK) for organisations that want to manage their own signing keys? What import mechanisms are supported (key wrapping, key ceremony)?"
        dimension: flexibility
      - id: Q4
        text: "Do you require multi-person approval (quorum / four-eye principle) for sensitive key operations (generation, destruction, export)? Is the quorum policy configurable?"
        dimension: security
      - id: Q5
        text: "Do you offer cloud-hosted HSM (AWS CloudHSM, Azure Dedicated HSM, Google Cloud HSM) or require on-premises HSM deployment? Can organisations choose between the two?"
        dimension: operational
      - id: Q6
        text: "How are HSM backup and disaster recovery handled without exposing key material? Do you support geographic replication of HSM key stores?"
        dimension: operational
      - id: Q7
        text: "Per AS-AP-10-056, how do you ensure all unique elements (salts, hashes, revocation indexes, device binding keys, signatures) have negligible collision probability? Do you use a certified CSPRNG?"
        dimension: compliance_completeness
      - id: Q8
        text: "Per AS-AP-10-058, how do you ensure unique element values and timestamps are discarded after issuance? Is the discarding process auditable and provable?"
        dimension: privacy
      - id: Q9
        text: "Does the HSM log all key usage events (signing operations, access attempts, administrative actions) for audit purposes? How long are HSM audit logs retained?"
        dimension: auditability

  # ============================================================================
  # VEND-ISS-018: Approved Signing Algorithms
  # Requirement: Use signing algorithms from the approved list
  # ============================================================================
  VEND-ISS-018:
    questions:
      - id: Q1
        text: "Which signing algorithms do you support from the approved list — ECDSA P-256, ECDSA P-384, EdDSA Ed25519, RSA-PSS (≥3072-bit)? Are all available for attestation signing?"
        dimension: technical_implementation
      - id: Q2
        text: "How do you ensure only approved algorithms are used for attestation signing — configuration enforcement, HSM policy, or runtime validation?"
        dimension: compliance_monitoring
      - id: Q3
        text: "Do you support algorithm agility to transition when new algorithms are approved or existing ones deprecated? Can old and new algorithms coexist during a transition period (dual-signing)?"
        dimension: lifecycle
      - id: Q4
        text: "Is Post-Quantum Cryptography (PQC) on your roadmap? Which NIST PQC standards are you evaluating — ML-DSA (FIPS 204), SLH-DSA (FIPS 205), or ML-KEM (FIPS 203) for key encapsulation? Do you plan to support hybrid classical+PQC signatures during the transition period?"
        dimension: roadmap
      - id: Q5
        text: "How do you handle cross-format algorithm compatibility — does the platform ensure the chosen algorithm is valid for both mDoc (ISO 18013-5 baseline: ES256) and SD-JWT-VC (JWS alg identifiers)?"
        dimension: interoperability
      - id: Q6
        text: "Can your signing service abstract away the underlying HSM specifics (e.g., support both Luna and nCipher via a unified signing API) to enable vendor portability?"
        dimension: flexibility
      - id: Q7
        text: "How do you handle algorithm deprecation — forced migration, grace period with warnings, or blocking of deprecated algorithms after a cutoff date?"
        dimension: lifecycle
      - id: Q8
        text: "Can different attestation types be configured to use different signing algorithms (e.g., ECDSA P-256 for PIDs, EdDSA for low-latency attestations)?"
        dimension: flexibility
      - id: Q9
        text: "Do you validate that the approved hash functions (SHA-256, SHA-384, SHA-512) are correctly paired with their signing algorithms, and reject invalid pairings?"
        dimension: security

  # ============================================================================
  # VEND-ISS-019: Key Rotation Procedures
  # Requirement: Implement key rotation procedures
  # ============================================================================
  VEND-ISS-019:
    questions:
      - id: Q1
        text: "Do you have documented key rotation procedures? Are these procedures tested regularly (e.g., annual key rotation drill)?"
        dimension: capability
      - id: Q2
        text: "How do you transition to new signing keys while maintaining validity of previously issued attestations — do you implement the 4-phase rotation model (pre-rotation, overlap, post-rotation, retirement)?"
        dimension: technical_implementation
      - id: Q3
        text: "What is the recommended key rotation frequency? Is it configurable per attestation type, or fixed platform-wide?"
        dimension: lifecycle
      - id: Q4
        text: "How is key rotation coordinated with Trusted List updates — is the new public key published before the new key is used for signing, to ensure verifier readiness?"
        dimension: operational
      - id: Q5
        text: "What happens to attestations signed with retired keys — do they remain valid and verifiable until their individual expiry, or are they revoked upon key retirement?"
        dimension: lifecycle
      - id: Q6
        text: "Is key rotation automated (scheduled) or does it require manual intervention? Can emergency key rotation be triggered for compromise scenarios?"
        dimension: automation
      - id: Q7
        text: "Per AS-AP-10-022, how does key rotation interact with device binding — do existing device bindings remain valid after the provider's signing key rotates (since they reference the wallet's key, not the provider's)?"
        dimension: compliance_completeness
      - id: Q8
        text: "How do you handle attestations in flight during key rotation — do you ensure a single issuance session uses one consistent key, not a mix of old and new?"
        dimension: technical_implementation
      - id: Q9
        text: "What is the secure destruction procedure for retired key material? Is destruction logged and auditable?"
        dimension: security

  # ============================================================================
  # VEND-ISS-020: Common Catalogue Registration (TS11)
  # Requirement: Publish attestation types to the Common Catalogue (TS11)
  # ============================================================================
  VEND-ISS-020:
    questions:
      - id: Q1
        text: "Do you support registration of attestation types in the Common Catalogue of Attestation Types per Technical Specification 11 (TS11)? Is registration available for both qualified and non-qualified attestation types?"
        dimension: capability
      - id: Q2
        text: "What information is published to the catalogue for each attestation type — type identifier (URI/OID), supported formats, applicable Rulebook, attribute schema, geographic availability?"
        dimension: technical_implementation
      - id: Q3
        text: "How do wallets and Relying Parties discover attestation types through the catalogue — search by type, by provider, by Member State, or by Rulebook?"
        dimension: interoperability
      - id: Q4
        text: "How do you handle updates to catalogue entries when attestation types change (e.g., new schema version, additional format support)? Is the update propagation immediate?"
        dimension: lifecycle
      - id: Q5
        text: "Is catalogue registration automated as part of attestation type deployment, or does it require a separate manual registration step?"
        dimension: automation
      - id: Q6
        text: "How do you handle catalogue deregistration when an attestation type is decommissioned? Is there a grace period for existing attestations of that type?"
        dimension: lifecycle
      - id: Q7
        text: "Can the organisation preview their catalogue entries before publication to verify completeness and accuracy?"
        dimension: operational
      - id: Q8
        text: "How does the Common Catalogue interact with Provider Information (VEND-ISS-002) — are the two kept in sync automatically, or are they independent registrations?"
        dimension: interoperability
      - id: Q9
        text: "Do you support catalogue entries for attestation types available in multiple Member States, or must separate entries be created per Member State?"
        dimension: geographic_scope

  # ============================================================================
  # VEND-ISS-021: Attestation Schema Documentation
  # Requirement: Document attestation schema including mandatory and optional attributes
  # ============================================================================
  VEND-ISS-021:
    questions:
      - id: Q1
        text: "Do you document and publish schemas for each attestation type? Are schemas published in both human-readable and machine-readable formats?"
        dimension: capability
      - id: Q2
        text: "Do schemas clearly distinguish mandatory vs optional vs conditional attributes, per EW-DM-12-007's encoding-independent semantic definition requirement?"
        dimension: technical_implementation
      - id: Q3
        text: "What schema format do you use — CDDL for mDoc CBOR encoding, JSON Schema for SD-JWT-VC, or both? Do you generate format-specific schemas from a single encoding-independent definition?"
        dimension: interoperability
      - id: Q4
        text: "How do you handle schema versioning and backwards compatibility — can the platform accept attestations issued under previous schema versions, and are deprecated attributes handled gracefully?"
        dimension: lifecycle
      - id: Q5
        text: "Are schemas published in machine-readable formats at discoverable endpoints for automated validation by wallets and Relying Parties?"
        dimension: automation
      - id: Q6
        text: "Do schemas include semantic definitions for each attribute (encoding-independent description per EW-DM-12-007), beyond just data type and cardinality?"
        dimension: documentation
      - id: Q7
        text: "How do you ensure semantic equivalence between the mDoc (CBOR) and SD-JWT-VC (JSON) encodings of the same attestation type?"
        dimension: interoperability
      - id: Q8
        text: "Do you provide schema validation tooling that organisations can use to verify their attestation data conforms to the published schema before issuance?"
        dimension: automation
      - id: Q9
        text: "How do you manage namespace conventions (e.g., `eu.europa.ec.eudi.pid.1` for PIDs) and ensure they comply with the applicable Rulebook's namespace requirements?"
        dimension: compliance_completeness

  # ============================================================================
  # VEND-ISS-022: Data Minimisation in Attestations
  # Requirement: Apply data minimisation principles to attestation content
  # ============================================================================
  VEND-ISS-022:
    questions:
      - id: Q1
        text: "How do you ensure attestations contain only attributes necessary for their intended purpose — do you apply GDPR Article 25 data protection by design principles during attestation type configuration?"
        dimension: privacy
      - id: Q2
        text: "Do you design attestations to be selective disclosure-friendly — are all attributes individually salted (mDoc MSO) or wrapped with SD-JWT `_sd` directives for per-attribute disclosure?"
        dimension: technical_implementation
      - id: Q3
        text: "Can the organisation configure which attributes are included in custom attestation types? Is there a review workflow to prevent unnecessary attribute inclusion?"
        dimension: flexibility
      - id: Q4
        text: "Do you offer guidance on data minimisation during attestation type design, including which attributes are typically unnecessary for common use cases?"
        dimension: documentation
      - id: Q5
        text: "How do you handle requests to include unnecessary attributes in attestations — is there a compliance gate that flags over-inclusion?"
        dimension: compliance_monitoring
      - id: Q6
        text: "Per EW-PIO-43-001, do you include an embedded disclosure policy by value in the Issuer metadata? How does this policy inform the wallet about mandatory vs optional attributes?"
        dimension: compliance_completeness
      - id: Q7
        text: "Do you support age-over predicates or range proofs that allow the user to prove a property (e.g., 'over 18') without disclosing the underlying attribute (e.g., date of birth)?"
        dimension: privacy
      - id: Q8
        text: "Can the organisation define different attribute sets for different audiences (e.g., a 'minimal PID' with only name and age-over, vs a 'full PID' with all attributes)?"
        dimension: flexibility
      - id: Q9
        text: "How do you audit that attestations issued in production actually conform to data minimisation policies — is there post-issuance compliance monitoring?"
        dimension: auditability

  # ============================================================================
  # VEND-ISS-023: No Tracking Identifiers
  # Requirement: Do not embed tracking identifiers in attestations
  # ============================================================================
  VEND-ISS-023:
    questions:
      - id: Q1
        text: "How do you ensure attestations do not contain overt or hidden tracking identifiers — do you perform automated privacy impact assessments of attestation structures before deployment, covering all fields visible to RPs (including status list indexes, serial numbers, timestamps, and format-specific identifiers)?"
        dimension: privacy
      - id: Q2
        text: "Are unique attestation identifiers (revocation indexes, serial numbers) designed to prevent cross-RP correlation per AS-AP-10-056's negligible-collision requirement?"
        dimension: technical_implementation
      - id: Q3
        text: "Do you conduct privacy reviews of attestation structures to identify potential correlation vectors (e.g., static identifiers, predictable sequences, timestamps)?"
        dimension: compliance_monitoring
      - id: Q4
        text: "How do you handle serial numbers or other unique identifiers required by format specifications (mDoc document number, SD-JWT-VC `jti`) — are these randomised per AS-AP-10-056?"
        dimension: technical_implementation
      - id: Q5
        text: "Can the attestation structure be audited for privacy compliance by independent parties? Do you support third-party privacy audits of your attestation design?"
        dimension: auditability
      - id: Q6
        text: "Per AS-AP-10-058, do you discard all unique element values and timestamps after issuance to prevent the provider from correlating presentations retrospectively?"
        dimension: privacy
      - id: Q7
        text: "Do you support batch issuance of single-use attestations for high-privacy scenarios where cross-presentation unlinkability is critical?"
        dimension: capability
      - id: Q8
        text: "Are status list indexes assigned in a way that prevents RPs from correlating users by comparing index values across different presentation sessions?"
        dimension: technical_implementation
      - id: Q9
        text: "Do you support or plan to support unlinkable proof mechanisms (e.g., ZKP-based selective disclosure, BBS+ signatures per draft-irtf-cfrg-bbs-signatures) for advanced anti-tracking scenarios? What is your implementation roadmap?"
        dimension: roadmap

  # ============================================================================
  # VEND-ISS-024: Cross-Border Recognition
  # Requirement: Enable cross-border recognition of attestations
  # ============================================================================
  VEND-ISS-024:
    questions:
      - id: Q1
        text: "Are attestations issued through your platform verifiable and recognisable in all 27 EU Member States plus EEA countries? Have you tested cross-border verification with wallets and RPs from at least 3 different Member States? Provide specific country pairs tested."
        dimension: capability
      - id: Q2
        text: "How do you ensure interoperability through adherence to common standards — do you validate attestation format compliance against AS-AP-10-013 (Rulebook-mandated formats) before issuance?"
        dimension: interoperability
      - id: Q3
        text: "Have you participated in EU interoperability testing exercises (Large-Scale Pilots, EUDI Wallet Consortium)? Can you provide evidence of successful cross-border verification results?"
        dimension: compliance_evidence
      - id: Q4
        text: "How do you handle Member State-specific attribute requirements or namespaces — do you support domestic namespace extensions alongside the EU-standard namespace?"
        dimension: geographic_scope
      - id: Q5
        text: "What languages are supported for attestation attribute display labels? Is the display localisation separate from the underlying encoding-neutral attribute identifiers?"
        dimension: interoperability
      - id: Q6
        text: "How does your platform support Trusted List cross-MS resolution — is the issuer's public key published in the National Trusted List, and do verifiers traverse the LOTL → National TL chain?"
        dimension: technical_implementation
      - id: Q7
        text: "Do you support the EU List of Trusted Lists (LOTL) infrastructure? How frequently do you synchronise with LOTL updates to ensure your trust anchor is propagated?"
        dimension: operational
      - id: Q8
        text: "How do you handle the scenario where a verifier in another Member State cannot resolve your trust anchor — is there a fallback mechanism or does verification fail?"
        dimension: incident_response
      - id: Q9
        text: "Do you maintain a cross-border verification test report that can be shared with prospective organisations as evidence of interoperability?"
        dimension: auditability

  # ============================================================================
  # VEND-ISS-026: PID Rulebook Compliance
  # Note: VEND-ISS-025 does not exist in source
  # Requirement: Comply with PID Rulebook format and attribute requirements
  # ============================================================================
  VEND-ISS-026:
    questions:
      - id: Q1
        text: "Do you support Person Identification Data (PID) issuance fully compliant with the PID Rulebook (EW-DM-03-01 through EW-DM-03-21)? Can you demonstrate compliance with all mandatory attribute requirements? The EC PID-online manual specifies PID as the foundational attestation for cross-border identification — how do you ensure your PID issuance meets the requirements for both online (OID4VP) and proximity (ISO 18013-5) presentation?"
        dimension: capability
      - id: Q2
        text: "How do you implement namespace conventions as specified in the PID Rulebook — do you use the EU namespace `eu.europa.ec.eudi.pid.1` for mDoc and standard claim names for SD-JWT-VC (per EW-DM-03-04/EW-DM-03-05)?"
        dimension: technical_implementation
      - id: Q3
        text: "Do you support domestic namespace publication for national attributes? Can Member States add national-specific PID attributes under their domestic namespace?"
        dimension: capability
      - id: Q4
        text: "What portrait image quality and encoding requirements do you support per EW-DM-03-08/EW-DM-03-09 — resolution, colour depth, compression format, file size limits?"
        dimension: technical_implementation
      - id: Q5
        text: "How do you handle CBOR encoding for mDoc format attributes (EW-DM-03-10) — do you validate element identifiers, data types, and encoding correctness before signing?"
        dimension: technical_implementation
      - id: Q6
        text: "Have you validated PID format compliance with reference implementations from the EU Digital Identity Wallet Reference Implementation or Large-Scale Pilots?"
        dimension: compliance_evidence
      - id: Q7
        text: "How do you handle the full mandatory PID attribute set (family name, given names, date of birth, nationality, document number, portrait, issuance/expiry dates, issuer identifier)?"
        dimension: compliance_completeness
      - id: Q8
        text: "Do you support the PID Rulebook's requirements for age-over attributes (e.g., `age_over_18`) as derived/computed attributes from date of birth?"
        dimension: technical_implementation
      - id: Q9
        text: "How do you ensure semantic equivalence between the mDoc and SD-JWT-VC encodings of the same PID — are both formats generated from a single canonical source? Per the EC PID-online manual, both formats must be supported for all PID use cases (online and proximity)."
        dimension: interoperability

  # ============================================================================
  # VEND-ISS-027: Mandatory Format Support per Rulebook
  # Requirement: Support all mandatory attestation formats for the attestation type
  # ============================================================================
  VEND-ISS-027:
    questions:
      - id: Q1
        text: "Do you offer attestations in all formats required by the applicable Rulebook? How do you determine which formats are mandatory vs optional for each attestation type?"
        dimension: capability
      - id: Q2
        text: "How do you track Rulebook changes that add new mandatory formats — is there an automated monitoring mechanism, or manual review?"
        dimension: lifecycle
      - id: Q3
        text: "Do you validate format correctness against Rulebook specifications — is there pre-issuance format validation (structure, encoding, mandatory fields)?"
        dimension: compliance_monitoring
      - id: Q4
        text: "How do you ensure encoding consistency across different formats (mDoc CBOR vs SD-JWT-VC JSON) — are attribute values semantically equivalent in both encodings?"
        dimension: technical_implementation
      - id: Q5
        text: "Per AS-AP-10-017, if you support revocation chaining, how do you ensure the attestation expiration date does not exceed the WUA expiration date presented during issuance?"
        dimension: compliance_completeness
      - id: Q6
        text: "Per AS-AP-10-039, do you implement device binding for all attestations? How does the binding mechanism differ between mDoc (mdoc authentication) and SD-JWT-VC (cnf claim)?"
        dimension: technical_implementation
      - id: Q7
        text: "When a Rulebook adds a new mandatory format, what is the expected lead time for your platform to support it? Is there a phased rollout process?"
        dimension: sla
      - id: Q8
        text: "Do you support issuing the same attestation in multiple formats simultaneously (batch dual-format issuance) or must the user request each format separately?"
        dimension: operational
      - id: Q9
        text: "How do you handle optional formats — can the organisation choose to issue in additional formats beyond the Rulebook mandate (e.g., W3C VCDM v2.0 per EW-DM-12-005)?"
        dimension: flexibility

  # ============================================================================
  # VEND-ISS-028: Rulebook-Compliant Revocation
  # Requirement: Implement revocation according to applicable Rulebook specifications
  # ============================================================================
  VEND-ISS-028:
    questions:
      - id: Q1
        text: "Do you implement attestation revocation as specified in the applicable Rulebook? How do you determine the revocation method(s) required for each attestation type (per AS-AP-07-003)?"
        dimension: capability
      - id: Q2
        text: "Do you meet the Rulebook-specified maximum propagation times for revocation status updates? What are your actual P50/P99 propagation latencies?"
        dimension: sla
      - id: Q3
        text: "Do you support suspension where the Rulebook requires it? Is suspension treated as distinct from revocation in your status list mechanism (per AS-AP-07-006 irreversibility)?"
        dimension: capability
      - id: Q4
        text: "How do you adapt revocation implementation when Rulebook specifications change — is there a change management process for revocation method updates?"
        dimension: lifecycle
      - id: Q5
        text: "Per AS-AP-07-004/AS-AP-07-005, how do you ensure the attestation provider retains sole responsibility for the revocation decision, even when operation is outsourced to a third party?"
        dimension: compliance_completeness
      - id: Q6
        text: "Per AS-AP-07-006, how do you technically enforce revocation irreversibility — once an attestation is revoked, is it impossible to reverse at any level (API, database, administrative override)?"
        dimension: security
      - id: Q7
        text: "Can revocation propagation time targets be configured per attestation type to accommodate Rulebook-specific requirements (e.g., 1 hour for QEAA vs 24 hours for non-qualified EAA)?"
        dimension: flexibility
      - id: Q8
        text: "How do you handle the scenario where a Rulebook specifies that a non-qualified EAA type is NOT revocable — do you omit revocation infrastructure for that type?"
        dimension: technical_implementation
      - id: Q9
        text: "Do you provide per-Rulebook revocation compliance reports showing actual propagation times vs Rulebook-specified maximums?"
        dimension: auditability

  # ============================================================================
  # VEND-ISS-029: Registration Information Maintenance
  # Requirement: Maintain accurate registration information and update on changes
  # ============================================================================
  VEND-ISS-029:
    questions:
      - id: Q1
        text: "How do you ensure registration information remains accurate in Member State registries — is there periodic validation against the actual operational state?"
        dimension: compliance_monitoring
      - id: Q2
        text: "What is the process for updating registration information when changes occur — API-driven, portal-based, or manual submission to the registry operator?"
        dimension: lifecycle
      - id: Q3
        text: "Per AS-MS-27-010, how quickly can registration updates be submitted and reflected in registries — what is your SLA for 'without undue delay'?"
        dimension: sla
      - id: Q4
        text: "Who is responsible for maintaining registration information — the organisation directly, or does the vendor manage it on behalf of the organisation?"
        dimension: operational
      - id: Q5
        text: "How do you alert the organisation to registration information that may be out of date — proactive staleness monitoring, periodic reminders, or manual checks?"
        dimension: alerting
      - id: Q6
        text: "Per AS-MS-27-017, how do you maintain the ability to revoke access certificates when registration information changes? Is access certificate lifecycle managed automatically?"
        dimension: compliance_completeness
      - id: Q7
        text: "What types of registration information changes are supported — organisational (name, legal entity), technical (endpoints, formats), key rotation (new certificates), operational (status)?"
        dimension: flexibility
      - id: Q8
        text: "Is there a change audit trail showing who updated registration information, when, and what was changed?"
        dimension: auditability
      - id: Q9
        text: "How do you handle registration updates for organisations operating in multiple Member States — must each MS registry be updated independently, or is there a federated update mechanism?"
        dimension: geographic_scope

  # ============================================================================
  # VEND-ISS-030: Trust Anchor Publication
  # Requirement: Publish PID/Attestation Provider trust anchor information
  # ============================================================================
  VEND-ISS-030:
    questions:
      - id: Q1
        text: "Do you publish trust anchor information according to the Commission's common format (per AS-MS-31-007/AS-MS-31-008)? Is the publication automated and machine-readable?"
        dimension: capability
      - id: Q2
        text: "Per AS-WP-31-001, what information is included in the published trust anchor — identification data, trust anchor public keys, Access Certificate Authority trust anchors, service supply points?"
        dimension: technical_implementation
      - id: Q3
        text: "How do wallets and RPs access your trust anchor information — via Trusted List lookup, direct endpoint, or both? What protocol is used (HTTPS, LDAP)?"
        dimension: interoperability
      - id: Q4
        text: "What is the process for Trusted List inclusion of your trust anchor (per AS-MS-31-011) — how long does initial inclusion typically take, and what documentation is required?"
        dimension: lifecycle
      - id: Q5
        text: "How do you handle trust anchor updates during key rotation — is the new public key published before the old key is deactivated to ensure continuous verifiability?"
        dimension: operational
      - id: Q6
        text: "What is the uptime SLA for trust anchor endpoints? Is there geographic redundancy to ensure availability across all Member States?"
        dimension: sla
      - id: Q7
        text: "Per AS-MS-31-013, if the organisation is a public body, do you support the additional notification requirements (legal basis, mandate scope)?"
        dimension: compliance_completeness
      - id: Q8
        text: "How do you handle trust anchor lifecycle events (signing key rotation, endpoint changes, provider status changes, Access Certificate Authority changes) — is the update propagation automated?"
        dimension: automation
      - id: Q9
        text: "Do you provide monitoring of trust anchor publication health — alerts for endpoint downtime, certificate expiry, or Trusted List desynchronisation?"
        dimension: operational

  # ============================================================================
  # VEND-ISS-031: Wallet Unit Attestation Verification During Issuance
  # Requirement: Verify Wallet Unit Attestation during issuance
  # ============================================================================
  VEND-ISS-031:
    questions:
      - id: Q1
        text: "Do you verify the Wallet Unit Attestation (WUA) before issuing PIDs or device-bound attestations? Is WUA verification mandatory for all issuance flows, or configurable per attestation type?"
        dimension: capability
      - id: Q2
        text: "Per AS-WP-09-015, how do you verify that the WSCA/WSCD has proven possession of the new attestation private key — challenge-response, signed nonce, or other mechanism?"
        dimension: technical_implementation
      - id: Q3
        text: "What WUA verification checks do you perform — signature validation, certificate chain validation, revocation status check, WSCD certification level verification, expiry check?"
        dimension: technical_implementation
      - id: Q4
        text: "How do you handle issuance requests from wallets with invalid or revoked WUAs — reject with specific error code, log the attempt, alert the Wallet Provider?"
        dimension: operational
      - id: Q5
        text: "How do you stay updated on certified WSCD lists and WUA trust anchors — automated synchronisation, manual updates, or Trusted List-based resolution?"
        dimension: lifecycle
      - id: Q6
        text: "What is the latency impact of WUA verification on the issuance process? Do you cache Wallet Provider certificates and WUA revocation status to minimise overhead?"
        dimension: sla
      - id: Q7
        text: "Per AS-WP-09-026, how do you ensure compliance with all relevant requirements in Technical Specification 3 (Wallet Unit Attestation)? Do you have a TS3 conformance test suite?"
        dimension: compliance_completeness
      - id: Q8
        text: "How do you handle WUA verification failure due to network issues (e.g., revocation status endpoint unreachable) — fail-open, fail-closed, or configurable policy?"
        dimension: security
      - id: Q9
        text: "Do you log WUA verification results for audit purposes — including which checks passed/failed, the Wallet Provider identity, and WSCD certification level?"
        dimension: auditability

  # ============================================================================
  # VEND-ISS-032: Embedded Disclosure Policies
  # Requirement: Include embedded disclosure policies in attestations
  # ============================================================================
  VEND-ISS-032:
    questions:
      - id: Q1
        text: "Do you support embedding disclosure policies in issued attestations per EW-PIO-43-001? Are policies included by value (not by reference) in the Issuer metadata via OpenID4VCI?"
        dimension: capability
      - id: Q2
        text: "How do you define disclosure policies for different attestation types — per-attestation-type configuration, per-Rulebook default, or fully customisable per issuance?"
        dimension: technical_implementation
      - id: Q3
        text: "Per AS-AP-43-001, how do you handle the requirement to revoke attestations when a corresponding embedded disclosure policy is added, changed, or deleted? Is this automated?"
        dimension: compliance_completeness
      - id: Q4
        text: "How do Wallet Units interpret and enforce embedded disclosure policies — have you tested policy enforcement across multiple wallet implementations?"
        dimension: interoperability
      - id: Q5
        text: "Can the organisation customise disclosure policies for their attestation types — mandatory vs optional attributes, purpose limitations, RP category restrictions?"
        dimension: flexibility
      - id: Q6
        text: "What guidance do you provide on best practices for disclosure policy design — templates, validation tools, compliance checks against data minimisation principles?"
        dimension: documentation
      - id: Q7
        text: "How do you handle the disclosure policy lifecycle — versioning, deprecation of old policies, migration of existing attestations when policies change?"
        dimension: lifecycle
      - id: Q8
        text: "What is the encoding format for embedded disclosure policies — JSON-based, CBOR-based, or format-specific (different for mDoc vs SD-JWT-VC)?"
        dimension: technical_implementation
      - id: Q9
        text: "Do you provide tooling for organisations to preview how a disclosure policy will affect the user experience in wallets before deployment?"
        dimension: operational

  # ============================================================================
  # VEND-ISS-033: Registration Certificate Usage
  # Requirement: Use registration certificates for Provider authentication
  # ============================================================================
  VEND-ISS-033:
    questions:
      - id: Q1
        text: "Do you use registration certificates for Provider authentication in Wallet Unit interactions? Is the certificate included in Issuer metadata per AS-AP-44-004?"
        dimension: capability
      - id: Q2
        text: "Per AS-AP-44-002, how do you distribute the registration certificate to all service supply points — is distribution automated when a new certificate is issued or rotated?"
        dimension: operational
      - id: Q3
        text: "Per AS-AP-44-004, is the registration certificate included by value (not by reference) in your Issuer metadata? This ensures issuance transactions are atomic and self-contained."
        dimension: compliance_completeness
      - id: Q4
        text: "How do you manage registration certificate lifecycle — automated renewal before expiry, revocation on registration status change, key rotation procedures?"
        dimension: lifecycle
      - id: Q5
        text: "What certificate types do you support as registration certificates — X.509, JWT-based, or other formats specified in the technical specifications?"
        dimension: technical_implementation
      - id: Q6
        text: "How are registration certificates validated by Wallet Units during issuance — certificate chain resolution, revocation status check, trust anchor lookup?"
        dimension: interoperability
      - id: Q7
        text: "What happens if the registration certificate expires or is revoked during operations — immediate issuance halt, graceful degradation with warning, or automatic renewal?"
        dimension: incident_response
      - id: Q8
        text: "How do you handle registration certificate updates without downtime — dual-certificate overlap period, rolling deployment, or scheduled maintenance window?"
        dimension: operational
      - id: Q9
        text: "Do you monitor registration certificate expiry proactively — alerts at 90/60/30 days before expiry, automated renewal triggers?"
        dimension: alerting

  # ============================================================================
  # VEND-ISS-034: SD-JWT VC Format Compliance for PID
  # Requirement: Comply with SD-JWT VC format requirements for PID issuance
  # ============================================================================
  VEND-ISS-034:
    questions:
      - id: Q1
        text: "Do you issue PIDs in SD-JWT VC format compliant with ARF specifications? Is the `vct` claim correctly set to a URN within the `urn:eudi:pid:` namespace (per EW-DM-03-14)?"
        dimension: capability
      - id: Q2
        text: "Do you include all required SD-JWT VC claims — `vct`, `iss`, `iat`, `exp`, `cnf` (key binding), `status` (revocation reference) — per EW-DM-03-17?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you encode PID attributes per EW-DM-03-18/EW-DM-03-19 — JSON claim encoding per the PID Rulebook’s SD-JWT-VC profile, with correct data types?"
        dimension: technical_implementation
      - id: Q4
        text: "Per EW-DM-03-20/EW-DM-03-21, are all PID claims made selectively disclosable using the SD-JWT `_sd` mechanism? Which claims are excluded as issuer-protected (e.g., `vct`, `iss`, `cnf`)?"
        dimension: compliance_completeness
      - id: Q5
        text: "How do you handle date formatting requirements — do you use `full-date` format (YYYY-MM-DD) per RFC 3339 for all date attributes?"
        dimension: technical_implementation
      - id: Q6
        text: "Have you validated SD-JWT VC output against reference parsers — specifically the EUDI Reference Implementation or equivalent conformance test suites?"
        dimension: compliance_evidence
      - id: Q7
        text: "Is SD-JWT VC compliance validation integrated into your CI/CD pipeline, running automatically against the official EUDI Reference Implementation test suite on every build?"
        dimension: automation
      - id: Q8
        text: "How do you handle domestic PID type extensions — does the `vct` URN correctly extend `urn:eudi:pid:1` with a domestic type identifier?"
        dimension: geographic_scope
      - id: Q9
        text: "Do you support key binding (KB-JWT) in SD-JWT VCs — is the `cnf` claim correctly populated with the device-bound public key or key reference?"
        dimension: technical_implementation

  # ============================================================================
  # VEND-ISS-035: mDoc Format Compliance for PID
  # Requirement: Comply with mDoc format requirements for PID issuance
  # ============================================================================
  VEND-ISS-035:
    questions:
      - id: Q1
        text: "Do you issue PIDs in ISO 18013-5 mDoc format compliant with ARF specifications? Is the `docType` correctly set to `eu.europa.ec.eudi.pid.1` (per EW-DM-03-07)?"
        dimension: capability
      - id: Q2
        text: "Do you use correct element identifiers as defined in the PID Rulebook? Is CBOR encoding validated for correct data types (tstr, bstr, tdate, full-date-str, uint, bool)?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you handle CBOR encoding validation — do you run CBOR structure validators before IssuerAuth signing to catch encoding errors?"
        dimension: technical_implementation
      - id: Q4
        text: "Per EW-DM-03-13, do you enforce element uniqueness — each PID contains at most one attribute with the same element identifier within any namespace?"
        dimension: compliance_completeness
      - id: Q5
        text: "Per EW-DM-03-06, how do you handle domestic namespace generation — appending ISO 3166-1 alpha-2 country codes (e.g., `eu.europa.ec.eudi.pid.de.1` for Germany)?"
        dimension: technical_implementation
      - id: Q6
        text: "Have you validated mDoc output against reference validators — specifically ISO 18013-5 test suites and the EUDI Reference Implementation?"
        dimension: compliance_evidence
      - id: Q7
        text: "How do you implement the Mobile Security Object (MSO) structure — per-attribute digests with correct salt generation (CSPRNG per AS-AP-10-056)?"
        dimension: technical_implementation
      - id: Q8
        text: "Do you support portrait image encoding in mDoc format — correct CBOR data type (bstr), compression format (JPEG2000 or JPEG), and quality requirements per EW-DM-03-08/EW-DM-03-09?"
        dimension: technical_implementation
      - id: Q9
        text: "Is mDoc format compliance validation integrated into your CI/CD pipeline, with automated testing against ISO 18013-5 conformance suites?"
        dimension: automation

  # ============================================================================
  # VEND-ISS-036: Dual Status Mechanism Support
  # Requirement: Support both attestation status mechanisms
  # ============================================================================
  VEND-ISS-036:
    questions:
      - id: Q1
        text: "Do you support both the Attestation Status List mechanism and the Attestation Revocation List mechanism per AS-AP-07-019? Are both operational in production?"
        dimension: capability
      - id: Q2
        text: "How do Relying Parties know which status mechanism to use for a given attestation — is the mechanism indicated in the attestation metadata, or do RPs try both?"
        dimension: interoperability
      - id: Q3
        text: "Are both status mechanisms updated synchronously when a revocation or suspension event occurs? What is the maximum time delta between the two mechanisms?"
        dimension: technical_implementation
      - id: Q4
        text: "What are the performance characteristics of each status mechanism — response time for status checks, status list size, update frequency, caching strategy?"
        dimension: sla
      - id: Q5
        text: "Can the organisation choose which status mechanisms to use, or is dual-mechanism support mandatory for all attestation types?"
        dimension: flexibility
      - id: Q6
        text: "How do you handle the privacy properties of each mechanism — does the Attestation Status List bitstring approach provide herd privacy (RP cannot distinguish which index was checked)?"
        dimension: security
      - id: Q7
        text: "What is the failure mode if one status mechanism becomes unavailable — does the other mechanism serve as a fallback, or are both required for verification?"
        dimension: incident_response
      - id: Q8
        text: "How do you ensure consistency between the two mechanisms during high-throughput revocation events (e.g., batch revocation of many attestations)?"
        dimension: technical_implementation
      - id: Q9
        text: "Do you provide monitoring and alerting for status mechanism health — endpoint availability, update latency, synchronisation drift between mechanisms?"
        dimension: operational

  # ============================================================================
  # VEND-ISS-037: Complete OpenID4VCI Implementation
  # Requirement: Implement complete OpenID4VCI protocol requirements
  # ============================================================================
  VEND-ISS-037:
    questions:
      - id: Q1
        text: "Do you implement all required elements of the OpenID4VCI protocol as specified in the ARF HLRs — including AS-AP-10-006/07 (issuance verification), AS-AP-10-023/18a (authorization flows), AS-AP-10-029-22b (access certificates), AS-AP-10-037/26 (credential offers), AS-AP-10-048/32a (deferred issuance)?"
        dimension: capability
      - id: Q2
        text: "How do you structure credential offer payloads — attestation type, supported formats, issuer identifier, grant parameters? Do you support delivery via deep link, QR code, and push notification?"
        dimension: technical_implementation
      - id: Q3
        text: "What authorization flows do you support — Authorization Code flow (user-initiated) and Pre-authorized Code flow (provider-initiated)? Do you comply with the HAIP profile requirements?"
        dimension: technical_implementation
      - id: Q4
        text: "How do you handle credential response formatting and error handling — are errors returned with standard OpenID4VCI error codes and descriptions?"
        dimension: operational
      - id: Q5
        text: "Per AS-AP-10-048/32a, do you support deferred issuance for scenarios where attestation cannot be issued immediately (e.g., pending authentic source verification)? What is the deferred issuance polling mechanism?"
        dimension: capability
      - id: Q6
        text: "How do you handle metadata discovery for OpenID4VCI endpoints — `/.well-known/openid-credential-issuer` and `/.well-known/oauth-authorization-server`?"
        dimension: interoperability
      - id: Q7
        text: "Per AS-AP-10-029/22a/22b, how do you include access certificates in Issuer metadata? Is the certificate chain verifiable by Wallet Units without external requests?"
        dimension: compliance_completeness
      - id: Q8
        text: "Do you support notification endpoints (AS-AP-10-037/26) for issuance status callbacks — can the Wallet Unit receive push notifications about credential readiness?"
        dimension: capability
      - id: Q9
        text: "How do you integrate device binding (AS-AP-10-041/27c) into the OpenID4VCI flow — proof-of-possession during the credential request, key attestation parameters?"
        dimension: technical_implementation

  # ============================================================================
  # VEND-ISS-038: EAA Personal Data Isolation
  # Requirement: Do not combine EAA personal data with other services
  # ============================================================================
  VEND-ISS-038:
    questions:
      - id: Q1
        text: "How do you ensure personal data collected during EAA provision is NOT combined with data from other services — per Article 45h(1) eIDAS 2.0, this prohibition is absolute with no consent-based exception. What technical architecture enforces this (separate databases, separate compute, API gating, network segmentation)?"
        dimension: architecture
      - id: Q2
        text: "Is there a formal data isolation policy documented and auditable? Does it explicitly address the Article 45h(1) prohibition (which is stricter than GDPR purpose limitation)?"
        dimension: compliance_evidence
      - id: Q3
        text: "How do you prevent EAA user profiles from being merged with marketing or analytics databases — technical barriers (network segmentation, API gating), or organisational controls only?"
        dimension: security
      - id: Q4
        text: "What controls prevent sharing EAA user data with commercial partner systems — contractual prohibitions, technical enforcement, or both?"
        dimension: security
      - id: Q5
        text: "Can independent auditors verify data isolation compliance — is there a documented audit procedure, and what evidence is provided (data flow diagrams, access logs, architecture reviews)?"
        dimension: auditability
      - id: Q6
        text: "What are the consequences if data isolation is breached — automated detection, incident response procedures, notification to supervisory authorities?"
        dimension: incident_response
      - id: Q7
        text: "How do you prevent EAA data from being used for AI/ML training on non-EAA services — is there a technical mechanism to exclude EAA data from training pipelines?"
        dimension: security
      - id: Q8
        text: "Do you perform regular data flow audits to verify no cross-service data leakage — automated scanning, penetration testing, or manual review?"
        dimension: compliance_monitoring
      - id: Q9
        text: "How do you handle data isolation in development and testing environments — is production EAA data never used in non-EAA test environments?"
        dimension: operational

  # ============================================================================
  # VEND-ISS-039: Logical Data Separation
  # Requirement: Keep EAA personal data logically separate
  # ============================================================================
  VEND-ISS-039:
    questions:
      - id: Q1
        text: "How do you implement logical separation of EAA-related personal data from other data per Article 45h(2) — separate database instances, separate schemas, logical partitioning with access controls, or data tagging with enforcement?"
        dimension: architecture
      - id: Q2
        text: "What architectural approach do you use — separate database instances (strongest isolation), separate schemas (good isolation, lower overhead), or tenant-based partitioning (multi-tenant)?"
        dimension: technical_implementation
      - id: Q3
        text: "How are access controls enforced to prevent cross-data-store queries — separate database credentials, no cross-schema joins, role-based access, query audit logging?"
        dimension: security
      - id: Q4
        text: "Is the logical separation verifiable through technical audits — architecture documentation, penetration testing, automated compliance scanning of database permissions?"
        dimension: auditability
      - id: Q5
        text: "How does logical separation work in multi-tenant environments — per-tenant EAA data isolation, tenant-specific encryption keys, no cross-tenant data leakage?"
        dimension: architecture
      - id: Q6
        text: "What happens to data separation in backup and disaster recovery scenarios — EAA data backed up to separate media, recovery procedures tested for EAA-only restoration?"
        dimension: operational
      - id: Q7
        text: "How do you ensure logical separation extends to log files and monitoring data — are EAA-related logs stored separately from non-EAA logs?"
        dimension: security
      - id: Q8
        text: "Do you provide architecture documentation demonstrating logical separation that can be shared with conformity assessment bodies?"
        dimension: compliance_evidence
      - id: Q9
        text: "How do you handle logical separation during database migrations or schema upgrades — is separation maintained throughout the migration process?"
        dimension: lifecycle

  # ============================================================================
  # VEND-ISS-040: QEAA Functional Separation
  # Requirement: Implement QEAA services functionally separate from other services
  # ============================================================================
  VEND-ISS-040:
    questions:
      - id: Q1
        text: "If offering QEAA services, how do you implement functional separation from other services per Article 45h(3) eIDAS 2.0 — organisational boundaries, dedicated technical infrastructure, independent governance structures? Does your architecture support full functional separation or compensating controls where full separation is impractical?"
        dimension: architecture
      - id: Q2
        text: "Are QEAA operations handled by dedicated teams with clear organisational boundaries — separate management reporting lines, QEAA-specific HR processes?"
        dimension: operational
      - id: Q3
        text: "Is QEAA infrastructure separated from non-QEAA infrastructure — separate servers, networks, HSMs, monitoring systems, deployment pipelines?"
        dimension: architecture
      - id: Q4
        text: "Are there independent governance structures for QEAA services — separate risk assessment, dedicated compliance monitoring, independent audit scope and reporting?"
        dimension: operational
      - id: Q5
        text: "How is functional separation documented and audited for conformity assessment — is there a separation report that can be shared with supervisory authorities?"
        dimension: compliance_evidence
      - id: Q6
        text: "What level of personnel separation exists for QEAA operations — dedicated teams, split roles with access restrictions, or shared teams with compensating controls?"
        dimension: operational
      - id: Q7
        text: "Where complete separation is impractical (shared facilities, shared legal entity), what compensating controls are in place — formal service boundaries, access matrices, change management gates?"
        dimension: security
      - id: Q8
        text: "Do QEAA services have separate incident response procedures and communication channels — independent post-incident review processes?"
        dimension: incident_response
      - id: Q9
        text: "How do you handle the Wallet Provider applicability of this requirement — per Article 5a(14), functional separation also applies to private Wallet Providers 'mutatis mutandis'?"
        dimension: compliance_completeness

  # ============================================================================
  # VEND-ISS-041: Cascading WUA Revocation
  # Requirement: Monitor WUA revocation status and implement cascading revocation policy
  # ============================================================================
  VEND-ISS-041:
    questions:
      - id: Q1
        text: "Do you monitor the revocation status of Wallet Unit Attestations (WUAs) received during issuance for all active credentials? Per AS-WP-38-018, PID Providers SHALL regularly verify whether the Wallet Unit has been revoked — describe your monitoring mechanism (polling status lists, webhook notifications from Wallet Providers, or other). What is the polling frequency and worst-case detection latency?"
        dimension: capability
      - id: Q2
        text: "What is your polling frequency for WUA revocation status lists? How do you balance revocation detection latency against the load on Wallet Provider status endpoints — and what is your effective worst-case cascading revocation latency?"
        dimension: sla
      - id: Q3
        text: "Per AS-WP-38-019, Attestation Providers SHALL publish their policy regarding cascading revocation when a WUA is revoked. Have you published this policy? Where is it accessible to Relying Parties (e.g., in Provider Information, Trusted List metadata, or a public policy document)?"
        dimension: compliance_completeness
      - id: Q4
        text: "How does your platform handle the asymmetry between PID Providers (SHALL revoke) and Attestation Providers (MAY revoke) — is cascading revocation configurable per issuer role, or hardcoded by deployment type?"
        dimension: architecture
      - id: Q5
        text: "How do you store the WUA references received during issuance — do you persist the WUA itself, its status list URI and index, or a hash? How does this storage interact with AS-AP-10-058's requirement to discard unique elements after issuance?"
        dimension: technical_implementation
      - id: Q6
        text: "When a WUA revocation is detected, how do you cross-reference all active credentials issued to that Wallet Unit — database lookup by WUA identifier, by Wallet Unit identifier, or by device binding key?"
        dimension: technical_implementation
      - id: Q7
        text: "What is the operational process when cascading revocation is triggered — automatic revocation without human review, alert-and-approve workflow, or manual investigation? Is the revocation immediate per AS-WP-38-018's requirement?"
        dimension: operational
      - id: Q8
        text: "How do you notify affected users when their attestations are cascade-revoked due to WUA revocation — push notification, email, in-app banner? Per EW-DM-38-015, the Wallet Provider must inform the user about wallet revocation separately, but do you also inform them about the resulting attestation revocation?"
        dimension: user_experience
      - id: Q9
        text: "Do you log cascading revocation events with full traceability — the WUA revocation event that triggered the cascade, all affected credentials, revocation timestamps, and the policy basis (AS-WP-38-018 for PIDs, AS-WP-38-019 policy for EAAs)?"
        dimension: auditability

  # ============================================================================
  # VEND-ISS-042: ETSI Issuance Policy Compliance (NCP+ / QCP-l+)
  # Requirement: Comply with applicable ETSI issuance policy (NCP+ or QCP-l+)
  # ============================================================================
  VEND-ISS-042:
    questions:
      - id: Q1
        text: "Which ETSI issuance policy does your platform currently comply with — NCP+ (ETSI EN 319 411-1) for PID/PuB-EAA Providers, or QCP-l+ (ETSI EN 319 411-2) for QEAA Providers? Can you provide the certificate of conformity or latest audit report?"
        dimension: compliance_evidence
      - id: Q2
        text: "Per AS-AP-10-093, how does your issuance policy cover all aspects of PID issuance and management — identity proofing, key generation, certificate lifecycle, revocation procedures, and archival? Is the policy document publicly available?"
        dimension: documentation
      - id: Q3
        text: "How do you handle the 'insofar applicable for PIDs/QEAAs' qualification — which NCP+/QCP-l+ requirements have you determined are not applicable to attestation issuance (vs traditional certificate issuance), and how is that determination documented?"
        dimension: compliance_completeness
      - id: Q4
        text: "What conformity assessment body (CAB) audits your ETSI policy compliance? How frequently are audits conducted, and what is the scope of each audit cycle?"
        dimension: compliance_evidence
      - id: Q5
        text: "How does your ETSI policy compliance interact with national supervisory body requirements — do some Member States impose additional requirements beyond the ETSI baseline?"
        dimension: geographic_scope
      - id: Q6
        text: "Per AS-AP-10-098, if you serve PuB-EAA Providers, do you comply with the NCP+ policy requirements? How do you distinguish PuB-EAA policy obligations from PID Provider obligations?"
        dimension: operational
      - id: Q7
        text: "What operational practices does ETSI NCP+/QCP-l+ mandate that affect issuance platform design — physical security requirements, personnel vetting procedures, incident response procedures, business continuity planning?"
        dimension: architecture
      - id: Q8
        text: "How do you handle ETSI policy version updates — when ETSI publishes a new version of EN 319 411-1 or EN 319 411-2, what is your process to assess impact and update compliance?"
        dimension: lifecycle
      - id: Q9
        text: "Can organisations using your platform inherit your ETSI policy compliance, or must they independently demonstrate their own compliance? What evidence and documentation do you provide to support their conformity assessment?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-ISS-043: ETSI TS 119 412-6 Signing Certificate Compliance
  # Requirement: Ensure signing certificates comply with ETSI TS 119 412-6
  # ============================================================================
  VEND-ISS-043:
    questions:
      - id: Q1
        text: "Which clause of ETSI TS 119 412-6 do your signing certificates comply with — Clause 4 (PID Provider per AS-AP-10-094), Clause 6 (non-qualified EAA per AS-AP-10-097), Clause 7 (QEAA per AS-AP-10-096), or Clause 8 (PuB-EAA per AS-AP-10-099)? Can you provide certificate samples demonstrating compliance?"
        dimension: compliance_evidence
      - id: Q2
        text: "How do you ensure signing certificate extensions, key usage flags, and subject fields conform to the applicable ETSI TS 119 412-6 clause — is validation automated in your certificate provisioning pipeline?"
        dimension: technical_implementation
      - id: Q3
        text: "What Certificate Authority (CA) issues your attestation signing certificates? Is the CA itself certified under ETSI EN 319 411-1/2 and listed in a Member State's Trusted List?"
        dimension: compliance_evidence
      - id: Q4
        text: "How do you handle the different clause requirements for different provider types — if your platform serves both PID Providers (Clause 4) and QEAA Providers (Clause 7), do you provision different certificate profiles per provider type?"
        dimension: architecture
      - id: Q5
        text: "What validity period do your signing certificates use? How does certificate validity interact with attestation validity — can an attestation remain valid after its signing certificate expires?"
        dimension: lifecycle
      - id: Q6
        text: "How do you manage signing certificate lifecycle — automated renewal, key rollover, revocation procedures? Is the certificate lifecycle management integrated with your HSM infrastructure?"
        dimension: operational
      - id: Q7
        text: "Per AS-AP-10-097, how do Providers of non-qualified EAAs differentiate their Clause 6 certificates from qualified provider certificates? Is there a risk of mis-categorisation during certificate issuance?"
        dimension: security
      - id: Q8
        text: "How do you handle ETSI TS 119 412-6 version updates — what is your process for assessing whether a new version introduces breaking changes to your certificate profiles?"
        dimension: lifecycle
      - id: Q9
        text: "Do you validate certificate compliance against ETSI TS 119 412-6 programmatically — is there an automated test suite that checks certificate structure, extensions, and policy OIDs against the applicable clause requirements?"
        dimension: automation
