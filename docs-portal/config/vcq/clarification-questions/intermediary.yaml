# ============================================================================
# VCQ Clarification Questions: Intermediary Requirements
# Generated by: Opus (Phase 3)
# Date: 2026-01-30
# ============================================================================
# This file contains clarification questions for vendors providing intermediary
# services (connector products) on behalf of Relying Parties. Key themes include
# no-storage mandates, request/response forwarding integrity, trust anchors,
# verification operations, and user privacy protections.
# ============================================================================

schemaVersion: 1
sourceFile: requirements/intermediary.yaml
modelPasses:
  opus: true # Completed 2026-01-30 - All intermediary requirements processed
  gemini: true # Completed 2026-01-30 - Gemini review pass finished

requirements:
  # ============================================================================
  # VEND-INT-001: Dual Identity Display
  # Requirement: Display both intermediary and RP identity before requesting attestations
  # ============================================================================
  VEND-INT-001:
    questions:
      - id: Q1
        text: "How does the product ensure both identity data sources are present in each presentation request — the intermediary's access certificate (containing the intermediary's name and identifier) and the RPRC_19a extension (containing the intermediated RP's name and identifier)?"
        dimension: technical_implementation
      - id: Q2
        text: "What RPRC_19a extension fields does the product populate for the intermediated RP (user-friendly name, unique identifier, Registrar URL, intended use identifier, intended use description), and how are these kept in sync with the RP's actual registration at the Registrar?"
        dimension: compliance_completeness
      - id: Q3
        text: "How is the intermediated RP's identity information kept current when RP registration details change — is there polling, webhook-based notification, or manual refresh? What is the maximum propagation delay?"
        dimension: lifecycle
      - id: Q4
        text: "How does the product handle cases where the wallet rejects the request or warns the user due to mismatched or missing identity data? Is the rejection surfaced to the intermediated RP with actionable error details?"
        dimension: operational
      - id: Q5
        text: "What controls ensure the intermediated RP's identity in the RPRC_19a extension matches their actual registration at the Registrar?"
        dimension: compliance_monitoring
      - id: Q6
        text: "How does the product handle multi-RP scenarios where the intermediary serves many RPs — how is the correct RP identity selected per request? Is there a per-request RP binding that prevents identity mix-ups?"
        dimension: architecture
      - id: Q7
        text: "Per RPI_07a, if the wallet verifies the contractual relationship between intermediary and RP at the Registrar and the verification fails, does the product receive notification of this failure? How is it handled operationally?"
        dimension: incident_response
      - id: Q8
        text: "How does the product handle the scenario where an intermediated RP has multiple registered intended uses (per RPI_05 items d and e) — can the RP dynamically select which intended use applies to each request?"
        dimension: capability
      - id: Q9
        text: "What testing or certification does the product have for dual-identity display across different wallet implementations (EUDI reference wallet, Apple, Google)? Have you observed any wallet-specific rendering differences?"
        dimension: interoperability

  # ============================================================================
  # VEND-INT-002: Request Integrity - No Request Modification
  # Requirement: Ensure RP's intended data requests are accurately communicated to wallet
  # ============================================================================
  VEND-INT-002:
    questions:
      - id: Q1
        text: "What technical controls prevent the intermediary from modifying, expanding, or altering the RP's registered data request? Is the attribute set sealed/signed at ingestion time?"
        dimension: security
      - id: Q2
        text: "How do you validate that request forwarding only includes attributes registered by the RP? Per RPRC_21, the wallet may query the Registrar to verify — does your product perform the same pre-flight check?"
        dimension: compliance_monitoring
      - id: Q3
        text: "Is there an audit trail showing the RP's original request versus what was sent to the wallet? Can this be produced for DPA investigations?"
        dimension: auditability
      - id: Q4
        text: "What happens if an RP attempts to request attributes not authorized in their registration — is the request rejected, silently filtered, or forwarded with a warning?"
        dimension: operational
      - id: Q5
        text: "How do you ensure alignment between registered intended uses and actual requests? If the RP has multiple intended uses, does the product enforce that only attributes for the selected use are included?"
        dimension: compliance_monitoring
      - id: Q6
        text: "Can the intermediary's own administrators or support staff override or modify the attribute set in a request? What role-based access controls prevent this?"
        dimension: security
      - id: Q7
        text: "How is the product architecturally designed to prevent 'attribute expansion' — does it treat the RP's registered attribute list as an immutable allowlist that cannot be bypassed programmatically?"
        dimension: architecture
      - id: Q8
        text: "When a new attribute type is added to the RP's registration, what is the process and latency for reflecting this in the intermediary's request construction?"
        dimension: lifecycle
      - id: Q9
        text: "Does the product generate machine-readable evidence (e.g., signed request logs) that could be submitted to a supervisory authority to prove no attribute expansion occurred?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-INT-003: Request Forwarding Integrity
  # Requirement: Forward presentation requests without modification of requested attributes
  # ============================================================================
  VEND-INT-003:
    questions:
      - id: Q1
        text: "How do you technically ensure requests are relayed to wallets without attribute modification — is the request payload transmitted as an opaque blob or reconstructed by the intermediary?"
        dimension: technical_implementation
      - id: Q2
        text: "Is the request payload signed or otherwise integrity-protected during relay? If reconstructed, how do you guarantee bit-exact fidelity with the RP's original request?"
        dimension: security
      - id: Q3
        text: "What logging exists to demonstrate request forwarding integrity? Can you produce before-and-after hashes of the request payload for audit purposes?"
        dimension: auditability
      - id: Q4
        text: "How is request integrity verified at the wallet end — does the wallet perform independent validation that the request matches the RP's registration?"
        dimension: interoperability
      - id: Q5
        text: "Per RPI_06, the intermediary must include its access certificate (RPI_01), the RP's registration certificate (RPI_03), and the RPRC_19a extension (RPI_05) in each request. How does the product assemble these three components — is it a single atomic operation or a multi-step construction?"
        dimension: architecture
      - id: Q6
        text: "How does the product handle selective disclosure attribute identifiers and namespaces — are ISO 18013-5 docType/namespace/elementIdentifier tuples and SD-JWT VC claim paths preserved exactly?"
        dimension: technical_implementation
      - id: Q7
        text: "What happens if the RP sends a malformed or invalid request to the intermediary — is it rejected before forwarding, or forwarded and left for the wallet to reject?"
        dimension: operational
      - id: Q8
        text: "How does forwarding integrity differ between OID4VP (remote) and ISO 18013-5 (proximity) protocols? Are there protocol-specific transformation risks?"
        dimension: technical_implementation
      - id: Q9
        text: "Is there end-to-end integrity protection (e.g., JWS-signed request_uri) from the RP through the intermediary to the wallet, or does the intermediary's own signing replace the RP's signature?"
        dimension: security

  # ============================================================================
  # VEND-INT-004: Response Forwarding Integrity - No Data Processing
  # Requirement: Forward wallet presentations to RP without modification
  # ============================================================================
  VEND-INT-004:
    questions:
      - id: Q1
        text: "How do you ensure wallet presentations are relayed to the RP without alteration, extraction, or processing of credential data?"
        dimension: technical_implementation
      - id: Q2
        text: "What architectural controls prevent the intermediary from accessing or analyzing presentation content? Is there a 'sealed pipeline' design where the intermediary cannot decode the payload?"
        dimension: architecture
      - id: Q3
        text: "Is the presentation payload encrypted end-to-end from wallet to RP, with the intermediary unable to decrypt? If not, what prevents in-transit inspection?"
        dimension: security
      - id: Q4
        text: "What audit evidence demonstrates that credential data is not accessed during transit? Can you provide code-level attestation or third-party audit results?"
        dimension: auditability
      - id: Q5
        text: "How would a breach of this integrity control be detected — are there runtime monitors, canary values, or anomaly detection mechanisms?"
        dimension: incident_response
      - id: Q6
        text: "Per RPI_08, if any RPI_09 verification fails, the intermediary SHALL NOT forward any attributes. How does the product ensure zero partial forwarding — is the decision atomic (all-or-nothing)?"
        dimension: technical_implementation
      - id: Q7
        text: "How does the no-storage mandate (Article 5b(10)) interact with your verification logic? If verification requires decoding the attestation (e.g., to check signatures), how is the decoded content securely erased after verification?"
        dimension: security
      - id: Q8
        text: "Does the product support the RP performing independent re-verification of the forwarded presentation, including signature checks and selective-disclosure proof validation?"
        dimension: interoperability
      - id: Q9
        text: "What is the maximum time window between receiving a presentation from the wallet and forwarding it to the RP? How does this interact with the immediate deletion requirement (VEND-INT-021/RPI_10)?"
        dimension: sla

  # ============================================================================
  # VEND-INT-005: Protocol Support (Remote and Proximity)
  # Requirement: Support both remote and proximity presentation protocols
  # ============================================================================
  VEND-INT-005:
    questions:
      - id: Q1
        text: "Do you support remote presentation via OpenID4VP as specified in ISO/IEC TS 18013-7? Which OID4VP draft version is implemented?"
        dimension: capability
      - id: Q2
        text: "Do you support proximity presentation via BLE/NFC as specified in ISO/IEC 18013-5? Is BLE mandatory and NFC optional, or are both fully supported?"
        dimension: capability
      - id: Q3
        text: "Which wallet implementations have you tested protocol compatibility with (EUDI reference wallet, Apple, Google, third-party)? What interoperability issues were encountered?"
        dimension: interoperability
      - id: Q4
        text: "What hardware is required for proximity presentation support at the RP's physical locations? Does the intermediary provide the hardware, or does the RP procure it independently?"
        dimension: operational
      - id: Q5
        text: "Do you support both same-device (app-to-app) and cross-device (QR code) OID4VP presentation flows? How is the response_uri callback routed through the intermediary's infrastructure?"
        dimension: technical_implementation
      - id: Q6
        text: "How do you handle mode switching when both remote and proximity are available for the same RP? Is the mode selected by the RP per-request, or configured statically?"
        dimension: user_experience
      - id: Q7
        text: "For proximity flows, how does the intermediary perform RPI_09 verification on-site before forwarding to the RP backend? Is there a local verification module or does verification require a network round-trip?"
        dimension: architecture
      - id: Q8
        text: "Do you support the `direct_post` and `direct_post.jwt` response modes for OID4VP? How is the response_uri endpoint secured against unauthorized submissions?"
        dimension: security
      - id: Q9
        text: "What is the latency overhead introduced by the intermediary in both remote and proximity flows? Are there SLA commitments for end-to-end presentation processing time?"
        dimension: sla

  # ============================================================================
  # VEND-INT-006: Conditional Forwarding After Verification
  # Requirement: Forward attributes only to the requesting RP after verification
  # ============================================================================
  VEND-INT-006:
    questions:
      - id: Q1
        text: "How do you ensure attributes are forwarded ONLY to the specific RP on whose behalf the request was made? What per-session RP binding mechanism prevents routing to the wrong RP?"
        dimension: security
      - id: Q2
        text: "What happens if verification fails — how is it ensured no attributes are forwarded? Is the decision atomic (all-or-nothing), or could a race condition result in partial forwarding?"
        dimension: operational
      - id: Q3
        text: "How do you prevent routing errors where data could be sent to the wrong RP in a multi-tenant environment? What isolation guarantees exist between RP routing paths?"
        dimension: architecture
      - id: Q4
        text: "What audit trail exists for successful and failed verification outcomes? Are RPI_09 verification results logged with sufficient detail for dispute resolution?"
        dimension: auditability
      - id: Q5
        text: "Per RPI_09, the intermediary SHALL verify authenticity, revocation status, device binding, user binding, and combined presentation validity. Which of these verifications does the product perform by default, and which are configurable per RP agreement?"
        dimension: compliance_completeness
      - id: Q6
        text: "After forwarding (or after verification failure), per RPI_10, the intermediary SHALL delete all PIDs and attestations completely and immediately. How is this immediate deletion triggered — is it synchronous with the forwarding operation?"
        dimension: technical_implementation
      - id: Q7
        text: "What happens if the RP's endpoint is unreachable when the intermediary attempts to forward verified attributes? Is there a retry mechanism, and if so, how does it interact with the immediate deletion requirement?"
        dimension: incident_response
      - id: Q8
        text: "How does the product handle the scenario where the intermediary serves an RP with both a direct and an intermediated relationship (per RPI_01 note c)? Can it correctly distinguish between the two modes?"
        dimension: architecture
      - id: Q9
        text: "Is there a real-time notification mechanism to the RP when verification fails (e.g., webhook, error callback), or does the RP only learn of failure through the absence of forwarded attributes?"
        dimension: operational

  # ============================================================================
  # VEND-INT-007: PID Provider Trusted Lists
  # Requirement: Maintain up-to-date Trusted Lists for PID Providers
  # ============================================================================
  VEND-INT-007:
    questions:
      - id: Q1
        text: "How do you obtain and maintain Trusted Lists for PID Providers from Member States? Do you bootstrap from the EU Commission's List of Trusted Lists (LOTL), or from individual Member State publications?"
        dimension: technical_implementation
      - id: Q2
        text: "How frequently are Trusted Lists refreshed? Is the refresh interval aligned with each list's `nextUpdate` timestamp, or is there a fixed polling interval?"
        dimension: sla
      - id: Q3
        text: "How do you handle additions, modifications, and revocations of trust anchors? Is the delta applied atomically, or could there be a window where old and new anchors coexist?"
        dimension: lifecycle
      - id: Q4
        text: "What is the maximum latency between a trust anchor change at the Member State level and your system reflecting it? What are the operational consequences if this latency exceeds the SLA?"
        dimension: sla
      - id: Q5
        text: "Which Member States' Trusted Lists do you currently support? Since intermediaries may serve RPs across multiple Member States, do you maintain all 27 Member State lists simultaneously?"
        dimension: geographic_scope
      - id: Q6
        text: "How do you verify the authenticity of downloaded Trusted Lists (signature verification, certificate chain validation)? What happens if a list's signature is invalid — is it rejected, and does the previous valid list remain active?"
        dimension: security
      - id: Q7
        text: "What is the fallback behaviour if a Member State's Trusted List is temporarily unavailable? Do you continue using the cached version, reject all presentations from that Member State, or apply a grace period?"
        dimension: operational
      - id: Q8
        text: "How do you ensure isolation between PID Provider trust anchors (OIA_12) and attestation provider trust anchors (OIA_13/14/15)? Could a PID trust anchor inadvertently validate an EAA, or vice versa?"
        dimension: architecture
      - id: Q9
        text: "Does the product support the EU Commission's centralised trust registry format and API once it becomes operational, or is it designed for Member State-by-Member State list ingestion only?"
        dimension: roadmap

  # ============================================================================
  # VEND-INT-008: Attestation Provider Trusted Lists
  # Requirement: Maintain up-to-date Trusted Lists for Attestation Providers
  # ============================================================================
  VEND-INT-008:
    questions:
      - id: Q1
        text: "How do you maintain Trusted Lists for QEAA and EAA providers? Is the process unified with PID Provider Trusted List management (VEND-INT-007), or handled separately?"
        dimension: technical_implementation
      - id: Q2
        text: "Do you distinguish between qualified (QEAA), public-body (PuB-EAA), and non-qualified (EAA) attestation providers in your trust store? Per OIA_13/14/15, each has different validation requirements."
        dimension: compliance_completeness
      - id: Q3
        text: "How do you handle attestation providers not yet on Trusted Lists — are their attestations rejected outright, or is there a provisional acceptance mechanism?"
        dimension: operational
      - id: Q4
        text: "Can the organisation configure additional trusted attestation providers beyond official lists? If so, what governance controls prevent unauthorised additions?"
        dimension: flexibility
      - id: Q5
        text: "Per OIA_14, PuB-EAA validation requires a two-step process: verify the QTSP's certificate against the Trusted List, then verify the attestation against the QTSP's public key. Does your product implement this full chain?"
        dimension: technical_implementation
      - id: Q6
        text: "How do you handle non-qualified EAAs where the trust mechanism is defined by a Rulebook (OIA_15/Topic 12) rather than the standard Trusted List infrastructure? Which Rulebook-defined mechanisms are currently supported?"
        dimension: capability
      - id: Q7
        text: "What is the refresh frequency for attestation provider Trusted Lists? Is it the same as for PID Provider lists, or configured independently?"
        dimension: sla
      - id: Q8
        text: "How do you prevent trust anchor cross-contamination — ensuring a QEAA trust anchor cannot inadvertently validate a PID, and vice versa?"
        dimension: architecture
      - id: Q9
        text: "When a new attestation provider is added to or removed from a Trusted List, what is the maximum propagation delay before your system reflects the change?"
        dimension: lifecycle

  # ============================================================================
  # VEND-INT-009: Official Trust Sources Only
  # Requirement: Obtain trust anchors only from official Trusted List sources
  # ============================================================================
  VEND-INT-009:
    questions:
      - id: Q1
        text: "How do you ensure trust anchors are obtained exclusively from official EU and Member State sources? Is there a hardcoded list of authoritative URLs, or is the discovery dynamic via the LOTL?"
        dimension: security
      - id: Q2
        text: "Do you use any third-party aggregators for trust anchor data? If so, how is their integrity verified against the original Member State publications?"
        dimension: supply_chain
      - id: Q3
        text: "What controls prevent injection of unauthorised trust anchors into your trust store — are write operations restricted to the automated Trusted List ingestion pipeline?"
        dimension: security
      - id: Q4
        text: "How is the authenticity of Trusted List downloads verified? Do you validate the XML/JSON signature on each list using the Member State's signing certificate chain?"
        dimension: technical_implementation
      - id: Q5
        text: "What is the chain of trust verification: Commission LOTL → Member State TL → Provider trust anchor? Is each step cryptographically verified?"
        dimension: architecture
      - id: Q6
        text: "How do you handle the scenario where a Member State changes its Trusted List signing certificate? Is there an out-of-band verification process?"
        dimension: lifecycle
      - id: Q7
        text: "Are there any hardcoded trust anchors in the product that bypass the Trusted List mechanism (e.g., for testing or bootstrapping)? How are these controlled in production?"
        dimension: security
      - id: Q8
        text: "Does the product support operating in an air-gapped environment where Trusted Lists must be imported manually? What integrity verification is performed on manual imports?"
        dimension: operational
      - id: Q9
        text: "How would a compromised trust anchor (e.g., a Trusted List signing key compromise at Member State level) be handled? Is there an emergency revocation mechanism?"
        dimension: incident_response

  # ============================================================================
  # VEND-INT-010: Signature Validation
  # Requirement: Validate attestation signatures using official trust anchors
  # ============================================================================
  VEND-INT-010:
    questions:
      - id: Q1
        text: "How do you verify cryptographic signatures on attestations and PIDs? Do you support both COSE signatures (mDoc) and JWS signatures (SD-JWT VC)?"
        dimension: technical_implementation
      - id: Q2
        text: "What happens when a signature is invalid — is the entire presentation rejected, or only the specific attestation with the invalid signature?"
        dimension: operational
      - id: Q3
        text: "What happens when a signature is valid but the issuer is not in your trust store — is this treated identically to an invalid signature, or does it produce a different error classification?"
        dimension: operational
      - id: Q4
        text: "What cryptographic libraries do you use for signature verification? Are they FIPS 140-2/3 certified or undergoing certification?"
        dimension: technical_implementation
      - id: Q5
        text: "How do you handle algorithm transitions as new algorithms are approved by the ARF? Is algorithm support configurable without a product update?"
        dimension: lifecycle
      - id: Q6
        text: "Do you verify the full certificate chain from the attestation issuer to the Trusted List root, or only validate against the immediate trust anchor?"
        dimension: security
      - id: Q7
        text: "How do you ensure the trust anchor used for verification belongs to the correct category (PID vs QEAA vs PuB-EAA vs non-qualified EAA)? Could a PID trust anchor inadvertently validate an EAA?"
        dimension: architecture
      - id: Q8
        text: "What is the verification latency for a single attestation signature? How does this scale when a presentation contains multiple attestations (combined presentation per RPI_09)?"
        dimension: sla
      - id: Q9
        text: "When signature verification fails, what information is logged for dispute resolution — without logging any attestation content (per no-storage mandate)?"
        dimension: auditability

  # ============================================================================
  # VEND-INT-011: Revocation Status Verification
  # Requirement: Verify attestation revocation status before acceptance (recommended)
  # ============================================================================
  VEND-INT-011:
    questions:
      - id: Q1
        text: "Do you check attestation revocation status before accepting presentations? If so, is this enabled by default or configured per RP agreement (per RPI_09 scope)?"
        dimension: capability
      - id: Q2
        text: "What revocation checking mechanisms do you support? Per VCR_12, if you verify revocation status, you SHALL support both Attestation Status Lists and Attestation Revocation Lists."
        dimension: technical_implementation
      - id: Q3
        text: "How do you handle revocation checking when status endpoints are unavailable — fail-closed (reject presentation) or fail-open (accept with warning)? Is this policy configurable per RP?"
        dimension: operational
      - id: Q4
        text: "What is the latency impact of revocation checking on verification time? How does this interact with the overall SLA for end-to-end presentation processing?"
        dimension: sla
      - id: Q5
        text: "Can the organisation configure whether revocation checking is mandatory or optional for each RP relationship? How does this interact with the RPI_09 agreement scope?"
        dimension: flexibility
      - id: Q6
        text: "What caching strategies do you employ for Status Lists to minimise latency while ensuring freshness? What is the maximum age of a cached status list before re-fetch?"
        dimension: technical_implementation
      - id: Q7
        text: "How does revocation checking interact with the no-storage mandate? Do you log individual attestation status identifiers during checking, or is the check performed without persistent state?"
        dimension: privacy
      - id: Q8
        text: "For Attestation Status Lists (compressed bitstring format), how do you handle the decompression and lookup efficiently at scale? What is the memory footprint per status list?"
        dimension: architecture
      - id: Q9
        text: "If a previously valid attestation is revoked between the time it was presented and the time the intermediary forwards it, is there a re-check mechanism before forwarding?"
        dimension: security

  # ============================================================================
  # VEND-INT-012: Device Binding Verification
  # Requirement: Verify the wallet unit's device binding
  # ============================================================================
  VEND-INT-012:
    questions:
      - id: Q1
        text: "How do you verify that presentations are cryptographically bound to the presenting wallet's WSCD? Do you support both mDoc `deviceAuth` verification and SD-JWT VC Key Binding JWT (`kb-jwt`) verification?"
        dimension: technical_implementation
      - id: Q2
        text: "What proof-of-possession mechanisms do you verify — device key signatures (ECDSA), device MACs, key attestations? Which WSCD types are supported (hardware SE, TEE, cloud HSM)?"
        dimension: security
      - id: Q3
        text: "How do you detect presentations that may have been exported from the original device? Is there any heuristic or protocol-level mechanism beyond the standard device key proof?"
        dimension: security
      - id: Q4
        text: "What is the failure handling when device binding verification fails — is the entire presentation rejected (per RPI_08), and how is the failure communicated to the RP?"
        dimension: operational
      - id: Q5
        text: "For mDoc format, do you verify the full `deviceAuth` structure including the session transcript (containing device engagement, eReader key, and session binding data)?"
        dimension: technical_implementation
      - id: Q6
        text: "For SD-JWT VC format, do you verify that the `cnf` claim in the issuer-signed JWT matches the public key used to sign the Key Binding JWT? What happens if they don't match?"
        dimension: technical_implementation
      - id: Q7
        text: "How does device binding verification interact with combined presentations (multiple attestations in a single session)? Must all attestations be bound to the same device key?"
        dimension: architecture
      - id: Q8
        text: "What is the verification latency for device binding checks? Does it add measurable overhead to the overall RPI_09 verification pipeline?"
        dimension: sla
      - id: Q9
        text: "How do you handle evolving WSCD standards — e.g., if Android StrongBox or Apple Secure Enclave introduce new key attestation formats, how quickly can you support them?"
        dimension: lifecycle

  # ============================================================================
  # VEND-INT-013: Replay Attack Prevention
  # Requirement: Verify presentation freshness and prevent replay attacks
  # ============================================================================
  VEND-INT-013:
    questions:
      - id: Q1
        text: "How do you verify that presentations are fresh and not replayed from previous sessions? Do you use nonce challenge-response, timestamp validation, session binding, or a combination?"
        dimension: technical_implementation
      - id: Q2
        text: "What nonce generation mechanism do you use — cryptographically random bytes, UUIDs, or another scheme? What is the nonce length and entropy?"
        dimension: security
      - id: Q3
        text: "How do you handle timestamp verification for presentation freshness? What is the maximum clock skew tolerance, and is it configurable?"
        dimension: technical_implementation
      - id: Q4
        text: "What is the time window for accepting presentations (nonce validity period)? How was this duration chosen, and what are the tradeoffs between security and usability?"
        dimension: operational
      - id: Q5
        text: "How do you detect and block replay attempts? Is there a server-side nonce store, and is it distributed across multiple intermediary instances to prevent split-brain replay attacks?"
        dimension: security
      - id: Q6
        text: "How do you bind the wallet response to the specific browser session or client state initiating the request (e.g., OID4VP `state` parameter handling)? Could a CSRF attack substitute a victim's presentation?"
        dimension: security
      - id: Q7
        text: "How does the nonce store interact with the no-storage mandate? Nonces must persist long enough to detect replays but must not contain any attestation content."
        dimension: privacy
      - id: Q8
        text: "How does the nonce store scale in a multi-instance deployment? Is it backed by a shared database, distributed cache (Redis), or consensus mechanism?"
        dimension: architecture
      - id: Q9
        text: "How frequently are expired nonces pruned from the store? Could an unbounded nonce store cause memory or storage issues under high volume?"
        dimension: operational

  # ============================================================================
  # VEND-INT-014: Secure Channel to RP
  # Requirement: Ensure secure channel for transmission to RP
  # ============================================================================
  VEND-INT-014:
    questions:
      - id: Q1
        text: "What transport layer security do you use for transmitting presentations to the RP? Do you require TLS 1.3, or is TLS 1.2 with approved cipher suites also supported? Are TLS 1.0/1.1 explicitly disabled?"
        dimension: security
      - id: Q2
        text: "Do you support mutual TLS (mTLS) for RP authentication? Is mTLS mandatory or optional per RP relationship?"
        dimension: capability
      - id: Q3
        text: "How are RP endpoints authenticated before forwarding data — certificate pinning, CA validation, or another mechanism?"
        dimension: security
      - id: Q4
        text: "What happens if the secure channel to the RP cannot be established (TLS handshake failure, certificate expired, network unreachable)? Are attributes deleted immediately per RPI_10, or is there a retry mechanism?"
        dimension: operational
      - id: Q5
        text: "Is application-layer encryption used in addition to transport encryption (e.g., JWE for payload encryption, JWS for verification result signing)?"
        dimension: security
      - id: Q6
        text: "What cipher suites are supported? Do you enforce perfect forward secrecy (PFS) via ephemeral key exchange (ECDHE)?"
        dimension: technical_implementation
      - id: Q7
        text: "How do you handle certificate rotation for the RP's TLS endpoint? Is there a grace period where both old and new certificates are accepted, or must the cutover be atomic?"
        dimension: lifecycle
      - id: Q8
        text: "Does the product support multiple concurrent secure channels to different RPs? How are these channels isolated to prevent cross-contamination of presentation data?"
        dimension: architecture
      - id: Q9
        text: "What API authentication mechanism is used between the intermediary and the RP (OAuth 2.0 client credentials, API keys, mTLS client certificates)? How are credentials rotated?"
        dimension: security

  # ============================================================================
  # VEND-INT-016: Secure Key Management
  # Note: VEND-INT-015 does not exist in source
  # Requirement: Implement secure key management for verification operations
  # ============================================================================
  VEND-INT-016:
    questions:
      - id: Q1
        text: "How do you securely store cryptographic material used in verification operations?"
        dimension: security
      - id: Q2
        text: "Are verification keys stored in HSMs or equivalent secure storage?"
        dimension: compliance_evidence
      - id: Q3
        text: "What access controls govern key usage?"
        dimension: security
      - id: Q4
        text: "How do you prevent unauthorized access, modification, or extraction of keys?"
        dimension: security
      - id: Q5
        text: "What is your key rotation and lifecycle management process?"
        dimension: lifecycle

  # ============================================================================
  # VEND-INT-017: Verification Result Integrity
  # Requirement: Protect verification results integrity
  # ============================================================================
  VEND-INT-017:
    questions:
      - id: Q1
        text: "How do you protect verification results from tampering before they reach the RP?"
        dimension: security
      - id: Q2
        text: "Are verification results signed or otherwise integrity-protected?"
        dimension: technical_implementation
      - id: Q3
        text: "How can the RP verify that the verification outcome is authentic and unmodified?"
        dimension: interoperability
      - id: Q4
        text: "What audit trail exists for verification decisions?"
        dimension: auditability

  # ============================================================================
  # VEND-INT-018: Verification Audit Logs
  # Requirement: Maintain audit logs of verification operations
  # ============================================================================
  VEND-INT-018:
    questions:
      - id: Q1
        text: "What verification operations are logged (timestamps, outcomes, error codes)?"
        dimension: auditability
      - id: Q2
        text: "How do you ensure logs do not contain attestation content (per no-storage mandate)?"
        dimension: privacy
      - id: Q3
        text: "How long are verification logs retained?"
        dimension: data_handling
      - id: Q4
        text: "Can logs be exported for dispute resolution or compliance audits?"
        dimension: operational
      - id: Q5
        text: "How are logs protected against tampering?"
        dimension: security

  # ============================================================================
  # VEND-INT-019: No Attribute Extraction
  # Requirement: Do not extract or log individual attribute values from presentations
  # ============================================================================
  VEND-INT-019:
    questions:
      - id: Q1
        text: "What technical controls prevent extraction of individual attribute values from presentations?"
        dimension: architecture
      - id: Q2
        text: "Are presentations treated as opaque payloads that cannot be decoded by the intermediary?"
        dimension: technical_implementation
      - id: Q3
        text: "How would attribute extraction be detected if it occurred?"
        dimension: incident_response
      - id: Q4
        text: "Do you undergo third-party audits to verify no-extraction compliance?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-INT-020: No Cross-RP Correlation
  # Requirement: Do not correlate or link user presentations across different RPs
  # ============================================================================
  VEND-INT-020:
    questions:
      - id: Q1
        text: "What technical and architectural controls prevent correlation of wallet user activity across different RPs?"
        dimension: architecture
      - id: Q2
        text: "Are RP relationships logically isolated to prevent cross-linking?"
        dimension: security
      - id: Q3
        text: "What data isolation exists between different RP tenants in your platform?"
        dimension: architecture
      - id: Q4
        text: "How would unauthorized correlation be detected?"
        dimension: incident_response
      - id: Q5
        text: "Do you undergo privacy audits verifying unlinkability?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-INT-021: Immediate Data Deletion
  # Requirement: Delete attestation data immediately after forwarding to RP
  # ============================================================================
  VEND-INT-021:
    questions:
      - id: Q1
        text: "How do you ensure complete deletion of PIDs, attestations, and user attributes immediately after forwarding to the RP?"
        dimension: technical_implementation
      - id: Q2
        text: "What is the definition of 'immediately'—what is the maximum time window?"
        dimension: sla
      - id: Q3
        text: "How is deletion verified (not just marked for deletion, but actually purged)?"
        dimension: auditability
      - id: Q4
        text: "How do you handle deletion when forwarding fails?"
        dimension: operational
      - id: Q5
        text: "Does deletion extend to all copies including memory, caches, and logs?"
        dimension: data_handling
      - id: Q6
        text: "What audit evidence demonstrates compliance with immediate deletion?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-INT-022: RP Details in Requests
  # Requirement: Specify RP details in each presentation request to wallet
  # ============================================================================
  VEND-INT-022:
    questions:
      - id: Q1
        text: "What RP details do you include in presentation requests (user-friendly name, unique ID, Registrar URL, intended use)?"
        dimension: technical_implementation
      - id: Q2
        text: "How do you obtain and maintain RP details for each intermediated RP?"
        dimension: operational
      - id: Q3
        text: "What happens when RP registration details change—how quickly is the update reflected?"
        dimension: lifecycle
      - id: Q4
        text: "Can the organization customize the user-friendly name and description shown to users?"
        dimension: flexibility
      - id: Q5
        text: "How does the product populate the RPRC_19a extension fields (RP name, RP identifier, Registrar URL, intended use identifier, intended use description) in each presentation request?"
        dimension: technical_implementation
      - id: Q6
        text: "How does the product ensure the RPRC_19a identity (intermediated RP) is distinct from the intermediary's own access certificate identity, so wallets correctly detect the intermediary scenario?"
        dimension: compliance_completeness
      - id: Q7
        text: "What validation is performed to ensure the RPRC_19a fields are consistent with the RP's actual registration at the Registrar?"
        dimension: compliance_monitoring

  # ============================================================================
  # VEND-INT-023: Credential Format Support
  # Requirement: Support mandatory credential formats based on supported use cases
  # ============================================================================
  VEND-INT-023:
    questions:
      - id: Q1
        text: "Do you support SD-JWT-VC format for remote presentations?"
        dimension: capability
      - id: Q2
        text: "Do you support ISO 18013-5 mDoc format for proximity presentations?"
        dimension: capability
      - id: Q3
        text: "If both remote and proximity modes are supported, are both formats fully implemented?"
        dimension: compliance_completeness
      - id: Q4
        text: "Which wallet implementations have you tested format compatibility with (EUDI reference, Apple, Google, third-party)?"
        dimension: interoperability
      - id: Q5
        text: "Have you participated in EUDI Wallet plugfest or interoperability testing events?"
        dimension: compliance_evidence
      - id: Q6
        text: "For SD-JWT-VC, do you support verification of individual disclosures (claims) independent of the full payload?"
        dimension: technical_implementation

  # ============================================================================
  # VEND-INT-024: Selective Disclosure Support
  # Requirement: Support selective disclosure in both credential formats
  # ============================================================================
  VEND-INT-024:
    questions:
      - id: Q1
        text: "Does your verification implementation correctly handle selectively disclosed attributes?"
        dimension: capability
      - id: Q2
        text: "Do you support partial attribute disclosure in both mDoc and SD-JWT-VC formats?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you verify presentations where only a subset of attributes is disclosed?"
        dimension: technical_implementation
      - id: Q4
        text: "What happens if an RP requests an attribute that was not disclosed?"
        dimension: operational

  # ============================================================================
  # VEND-INT-025: Cryptographic Certification
  # Requirement: Consider certification for cryptographic components
  # ============================================================================
  VEND-INT-025:
    questions:
      - id: Q1
        text: "Do you have certifications for your cryptographic implementations (FIPS 140-2/3, Common Criteria)?"
        dimension: compliance_evidence
      - id: Q2
        text: "What certified cryptographic libraries or modules do you use?"
        dimension: technical_implementation
      - id: Q3
        text: "If not currently certified, is certification on your roadmap?"
        dimension: roadmap
      - id: Q4
        text: "Can you provide certification evidence to the organization for their risk assessment?"
        dimension: documentation

  # ============================================================================
  # VEND-INT-026: Embedded Disclosure Policy Compliance
  # Requirement: Comply with embedded disclosure policies in attestations
  # ============================================================================
  VEND-INT-026:
    questions:
      - id: Q1
        text: "How do you verify RP compliance with embedded disclosure policies in attestations?"
        dimension: technical_implementation
      - id: Q2
        text: "What happens when an RP does not meet the disclosure policy conditions?"
        dimension: operational
      - id: Q3
        text: "How is the disclosure policy verification result communicated to the wallet for user display?"
        dimension: interoperability
      - id: Q4
        text: "What disclosure policy types do you support?"
        dimension: capability

  # ============================================================================
  # VEND-INT-027: WebAuthn for Pseudonyms
  # Requirement: Support WebAuthn specification for pseudonym generation
  # ============================================================================
  VEND-INT-027:
    questions:
      - id: Q1
        text: "Do you support WebAuthn-based pseudonymous authentication from wallet units?"
        dimension: capability
      - id: Q2
        text: "Which WebAuthn attestation and assertion modes do you support?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you handle pseudonymous authentication without revealing user identity?"
        dimension: privacy
      - id: Q4
        text: "What WebAuthn authenticator types are supported?"
        dimension: interoperability

  # ============================================================================
  # VEND-INT-028: RP-Specific Pseudonyms
  # Requirement: Support relying-party-specific pseudonyms
  # ============================================================================
  VEND-INT-028:
    questions:
      - id: Q1
        text: "Do you correctly handle RP-specific pseudonyms generated by wallets?"
        dimension: capability
      - id: Q2
        text: "How do you ensure pseudonyms cannot be linked across different RPs using your service?"
        dimension: privacy
      - id: Q3
        text: "What technical controls prevent pseudonym correlation?"
        dimension: security
      - id: Q4
        text: "Do you maintain any mapping between pseudonyms and real identities?"
        dimension: privacy

  # ============================================================================
  # VEND-INT-029: Valid Access Certificate Usage
  # Requirement: Use valid Wallet-Relying Party Access Certificate
  # ============================================================================
  VEND-INT-029:
    questions:
      - id: Q1
        text: "How do you obtain and manage Wallet-Relying Party Access Certificates from Registrars?"
        dimension: lifecycle
      - id: Q2
        text: "How do you ensure the certificate is valid and not expired when interacting with wallets?"
        dimension: technical_implementation
      - id: Q3
        text: "What certificate lifecycle management is in place (renewal alerts, automated rotation)?"
        dimension: automation
      - id: Q4
        text: "How do wallets verify your access certificate?"
        dimension: interoperability
      - id: Q5
        text: "What happens if the access certificate is revoked or expires during operations?"
        dimension: incident_response

  # ============================================================================
  # VEND-INT-030: TS7 Data Deletion Interface
  # Requirement: Implement TS7 data deletion request interface for GDPR Article 17 compliance
  # ============================================================================
  VEND-INT-030:
    questions:
      - id: Q1
        text: "Do you implement the common data deletion request interface as specified in TS7?"
        dimension: capability
      - id: Q2
        text: "How do you authenticate users submitting deletion requests via the TS7 interface?"
        dimension: security
      - id: Q3
        text: "Given the no-storage mandate, what data is subject to deletion requests?"
        dimension: data_handling
      - id: Q4
        text: "What is your response time for processing deletion requests?"
        dimension: sla
      - id: Q5
        text: "How do you relay deletion requests to the ultimate RP when needed?"
        dimension: operational
      - id: Q6
        text: "Is the deletion request automatically routed to the backend RP systems via webhook/API, or is it a manual notification?"
        dimension: automation

  # ============================================================================
  # VEND-INT-031: User Reporting Support
  # Requirement: Support user reporting to data protection authorities
  # ============================================================================
  VEND-INT-031:
    questions:
      - id: Q1
        text: "How is your identity (as intermediary) presented to users and potentially included in DPA reports?"
        dimension: operational
      - id: Q2
        text: "What contact information is provided to users for complaint purposes?"
        dimension: compliance_completeness
      - id: Q3
        text: "How do you support investigation requests from data protection authorities?"
        dimension: regulatory_access
      - id: Q4
        text: "What process is in place to respond to DPA inquiries about intermediation activities?"
        dimension: incident_response

  # ============================================================================
  # VEND-INT-032: Dual Certificate Inclusion in Requests
  # Requirement: Include intermediary access certificate and RP registration certificate in requests
  # ============================================================================
  VEND-INT-032:
    questions:
      - id: Q1
        text: "Do you include both your access certificate and the intermediated RP's registration certificate in wallet requests?"
        dimension: capability
      - id: Q2
        text: "How do you obtain and maintain RP registration certificates?"
        dimension: lifecycle
      - id: Q3
        text: "What happens when an RP does not have a registration certificate?"
        dimension: operational
      - id: Q4
        text: "How are certificate updates reflected in ongoing operations?"
        dimension: lifecycle

  # ============================================================================
  # VEND-INT-033: Contractual Relationship Registration
  # Requirement: Ensure intermediary-RP contractual relationship is registered
  # ============================================================================
  VEND-INT-033:
    questions:
      - id: Q1
        text: "How do you ensure the intermediary-RP relationship is registered with the Registrar before beginning operations?"
        dimension: compliance_monitoring
      - id: Q2
        text: "What legal evidence do you provide to Registrars to establish the relationship?"
        dimension: compliance_evidence
      - id: Q3
        text: "How do you handle wallets that cannot verify the registered relationship?"
        dimension: operational
      - id: Q4
        text: "What is the timeline from contract signing to registered relationship?"
        dimension: sla
      - id: Q5
        text: "How do you manage relationship updates (new RPs, terminated RPs)?"
        dimension: lifecycle

  # ============================================================================
  # VEND-INT-034: Attestation Status List Verification
  # Requirement: Support attestation status list verification mechanisms (recommended)
  # ============================================================================
  VEND-INT-034:
    questions:
      - id: Q1
        text: "Do you support attestation status list verification as specified in ARF Topic 7?"
        dimension: capability
      - id: Q2
        text: "What status list formats do you support (Attestation Status List, Token Status List)?"
        dimension: technical_implementation
      - id: Q3
        text: "How frequently do you refresh status lists from issuers?"
        dimension: sla
      - id: Q4
        text: "What is the fallback behavior when status lists are unavailable?"
        dimension: operational
      - id: Q5
        text: "Can the organization configure revocation checking behavior (mandatory vs. optional)?"
        dimension: flexibility
