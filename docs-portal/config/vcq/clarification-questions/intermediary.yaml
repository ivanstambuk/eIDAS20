# ============================================================================
# VCQ Clarification Questions: Intermediary Requirements
# Generated by: Opus (Phase 3)
# Date: 2026-01-30
# ============================================================================
# This file contains clarification questions for vendors providing intermediary
# services (connector products) on behalf of Relying Parties. Key themes include
# no-storage mandates, request/response forwarding integrity, trust anchors,
# verification operations, and user privacy protections.
# ============================================================================

schemaVersion: 1
sourceFile: requirements/intermediary.yaml
modelPasses:
  opus: true # Completed 2026-01-30 - All intermediary requirements processed
  gemini: true # Completed 2026-01-30 - Gemini review pass finished

requirements:
  # ============================================================================
  # VEND-INT-001: Dual Identity Display
  # Requirement: Display both intermediary and RP identity before requesting attestations
  # ============================================================================
  VEND-INT-001:
    questions:
      - id: Q1
        text: "How does the product ensure both identity data sources are present in each presentation request — the intermediary's access certificate (containing the intermediary's name and identifier) and the EW-DM-44-018 extension (containing the intermediated RP's name and identifier)?"
        dimension: technical_implementation
      - id: Q2
        text: "What EW-DM-44-018 extension fields does the product populate for the intermediated RP (user-friendly name, unique identifier, Registrar URL, intended use identifier, intended use description), and how are these kept in sync with the RP's actual registration at the Registrar?"
        dimension: compliance_completeness
      - id: Q3
        text: "How is the intermediated RP's identity information kept current when RP registration details change — is there polling, webhook-based notification, or manual refresh? What is the maximum propagation delay?"
        dimension: lifecycle
      - id: Q4
        text: "How does the product handle cases where the wallet rejects the request or warns the user due to mismatched or missing identity data? Is the rejection surfaced to the intermediated RP with actionable error details?"
        dimension: operational
      - id: Q5
        text: "What controls ensure the intermediated RP's identity in the EW-DM-44-018 extension matches their actual registration at the Registrar?"
        dimension: compliance_monitoring
      - id: Q6
        text: "How does the product handle multi-RP scenarios where the intermediary serves many RPs — how is the correct RP identity selected per request? Is there a per-request RP binding that prevents identity mix-ups?"
        dimension: architecture
      - id: Q7
        text: "Per AS-RP-51-009, if the wallet verifies the contractual relationship between intermediary and RP at the Registrar and the verification fails, does the product receive notification of this failure? How is it handled operationally?"
        dimension: incident_response
      - id: Q8
        text: "How does the product handle the scenario where an intermediated RP has multiple registered intended uses (per AS-RP-51-005 items d and e) — can the RP dynamically select which intended use applies to each request?"
        dimension: capability
      - id: Q9
        text: "What testing or certification does the product have for dual-identity display across different wallet implementations (EUDI reference wallet, Apple, Google)? Have you observed any wallet-specific rendering differences?"
        dimension: interoperability

  # ============================================================================
  # VEND-INT-002: Request Integrity - No Request Modification
  # Requirement: Ensure RP's intended data requests are accurately communicated to wallet
  # ============================================================================
  VEND-INT-002:
    questions:
      - id: Q1
        text: "What technical controls prevent the intermediary from modifying, expanding, or altering the RP's registered data request? Is the attribute set sealed/signed at ingestion time?"
        dimension: security
      - id: Q2
        text: "How do you validate that request forwarding only includes attributes registered by the RP? Per EW-DM-44-021, the wallet may query the Registrar to verify — does your product perform the same pre-flight check?"
        dimension: compliance_monitoring
      - id: Q3
        text: "Is there an audit trail showing the RP's original request versus what was sent to the wallet? Can this be produced for DPA investigations?"
        dimension: auditability
      - id: Q4
        text: "What happens if an RP attempts to request attributes not authorized in their registration — is the request rejected, silently filtered, or forwarded with a warning?"
        dimension: operational
      - id: Q5
        text: "How do you ensure alignment between registered intended uses and actual requests? If the RP has multiple intended uses, does the product enforce that only attributes for the selected use are included?"
        dimension: compliance_monitoring
      - id: Q6
        text: "Can the intermediary's own administrators or support staff override or modify the attribute set in a request? What role-based access controls prevent this?"
        dimension: security
      - id: Q7
        text: "How is the product architecturally designed to prevent 'attribute expansion' — does it treat the RP's registered attribute list as an immutable allowlist that cannot be bypassed programmatically?"
        dimension: architecture
      - id: Q8
        text: "When a new attribute type is added to the RP's registration, what is the process and latency for reflecting this in the intermediary's request construction?"
        dimension: lifecycle
      - id: Q9
        text: "Does the product generate machine-readable evidence (e.g., signed request logs) that could be submitted to a supervisory authority to prove no attribute expansion occurred?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-INT-003: Request Forwarding Integrity
  # Requirement: Forward presentation requests without modification of requested attributes
  # ============================================================================
  VEND-INT-003:
    questions:
      - id: Q1
        text: "How do you technically ensure requests are relayed to wallets without attribute modification — is the request payload transmitted as an opaque blob or reconstructed by the intermediary?"
        dimension: technical_implementation
      - id: Q2
        text: "Is the request payload signed or otherwise integrity-protected during relay? If reconstructed, how do you guarantee bit-exact fidelity with the RP's original request?"
        dimension: security
      - id: Q3
        text: "What logging exists to demonstrate request forwarding integrity? Can you produce before-and-after hashes of the request payload for audit purposes?"
        dimension: auditability
      - id: Q4
        text: "How is request integrity verified at the wallet end — does the wallet perform independent validation that the request matches the RP's registration?"
        dimension: interoperability
      - id: Q5
        text: "Per AS-RP-51-006, the intermediary must include its access certificate (AS-RP-51-001), the RP's registration certificate (AS-RP-51-003), and the EW-DM-44-018 extension (AS-RP-51-005) in each request. How does the product assemble these three components — is it a single atomic operation or a multi-step construction?"
        dimension: architecture
      - id: Q6
        text: "How does the product handle selective disclosure attribute identifiers and namespaces — are ISO 18013-5 docType/namespace/elementIdentifier tuples and SD-JWT VC claim paths preserved exactly?"
        dimension: technical_implementation
      - id: Q7
        text: "What happens if the RP sends a malformed or invalid request to the intermediary — is it rejected before forwarding, or forwarded and left for the wallet to reject?"
        dimension: operational
      - id: Q8
        text: "How does forwarding integrity differ between OID4VP (remote) and ISO 18013-5 (proximity) protocols? Are there protocol-specific transformation risks?"
        dimension: technical_implementation
      - id: Q9
        text: "Is there end-to-end integrity protection (e.g., JWS-signed request_uri) from the RP through the intermediary to the wallet, or does the intermediary's own signing replace the RP's signature?"
        dimension: security

  # ============================================================================
  # VEND-INT-004: Response Forwarding Integrity - No Data Processing
  # Requirement: Forward wallet presentations to RP without modification
  # ============================================================================
  VEND-INT-004:
    questions:
      - id: Q1
        text: "How do you ensure wallet presentations are relayed to the RP without alteration, extraction, or processing of credential data?"
        dimension: technical_implementation
      - id: Q2
        text: "What architectural controls prevent the intermediary from accessing or analyzing presentation content? Is there a 'sealed pipeline' design where the intermediary cannot decode the payload?"
        dimension: architecture
      - id: Q3
        text: "Is the presentation payload encrypted end-to-end from wallet to RP, with the intermediary unable to decrypt? If not, what prevents in-transit inspection?"
        dimension: security
      - id: Q4
        text: "What audit evidence demonstrates that credential data is not accessed during transit? Can you provide code-level attestation or third-party audit results?"
        dimension: auditability
      - id: Q5
        text: "How would a breach of this integrity control be detected — are there runtime monitors, canary values, or anomaly detection mechanisms?"
        dimension: incident_response
      - id: Q6
        text: "Per AS-RP-51-011, if any AS-RP-51-012 verification fails, the intermediary SHALL NOT forward any attributes. How does the product ensure zero partial forwarding — is the decision atomic (all-or-nothing)?"
        dimension: technical_implementation
      - id: Q7
        text: "How does the no-storage mandate (Article 5b(10)) interact with your verification logic? If verification requires decoding the attestation (e.g., to check signatures), how is the decoded content securely erased after verification?"
        dimension: security
      - id: Q8
        text: "Does the product support the RP performing independent re-verification of the forwarded presentation, including signature checks and selective-disclosure proof validation?"
        dimension: interoperability
      - id: Q9
        text: "What is the maximum time window between receiving a presentation from the wallet and forwarding it to the RP? How does this interact with the immediate deletion requirement (VEND-INT-021/AS-RP-51-013)?"
        dimension: sla

  # ============================================================================
  # VEND-INT-005: Protocol Support (Remote and Proximity)
  # Requirement: Support both remote and proximity presentation protocols
  # ============================================================================
  VEND-INT-005:
    questions:
      - id: Q1
        text: "Do you support remote presentation via OpenID4VP as specified in ISO/IEC TS 18013-7? Which OID4VP draft version is implemented?"
        dimension: capability
      - id: Q2
        text: "Do you support proximity presentation via BLE and/or NFC as specified in ISO/IEC 18013-5? BLE is the mandatory baseline transport per ISO 18013-5:2021 — is NFC supported as an additional option? Do you support both 'supervised' proximity flows (attended kiosk/counter) and 'unsupervised' flows (unattended terminal) per the EC proximity-ID manual?"
        dimension: capability
      - id: Q3
        text: "Which wallet implementations have you tested protocol compatibility with (EUDI reference wallet, Apple, Google, third-party)? What interoperability issues were encountered?"
        dimension: interoperability
      - id: Q4
        text: "What hardware is required for proximity presentation support at the RP's physical locations? Does the connector provide the hardware, or does the RP procure it independently?"
        dimension: operational
      - id: Q5
        text: "Do you support both same-device (app-to-app) and cross-device (QR code) OID4VP presentation flows? How is the response_uri callback routed through the connector's infrastructure?"
        dimension: technical_implementation
      - id: Q6
        text: "How do you handle mode switching when both remote and proximity are available for the same RP? Is the mode selected by the RP per-request, or configured statically?"
        dimension: user_experience
      - id: Q7
        text: "For proximity flows, how does the connector perform AS-RP-51-012 verification on-site before forwarding to the RP backend? Is there a local verification module or does verification require a network round-trip?"
        dimension: architecture
      - id: Q8
        text: "Do you support the `direct_post` and `direct_post.jwt` response modes for OID4VP? How is the response_uri endpoint secured against unauthorized submissions?"
        dimension: security
      - id: Q9
        text: "What is the latency overhead introduced by the connector in both remote and proximity flows? Are there SLA commitments for end-to-end presentation processing time?"
        dimension: sla

  # ============================================================================
  # VEND-INT-006: Conditional Forwarding After Verification
  # Requirement: Forward attributes only to the requesting RP after verification
  # ============================================================================
  VEND-INT-006:
    questions:
      - id: Q1
        text: "How do you ensure attributes are forwarded ONLY to the specific RP on whose behalf the request was made? What per-session RP binding mechanism prevents routing to the wrong RP?"
        dimension: security
      - id: Q2
        text: "What happens if verification fails — how is it ensured no attributes are forwarded? Is the decision atomic (all-or-nothing), or could a race condition result in partial forwarding?"
        dimension: operational
      - id: Q3
        text: "How do you prevent routing errors where data could be sent to the wrong RP in a multi-tenant environment? What isolation guarantees exist between RP routing paths?"
        dimension: architecture
      - id: Q4
        text: "What audit trail exists for successful and failed verification outcomes? Are AS-RP-51-012 verification results logged with sufficient detail for dispute resolution?"
        dimension: auditability
      - id: Q5
        text: "Per AS-RP-51-012, the intermediary SHALL verify authenticity, revocation status, device binding, user binding, and combined presentation validity. Which of these verifications does the product perform by default, and which are configurable per RP agreement?"
        dimension: compliance_completeness
      - id: Q6
        text: "After forwarding (or after verification failure), per AS-RP-51-013, the intermediary SHALL delete all PIDs and attestations completely and immediately. How is this immediate deletion triggered — is it synchronous with the forwarding operation?"
        dimension: technical_implementation
      - id: Q7
        text: "What happens if the RP's endpoint is unreachable when the intermediary attempts to forward verified attributes? Is there a retry mechanism, and if so, how does it interact with the immediate deletion requirement?"
        dimension: incident_response
      - id: Q8
        text: "How does the product handle the scenario where the intermediary serves an RP with both a direct and an intermediated relationship (per AS-RP-51-001 note c)? Can it correctly distinguish between the two modes?"
        dimension: architecture
      - id: Q9
        text: "Is there a real-time notification mechanism to the RP when verification fails (e.g., webhook, error callback), or does the RP only learn of failure through the absence of forwarded attributes?"
        dimension: operational

  # ============================================================================
  # VEND-INT-007: PID Provider Trusted Lists
  # Requirement: Maintain up-to-date Trusted Lists for PID Providers
  # ============================================================================
  VEND-INT-007:
    questions:
      - id: Q1
        text: "How do you obtain and maintain Trusted Lists for PID Providers from Member States? Do you bootstrap from the EU Commission's List of Trusted Lists (LOTL), or from individual Member State publications?"
        dimension: technical_implementation
      - id: Q2
        text: "How frequently are Trusted Lists refreshed? Is the refresh interval aligned with each list's `nextUpdate` timestamp, or is there a fixed polling interval?"
        dimension: sla
      - id: Q3
        text: "How do you handle additions, modifications, and revocations of trust anchors? Is the delta applied atomically, or could there be a window where old and new anchors coexist?"
        dimension: lifecycle
      - id: Q4
        text: "What is the maximum latency between a trust anchor change at the Member State level and your system reflecting it? What are the operational consequences if this latency exceeds the SLA?"
        dimension: sla
      - id: Q5
        text: "Which Member States' Trusted Lists do you currently support? Since connectors may serve RPs across multiple Member States, do you maintain all 27 Member State lists simultaneously?"
        dimension: geographic_scope
      - id: Q6
        text: "How do you verify the authenticity of downloaded Trusted Lists (signature verification, certificate chain validation)? What happens if a list's signature is invalid — is it rejected, and does the previous valid list remain active?"
        dimension: security
      - id: Q7
        text: "What is the fallback behaviour if a Member State's Trusted List is temporarily unavailable? Do you continue using the cached version, reject all presentations from that Member State, or apply a grace period?"
        dimension: operational
      - id: Q8
        text: "How do you ensure isolation between PID Provider trust anchors (EW-PIO-01-020) and attestation provider trust anchors (EW-PIO-01-021/14/15)? Could a PID trust anchor inadvertently validate an EAA, or vice versa?"
        dimension: architecture
      - id: Q9
        text: "Does the product support the EU Commission's centralised trust registry format and API once it becomes operational, or is it designed for Member State-by-Member State list ingestion only?"
        dimension: roadmap

  # ============================================================================
  # VEND-INT-008: Attestation Provider Trusted Lists
  # Requirement: Maintain up-to-date Trusted Lists for Attestation Providers
  # ============================================================================
  VEND-INT-008:
    questions:
      - id: Q1
        text: "How do you maintain Trusted Lists for QEAA and EAA providers? Is the process unified with PID Provider Trusted List management (VEND-INT-007), or handled separately?"
        dimension: technical_implementation
      - id: Q2
        text: "Do you distinguish between qualified (QEAA), public-body (PuB-EAA), and non-qualified (EAA) attestation providers in your trust store? Per EW-PIO-01-021/14/15, each has different validation requirements."
        dimension: compliance_completeness
      - id: Q3
        text: "How do you handle attestation providers not yet on Trusted Lists — are their attestations rejected outright, or is there a provisional acceptance mechanism?"
        dimension: operational
      - id: Q4
        text: "Can the organisation configure additional trusted attestation providers beyond official lists? If so, what governance controls prevent unauthorised additions?"
        dimension: flexibility
      - id: Q5
        text: "Per EW-PIO-01-022, PuB-EAA validation requires a two-step process: verify the QTSP's certificate against the Trusted List, then verify the attestation against the QTSP's public key. Does your product implement this full chain?"
        dimension: technical_implementation
      - id: Q6
        text: "How do you handle non-qualified EAAs where the trust mechanism is defined by a Rulebook (EW-PIO-01-023/Topic 12) rather than the standard Trusted List infrastructure? Which Rulebook-defined mechanisms are currently supported?"
        dimension: capability
      - id: Q7
        text: "What is the refresh frequency for attestation provider Trusted Lists? Is it the same as for PID Provider lists, or configured independently?"
        dimension: sla
      - id: Q8
        text: "How do you prevent trust anchor cross-contamination — ensuring a QEAA trust anchor cannot inadvertently validate a PID, and vice versa?"
        dimension: architecture
      - id: Q9
        text: "When a new attestation provider is added to or removed from a Trusted List, what is the maximum propagation delay before your system reflects the change?"
        dimension: lifecycle

  # ============================================================================
  # VEND-INT-009: Official Trust Sources Only
  # Requirement: Obtain trust anchors only from official Trusted List sources
  # ============================================================================
  VEND-INT-009:
    questions:
      - id: Q1
        text: "How do you ensure trust anchors are obtained exclusively from official EU and Member State sources? Is there a hardcoded list of authoritative URLs, or is the discovery dynamic via the LOTL?"
        dimension: security
      - id: Q2
        text: "Do you use any third-party aggregators for trust anchor data? If so, how is their integrity verified against the original Member State publications?"
        dimension: supply_chain
      - id: Q3
        text: "What controls prevent injection of unauthorised trust anchors into your trust store — are write operations restricted to the automated Trusted List ingestion pipeline?"
        dimension: security
      - id: Q4
        text: "How is the authenticity of Trusted List downloads verified? Do you validate the XML/JSON signature on each list using the Member State's signing certificate chain?"
        dimension: technical_implementation
      - id: Q5
        text: "What is the chain of trust verification: Commission LOTL → Member State TL → Provider trust anchor? Is each step cryptographically verified?"
        dimension: architecture
      - id: Q6
        text: "How do you handle the scenario where a Member State changes its Trusted List signing certificate? Is there an out-of-band verification process?"
        dimension: lifecycle
      - id: Q7
        text: "Are there any hardcoded trust anchors in the product that bypass the Trusted List mechanism (e.g., for testing or bootstrapping)? How are these controlled in production?"
        dimension: security
      - id: Q8
        text: "Does the product support operating in an air-gapped environment where Trusted Lists must be imported manually? What integrity verification is performed on manual imports?"
        dimension: operational
      - id: Q9
        text: "How would a compromised trust anchor (e.g., a Trusted List signing key compromise at Member State level) be handled? Is there an emergency revocation mechanism?"
        dimension: incident_response

  # ============================================================================
  # VEND-INT-010: Signature Validation
  # Requirement: Validate attestation signatures using official trust anchors
  # ============================================================================
  VEND-INT-010:
    questions:
      - id: Q1
        text: "How do you verify cryptographic signatures on attestations and PIDs? Do you support both COSE signatures (mDoc) and JWS signatures (SD-JWT VC)?"
        dimension: technical_implementation
      - id: Q2
        text: "What happens when a signature is invalid — is the entire presentation rejected, or only the specific attestation with the invalid signature?"
        dimension: operational
      - id: Q3
        text: "What happens when a signature is valid but the issuer is not in your trust store — is this treated identically to an invalid signature, or does it produce a different error classification?"
        dimension: operational
      - id: Q4
        text: "What cryptographic libraries do you use for signature verification? Are they FIPS 140-2/3 certified or undergoing certification?"
        dimension: technical_implementation
      - id: Q5
        text: "How do you handle algorithm transitions as new algorithms are approved by the ARF? Is algorithm support configurable without a product update?"
        dimension: lifecycle
      - id: Q6
        text: "Do you verify the full certificate chain from the attestation issuer to the Trusted List root, or only validate against the immediate trust anchor?"
        dimension: security
      - id: Q7
        text: "How do you ensure the trust anchor used for verification belongs to the correct category (PID vs QEAA vs PuB-EAA vs non-qualified EAA)? Could a PID trust anchor inadvertently validate an EAA?"
        dimension: architecture
      - id: Q8
        text: "What is the verification latency for a single attestation signature? How does this scale when a presentation contains multiple attestations (combined presentation per AS-RP-51-012)?"
        dimension: sla
      - id: Q9
        text: "When signature verification fails, what information is logged for dispute resolution — without logging any attestation content (per no-storage mandate)?"
        dimension: auditability

  # ============================================================================
  # VEND-INT-011: Revocation Status Verification & Mechanisms
  # Requirement: Verify attestation revocation status using supported mechanisms before acceptance (recommended)
  # Note: Consolidated from VEND-INT-011 + VEND-INT-034
  # ============================================================================
  VEND-INT-011:
    questions:
      - id: Q1
        text: "Do you check attestation revocation status before accepting presentations? Is this enabled by default or configured per RP agreement (per AS-RP-51-012 scope)? Is this verification performed as part of the AS-RP-51-012 verification gate (step b: revocation status)?"
        dimension: capability
      - id: Q2
        text: "Do you support BOTH revocation checking mechanisms specified per AS-AP-07-017 — Attestation Status Lists (compressed bitstring) AND Attestation Revocation Lists (identifier lists)? Or do you support only one?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you handle revocation checking when status endpoints are unavailable — fail-closed (reject presentation), fail-open (accept with warning), or use a cached (potentially stale) list? Is this policy configurable per RP?"
        dimension: operational
      - id: Q4
        text: "What is the end-to-end latency impact of revocation checking on overall transaction time? Do you pre-fetch and cache status lists proactively, or is each check a synchronous remote call? How does performance differ between Attestation Status Lists (bitstring lookup) and Attestation Revocation Lists (identifier search)?"
        dimension: sla
      - id: Q5
        text: "Can the organisation configure whether revocation checking is mandatory or optional per RP relationship or per attestation type? Given AS-AP-07-020 is a SHOULD, is there an opt-out mechanism? How does this interact with the AS-RP-51-012 agreement scope?"
        dimension: flexibility
      - id: Q6
        text: "What caching strategies do you employ for Status Lists to minimise latency while ensuring freshness? How frequently do you refresh status lists from PID/EAA Providers — time-based (e.g., every N minutes), event-based (on each request), or configurable per attestation type? What is the maximum age of a cached status list before mandatory re-fetch?"
        dimension: technical_implementation
      - id: Q7
        text: "How does revocation checking interact with the no-storage mandate? Do you log individual attestation status identifiers during checking, or is the check performed without persistent state?"
        dimension: privacy
      - id: Q8
        text: "For Attestation Status Lists (compressed bitstring format), how do you handle the decompression and lookup efficiently at scale? What is the memory footprint per status list?"
        dimension: architecture
      - id: Q9
        text: "If a previously valid attestation is revoked between the time it was presented and the time the connector forwards it, is there a re-check mechanism before forwarding? How do you handle the cache consistency problem if a revocation occurs between cache refreshes?"
        dimension: security
      - id: Q10
        text: "How do you handle short-lived attestations (validity ≤24 hours per AS-AP-07-001) — do you skip revocation checking for these, or do you treat all attestations the same regardless of validity period?"
        dimension: technical_implementation
      - id: Q11
        text: "If revocation verification fails (attestation is found to be revoked), do you correctly block attribute forwarding to the RP per AS-RP-51-011? What error information is returned to the wallet?"
        dimension: compliance_completeness

  # ============================================================================
  # VEND-INT-012: Device Binding Verification
  # Requirement: Verify the wallet unit's device binding
  # ============================================================================
  VEND-INT-012:
    questions:
      - id: Q1
        text: "How do you verify that presentations are cryptographically bound to the presenting wallet's WSCD? Do you support both mDoc `deviceAuth` verification and SD-JWT VC Key Binding JWT (`kb-jwt`) verification?"
        dimension: technical_implementation
      - id: Q2
        text: "What proof-of-possession mechanisms do you verify — device key signatures (ECDSA), device MACs, key attestations? Which WSCD types are supported (hardware SE, TEE, cloud HSM)?"
        dimension: security
      - id: Q3
        text: "How do you detect presentations that may have been exported from the original device? Is there any heuristic or protocol-level mechanism beyond the standard device key proof?"
        dimension: security
      - id: Q4
        text: "What is the failure handling when device binding verification fails — is the entire presentation rejected (per AS-RP-51-011), and how is the failure communicated to the RP?"
        dimension: operational
      - id: Q5
        text: "For mDoc format, do you verify the full `deviceAuth` structure including the session transcript (containing device engagement, eReader key, and session binding data)?"
        dimension: technical_implementation
      - id: Q6
        text: "For SD-JWT VC format, do you verify that the `cnf` claim in the issuer-signed JWT matches the public key used to sign the Key Binding JWT? What happens if they don't match?"
        dimension: technical_implementation
      - id: Q7
        text: "How does device binding verification interact with combined presentations (multiple attestations in a single session)? Must all attestations be bound to the same device key?"
        dimension: architecture
      - id: Q8
        text: "What is the verification latency for device binding checks? Does it add measurable overhead to the overall AS-RP-51-012 verification pipeline?"
        dimension: sla
      - id: Q9
        text: "How do you handle evolving WSCD standards — e.g., if Android StrongBox or Apple Secure Enclave introduce new key attestation formats, how quickly can you support them?"
        dimension: lifecycle

  # ============================================================================
  # VEND-INT-013: Replay Attack Prevention
  # Requirement: Verify presentation freshness and prevent replay attacks
  # ============================================================================
  VEND-INT-013:
    questions:
      - id: Q1
        text: "How do you verify that presentations are fresh and not replayed from previous sessions? Do you use nonce challenge-response, timestamp validation, session binding, or a combination?"
        dimension: technical_implementation
      - id: Q2
        text: "What nonce generation mechanism do you use — cryptographically random bytes, UUIDs, or another scheme? What is the nonce length and entropy?"
        dimension: security
      - id: Q3
        text: "How do you handle timestamp verification for presentation freshness? What is the maximum clock skew tolerance, and is it configurable?"
        dimension: technical_implementation
      - id: Q4
        text: "What is the time window for accepting presentations (nonce validity period)? How was this duration chosen, and what are the tradeoffs between security and usability?"
        dimension: operational
      - id: Q5
        text: "How do you detect and block replay attempts? Is there a server-side nonce store, and is it distributed across multiple connector instances to prevent split-brain replay attacks?"
        dimension: security
      - id: Q6
        text: "How do you bind the wallet response to the specific browser session or client state initiating the request (e.g., OID4VP `state` parameter handling)? Could a CSRF attack substitute a victim's presentation?"
        dimension: security
      - id: Q7
        text: "How does the nonce store interact with the no-storage mandate? Nonces must persist long enough to detect replays but must not contain any attestation content."
        dimension: privacy
      - id: Q8
        text: "How does the nonce store scale in a multi-instance deployment? Is it backed by a shared database, distributed cache (Redis), or consensus mechanism?"
        dimension: architecture
      - id: Q9
        text: "How frequently are expired nonces pruned from the store? Could an unbounded nonce store cause memory or storage issues under high volume?"
        dimension: operational

  # ============================================================================
  # VEND-INT-014: Secure Channel to RP
  # Requirement: Ensure secure channel for transmission to RP
  # ============================================================================
  VEND-INT-014:
    questions:
      - id: Q1
        text: "What transport layer security do you use for transmitting presentations to the RP? Do you require TLS 1.3, or is TLS 1.2 with approved cipher suites also supported? Are TLS 1.0/1.1 explicitly disabled?"
        dimension: security
      - id: Q2
        text: "Do you support mutual TLS (mTLS) for RP authentication? Is mTLS mandatory or optional per RP relationship?"
        dimension: capability
      - id: Q3
        text: "How are RP endpoints authenticated before forwarding data — certificate pinning, CA validation, or another mechanism?"
        dimension: security
      - id: Q4
        text: "What happens if the secure channel to the RP cannot be established (TLS handshake failure, certificate expired, network unreachable)? Are attributes deleted immediately per AS-RP-51-013, or is there a retry mechanism?"
        dimension: operational
      - id: Q5
        text: "Is application-layer encryption used in addition to transport encryption (e.g., JWE for payload encryption, JWS for verification result signing)?"
        dimension: security
      - id: Q6
        text: "What cipher suites are supported? Do you enforce perfect forward secrecy (PFS) via ephemeral key exchange (ECDHE)?"
        dimension: technical_implementation
      - id: Q7
        text: "How do you handle certificate rotation for the RP's TLS endpoint? Is there a grace period where both old and new certificates are accepted, or must the cutover be atomic?"
        dimension: lifecycle
      - id: Q8
        text: "Does the product support multiple concurrent secure channels to different RPs? How are these channels isolated to prevent cross-contamination of presentation data?"
        dimension: architecture
      - id: Q9
        text: "What API authentication mechanism is used between the intermediary and the RP (OAuth 2.0 client credentials, API keys, mTLS client certificates)? How are credentials rotated?"
        dimension: security

  # ============================================================================
  # VEND-INT-016: Secure Key Management
  # Note: VEND-INT-015 does not exist in source
  # Requirement: Implement secure key management for verification operations
  # ============================================================================
  VEND-INT-016:
    questions:
      - id: Q1
        text: "How do you securely store cryptographic material used in verification operations? Are private keys stored in HSMs, TPMs, or equivalent hardware-backed secure storage for production deployments?"
        dimension: security
      - id: Q2
        text: "Are the HSMs or secure enclaves used for key storage certified (e.g., FIPS 140-2/3, Common Criteria EAL4+)? Does your certification level meet the requirements of your RP customers' compliance frameworks?"
        dimension: compliance_evidence
      - id: Q3
        text: "What access controls govern key usage — is key access restricted to specific service accounts, and are all access attempts logged and audited?"
        dimension: security
      - id: Q4
        text: "What key types does the connector manage: TLS server/client keys, JWS signing keys for verification results, trust anchor certificates? Are these stored in separate key hierarchies?"
        dimension: architecture
      - id: Q5
        text: "What is your key rotation schedule and lifecycle management process? Is rotation automated, and what is the overlap period during which both old and new keys are valid?"
        dimension: lifecycle
      - id: Q6
        text: "How do you handle ephemeral session keys generated during OID4VP or ISO 18013-5 device engagement? Are these keys held only in volatile memory and securely zeroed after the session completes?"
        dimension: technical_implementation
      - id: Q7
        text: "What is the emergency key revocation procedure if a key is suspected compromised? What is the maximum time from detection to revocation?"
        dimension: incident_response
      - id: Q8
        text: "How do you prevent keys from appearing in logs, error messages, stack traces, or diagnostic output — especially during debugging or incident investigation?"
        dimension: security
      - id: Q9
        text: "How is key material protected during backup and disaster recovery? Are backups encrypted with separate key encryption keys, and are backup media handled according to the same security policy?"
        dimension: operational

  # ============================================================================
  # VEND-INT-017: Verification Result Integrity
  # Requirement: Protect verification results integrity
  # ============================================================================
  VEND-INT-017:
    questions:
      - id: Q1
        text: "How do you protect verification results from tampering before they reach the RP? Do you sign the verification outcome with JWS, or use HMAC with a shared secret?"
        dimension: security
      - id: Q2
        text: "Are verification results signed or otherwise integrity-protected? If signed, what algorithm and key length are used for the JWS signature?"
        dimension: technical_implementation
      - id: Q3
        text: "How can the RP independently verify that the verification outcome is authentic and unmodified? Is the intermediary's public key or certificate provided to the RP during onboarding?"
        dimension: interoperability
      - id: Q4
        text: "What audit trail exists for verification decisions? Can the signed verification result serve as non-repudiable evidence in dispute resolution without requiring access to the original attestation?"
        dimension: auditability
      - id: Q5
        text: "What fields are included in the verification result payload — overall outcome, per-check outcomes (AS-RP-51-012 breakdown), timestamp, nonce binding, intermediary identifier?"
        dimension: technical_implementation
      - id: Q6
        text: "How do you prevent the verification result from being replayed by a malicious RP to claim a presentation was verified when it was not? Is the result bound to a specific request nonce?"
        dimension: security
      - id: Q7
        text: "Is the verification result format standardised, or is it proprietary to your product? How does this affect RP vendor lock-in?"
        dimension: interoperability
      - id: Q8
        text: "How does verification result integrity interact with the no-storage mandate — can the RP retain the signed result as proof without retaining the underlying attestation data?"
        dimension: compliance_completeness
      - id: Q9
        text: "What happens if the verification result signing key is rotated — can RPs still validate historical verification results signed with the previous key?"
        dimension: lifecycle

  # ============================================================================
  # VEND-INT-018: Verification Audit Logs
  # Requirement: Maintain audit logs of verification operations
  # ============================================================================
  VEND-INT-018:
    questions:
      - id: Q1
        text: "What verification operations are logged — timestamps, per-check outcomes (AS-RP-51-012 breakdown), error codes, protocol used, processing duration? Is the logging schema documented and configurable?"
        dimension: auditability
      - id: Q2
        text: "How do you ensure logs do not contain attestation content (per the no-storage mandate)? Is there an automated content filter or schema enforcement that rejects log entries containing prohibited data?"
        dimension: privacy
      - id: Q3
        text: "How long are verification logs retained, and is the retention period configurable per RP agreement? How do you ensure logs are deleted at the end of the retention period?"
        dimension: data_handling
      - id: Q4
        text: "Can logs be exported for dispute resolution or compliance audits? What format and access controls apply to log exports?"
        dimension: operational
      - id: Q5
        text: "How are logs protected against tampering — append-only storage, cryptographic signing, blockchain anchoring, or another tamper-evidence mechanism?"
        dimension: security
      - id: Q6
        text: "Do verification logs contain wallet unit identifiers or device key fingerprints that could enable user tracking across sessions? If so, how is this consistent with the unlinkability requirement (VEND-INT-020)?"
        dimension: privacy
      - id: Q7
        text: "Are logs themselves treated as processing records under GDPR Article 30? Who is the data controller for log data, and is a DPIA required?"
        dimension: compliance_completeness
      - id: Q8
        text: "What is the log volume per verification operation, and how does log storage scale with the number of RPs and transactions? Is log aggregation or sampling used at high volume?"
        dimension: architecture
      - id: Q9
        text: "In a multi-instance deployment, how are logs correlated across instances to reconstruct the full verification flow for a single session?"
        dimension: operational

  # ============================================================================
  # VEND-INT-019: No Attribute Extraction
  # Requirement: Do not extract or log individual attribute values from presentations
  # ============================================================================
  VEND-INT-019:
    questions:
      - id: Q1
        text: "What technical controls prevent extraction of individual attribute values from presentations? Is the attestation treated as an opaque binary blob throughout the intermediary's pipeline?"
        dimension: architecture
      - id: Q2
        text: "Are presentations treated as opaque payloads that cannot be decoded by the intermediary? Or does the intermediary need to partially parse SD-JWT VC disclosures or mDoc IssuerSignedItems for any verification step?"
        dimension: technical_implementation
      - id: Q3
        text: "How would attribute extraction be detected if it occurred — e.g., via code review, runtime monitoring, or DLP (Data Loss Prevention) controls?"
        dimension: incident_response
      - id: Q4
        text: "Do you undergo third-party audits or penetration testing to verify no-extraction compliance? What is the audit frequency and scope?"
        dimension: compliance_evidence
      - id: Q5
        text: "For AS-RP-51-012 checks that require limited attribute access (e.g., user binding via biometric template), how do you ensure the accessed data is minimal, purpose-limited, and securely erased immediately after the check?"
        dimension: security
      - id: Q6
        text: "Does the intermediary's codebase use attestation deserialisation libraries that could inadvertently expose attribute values to application logic? How is this risk controlled?"
        dimension: architecture
      - id: Q7
        text: "How do you prevent analytics, profiling, or machine learning training on presentation content — is there an organisational policy, and is it enforced technically?"
        dimension: privacy
      - id: Q8
        text: "If the product offers value-added services (e.g., age verification, nationality check) that require specific attribute inspection, how is this reconciled with the no-extraction mandate?"
        dimension: compliance_completeness
      - id: Q9
        text: "How do you handle debugging and incident investigation without exposing attribute content — e.g., can you reproduce verification failures without access to the original attestation payload?"
        dimension: operational

  # ============================================================================
  # VEND-INT-020: No Cross-RP Correlation
  # Requirement: Do not correlate or link user presentations across different RPs
  # ============================================================================
  VEND-INT-020:
    questions:
      - id: Q1
        text: "What technical and architectural controls prevent correlation of wallet user activity across different RPs? Is there logical or physical tenant isolation per RP?"
        dimension: architecture
      - id: Q2
        text: "Are RP relationships logically isolated to prevent cross-linking — separate databases, namespaces, or encryption domains per RP?"
        dimension: security
      - id: Q3
        text: "What data isolation exists between different RP tenants in your platform? Could a database query, log search, or API call inadvertently return data from multiple RP contexts?"
        dimension: architecture
      - id: Q4
        text: "How would unauthorised correlation be detected — is there monitoring for cross-RP queries, data access anomalies, or staff access pattern analysis?"
        dimension: incident_response
      - id: Q5
        text: "Do you undergo privacy audits verifying unlinkability? What methodology is used — code audit, data flow analysis, or privacy engineering review?"
        dimension: compliance_evidence
      - id: Q6
        text: "Are session identifiers, nonces, and internal correlation IDs designed to be meaningless outside their RP context? Could any identifier format enable cross-RP linking?"
        dimension: security
      - id: Q7
        text: "How are verification logs partitioned per RP? Do log entries contain any common identifiers (wallet unit IDs, device key fingerprints) that could be joined across RP boundaries?"
        dimension: privacy
      - id: Q8
        text: "What staff access controls prevent intermediary personnel from querying across RP tenant boundaries? Is there role-based access with RP-scope restrictions?"
        dimension: security
      - id: Q9
        text: "If the intermediary processes presentations for the same user from two different RPs, are there any shared processing resources (memory pools, thread pools, caches) that could leak information between sessions?"
        dimension: architecture

  # ============================================================================
  # VEND-INT-021: Immediate Data Deletion
  # Requirement: Delete attestation data immediately after forwarding to RP
  # ============================================================================
  VEND-INT-021:
    questions:
      - id: Q1
        text: "How do you ensure complete deletion of PIDs, attestations, and user attributes immediately after forwarding to the RP? Is secure memory zeroing used (not just pointer deallocation)?"
        dimension: technical_implementation
      - id: Q2
        text: "What is the definition of 'immediately' — what is the maximum time window between forwarding completion (or verification failure) and data deletion? Is this SLA contractually defined?"
        dimension: sla
      - id: Q3
        text: "How is deletion verified (not just marked for deletion, but actually purged from memory, disk, and swap)? Do you use secure memory APIs (e.g., `memset_s`, `SecureZeroMemory`) that cannot be optimised away by the compiler?"
        dimension: auditability
      - id: Q4
        text: "How do you handle deletion when forwarding fails — is data still deleted immediately per AS-RP-51-013, even though the RP never received it? Are retry mechanisms that would require retaining attestation data prohibited?"
        dimension: operational
      - id: Q5
        text: "Does deletion extend to all copies including volatile memory, CPU caches, swap/page files, temporary files, in-memory caches, and log entries? Do you use memory locking (e.g., `mlock`) to prevent paging of sensitive data?"
        dimension: data_handling
      - id: Q6
        text: "What audit evidence demonstrates compliance with immediate deletion — deletion timestamps, memory zeroing confirmations, file system attestation?"
        dimension: compliance_evidence
      - id: Q7
        text: "In a managed/cloud environment, how do you ensure deletion extends to the hypervisor's memory management layer and any transparent encryption/caching layers?"
        dimension: architecture
      - id: Q8
        text: "If the intermediary process crashes mid-verification, what ensures that attestation data in memory is not persisted to core dumps, crash reports, or diagnostic snapshots?"
        dimension: incident_response
      - id: Q9
        text: "How frequently is the deletion mechanism tested? Is there an automated test (e.g., memory scanning after deletion) that verifies no residual data remains?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-INT-022: RP Details in Requests
  # Requirement: Specify RP details in each presentation request to wallet
  # ============================================================================
  VEND-INT-022:
    questions:
      - id: Q1
        text: "What RP details do you include in presentation requests — user-friendly name, unique identifier, Registrar URL, intended use identifier, intended use description? Are all 5 AS-RP-51-005 fields populated in every request?"
        dimension: technical_implementation
      - id: Q2
        text: "How do you obtain and maintain RP details for each intermediated RP? Is this a one-time onboarding process for static fields (a–c), and per-request selection for dynamic fields (d–e)?"
        dimension: operational
      - id: Q3
        text: "What happens when RP registration details change at the Registrar — how quickly is the update reflected in the intermediary's configuration? Is there automated synchronisation?"
        dimension: lifecycle
      - id: Q4
        text: "Can the organisation customise the user-friendly name and description shown to wallet users, or are these strictly taken from the RP's Registrar entry?"
        dimension: flexibility
      - id: Q5
        text: "How does the product populate the EW-DM-44-018 extension fields in each presentation request? Is the population automated from RP configuration, or manually assembled per request?"
        dimension: technical_implementation
      - id: Q6
        text: "How does the product ensure the EW-DM-44-018 identity (intermediated RP) is distinct from the intermediary's own access certificate identity, so wallets correctly detect the intermediary scenario per AS-RP-51-008?"
        dimension: compliance_completeness
      - id: Q7
        text: "What validation is performed to ensure the EW-DM-44-018 fields are consistent with the RP's actual registration at the Registrar? Is there a check at onboarding and/or at each request?"
        dimension: compliance_monitoring
      - id: Q8
        text: "If the intermediated RP has multiple registered intended uses, how does the product select the correct intended use (d) and description (e) for each specific request? Is this configurable per API call?"
        dimension: architecture
      - id: Q9
        text: "If the intermediated RP has registration certificates (per AS-RP-51-003), how does the intermediary know which single certificate to include in the request? Is this part of the RP onboarding configuration?"
        dimension: technical_implementation

  # ============================================================================
  # VEND-INT-023: Credential Format Support
  # Requirement: Support mandatory credential formats based on supported use cases
  # ============================================================================
  VEND-INT-023:
    questions:
      - id: Q1
        text: "Do you support SD-JWT-VC format for remote presentations? Can you verify SD-JWT signatures, validate selective disclosures (hash verification), and check key binding JWTs?"
        dimension: capability
      - id: Q2
        text: "Do you support ISO 18013-5 mDoc format for proximity presentations? Can you handle device engagement, session establishment, CBOR decoding, and COSE signature verification?"
        dimension: capability
      - id: Q3
        text: "If both remote and proximity modes are supported, are both formats fully implemented with equivalent verification depth, or is one format a secondary/limited implementation?"
        dimension: compliance_completeness
      - id: Q4
        text: "Which wallet implementations have you tested format compatibility with (EUDI reference wallet, Apple, Google, third-party)? Have you participated in EUDI Wallet plugfest or interoperability testing events?"
        dimension: interoperability
      - id: Q5
        text: "For proximity presentations, which transport protocols do you support — BLE (mandatory baseline per ISO 18013-5), NFC, or Wi-Fi Aware? Do you support ISO 18013-7 for reader authentication enhancements?"
        dimension: technical_implementation
      - id: Q6
        text: "For SD-JWT-VC, do you support verification of individual disclosures (claims) independent of the full payload? How do you handle the `_sd` claim array and disclosure hashing?"
        dimension: technical_implementation
      - id: Q7
        text: "For mDoc, do you correctly verify the Mobile Security Object (MSO) including the `ValidityInfo` and per-namespace digests? How do you handle expired MSOs?"
        dimension: technical_implementation
      - id: Q8
        text: "How do you handle Attestation Rulebook (EW-DM-12-003) requirements that mandate mDoc format for specific attestation types requiring proximity presentation? Is format support configurable per attestation type?"
        dimension: architecture
      - id: Q9
        text: "What is your roadmap for supporting future credential format versions or new formats (e.g., W3C VC Data Model 2.0, ISO 18013-5 amendments)? How do you manage format version negotiation?"
        dimension: roadmap

  # ============================================================================
  # VEND-INT-024: Selective Disclosure Support
  # Requirement: Support selective disclosure in both credential formats
  # ============================================================================
  VEND-INT-024:
    questions:
      - id: Q1
        text: "Does your verification implementation correctly handle selectively disclosed attributes, verifying only the disclosed subset without treating undisclosed claims as errors?"
        dimension: capability
      - id: Q2
        text: "For SD-JWT-VC selective disclosure, do you verify the hash of each disclosed claim against the issuer-signed payload? How do you handle the `_sd` array and salt validation?"
        dimension: technical_implementation
      - id: Q3
        text: "For mDoc selective disclosure, do you verify each `IssuerSignedItem` digest against the Mobile Security Object (MSO)? How do you handle namespace-scoped disclosure?"
        dimension: technical_implementation
      - id: Q4
        text: "What happens if an RP requests an attribute that was not disclosed by the user — do you return an error, silently omit it, or forward a partial result?"
        dimension: operational
      - id: Q5
        text: "When forwarding selectively disclosed attributes to the RP (per VEND-INT-004), do you forward exactly the disclosed subset without inferring, reconstructing, or flagging undisclosed attributes?"
        dimension: compliance_completeness
      - id: Q6
        text: "Do you verify the key binding JWT (`kb-jwt`) in SD-JWT-VC presentations to confirm the holder is authorised to present the disclosed claims?"
        dimension: security
      - id: Q7
        text: "How do you handle combined presentations where some attestations use SD-JWT-VC and others use mDoc — is the verification pipeline format-agnostic at the forwarding stage?"
        dimension: architecture
      - id: Q8
        text: "Have you tested selective disclosure edge cases: single-attribute disclosure, empty disclosure (no claims), disclosure of nested objects, and disclosure of array elements?"
        dimension: interoperability
      - id: Q9
        text: "How does your selective disclosure verification interact with the no-extraction mandate (VEND-INT-019) — does verification require decoding attribute values, or can it be performed purely on hashes/digests?"
        dimension: privacy

  # ============================================================================
  # VEND-INT-025: Cryptographic Certification
  # Requirement: Consider certification for cryptographic components
  # ============================================================================
  VEND-INT-025:
    questions:
      - id: Q1
        text: "Do you have certifications for your cryptographic implementations (FIPS 140-2/3, Common Criteria EAL4+, SOG-IS)? At what level, and for which specific modules?"
        dimension: compliance_evidence
      - id: Q2
        text: "What certified cryptographic libraries or modules do you use (e.g., OpenSSL FIPS module, BouncyCastle FIPS, AWS CloudHSM, Azure Key Vault)? Are these libraries used consistently across all verification paths?"
        dimension: technical_implementation
      - id: Q3
        text: "If not currently certified, is certification on your roadmap? What certification level are you targeting, and what is the expected timeline?"
        dimension: roadmap
      - id: Q4
        text: "Can you provide certification evidence to the organisation for their risk assessment? What form does this take (certificate copy, audit report, vendor attestation letter)?"
        dimension: documentation
      - id: Q5
        text: "How do you handle algorithm agility — if a certified algorithm is deprecated or weakened, what is your process for migrating to a replacement while maintaining certification?"
        dimension: lifecycle
      - id: Q6
        text: "Does your certification cover the full scope of cryptographic operations: signature verification (ECDSA/EdDSA/RSA), hash functions (SHA-256/SHA-384), TLS (cipher suites), and random number generation?"
        dimension: compliance_completeness
      - id: Q7
        text: "For HSM-backed deployments, is the HSM itself certified (FIPS 140-2/3 Level 2+), and does the certification cover the specific key usage patterns in your intermediary product?"
        dimension: security
      - id: Q8
        text: "How do you maintain certification across software updates — does each update require re-certification, or are updates covered under the original certification scope?"
        dimension: operational
      - id: Q9
        text: "Are your cryptographic implementations subject to regular penetration testing or side-channel analysis beyond formal certification? What is the testing frequency?"
        dimension: security

  # ============================================================================
  # VEND-INT-026: Embedded Disclosure Policy Compliance
  # Requirement: Comply with embedded disclosure policies in attestations
  # ============================================================================
  VEND-INT-026:
    questions:
      - id: Q1
        text: "How do you verify RP compliance with embedded disclosure policies in attestations? Is policy evaluation performed before or after the wallet presents the attestation?"
        dimension: technical_implementation
      - id: Q2
        text: "What happens when the intermediated RP does not meet the disclosure policy conditions — is the request blocked before reaching the wallet, or is the wallet informed and left to reject?"
        dimension: operational
      - id: Q3
        text: "How is the disclosure policy verification result communicated to the wallet for user display? Is this via a standard protocol mechanism or a proprietary API?"
        dimension: interoperability
      - id: Q4
        text: "What disclosure policy types do you support — RP category restrictions, purpose limitations, jurisdiction constraints, temporal windows, or others?"
        dimension: capability
      - id: Q5
        text: "How do you obtain the intermediated RP's registration data (RP category, registered purposes, jurisdiction) for evaluation against disclosure policies? Is this queried from the Registrar in real time?"
        dimension: architecture
      - id: Q6
        text: "How does the disclosure policy check interact with the AS-RP-51-006 attribute scope check? Are they performed independently, and what is the order of evaluation?"
        dimension: compliance_completeness
      - id: Q7
        text: "Can disclosure policies reference data that the connector cannot evaluate (e.g., the RP's internal data processing agreement)? How do you handle unresolvable policy conditions?"
        dimension: operational
      - id: Q8
        text: "Are disclosure policies cached or evaluated fresh for each request? If cached, how do you handle policy updates by attestation issuers?"
        dimension: lifecycle
      - id: Q9
        text: "What audit trail exists for disclosure policy evaluations — is the policy check result logged (pass/fail, which conditions were evaluated) without logging the attestation content?"
        dimension: auditability

  # ============================================================================
  # VEND-INT-027: WebAuthn for Pseudonyms
  # Requirement: Support WebAuthn specification for pseudonym generation
  # ============================================================================
  VEND-INT-027:
    questions:
      - id: Q1
        text: "Do you support WebAuthn-based pseudonymous authentication from wallet units? Which WebAuthn specification version do you implement (Level 2, Level 3)? This supports the TS12 pseudonym attestation use case from the EC PID-online manual, where users authenticate without revealing their real identity."
        dimension: capability
      - id: Q2
        text: "Which WebAuthn attestation and assertion modes do you support? Do you support `direct` attestation for initial registration and `assertion` for subsequent authentications?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you handle pseudonymous authentication without revealing user identity — is the public key (pseudonym) the only identifier visible to the connector, with no linkage to PID data?"
        dimension: privacy
      - id: Q4
        text: "What WebAuthn authenticator types are supported (platform, cross-platform, WSCD-backed)? How do you handle the `authenticatorData` fields including RP ID hash, flags, and sign count?"
        dimension: interoperability
      - id: Q5
        text: "Do you support the `ES256` algorithm (ECDSA P-256) at minimum per WebAuthn recommendations? Which additional algorithms are supported?"
        dimension: technical_implementation
      - id: Q6
        text: "How do you forward the verified pseudonym to the intermediated RP without associating it with any PID or attestation data? Is the pseudonym treated with the same deletion requirements as attestation data (per AS-RP-51-013)?"
        dimension: compliance_completeness
      - id: Q7
        text: "How do you handle WebAuthn challenge freshness — is the challenge (nonce) generated by the connector, by the intermediated RP, or collaboratively?"
        dimension: security
      - id: Q8
        text: "What is your credential registration flow — does the wallet register the WebAuthn credential directly with the intermediated RP (via the connector as proxy), or with the connector itself?"
        dimension: architecture
      - id: Q9
        text: "How do you handle the scenario where a user's WSCD changes (e.g., phone replacement) — is there a re-registration mechanism that preserves the pseudonym continuity for the RP?"
        dimension: lifecycle

  # ============================================================================
  # VEND-INT-028: RP-Specific Pseudonyms
  # Requirement: Support relying-party-specific pseudonyms
  # ============================================================================
  VEND-INT-028:
    questions:
      - id: Q1
        text: "Do you correctly handle RP-specific pseudonyms generated by wallets? Is the RP ID used for pseudonym derivation the intermediated RP's identifier (not the intermediary's own identifier)?"
        dimension: capability
      - id: Q2
        text: "How do you ensure pseudonyms cannot be linked across different RPs using your service? Since the intermediary sees pseudonyms for multiple RPs, what controls prevent cross-RP correlation?"
        dimension: privacy
      - id: Q3
        text: "What technical controls prevent pseudonym correlation — are pseudonyms stored in per-RP isolated contexts, or processed in a shared pipeline where correlation could theoretically occur?"
        dimension: security
      - id: Q4
        text: "Do you maintain any mapping between pseudonyms and real identities (PIDs)? If pseudonym verification occurs alongside PID verification in the same session, how do you prevent linkage?"
        dimension: privacy
      - id: Q5
        text: "How do you ensure the RP ID used for pseudonym scoping is the intermediated RP's registered identifier and not the intermediary's domain? Is this configured per RP during onboarding?"
        dimension: architecture
      - id: Q6
        text: "After forwarding the pseudonym to the RP, is it deleted from the intermediary's systems per the no-storage mandate? Or does the intermediary retain it for session continuity?"
        dimension: compliance_completeness
      - id: Q7
        text: "How does RP-specific pseudonym handling interact with the cross-RP unlinkability requirement (VEND-INT-020)? Are there any shared data structures that could leak pseudonym information across RP contexts?"
        dimension: security
      - id: Q8
        text: "If the intermediated RP changes its registered identifier (e.g., domain change), how does this affect existing pseudonyms? Is there a migration mechanism?"
        dimension: lifecycle
      - id: Q9
        text: "Do you undergo privacy engineering reviews or formal unlinkability analysis to verify that RP-specific pseudonyms remain unlinkable across your intermediary platform?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-INT-029: Valid Access Certificate Usage
  # Requirement: Use valid Wallet-Relying Party Access Certificate
  # ============================================================================
  VEND-INT-029:
    questions:
      - id: Q1
        text: "How do you obtain Wallet-Relying Party Access Certificates from Registrars? Is the enrolment process automated, and how long does initial provisioning take?"
        dimension: lifecycle
      - id: Q2
        text: "How do you ensure the access certificate is valid and not expired when interacting with wallets? Is there automated monitoring with renewal alerts well before expiry?"
        dimension: technical_implementation
      - id: Q3
        text: "What certificate lifecycle management is in place — automated rotation, overlap periods with both old and new certificates, and grace periods for renewal?"
        dimension: automation
      - id: Q4
        text: "How do wallets verify your access certificate? Is the certificate chain verifiable against a Registrar Trusted List, and how do you ensure chain completeness?"
        dimension: interoperability
      - id: Q5
        text: "What happens if the access certificate is revoked or expires during operations — do all in-flight sessions fail, or is there a graceful degradation mechanism?"
        dimension: incident_response
      - id: Q6
        text: "For remote presentations (OID4VP), how is the access certificate presented — as the TLS server certificate, in the request JWT, or both? Is the presentation mechanism configurable?"
        dimension: technical_implementation
      - id: Q7
        text: "For proximity presentations (ISO 18013-5), how is the access certificate included in the reader authentication structure? Do you support the certificate format specified in ETSI TS 119 472-2?"
        dimension: technical_implementation
      - id: Q8
        text: "How does the connector's access certificate identity relate to the EW-DM-44-018 identity of the intermediated RP? Can you explain how wallets detect the connector scenario by comparing these two identities (per AS-RP-51-008)?"
        dimension: compliance_completeness
      - id: Q9
        text: "If the connector serves multiple Registrars (e.g., across Member States), how do you manage multiple access certificates and ensure the correct certificate is used for each RP context?"
        dimension: architecture

  # ============================================================================
  # VEND-INT-030: TS7 Data Deletion Interface
  # Requirement: Implement TS7 data deletion request interface for GDPR Article 17 compliance
  # ============================================================================
  VEND-INT-030:
    questions:
      - id: Q1
        text: "Do you implement the common data deletion request interface as specified in TS7? Which TS7 API endpoints are exposed, and what is the request/response format?"
        dimension: capability
      - id: Q2
        text: "How do you authenticate users submitting deletion requests (per AS-RP-48-005)? Do you use the wallet's authentication or signature facilities, or your own authentication mechanisms?"
        dimension: security
      - id: Q3
        text: "Given the no-storage mandate (VEND-INT-021), what data is actually subject to deletion requests — audit logs, transaction metadata, error logs, or other operational records?"
        dimension: data_handling
      - id: Q4
        text: "What is your response time for processing deletion requests? Do you meet the GDPR 'without undue delay' standard (typically within one month)? Is there a committed SLA?"
        dimension: sla
      - id: Q5
        text: "How do you relay deletion requests to the intermediated RP (the actual data controller) — via webhook, API call, or manual notification? What confirmation mechanism ensures the RP actually processes the deletion?"
        dimension: operational
      - id: Q6
        text: "Is the deletion request relay to the backend RP systems automated end-to-end, or does it require manual intervention at any stage? What is the automation coverage percentage?"
        dimension: automation
      - id: Q7
        text: "How do you handle deletion requests for data that has already been automatically deleted under the no-storage mandate? Do you confirm deletion even if no data was found?"
        dimension: compliance_completeness
      - id: Q8
        text: "If the intermediated RP is unresponsive or refuses the deletion request, what is your escalation procedure? Do you notify the user or the relevant DPA?"
        dimension: incident_response
      - id: Q9
        text: "Do you maintain a deletion request log (recording that a request was received, processed, and relayed) for accountability purposes without storing the personal data itself?"
        dimension: auditability

  # ============================================================================
  # VEND-INT-031: User Reporting Support
  # Requirement: Support user reporting to data protection authorities
  # ============================================================================
  VEND-INT-031:
    questions:
      - id: Q1
        text: "How is your identity (as intermediary) presented to users during the consent flow, and how might it appear in DPA reports — is it the intermediary name from the access certificate, the legal entity name, or both?"
        dimension: operational
      - id: Q2
        text: "What contact information is provided to users for complaint purposes — DPO contact details, registered address, supervisory authority details? Is this information included in the EW-DM-44-018 extension or provided via a separate channel?"
        dimension: compliance_completeness
      - id: Q3
        text: "How do you support investigation requests from data protection authorities — can you produce a complete audit trail of intermediation activities for a specific user without retaining personal data beyond the no-storage mandate?"
        dimension: regulatory_access
      - id: Q4
        text: "What process is in place to respond to DPA inquiries about intermediation activities? Is there a dedicated DPA liaison team or contact point with defined response SLAs?"
        dimension: incident_response
      - id: Q5
        text: "In a DPA report, how do you distinguish between the intermediary's responsibility and the intermediated RP's responsibility? Can you provide evidence of which RP instructed each specific request?"
        dimension: compliance_evidence
      - id: Q6
        text: "How do you demonstrate compliance with the no-storage mandate (VEND-INT-021) to a DPA during an investigation — what evidence can you produce that personal data was deleted immediately after forwarding?"
        dimension: auditability
      - id: Q7
        text: "Does the wallet's DPA reporting interface include the intermediary's identity alongside the intermediated RP's identity, or only one of them? How do you ensure both are visible to the user?"
        dimension: interoperability
      - id: Q8
        text: "If a DPA requests information about all users served on behalf of a specific RP, can you produce this from your audit logs without revealing attribute content (per VEND-INT-018)?"
        dimension: privacy
      - id: Q9
        text: "Do you have a data protection impact assessment (DPIA) covering intermediation activities that can be shared with DPAs upon request?"
        dimension: documentation

  # ============================================================================
  # VEND-INT-032: Dual Certificate Inclusion in Requests
  # Requirement: Include intermediary access certificate and RP registration certificate in requests
  # ============================================================================
  VEND-INT-032:
    questions:
      - id: Q1
        text: "Do you include both your access certificate and the intermediated RP's registration certificate in wallet requests? Is this dual-certificate inclusion implemented for both remote (OID4VP) and proximity (ISO 18013-5) flows?"
        dimension: capability
      - id: Q2
        text: "How do you obtain and maintain RP registration certificates — are they retrieved during RP onboarding (per AS-RP-51-003) and refreshed automatically, or is this a manual process?"
        dimension: lifecycle
      - id: Q3
        text: "What happens when an intermediated RP does not have a registration certificate (e.g., has not registered intended uses)? Do you proceed with only the intermediary's access certificate and warn the wallet?"
        dimension: operational
      - id: Q4
        text: "How are certificate updates (renewal, re-issuance) reflected in ongoing operations? Is there a monitoring mechanism that detects when an RP's registration certificate has been updated or revoked?"
        dimension: lifecycle
      - id: Q5
        text: "For remote presentations (OID4VP), how is the RP's registration certificate included — as a field in the EW-DM-44-018 extension, as a separate JWT claim, or within the request metadata?"
        dimension: technical_implementation
      - id: Q6
        text: "For proximity presentations (ISO 18013-5), how are both certificates included in the reader authentication structure? Are they included as separate certificate entries in the COSE structure?"
        dimension: technical_implementation
      - id: Q7
        text: "How does the wallet use the dual-certificate to perform the AS-RP-51-009 relationship verification — does it inspect the registration certificate directly, or query the Registrar?"
        dimension: interoperability
      - id: Q8
        text: "If the RP's registration certificate is expired or revoked at the time of request, do you detect this and block the request, or do you forward the expired certificate and let the wallet handle it?"
        dimension: security
      - id: Q9
        text: "Do you support serving multiple intermediated RPs concurrently, each with their own registration certificate? How do you ensure the correct RP certificate is included in each request?"
        dimension: architecture

  # ============================================================================
  # VEND-INT-033: Contractual Relationship Registration
  # Requirement: Ensure intermediary-RP contractual relationship is registered
  # ============================================================================
  VEND-INT-033:
    questions:
      - id: Q1
        text: "How do you ensure the intermediary-RP relationship is registered with the Registrar before beginning operations — is there a technical gate that blocks wallet interactions until registration is confirmed?"
        dimension: compliance_monitoring
      - id: Q2
        text: "What legal evidence do you provide to Registrars to establish the relationship (contract, service agreement, authorisation letter)? Does the evidence format vary by Registrar or Member State?"
        dimension: compliance_evidence
      - id: Q3
        text: "How do you handle wallets that cannot verify the registered relationship (AS-RP-51-009 verification failure) — does the transaction proceed with a user warning, or is it blocked entirely?"
        dimension: operational
      - id: Q4
        text: "What is the typical timeline from contract signing to registered relationship — hours, days, or weeks? Is there an SLA with the Registrar for registration processing time?"
        dimension: sla
      - id: Q5
        text: "How do you manage relationship lifecycle changes — onboarding new RPs, updating registration details (e.g., new intended uses), and de-registering terminated RPs? Is the de-registration automated when the contractual relationship ends?"
        dimension: lifecycle
      - id: Q6
        text: "Can you onboard an intermediated RP across multiple Registrars (e.g., if the RP operates in multiple Member States)? How do you manage registration consistency across Registrars?"
        dimension: architecture
      - id: Q7
        text: "How do you handle the scenario where a Registrar rejects the registration (e.g., insufficient evidence)? Is there an appeal mechanism or alternative evidence submission process?"
        dimension: incident_response
      - id: Q8
        text: "If an RP's registration is suspended or revoked by the Registrar (e.g., due to non-compliance), how quickly do you detect this and stop accepting intermediation requests for that RP?"
        dimension: compliance_monitoring
      - id: Q9
        text: "Do you maintain an internal registry of all registered intermediary-RP relationships with their registration status? Is this synchronised with the Registrar in real time or on a polling basis?"
        dimension: technical_implementation

  # ============================================================================
  # VEND-MULTI-01: Multi-Relying-Party Support
  # Requirement: Support multi-relying-party deployments with per-entity isolation
  # Source: corporate-group-rp-registration.md §6.2
  # ============================================================================
  VEND-MULTI-01:
    questions:
      - id: Q1
        text: "How does the platform manage multiple RPACs and RPRCs simultaneously? Are private keys for each entity stored in isolated key containers (separate HSM partitions, separate key vaults), or do they share a key management infrastructure with logical separation only?"
        dimension: security
      - id: Q2
        text: "What data isolation model is enforced between RP tenants — physical isolation (separate databases/instances per entity), logical isolation (shared database with row-level security), or namespace isolation (schema-per-tenant)? How is cross-tenant data leakage prevented in queries, log searches, and API responses?"
        dimension: architecture
      - id: Q3
        text: "Can intended use declarations, data request scopes, privacy policy URLs, and attribute request profiles be configured independently per RP entity? If the platform serves 50 entities each with 3 intended uses (150 configurations), how does the configuration model scale?"
        dimension: operational
      - id: Q4
        text: "How does the platform bind the correct RPRC to each wallet transaction based on the requesting entity? In an intermediary deployment where the intermediary holds RPRCs for multiple End-RPs, what mechanism ensures the right certificate is selected for each request — is this configured per API call, per session, or per endpoint?"
        dimension: technical_implementation
      - id: Q5
        text: "Can each RP entity independently export its own compliance evidence and audit trails without gaining visibility into other entities' data? What access controls ensure a subsidiary's compliance officer can only access that subsidiary's records?"
        dimension: auditability
      - id: Q6
        text: "How does the platform handle certificate lifecycle events during corporate restructuring — mergers, acquisitions, and entity conversions? Can it process certificate revocation for an absorbed entity and re-issuance for the successor entity within the 24-hour revocation notification window (CIR Art. 9(5-6))?"
        dimension: lifecycle
      - id: Q7
        text: "How does multi-RP support interact with the no-storage mandate (Art. 5b(10)) and immediate deletion requirement (VEND-INT-021)? In a multi-tenant deployment, does the deletion pipeline operate per-entity, and how is it verified that no attestation data leaks across tenant boundaries during the transient processing window?"
        dimension: privacy
      - id: Q8
        text: "What is the onboarding process for adding a new RP entity to the platform? How long does it take from registration completion at the national Registrar to the entity being operational on the platform? Is this process automated via the common registration API (ETSI TS 119 475)?"
        dimension: operational
      - id: Q9
        text: "How does the platform enforce the flat two-layer intermediary model mandated by the ARF? If a corporate group has regional hubs between the central intermediary and local subsidiaries, does the platform prevent or detect attempts to configure multi-level delegation chains?"
        dimension: compliance_completeness
