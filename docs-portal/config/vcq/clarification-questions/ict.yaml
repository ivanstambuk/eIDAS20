# ============================================================================
# VCQ Clarification Questions: ICT/DORA Requirements
# Generated by: Opus (Phase 4)
# Date: 2026-01-30
# Enhanced: 2026-02-10 — all questions expanded to 9 per requirement
# ============================================================================
# This file contains clarification questions for vendors providing ICT services
# to DORA-regulated financial entities. Key themes include contractual provisions,
# audit rights, exit strategies, ICT risk management, and incident notification.
# Note: These requirements apply IN ADDITION to eIDAS intermediary requirements
# when the RP is a DORA-regulated financial entity.
# ============================================================================

schemaVersion: 1
sourceFile: requirements/ict.yaml
modelPasses:
  opus: true # Completed 2026-01-30 - All ICT requirements processed
  gemini: true # Completed 2026-01-30 - Gemini review pass finished

requirements:
  # ============================================================================
  # VEND-ICT-001: DORA Article 30 Contractual Provisions
  # Requirement: Include mandatory contractual provisions per DORA Article 30
  # ============================================================================
  VEND-ICT-001:
    questions:
      - id: Q1
        text: "Does your standard contract include all mandatory provisions specified in DORA Article 30(2)(a)-(j)? Can you provide a compliance mapping matrix?"
        dimension: compliance_completeness
      - id: Q2
        text: "How do you document service descriptions, processing locations, and data protection measures in contracts — appendices, schedules, SLA documents?"
        dimension: documentation
      - id: Q3
        text: "Do you have DORA-specific contract templates or amendments for financial entity customers — pre-drafted Article 30(2) clauses?"
        dimension: capability
      - id: Q4
        text: "How do you handle contract negotiations when the organisation requires DORA-specific clauses — are there non-negotiable terms?"
        dimension: flexibility
      - id: Q5
        text: "Are processing locations documented and subject to approval by the financial entity — including change notification obligations for location moves?"
        dimension: geographic_scope
      - id: Q6
        text: "Does your internal governance follow the 'three lines of defence' model (operations, risk management, internal audit) as expected by DORA?"
        dimension: governance
      - id: Q7
        text: "How do you handle the dual regulatory regime — contracts that must satisfy both eIDAS intermediary requirements (including Article 45h functional separation obligations) and DORA Article 30 ICT provisions simultaneously? Is there a unified compliance mapping?"
        dimension: compliance_completeness
      - id: Q8
        text: "What is your contract amendment process when DORA regulatory technical standards (RTS) are updated — proactive customer notification, mandatory re-negotiation?"
        dimension: lifecycle
      - id: Q9
        text: "Have you engaged external legal counsel specialised in DORA to review your standard contract templates? When was the last review?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-ICT-002: Audit Rights
  # Requirement: Provide audit rights as required by DORA Article 30(2)(e)
  # ============================================================================
  VEND-ICT-002:
    questions:
      - id: Q1
        text: "Do you grant full access, inspection, and audit rights to the financial entity and their supervisory authority as required by Article 30(2)(e)?"
        dimension: compliance_completeness
      - id: Q2
        text: "What is the notice period required for audit requests — standard vs expedited for supervisory authority inspections?"
        dimension: sla
      - id: Q3
        text: "Are on-site audits supported, or only remote/third-party audits? Do you restrict any areas from on-site inspection?"
        dimension: operational
      - id: Q4
        text: "How do you facilitate GDPR Article 28(3)(h) audit requirements in addition to DORA — integrated audit process or separate tracks?"
        dimension: compliance_completeness
      - id: Q5
        text: "What audit reports or certifications can you provide proactively — SOC 2 Type II, ISO 27001, ISAE 3402, C5? How current are they?"
        dimension: compliance_evidence
      - id: Q6
        text: "Are there any restrictions on audit scope or frequency — capped number of audits per year, excluded systems, confidentiality constraints?"
        dimension: limitations
      - id: Q7
        text: "Do you provide a 'Standard Audit Report' that specifically maps your internal controls to DORA Articles 28-30 requirements?"
        dimension: reporting
      - id: Q8
        text: "Do you support pooled auditing arrangements where multiple financial entities commission a single audit to reduce operational burden?"
        dimension: efficiency
      - id: Q9
        text: "What is the process for handling audit findings — remediation timeline, follow-up verification, customer notification of resolution?"
        dimension: incident_response

  # ============================================================================
  # VEND-ICT-003: Exit Strategies and Transition Planning
  # Requirement: Support exit strategies and transition planning
  # ============================================================================
  VEND-ICT-003:
    questions:
      - id: Q1
        text: "What transition period do you guarantee during contract termination — minimum months, SLA during transition, service continuity commitment?"
        dimension: sla
      - id: Q2
        text: "What data migration assistance do you provide during exit — tools, personnel, documentation, dedicated migration team?"
        dimension: capability
      - id: Q3
        text: "Do you continue providing services at the same quality level during the transition to an alternative provider — no degradation clause?"
        dimension: operational
      - id: Q4
        text: "In what formats can data be exported for migration — standard formats (JSON, CSV, XML), API-based export, database dump? Are proprietary formats avoided?"
        dimension: interoperability
      - id: Q5
        text: "What is the cost model for exit support services — included in contract, additional fees, capped costs, per-hour rates?"
        dimension: commercial
      - id: Q6
        text: "Have you executed successful transitions for previous financial entity customers? Can you provide references or case studies?"
        dimension: experience
      - id: Q7
        text: "Do you support periodic exit plan testing as expected by DORA — dry-run migrations, data export verification, timeline validation?"
        dimension: compliance_monitoring
      - id: Q8
        text: "What anti-lock-in measures are in place — open standards, documented APIs, no contractual barriers to switching?"
        dimension: flexibility
      - id: Q9
        text: "How do you handle data deletion/return upon exit completion — certified deletion, proof of destruction, retention for regulatory requirements?"
        dimension: security

  # ============================================================================
  # VEND-ICT-004: ICT Risk Management Participation
  # Requirement: Participate in the financial entity's ICT risk management framework
  # ============================================================================
  VEND-ICT-004:
    questions:
      - id: Q1
        text: "How do you cooperate with the organisation's ICT risk management program per Article 28(1) — dedicated risk liaison, regular risk reviews, joint workshops?"
        dimension: operational
      - id: Q2
        text: "Do you participate in the organisation's risk assessments and control testing — annual risk assessments, quarterly control testing, ad-hoc assessments?"
        dimension: compliance_monitoring
      - id: Q3
        text: "How do you support the organisation's remediation activities when control gaps are identified — remediation timeline, tracking, verification?"
        dimension: incident_response
      - id: Q4
        text: "What risk reporting do you provide to support the organisation's risk framework — risk dashboards, KRI reports, vulnerability scan summaries?"
        dimension: documentation
      - id: Q5
        text: "Can the organisation integrate your service risk data into their own risk monitoring tools — API feeds, SIEM integration, GRC platform connectors?"
        dimension: interoperability
      - id: Q6
        text: "Do you provide service-level risk assessments — risk register entries per service, control effectiveness ratings, residual risk levels?"
        dimension: documentation
      - id: Q7
        text: "How do you handle the cost and effort of risk management cooperation — included in service fee, separately costed, capped effort?"
        dimension: commercial
      - id: Q8
        text: "What threat intelligence do you share with financial entity customers — sector-specific threats, zero-day notifications, incident patterns?"
        dimension: security
      - id: Q9
        text: "How frequently do you update your own ICT risk assessment — at least annually, after material changes, continuous monitoring?"
        dimension: lifecycle

  # ============================================================================
  # VEND-ICT-005: Register of ICT TPPs Information
  # Requirement: Provide information required for the financial entity's Register of ICT TPPs
  # ============================================================================
  VEND-ICT-005:
    questions:
      - id: Q1
        text: "What entity details do you provide for inclusion in the organisation's ICT TPP register per Article 28(3) — full legal name, LEI, registered office, contact details?"
        dimension: documentation
      - id: Q2
        text: "Do you provide criticality assessments for your services — service-level criticality classification, dependency analysis, substitutability rating?"
        dimension: compliance_completeness
      - id: Q3
        text: "How do you notify the organisation when register information changes — proactive notification, change triggers, notification timeline?"
        dimension: lifecycle
      - id: Q4
        text: "What contractual terms summary do you provide for registry purposes — contract dates, renewal terms, termination provisions?"
        dimension: documentation
      - id: Q5
        text: "How frequently do you update the information provided — annual refresh, event-driven updates, real-time?"
        dimension: sla
      - id: Q6
        text: "Do you disclose your subcontractor chain for registry purposes — sub-processor names, services, locations, criticality?"
        dimension: supply_chain
      - id: Q7
        text: "Do you provide information in a standardised format compatible with regulatory reporting requirements — ESA templates, structured data?"
        dimension: interoperability
      - id: Q8
        text: "How do you handle confidentiality concerns when providing registry information — NDA provisions, aggregated vs detailed data?"
        dimension: security
      - id: Q9
        text: "Can you provide a pre-filled ICT TPP registry template that financial entity customers can integrate directly into their registers?"
        dimension: operational

  # ============================================================================
  # VEND-ICT-006: Due Diligence Support
  # Requirement: Support due diligence assessment before contract signing
  # ============================================================================
  VEND-ICT-006:
    questions:
      - id: Q1
        text: "What financial stability information do you provide for due diligence per Article 29(1) — annual reports, credit ratings, parent company guarantees?"
        dimension: documentation
      - id: Q2
        text: "How do you demonstrate ICT risk management capabilities — documented policies, risk framework maturity assessment, control self-assessments?"
        dimension: compliance_evidence
      - id: Q3
        text: "What compliance posture evidence can you provide — SOC 2 Type II, ISO 27001, C5, ISAE 3402, DORA-specific assessment?"
        dimension: compliance_evidence
      - id: Q4
        text: "Do you have a standard due diligence package for financial entity prospects — pre-compiled document bundle, self-service portal?"
        dimension: operational
      - id: Q5
        text: "How do you respond to security questionnaire/RFI processes — typical turnaround time, dedicated team, automated responses?"
        dimension: operational
      - id: Q6
        text: "Can existing financial entity customers provide references — number of financial entity customers, reference programme?"
        dimension: experience
      - id: Q7
        text: "Do you support ongoing due diligence — periodic reassessment support, proactive updates on material changes, annual DD refresh?"
        dimension: lifecycle
      - id: Q8
        text: "What penetration testing and vulnerability assessment results can you share — scope, frequency, remediation status, third-party vs internal?"
        dimension: security
      - id: Q9
        text: "How do you handle negative due diligence findings — remediation commitment, timeline, re-assessment process?"
        dimension: incident_response

  # ============================================================================
  # VEND-ICT-007: ICT Incident Notification
  # Requirement: Notify the financial entity of ICT-related incidents
  # ============================================================================
  VEND-ICT-007:
    questions:
      - id: Q1
        text: "What is your incident notification timeline — how quickly after detection do you notify affected financial entity customers? Is it within the 4-hour window for major incidents per the DORA RTS on ICT incident classification (Commission Delegated Regulation 2024/1772)?"
        dimension: sla
      - id: Q2
        text: "What channels are used for incident notification — email, phone, ticketing system, status page, API webhook?"
        dimension: operational
      - id: Q3
        text: "Do you support integration with the organisation's SIEM or security monitoring tools for automated alerting — API feeds, syslog, STIX/TAXII?"
        dimension: interoperability
      - id: Q4
        text: "What information is included in incident notifications — classification, affected services, estimated impact, timeline, remediation steps?"
        dimension: documentation
      - id: Q5
        text: "How do you support the organisation's own regulatory incident reporting obligations under DORA — data for supervisory authority reports?"
        dimension: regulatory_access
      - id: Q6
        text: "Do you provide root cause analysis and remediation plans after incidents — timeline for RCA delivery, preventive measures, lessons learned?"
        dimension: incident_response
      - id: Q7
        text: "How do you classify 'Major ICT Incidents' under DORA — criteria alignment with DORA RTS, escalation triggers, automated classification?"
        dimension: compliance_monitoring
      - id: Q8
        text: "Is incident assistance provided at no additional cost per Article 30(2)(f) — scope of free assistance, cost boundaries for extended support?"
        dimension: commercial
      - id: Q9
        text: "Do you conduct post-incident reviews with affected customers — joint lessons learned, control improvement programmes, recurrence prevention?"
        dimension: operational

  # ============================================================================
  # VEND-ICT-008: Threat-Led Penetration Testing (TLPT)
  # Requirement: Participate in threat-led penetration testing if required
  # ============================================================================
  VEND-ICT-008:
    questions:
      - id: Q1
        text: "Do you support customer-initiated threat-led penetration testing (TLPT) per Article 26(4) — full scope or limited? Any excluded systems?"
        dimension: capability
      - id: Q2
        text: "What is the advance notice required for TLPT participation — scheduling constraints, blackout periods, coordination requirements?"
        dimension: operational
      - id: Q3
        text: "Are there scope limitations on penetration testing of your systems — shared infrastructure exclusions, customer data isolation requirements?"
        dimension: limitations
      - id: Q4
        text: "How do you handle remediation of vulnerabilities discovered during TLPT — remediation timeline commitments, re-testing, customer notification?"
        dimension: incident_response
      - id: Q5
        text: "Do you conduct your own regular penetration testing — frequency, scope, accredited testers, results available to customers?"
        dimension: compliance_evidence
      - id: Q6
        text: "Can TLPT results be shared with the organisation's supervisory authority as required by DORA?"
        dimension: regulatory_access
      - id: Q7
        text: "Do you support 'pooled TLPT' per Article 26(4) where multiple financial entities coordinate a single test to reduce operational burden?"
        dimension: efficiency
      - id: Q8
        text: "Are you familiar with the TIBER-EU framework that informed DORA's TLPT requirements under Article 26? Have you participated in TIBER tests before, and are you aligning your testing procedures to the DORA TLPT technical standards?"
        dimension: experience
      - id: Q9
        text: "How do you ensure TLPT does not disrupt live services — production safeguards, rollback procedures, incident response standby?"
        dimension: security

  # ============================================================================
  # VEND-ICT-009: Business Continuity
  # Requirement: Maintain business continuity arrangements for ICT services
  # ============================================================================
  VEND-ICT-009:
    questions:
      - id: Q1
        text: "What is your service availability SLA for financial entity customers — uptime percentage, planned maintenance windows, measurement methodology?"
        dimension: sla
      - id: Q2
        text: "What disaster recovery capabilities do you maintain — RTO and RPO by service tier, automatic failover, manual recovery procedures?"
        dimension: capability
      - id: Q3
        text: "How frequently are business continuity plans tested per Article 30(2)(g) — at least annually, frequency, scope of tests?"
        dimension: compliance_monitoring
      - id: Q4
        text: "Where are backup facilities located — geographic redundancy, EU data sovereignty, distance from primary site?"
        dimension: geographic_scope
      - id: Q5
        text: "Do you provide business continuity test results to customers — detailed reports, summary, pass/fail, corrective actions?"
        dimension: compliance_evidence
      - id: Q6
        text: "What was the outcome of your last disaster recovery test — full success, identified issues, remediation status?"
        dimension: experience
      - id: Q7
        text: "Do you conduct specific scenario-based testing — ransomware, physical destruction, cloud provider outage, key personnel loss, multi-service failure?"
        dimension: resilience
      - id: Q8
        text: "Do you support joint BC/DR testing exercises with financial entity customers — coordinated testing, communication protocol verification?"
        dimension: operational
      - id: Q9
        text: "How do you align your BC/DR capabilities with the financial entity's own continuity requirements — recovery priority coordination, dependency mapping?"
        dimension: interoperability

  # ============================================================================
  # VEND-ICT-010: Subcontracting Approval
  # Requirement: Obtain approval for subcontracting of critical functions
  # ============================================================================
  VEND-ICT-010:
    questions:
      - id: Q1
        text: "Do you use subcontractors for any part of the ICT service — which components, which providers, service criticality per subcontractor?"
        dimension: supply_chain
      - id: Q2
        text: "How do you obtain prior approval from the organisation before engaging subcontractors per Article 30(2)(d) — specific vs general authorisation?"
        dimension: compliance_monitoring
      - id: Q3
        text: "How do you ensure subcontractors meet equivalent security and compliance requirements — flow-down clauses, independent assessment, certification requirements?"
        dimension: supply_chain
      - id: Q4
        text: "What visibility does the organisation have into your subcontractor chain — full chain disclosure, material subcontractors only, tiered visibility?"
        dimension: auditability
      - id: Q5
        text: "Can the organisation reject specific subcontractors — contractual right of objection, alternative arrangements if rejected?"
        dimension: flexibility
      - id: Q6
        text: "How are subcontractor changes communicated to the organisation — advance notification timeline, right to object before engagement?"
        dimension: lifecycle
      - id: Q7
        text: "Do audit rights flow down to subcontractors per GDPR Article 28(2) — can the financial entity audit your sub-processors?"
        dimension: compliance_completeness
      - id: Q8
        text: "Who retains liability for subcontractor failures — primary ICT TPP remains fully responsible, or shared liability?"
        dimension: commercial
      - id: Q9
        text: "How do you handle subcontractor incidents — notification chain, coordination, RCA that includes subcontractor root causes?"
        dimension: incident_response

  # ============================================================================
  # VEND-ICT-011: Concentration Risk Information
  # Requirement: Provide information for concentration risk assessment
  # ============================================================================
  VEND-ICT-011:
    questions:
      - id: Q1
        text: "Can you disclose the approximate number of financial entities using your services per Article 28(4) — by sector (banking, insurance, investment)?"
        dimension: documentation
      - id: Q2
        text: "What information do you provide on interdependencies with other ICT providers — cloud providers, DNS, CDN, payment networks, data centre operators?"
        dimension: supply_chain
      - id: Q3
        text: "How do you support the organisation's concentration risk analysis — data provided, analysis tools, standardised risk assessment templates?"
        dimension: compliance_monitoring
      - id: Q4
        text: "Do you have single points of failure that could affect multiple financial entities — shared infrastructure, common dependencies, correlated risks?"
        dimension: architecture
      - id: Q5
        text: "What is your geographic distribution of infrastructure — number and location of data centres, edge nodes, processing regions?"
        dimension: geographic_scope
      - id: Q6
        text: "How substitutable is your service — are there alternative providers, what is the estimated switching effort/time, open standard compatibility?"
        dimension: flexibility
      - id: Q7
        text: "Do you anticipate being designated as a Critical ICT TPP under Article 31 — based on the designation criteria in Article 31(2): systemic character, degree of substitutability, number of financial entities served, and cross-border nature of services?"
        dimension: roadmap
      - id: Q8
        text: "How do you mitigate concentration risk within your own supply chain — multi-cloud strategy, redundant DNS, diverse network providers?"
        dimension: security
      - id: Q9
        text: "What is your market share in the relevant service category for EUDI Wallet intermediary services — are you a dominant provider?"
        dimension: commercial

  # ============================================================================
  # VEND-ICT-012: Critical ICT TPP Oversight
  # Requirement: Comply with enhanced oversight if designated as Critical ICT TPP
  # ============================================================================
  VEND-ICT-012:
    questions:
      - id: Q1
        text: "Are you currently designated as a Critical ICT Third-Party Provider (CTPP) by the ESAs per Article 31? If so, when was the designation?"
        dimension: regulatory_status
      - id: Q2
        text: "If designated, who is your Lead Overseer (EBA, ESMA, or EIOPA)? What is the current status of oversight activities?"
        dimension: regulatory_access
      - id: Q3
        text: "What additional oversight measures do you support for designated CTPPs — general investigations, on-site inspections, regular reporting?"
        dimension: compliance_completeness
      - id: Q4
        text: "Do you anticipate designation as a CTPP in the future — based on Art. 31(2) criteria (systemic importance, substitutability, cross-border dependency)?"
        dimension: roadmap
      - id: Q5
        text: "How would CTPP designation affect the organisation's use of your services — additional reporting requirements, enhanced oversight, service continuity?"
        dimension: operational
      - id: Q6
        text: "Have you received any recommendations from the Lead Overseer? What was the response and remediation timeline?"
        dimension: compliance_history
      - id: Q7
        text: "How do you prepare for potential CTPP designation — pre-emptive compliance measures, governance enhancements, reporting infrastructure?"
        dimension: readiness
      - id: Q8
        text: "What additional costs or operational impacts would CTPP designation have on financial entity customers — pass-through costs, additional compliance requirements?"
        dimension: commercial
      - id: Q9
        text: "Do you participate in industry forums or working groups on DORA CTPP oversight — shaping the oversight framework, sharing best practices?"
        dimension: governance
