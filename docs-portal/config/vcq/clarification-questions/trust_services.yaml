# ============================================================================
# VCQ Clarification Questions: Trust Services Requirements
# Generated by: Opus (Phase 5)
# Date: 2026-01-30
# Enhanced: 2026-02-10 — all questions expanded to 9 per requirement
# ============================================================================
# This file contains clarification questions for vendors providing qualified
# trust services (QTSP). Key themes include QTSP status, conformity assessment,
# QSCDs, security breach notification, remote signing, QEAAs, and liability.
# ============================================================================

schemaVersion: 1
sourceFile: requirements/trust_services.yaml
modelPasses:
  opus: true # Completed 2026-01-30 - All trust services requirements processed
  gemini: true # Completed 2026-01-30 - Gemini review pass finished

requirements:
  # ============================================================================
  # VEND-TSP-001: QTSP Status
  # Requirement: Obtain and maintain qualified trust service provider (QTSP) status
  # ============================================================================
  VEND-TSP-001:
    questions:
      - id: Q1
        text: "Do you hold QTSP status from an EU Member State conformity assessment body? Can you provide the qualification decision document?"
        dimension: compliance_evidence
      - id: Q2
        text: "Which Member State issued your QTSP status, and are you listed on their national Trusted List? Can you provide the Trusted List URI?"
        dimension: geographic_scope
      - id: Q3
        text: "Which qualified trust services does your QTSP status cover — QES, QSeal, QEAA, QTS, QERDS, QWAC? Is each service type separately qualified?"
        dimension: capability
      - id: Q4
        text: "How long have you maintained QTSP status? What is your track record of continuous qualification without suspension?"
        dimension: experience
      - id: Q5
        text: "Have you ever had QTSP status suspended or revoked? If so, what were the circumstances and what corrective actions were taken?"
        dimension: compliance_history
      - id: Q6
        text: "Is your QTSP status recognised cross-border via the LOTL (List of Trusted Lists) chain? Have you verified recognition in other Member States?"
        dimension: interoperability
      - id: Q7
        text: "How do you ensure continuous compliance between conformity assessments — internal audit programme, continuous monitoring, policy reviews?"
        dimension: compliance_monitoring
      - id: Q8
        text: "What is your process for extending QTSP status to cover new trust service types — separate qualification process, incremental assessment?"
        dimension: lifecycle
      - id: Q9
        text: "Do you hold equivalent certifications in addition to QTSP status — ISO 27001, SOC 2, ETSI EN 319 401? How do these complement your QTSP qualification?"
        dimension: compliance_evidence

  # ============================================================================
  # VEND-TSP-002: Conformity Assessment
  # Requirement: Undergo regular conformity assessment (at least every 24 months)
  # ============================================================================
  VEND-TSP-002:
    questions:
      - id: Q1
        text: "When was your last conformity assessment, and who conducted it? Is the CAB accredited under Regulation (EC) No 765/2008 for the relevant scope?"
        dimension: compliance_evidence
      - id: Q2
        text: "What was the outcome of your most recent conformity assessment — full conformity, conformity with observations, or non-conformity findings?"
        dimension: compliance_evidence
      - id: Q3
        text: "Were there any findings or non-conformities? What corrective actions were taken and within what timeframe?"
        dimension: compliance_history
      - id: Q4
        text: "When is your next conformity assessment scheduled? Is it within the 24-month maximum interval from the last assessment?"
        dimension: lifecycle
      - id: Q5
        text: "Can you share the conformity assessment report (or a summary) with the organisation? Are there restrictions on report distribution?"
        dimension: documentation
      - id: Q6
        text: "What is the scope of your conformity assessment — does it cover all qualified trust services you provide, including any recently added services?"
        dimension: compliance_completeness
      - id: Q7
        text: "Has the supervisory body ever requested an additional assessment outside the regular 24-month cycle? If so, what triggered it?"
        dimension: compliance_history
      - id: Q8
        text: "How do you prepare for conformity assessments — pre-audit internal reviews, gap analysis, evidence collection procedures?"
        dimension: operational
      - id: Q9
        text: "Does your conformity assessment explicitly cover EUDI Wallet ecosystem trust services (QEAA issuance, access certificate authority) in addition to traditional QES/QSeal?"
        dimension: compliance_completeness

  # ============================================================================
  # VEND-TSP-003: Supervisory Notification of Changes
  # Requirement: Notify supervisory body of changes affecting qualified status
  # ============================================================================
  VEND-TSP-003:
    questions:
      - id: Q1
        text: "What process do you have for notifying your supervisory body of significant changes — formal change notification procedure, designated contact, templated reports?"
        dimension: compliance_monitoring
      - id: Q2
        text: "What types of changes trigger notification — organisational (ownership, mergers), technical (infrastructure, algorithms), security (breaches, policy), personnel (CISO, DPO)?"
        dimension: operational
      - id: Q3
        text: "How do you also notify customers when changes may affect the organisation's use of your services — advance notice periods, communication channels?"
        dimension: lifecycle
      - id: Q4
        text: "How quickly after a change do you notify the supervisory body — 'without undue delay' as interpreted in your jurisdiction, or specific SLA?"
        dimension: sla
      - id: Q5
        text: "Do you maintain a standing regular cadence with your Supervisory Body beyond mandatory incident reporting — annual reviews, quarterly updates?"
        dimension: governance
      - id: Q6
        text: "How do you determine whether a change is 'significant' enough to trigger notification — risk assessment criteria, materiality threshold, legal advice?"
        dimension: operational
      - id: Q7
        text: "Do you maintain a change register that logs all notifiable events — date, nature of change, notification status, supervisory body response?"
        dimension: auditability
      - id: Q8
        text: "How do you handle situations where a change is deemed significant by the supervisory body but was not notified — remediation process, penalty risk?"
        dimension: incident_response
      - id: Q9
        text: "What is your process if the supervisory body requests additional information or imposes conditions following a change notification?"
        dimension: governance

  # ============================================================================
  # VEND-TSP-004: Qualified Signature/Seal Creation Devices (QSCDs)
  # Requirement: Use qualified electronic signature/seal creation devices (QSCDs)
  # ============================================================================
  VEND-TSP-004:
    questions:
      - id: Q1
        text: "What QSCDs do you use for qualified signature and seal creation — specific make/model, certification level (Common Criteria EAL4+ with AVA_VAN.5 per IR 2025/1567 Art 3)? Are they listed in the EU compilation of certified QSCDs?"
        dimension: technical_implementation
      - id: Q2
        text: "Are your QSCDs certified per Annex II of eIDAS? By which certification body, and for which product version and configuration?"
        dimension: compliance_evidence
      - id: Q3
        text: "Do you support Bring Your Own Key (BYOK) for organisations that want to control their own signing keys within your QSCDs? What are the constraints?"
        dimension: flexibility
      - id: Q4
        text: "What physical and logical access controls protect QSCDs — multi-factor authentication, biometric access, secure facility requirements?"
        dimension: security
      - id: Q5
        text: "Do you require multi-person approval (quorum, e.g., M-of-N) for sensitive QSCD operations — key generation, key backup, firmware updates?"
        dimension: security
      - id: Q6
        text: "How do you manage QSCD lifecycle — procurement from certified manufacturers, secure provisioning, firmware updates, decommissioning, key destruction?"
        dimension: lifecycle
      - id: Q7
        text: "Do you use local QSCDs (smart cards, USB tokens) or remote QSCDs (server-side HSMs)? If remote, how do you ensure sole control (see VEND-TSP-009)?"
        dimension: architecture
      - id: Q8
        text: "How do you handle QSCD certificate expiry or invalidation — planned replacement schedule, emergency procedures, continuity during transition?"
        dimension: operational
      - id: Q9
        text: "What monitoring and alerting is in place for QSCD health — tamper detection, firmware integrity, capacity utilisation, performance degradation?"
        dimension: operational

  # ============================================================================
  # VEND-TSP-005: Signature Creation Data Protection
  # Requirement: Protect signature/seal creation data against duplication and theft
  # ============================================================================
  VEND-TSP-005:
    questions:
      - id: Q1
        text: "What measures protect electronic signature creation data (private keys) from duplication — HSM-backed generation, no-export configuration, hardware boundary enforcement?"
        dimension: security
      - id: Q2
        text: "What theft prevention controls are in place — secure facilities, multi-zone access control, personnel vetting, segregation of duties?"
        dimension: security
      - id: Q3
        text: "How do you detect and respond to unauthorised access attempts — real-time monitoring, intrusion detection, automated lockout, tamper-evident seals?"
        dimension: incident_response
      - id: Q4
        text: "What audit logging exists for signature creation operations — per-operation logs, tamper-proof storage, retention period, access controls on logs?"
        dimension: auditability
      - id: Q5
        text: "Are signature creation operations monitored in real-time — SIEM integration, anomaly detection, rate limiting, geographic restrictions?"
        dimension: security
      - id: Q6
        text: "How is key backup handled — encrypted split-knowledge backup, geographically distributed, M-of-N recovery, catastrophic loss procedures?"
        dimension: operational
      - id: Q7
        text: "What is your key compromise recovery plan — detection indicators, revocation timeline, re-issuance procedures, customer notification?"
        dimension: incident_response
      - id: Q8
        text: "How do you ensure keys never exist outside the HSM boundary — key generation ceremony procedures, proof of generation within HSM?"
        dimension: compliance_evidence
      - id: Q9
        text: "Do you perform regular penetration testing specifically targeting signature creation infrastructure — scope, frequency, third-party vs internal?"
        dimension: security

  # ============================================================================
  # VEND-TSP-006: Disaster Recovery and Business Continuity
  # Requirement: Maintain disaster recovery and business continuity capabilities
  # ============================================================================
  VEND-TSP-006:
    questions:
      - id: Q1
        text: "What is your Recovery Time Objective (RTO) for trust services — is it specified per service type (QES, QEAA, QTS)?"
        dimension: sla
      - id: Q2
        text: "What is your Recovery Point Objective (RPO) for trust service data — maximum data loss window, per-service specification?"
        dimension: sla
      - id: Q3
        text: "How frequently are disaster recovery procedures tested — at least annually? Are results documented and shared with the supervisory body?"
        dimension: compliance_monitoring
      - id: Q4
        text: "Where are your backup facilities located — geographic redundancy across different regions/countries, automatic failover capability?"
        dimension: geographic_scope
      - id: Q5
        text: "What was the outcome of your last disaster recovery test — full success, partial, any issues identified and remediated?"
        dimension: compliance_evidence
      - id: Q6
        text: "Do you have a documented termination plan per Article 24(2)(h) to ensure service continuity if you cease operations?"
        dimension: lifecycle
      - id: Q7
        text: "Does your termination plan include provisions for transfer of revocation lists and OCSP services to a Trusted Archivist to ensure long-term verifiability of past signatures?"
        dimension: lifecycle
      - id: Q8
        text: "What is your real-time data replication strategy — synchronous, asynchronous, near-real-time? How do you handle WAN latency and consistency?"
        dimension: technical_implementation
      - id: Q9
        text: "How do you handle HSM key material in DR scenarios — key backup across sites, HSM cluster failover, secure key migration procedures?"
        dimension: security

  # ============================================================================
  # VEND-TSP-007: Security Breach Notification
  # Requirement: Notify supervisory body of security breaches within 24 hours
  # ============================================================================
  VEND-TSP-007:
    questions:
      - id: Q1
        text: "What is your process for detecting and classifying security breaches — classification levels (critical/high/medium/low), triage criteria, automated detection?"
        dimension: incident_response
      - id: Q2
        text: "How do you ensure supervisory body notification within 24 hours — on-call procedures, pre-drafted notification templates, designated contact points?"
        dimension: sla
      - id: Q3
        text: "Have you experienced any security breaches affecting trust services in the past 3 years? If so, what was the nature and impact?"
        dimension: compliance_history
      - id: Q4
        text: "How do you notify affected customers of security breaches — communication channels, timeline, content (scope, impact, remediation steps)?"
        dimension: incident_response
      - id: Q5
        text: "What post-incident remediation and review processes do you follow — root cause analysis, corrective actions, lessons learned, process improvements?"
        dimension: incident_response
      - id: Q6
        text: "How do you determine whether a breach has 'significant impact' per Article 19(2) — impact assessment criteria, number of affected users, service disruption threshold?"
        dimension: operational
      - id: Q7
        text: "How do you handle the parallel GDPR Article 33 notification requirement (72 hours to DPA) if personal data is involved in the breach?"
        dimension: compliance_completeness
      - id: Q8
        text: "What is the content of your supervisory body notification — nature/scope of breach, detection time, affected systems, user count, measures taken?"
        dimension: documentation
      - id: Q9
        text: "Do you conduct regular breach simulation exercises (tabletop or live) to test your notification procedures and response times?"
        dimension: operational

  # ============================================================================
  # VEND-TSP-008: Remote Qualified Signature (TS8)
  # Requirement: Implement secure remote signature creation (TS8) if offering remote QES
  # ============================================================================
  VEND-TSP-008:
    questions:
      - id: Q1
        text: "Do you offer remote qualified electronic signature services? If so, what is the volume of remote signatures processed monthly?"
        dimension: capability
      - id: Q2
        text: "How do you implement the remote signature creation protocols specified in TS8 — Signature Activation Protocol (SAP), server-side QSCD management, transport encryption? Per the EC eSignature manual, do you support both 'wallet-driven' (user initiates in wallet) and 'RP-driven' (service portal initiates) signature flows?"
        dimension: technical_implementation
      - id: Q3
        text: "How is signature creation data (private keys) securely managed on behalf of signatories — HSM partition per signatory, shared HSM with logical separation, key lifecycle?"
        dimension: security
      - id: Q4
        text: "What authentication mechanisms are used to authorise remote signature creation — multi-factor (knowledge + possession + inherence), mobile app binding, OTP tokens?"
        dimension: security
      - id: Q5
        text: "Is your remote signing implementation certified by a conformity assessment body? Does the certification scope explicitly cover EUDI Wallet-initiated signing (not only traditional web-portal-initiated signing)?"
        dimension: compliance_evidence
      - id: Q6
        text: "Is your specific implementation of 'Sole Control' (e.g., mobile app binding, WSCD-backed SAP per EN 419 241-2) explicitly named in your Conformity Assessment Report? Can you provide the relevant extract?"
        dimension: compliance_evidence
      - id: Q7
        text: "What session security measures are in place — session binding, timeout policies, re-authentication triggers, replay attack prevention?"
        dimension: security
      - id: Q8
        text: "How do you handle signatory onboarding for remote signing — identity verification, key generation ceremony, activation code delivery?"
        dimension: operational
      - id: Q9
        text: "What availability SLA do you provide for remote signing services — uptime percentage, planned maintenance windows, geographic redundancy?"
        dimension: sla

  # ============================================================================
  # VEND-TSP-009: Sole Control Assurance
  # Requirement: Obtain sole control assurance for remote signing operations
  # ============================================================================
  VEND-TSP-009:
    questions:
      - id: Q1
        text: "How do you ensure the signatory has sole control over the signature creation process — can you prove that even the QTSP itself cannot trigger signature creation without signatory authorisation?"
        dimension: security
      - id: Q2
        text: "What multi-factor authentication is required before signature creation — which factors (knowledge, possession, inherence), which specific mechanisms?"
        dimension: technical_implementation
      - id: Q3
        text: "How is explicit consent obtained for each signature operation — per-document consent, batch consent (if allowed), consent UI design?"
        dimension: user_experience
      - id: Q4
        text: "What audit trail exists for sole control verification — per-operation logs linking signatory authentication to signature creation, tamper-proof storage?"
        dimension: auditability
      - id: Q5
        text: "Is your sole control mechanism certified or audited by a CAB — specific standard (EN 419 241), certification level, validity period?"
        dimension: compliance_evidence
      - id: Q6
        text: "How do you prevent session hijacking or replay attacks against the sole control mechanism — session binding, nonce-based activation, time-limited SADs?"
        dimension: security
      - id: Q7
        text: "How do you handle sole control in batch signing scenarios — is per-document consent required, or can a signatory pre-authorise a batch?"
        dimension: operational
      - id: Q8
        text: "What is the user experience for sole control — number of interaction steps, average time to complete a signature, mobile vs desktop?"
        dimension: user_experience
      - id: Q9
        text: "How do you handle lost or compromised authentication factors — key recovery procedures, signatory re-enrolment, temporary signing block?"
        dimension: incident_response

  # ============================================================================
  # VEND-TSP-010: WYSIWYS Support
  # Requirement: Support WYSIWYS (What You See Is What You Sign) for document signing
  # ============================================================================
  VEND-TSP-010:
    questions:
      - id: Q1
        text: "How do you present document content to signers before authorisation (WYSIWYS) — full document rendering, scrollable view, zoom capability?"
        dimension: user_experience
      - id: Q2
        text: "What document formats are supported for WYSIWYS rendering — PDF, XML, Office documents? How do you handle format-specific rendering challenges?"
        dimension: interoperability
      - id: Q3
        text: "How do you handle documents with dynamic content or hidden elements — JavaScript, macros, external references? Are these disabled or flagged?"
        dimension: security
      - id: Q4
        text: "Can signers scroll and review entire documents before signing — is there a mechanism to ensure the signer has viewed all pages?"
        dimension: user_experience
      - id: Q5
        text: "How do you ensure the signed document matches what was displayed — hash verification between rendered view and signed data?"
        dimension: security
      - id: Q6
        text: "How do you handle accessibility requirements — screen reader compatibility, contrast, font sizes, keyboard navigation?"
        dimension: user_experience
      - id: Q7
        text: "How do you render documents on mobile devices — responsive rendering, pinch-to-zoom, portrait/landscape orientation handling?"
        dimension: user_experience
      - id: Q8
        text: "Do you support annotation or markup on documents before signing — signature position, date stamp, comments?"
        dimension: capability
      - id: Q9
        text: "How do you handle multi-party signing — sequential presentation to each signer, visibility of other signers' signatures, countersigning?"
        dimension: operational

  # ============================================================================
  # VEND-TSP-011: Qualified Timestamps
  # Requirement: Issue qualified timestamps from a trusted time source
  # ============================================================================
  VEND-TSP-011:
    questions:
      - id: Q1
        text: "Do you offer qualified electronic timestamp services? What is the volume of timestamps issued per day?"
        dimension: capability
      - id: Q2
        text: "What time source do you use, and is it traceable to UTC — national metrology institute, GPS/GNSS, NTP stratum 1? How many redundant sources?"
        dimension: technical_implementation
      - id: Q3
        text: "What is the accuracy of your timestamps — within ±1 second of UTC, or tighter? How do you verify and document accuracy?"
        dimension: sla
      - id: Q4
        text: "How do you ensure timestamp data cannot be modified undetectably — tamper-evident logging, HSM-protected signing, hash chain integrity?"
        dimension: security
      - id: Q5
        text: "What is the availability SLA for your timestamp authority — uptime percentage, geographic redundancy, maximum response time?"
        dimension: sla
      - id: Q6
        text: "Do you support long-term validation (LTV) — archival timestamp chains, re-timestamping services for signatures approaching algorithm deprecation?"
        dimension: lifecycle
      - id: Q7
        text: "What signing algorithm do you use for timestamps — RSA-PSS, ECDSA P-256/P-384, EdDSA Ed25519? Is PQC on your roadmap for timestamp signing (e.g., ML-DSA per NIST FIPS 204, SLH-DSA per NIST FIPS 205)?"
        dimension: technical_implementation
      - id: Q8
        text: "How do you handle clock drift detection and correction — automatic drift monitoring, alarm thresholds, service suspension on drift?"
        dimension: operational
      - id: Q9
        text: "What is the timestamp token format — RFC 3161, RFC 5544, or other? Is it compatible with standard timestamp verification libraries?"
        dimension: interoperability

  # ============================================================================
  # VEND-TSP-012: QEAA Authentic Source Verification
  # Requirement: Issue QEAAs only after verifying data from authentic sources
  # ============================================================================
  VEND-TSP-012:
    questions:
      - id: Q1
        text: "What authentic sources do you connect to for QEAA attribute verification — government registries, regulated entities, educational institutions, professional bodies?"
        dimension: capability
      - id: Q2
        text: "How do you verify data provenance from authentic sources — secure API connections, mutual TLS, signed responses, audit chain?"
        dimension: security
      - id: Q3
        text: "What audit trail links QEAAs back to source verification — verification timestamp, source identifier, response hash, consent record?"
        dimension: auditability
      - id: Q4
        text: "How do you handle attributes not available from authentic sources (person-provided data) — identity verification procedures, evidence collection, liability?"
        dimension: operational
      - id: Q5
        text: "What is the freshness of data from authentic sources at time of issuance — maximum delay between verification and attestation, caching policies?"
        dimension: sla
      - id: Q6
        text: "How do you handle deferred verification responses from authentic sources — polling mechanism, maximum wait time, fallback procedures?"
        dimension: technical_implementation
      - id: Q7
        text: "How do you implement data minimisation when querying authentic sources — request only needed attributes, avoid unnecessary data collection?"
        dimension: privacy
      - id: Q8
        text: "What happens if an authentic source returns a negative or partial verification — does the platform refuse issuance entirely, issue a partial attestation containing only verified attributes, or issue with a 'person-provided' quality designation? How is the user informed of which attributes could not be verified?"
        dimension: operational
      - id: Q9
        text: "Do you support cross-border authentic source access — sources in other Member States, language handling, data format translation?"
        dimension: geographic_scope

  # ============================================================================
  # VEND-TSP-013: QEAA Qualified Signature/Seal
  # Requirement: Sign QEAAs with qualified electronic signature or seal
  # ============================================================================
  VEND-TSP-013:
    questions:
      - id: Q1
        text: "Do you sign QEAAs with a qualified electronic signature or qualified electronic seal? Which one, and why?"
        dimension: compliance_completeness
      - id: Q2
        text: "What signing algorithm and key length do you use for QEAA signatures — ECDSA P-256/P-384, EdDSA Ed25519, RSA-PSS ≥3072-bit?"
        dimension: technical_implementation
      - id: Q3
        text: "Is Post-Quantum Cryptography (PQC) on your roadmap for QEAA signing algorithms — ML-DSA (NIST FIPS 204) for primary PQC signatures, hybrid signatures (classical + PQC) during the transition period? What is your migration timeline?"
        dimension: roadmap
      - id: Q4
        text: "Is your QEAA signing certificate included in Member State Trusted Lists — can RPs verify the certificate via the LOTL chain?"
        dimension: compliance_evidence
      - id: Q5
        text: "What is your key rotation schedule for QEAA signing keys — planned frequency, emergency rotation procedures, overlap period?"
        dimension: lifecycle
      - id: Q6
        text: "Do you support 'pre-hashing' of large datasets on the client side before submission to reduce bandwidth and privacy exposure?"
        dimension: technical_implementation
      - id: Q7
        text: "How do you handle signing for both mDoc and SD-JWT-VC formats — same signing key, separate keys per format, algorithm compatibility?"
        dimension: technical_implementation
      - id: Q8
        text: "What is your signing throughput — signatures per second, queue management, performance under peak load?"
        dimension: sla
      - id: Q9
        text: "How do you handle Trusted List update propagation after key rotation — coordination with supervisory body, notification to RPs, transition period?"
        dimension: operational

  # ============================================================================
  # VEND-TSP-014: QEAA Revocation
  # Requirement: Provide QEAA revocation capability through status lists
  # ============================================================================
  VEND-TSP-014:
    questions:
      - id: Q1
        text: "What revocation mechanisms do you provide for QEAAs — Attestation Status List, Attestation Revocation List, short-lived attestations (≤24 hours), or a combination?"
        dimension: capability
      - id: Q2
        text: "How frequently are revocation status lists updated — publication interval, event-driven updates, configurable per attestation type?"
        dimension: sla
      - id: Q3
        text: "What is the maximum propagation time for QEAA revocation — time from revocation decision to status list availability, compliance with ETSI EN 319 411-1 REV-6.2.4-03A?"
        dimension: sla
      - id: Q4
        text: "How do Relying Parties access your QEAA revocation information — HTTP endpoints, caching policies, format (Attestation Status List bitstring, CRL)?"
        dimension: interoperability
      - id: Q5
        text: "Do you support QEAA suspension in addition to permanent revocation — temporary revocation with reinstatement capability?"
        dimension: capability
      - id: Q6
        text: "What triggers automatic revocation — key compromise, authentic source data change, issuer decision, user request, attestation expiry?"
        dimension: operational
      - id: Q7
        text: "How do you handle batch revocation scenarios — mass revocation of many attestations simultaneously, performance impact, notification procedures?"
        dimension: technical_implementation
      - id: Q8
        text: "What privacy properties does your revocation mechanism provide — herd privacy (RP cannot determine which index was checked), access logging?"
        dimension: security
      - id: Q9
        text: "What is the availability SLA for your revocation/status endpoints — uptime, geographic redundancy, maximum response time?"
        dimension: sla

  # ============================================================================
  # VEND-TSP-015: Financial Resources and Liability Insurance
  # Requirement: Maintain sufficient financial resources or liability insurance
  # ============================================================================
  VEND-TSP-015:
    questions:
      - id: Q1
        text: "What liability insurance coverage do you maintain for qualified trust services — policy type, insurer, coverage scope?"
        dimension: compliance_evidence
      - id: Q2
        text: "What is the coverage limit and scope of your liability insurance — per-incident cap, aggregate annual cap, geographic scope?"
        dimension: commercial
      - id: Q3
        text: "Can you provide proof of current insurance coverage — certificate of insurance, policy summary, coverage confirmation letter?"
        dimension: documentation
      - id: Q4
        text: "How do you demonstrate adequate financial resources beyond insurance — financial statements, reserves, parent company guarantees?"
        dimension: compliance_evidence
      - id: Q5
        text: "What is the claims process if a customer experiences damages — claims submission, investigation timeline, compensation mechanism?"
        dimension: operational
      - id: Q6
        text: "Is your insurance coverage proportionate to the volume and value of trust services provided — how is adequacy assessed?"
        dimension: commercial
      - id: Q7
        text: "Does your insurance specifically cover EUDI Wallet ecosystem risks — QEAA mis-issuance, access certificate failures, cross-border liability?"
        dimension: compliance_completeness
      - id: Q8
        text: "What is the insurance renewal cycle — annual, multi-year? Has coverage ever lapsed or been refused?"
        dimension: lifecycle
      - id: Q9
        text: "How do you handle liability allocation in multi-party scenarios — joint liability with other QTSPs, intermediaries, or Wallet Providers?"
        dimension: commercial

  # ============================================================================
  # VEND-TSP-016: Liability Acceptance
  # Requirement: Accept liability for qualified signatures/attestations issued
  # ============================================================================
  VEND-TSP-016:
    questions:
      - id: Q1
        text: "Do you accept liability for qualified services as specified in eIDAS Article 13 — presumed liability unless you prove no negligence?"
        dimension: compliance_completeness
      - id: Q2
        text: "What limitations on liability exist in your standard contract terms — are any eIDAS-mandated obligations excluded or limited?"
        dimension: commercial
      - id: Q3
        text: "How do you handle claims for damages arising from verification or revocation failures — claims process, investigation, remediation?"
        dimension: incident_response
      - id: Q4
        text: "What indemnification provisions do you offer — scope, caps, exclusions, process for triggering indemnification?"
        dimension: commercial
      - id: Q5
        text: "Have there been any liability claims against your trust services in the past 5 years? If so, what was the nature and outcome?"
        dimension: compliance_history
      - id: Q6
        text: "How do you differentiate liability between qualified and non-qualified trust services — different contractual terms, insurance coverage?"
        dimension: commercial
      - id: Q7
        text: "Do you accept liability for QEAAs based on incorrect authentic source data — where does liability transfer occur between QTSP and authentic source?"
        dimension: compliance_completeness
      - id: Q8
        text: "How is liability communicated to relying parties — terms of service, reliance limits, liability caps for certificate-based reliance?"
        dimension: documentation
      - id: Q9
        text: "What dispute resolution mechanism is in your contracts — mediation, arbitration, jurisdiction, governing law?"
        dimension: commercial

  # ============================================================================
  # VEND-TSP-017: Access Certificate Policy Compliance
  # Requirement: Comply with common Access Certificate Policy requirements
  # ============================================================================
  VEND-TSP-017:
    questions:
      - id: Q1
        text: "If acting as an Access Certificate Authority (ACA), do you comply with the Commission's common Certificate Policy per AS-MS-27-015? Can you demonstrate compliance?"
        dimension: compliance_completeness
      - id: Q2
        text: "What certificate issuance procedures do you follow — registration authority processes, identity verification, certificate request validation?"
        dimension: technical_implementation
      - id: Q3
        text: "How do you provide certificate validation services — OCSP, CRL, or both? What are the response times and availability SLAs?"
        dimension: capability
      - id: Q4
        text: "What is your certificate revocation process and timeline — maximum time from revocation request to CRL/OCSP update?"
        dimension: lifecycle
      - id: Q5
        text: "How do you support ecosystem participants in verifying access certificates — validation endpoints, trust chain documentation, integration libraries?"
        dimension: interoperability
      - id: Q6
        text: "Per AS-MS-27-016, do you log all issued access certificates for Certificate Transparency (CT) per Topic 55 requirements? Which CT logs do you use?"
        dimension: compliance_completeness
      - id: Q7
        text: "What certificate profiles do you support — PID Provider certificates, Attestation Provider certificates, Relying Party certificates, intermediary certificates?"
        dimension: capability
      - id: Q8
        text: "How do you handle cross-border certificate recognition — is your ACA included in the LOTL, are certificates verifiable across all Member States?"
        dimension: interoperability
      - id: Q9
        text: "What is your certificate renewal process — automated renewal, manual re-application, grace period, overlap with existing certificates?"
        dimension: operational

  # ============================================================================
  # VEND-TSP-018: Trust Service Suspension/Cancellation
  # Requirement: Handle suspension and cancellation of Trust Services
  # ============================================================================
  VEND-TSP-018:
    questions:
      - id: Q1
        text: "What notification process do you follow if your trust services are suspended or cancelled — customer notification timeline, supervisory body coordination?"
        dimension: incident_response
      - id: Q2
        text: "What transition procedures ensure continuity for customers during suspension/cancellation — alternative provider referrals, migration support?"
        dimension: lifecycle
      - id: Q3
        text: "How long are certificates/attestations still verifiable after service cancellation — revocation list maintenance, OCSP responder availability?"
        dimension: lifecycle
      - id: Q4
        text: "What arrangements exist for archive and repository access after service termination — data retention period, access procedures, Trusted Archivist?"
        dimension: operational
      - id: Q5
        text: "Have you ever had trust services suspended? If so, what were the circumstances and how was service restored?"
        dimension: compliance_history
      - id: Q6
        text: "Per EW-DM-31-001, if acting as an ACA, are you prepared to immediately revoke ALL temporally valid access certificates upon suspension — operational readiness, automation?"
        dimension: compliance_completeness
      - id: Q7
        text: "Per AS-MS-31-019, if acting as a Provider of registration certificates, are you prepared to immediately revoke ALL valid registration certificates and prohibit registry access upon suspension?"
        dimension: compliance_completeness
      - id: Q8
        text: "What is your customer impact mitigation plan — advance notice for planned changes, alternative provider list, automated migration tools?"
        dimension: operational
      - id: Q9
        text: "How do you handle the downstream impact on intermediaries and relying parties who depend on your certificates — communication plan, transition timeline?"
        dimension: lifecycle

  # ============================================================================
  # VEND-TSP-019: Authentic Source Interface Implementation
  # Requirement: Implement authentic source verification for QTSPs
  # ============================================================================
  VEND-TSP-019:
    questions:
      - id: Q1
        text: "How do you implement the technical interfaces for authentic source access per ARF Topic 42 — AS-AP-42-001 technical specifications, discovery mechanism?"
        dimension: technical_implementation
      - id: Q2
        text: "How do you obtain and record User consent per AS-AP-42-009 — informed consent (user understands what is verified), specific (per-attribute/per-request), auditable?"
        dimension: privacy
      - id: Q3
        text: "How do you process verification responses per AS-AP-42-004/05 — positive, negative, partial data, deferred (polling with unique identifier)?"
        dimension: compliance_completeness
      - id: Q4
        text: "What authentic source response types can you handle — positive verification, negative verification, partial data, source unavailability?"
        dimension: capability
      - id: Q5
        text: "How do you handle authentic source unavailability or errors — retry logic, fallback procedures, user notification, issuance deferral?"
        dimension: operational
      - id: Q6
        text: "Per AS-AP-42-005, do you send verification requests directly to the Authentic Source or designated intermediary — no additional intermediaries in the chain?"
        dimension: compliance_completeness
      - id: Q7
        text: "How do you discover Authentic Sources at national level — registry lookup, pre-configured endpoints, dynamic discovery per AS-AP-42-001?"
        dimension: technical_implementation
      - id: Q8
        text: "What security measures protect the authentic source communication channel — mutual TLS, signed requests/responses, encryption in transit?"
        dimension: security
      - id: Q9
        text: "How do you handle cross-border authentic source access — sources in other Member States, language handling, data format normalisation?"
        dimension: geographic_scope
