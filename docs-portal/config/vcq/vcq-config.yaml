  exportFormats:
    - id: "markdown"
      label: "Markdown"
      extension: ".md"
    - id: "pdf"
      label: "PDF Document"
      extension: ".pdf"
# =============================================================================
# Migration Notes (DEC-256, DEC-289)
# =============================================================================
#
# Previous structure (v2 - DEC-254):
#   - Step 1: Source Selection only
#   - Single RP Intermediary type
#
# Structure (v3 - DEC-256):
#   - Step 1: Organisation Role Selection (Relying Party, Issuer)
#   - Step 2: Product Category Selection (Connector, Issuance Platform, Trust Services)
#   - Step 3: Source Selection (eIDAS, Related, Architecture/Tech Specs)
#
# Current structure (v4 - DEC-289):
#   - Step 1:  Organisation Role Selection (Relying Party, Issuer)
#   - Step 2:  Product Category Selection (Connector, Issuance Platform, Trust Services)
#   - Step 2b: Deployment Architecture (Intermediary, Direct SaaS, Direct Self-Hosted)
#              → Only visible when Role=Relying Party AND Category=Connector
#   - Step 3:  Source Selection (eIDAS, Related, Architecture/Tech Specs)
#
# Role → Product Category Mapping:
#   - Relying Party → Connector, Trust Services
#   - Issuer → Issuance Platform, Trust Services
#
# Deployment Architecture → Connector only:
#   Requirements have `deploymentArchitectures` field (array of IDs).
#   Empty/absent = agnostic (all architectures). Union filter logic.
#
# Technical Specifications are now included in the Architecture tile,
# filtered by the selected Role and Product Category.
