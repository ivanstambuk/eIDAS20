  - id: VEND-ISS-031
    category: issuance
    requirement: Verify Wallet Unit Attestation during issuance
    explanation: |
      Before issuing a PID or device-bound attestation, the
      provider must verify the Wallet Unit Attestation (WUA)
      to ensure the target Wallet Unit is genuine and certified.

      **WUA_11a — Key possession proof:**
      During issuance of a PID or device-bound attestation,
      the PID Provider or Attestation Provider SHALL verify
      that the WSCA/WSCD or keystore has proven possession of
      the new PID or attestation private key. This ensures the
      attestation will be bound to a genuine secure element.

      **WUA_20a — TS3 compliance:**
      A PID Provider or Attestation Provider SHALL comply with
      all relevant requirements specified in Technical
      Specification 3 (Wallet Unit Attestation). TS3 defines
      the WUA data model, validation procedures, and trust
      chain requirements.

      **WUA verification checks:**
      The provider must perform the following checks:
      1. WUA signature validation (verify against Wallet
         Provider trust anchor)
      2. Certificate chain validation (WUA → Wallet Provider
         → Trusted List)
      3. WUA revocation status check
      4. WSCD certification level verification
      5. WUA expiry check

      **Issuance rejection:**
      If WUA verification fails (invalid signature, revoked,
      expired, insufficient WSCD certification), the provider
      SHALL reject the issuance request and return an
      appropriate error to the Wallet Unit.

      **Performance considerations:**
      WUA verification adds latency to the issuance process.
      The platform should cache trusted Wallet Provider
      certificates and WUA revocation status to minimise
      verification overhead.
    legalBasis:
      regulation: 2024/2979
      article: Article 3
      paragraph: "1"
    legalText: |
      PID and Attestation Providers shall verify the Wallet
      Unit Attestation before issuing PIDs or device-bound
      attestations.
    arfReference:
      topic: Topic 9
      hlr:
        - AS-WP-09-015
        - AS-WP-09-026
    roles:
      - issuer
    productCategories:
      - issuance_platform
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-ISS-032
    category: usage
    requirement: Include embedded disclosure policies in attestations
    explanation: |
      Where applicable, attestation providers must include embedded
      disclosure policies in issued attestations. These policies
      guide Wallet Units on appropriate disclosure behaviour for
      the attestation.

      **EDP_09 — Policy inclusion in Issuer metadata:**
      An Attestation Provider SHALL include an embedded disclosure
      policy (if any) by value in the Issuer metadata related to
      the attestation, in compliance with the OpenID4VCI issuance
      protocol or an extension thereof. Including by value (not
      by reference) ensures the policy is available offline and
      does not require additional network requests.

      **EDP_11 — Revocation on policy change:**
      An Attestation Provider SHALL revoke an attestation if a
      corresponding embedded disclosure policy is added, changed,
      or deleted. This ensures that wallets always use the
      current policy and cannot rely on stale policies.

      **Disclosure policy content:**
      An embedded disclosure policy typically specifies:
      - Which attributes are mandatory for disclosure
      - Which attributes are optional (user-selectable)
      - Which attributes should never be disclosed
      - Purpose limitations (e.g., age verification only)
      - Relying Party category restrictions

      **Wallet behaviour:**
      When a Wallet Unit receives an attestation with an embedded
      disclosure policy, it should:
      - Display the policy to the user during consent
      - Enforce mandatory attribute disclosure
      - Allow the user to opt in/out of optional attributes
      - Prevent disclosure of restricted attributes
    legalBasis:
      regulation: 2014/910
      article: Article 5a
      paragraph: "16"
    legalText: |
      Attestation providers shall include embedded disclosure
      policies to guide appropriate attribute disclosure by
      Wallet Units.
    arfReference:
      topic: Topic 43
      hlr:
        - EW-PIO-43-001
        - AS-AP-43-001
    roles:
      - issuer
    productCategories:
      - issuance_platform
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-ISS-033
    category: registration
    requirement: Use registration certificates for Provider authentication
    explanation: |
      If a registration certificate was issued during registration,
      the provider must use it for authentication in interactions
      with Wallet Units as specified in the technical specifications.

      **RPRC_14 — Service supply point distribution:**
      If, during registration, a PID Provider, QEAA Provider,
      PuB-EAA Provider, or non-qualified EAA Provider received a
      registration certificate, it SHALL distribute it to all its
      service supply points. A service supply point is a system
      at which a Wallet Unit can start the process of requesting
      and obtaining a PID or attestation.

      **RPRC_22 — Issuer metadata inclusion:**
      If a PID Provider or Attestation Provider received a
      registration certificate, it SHALL include it in its Issuer
      metadata used in the common OpenID4VCI protocol. The
      registration certificate SHALL be included by value, not by
      reference. This ensures issuance transactions are atomic and
      self-contained without external requests.

      **Registration certificate lifecycle:**
      The provider must manage the certificate lifecycle:
      - Renewal before expiry (automated or manual)
      - Revocation when registration status changes
      - Key rotation (new certificate with new key pair)
      - Distribution to all service supply points after renewal

      **Wallet Unit validation:**
      During issuance, the Wallet Unit validates the registration
      certificate to authenticate the provider. If validation
      fails, the wallet should abort the issuance flow and warn
      the user.
    legalBasis:
      regulation: 2014/910
      article: Article 45d
      paragraph: "1"
    legalText: |
      Providers that received a registration certificate shall
      use it for authentication in interactions with Wallet Units.
    arfReference:
      topic: Topic 44
      hlr:
        - AS-AP-44-002
        - AS-AP-44-004
    roles:
      - issuer
    productCategories:
      - issuance_platform
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-ISS-034
    category: issuance
    requirement: Comply with SD-JWT VC format requirements for PID issuance
    explanation: |
      When issuing PIDs in SD-JWT VC format, providers must include
      required claims, encode attributes per specification, ensure
      proper date formatting, and make all claims selectively
      disclosable.

      **PID_14 — vct claim requirement:**
      A PID Provider issuing SD-JWT-VC-compliant PIDs SHALL
      include the `vct` claim, where the value SHALL be a URN
      within the `urn:eudi:pid:` namespace. The type SHALL be
      `urn:eudi:pid:1` for the standard type or a domestic type
      that extends it.

      **PID_17 — Required SD-JWT claims:**
      The SD-JWT VC must include at minimum:
      - `vct`: attestation type URI
      - `iss`: issuer identifier
      - `iat`: issuance timestamp
      - `exp`: expiration timestamp
      - `cnf`: key binding (device binding)
      - `status`: revocation status reference

      **PID_18/PID_19 — Attribute encoding:**
      PID attributes must be encoded as JSON claims per the
      PID Rulebook’s SD-JWT-VC profile. Date attributes must
      use `full-date` format (YYYY-MM-DD) per RFC 3339.

      **PID_20/PID_21 — Selective disclosure:**
      All PID claims (except issuer-protected claims like `vct`,
      `iss`, `cnf`, `status`) SHALL be made selectively
      disclosable using the SD-JWT `_sd` mechanism. This enables
      per-attribute disclosure at presentation time.

      **Validation:**
      SD-JWT VC output should be validated against reference
      parsers (e.g., EUDI Reference Implementation) and
      integrated into CI/CD pipelines for continuous compliance.
    legalBasis:
      regulation: 2024/2977
      article: Annex
      paragraph: "1"
    legalText: |
      PID Providers issuing SD-JWT-VC-compliant PIDs shall
      comply with the format requirements specified in the
      PID Rulebook.
    arfReference:
      topic: Topic 3
      hlr:
