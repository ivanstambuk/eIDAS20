schemaVersion: 1
requirements:
  - id: VEND-INT-001
    category: contracts
    requirement: Display both intermediary and RP identity before requesting attestations
    explanation: |
      When the intermediary requests attestations from a wallet user, the wallet
      must display both the intermediary's identity (as the direct requester) and
      the identity of the ultimate Relying Party on whose behalf the intermediary
      is acting. This ensures informed consent.

      **Wallet detection mechanism (RPI_07):**
      The wallet detects an intermediary scenario by comparing two data sources:
      - The intermediary's identity (name, identifier) from its **access
        certificate** (obtained via RPI_01 registration)
      - The intermediated RP's identity (name, identifier) from the **RPRC_19a
        extension** in the presentation request, and from the RP's registration
        certificate if available (obtained via RPI_03)

      If these identities differ, the wallet knows the request is from an
      intermediary and displays both names. The intermediary product must
      therefore ensure both data sources are correctly populated in every
      presentation request.

      **Data that must be populated (RPI_05 → RPRC_19a):**
      The intermediated RP must supply to the intermediary: (a) its
      user-friendly name, (b) its unique identifier, (c) the URL of its
      Registrar, (d) the identifier of its intended use, and (e) a
      user-friendly description of its intended use. Since (a)-(c) are
      static, they can be configured once; (d)-(e) vary only if the RP
      has multiple registered intended uses.

      **Relationship verification (RPI_07a):**
      If the user requests it, the wallet will additionally verify that
      the contractual relationship between intermediary and RP is
      registered at the responsible Registrar (per RPI_04). Failure to
      register this relationship will cause the wallet to warn the user,
      potentially blocking the transaction.
    legalBasis:
      regulation: 2014/910
      article: Article 5b
      paragraph: "8"
    arfReference:
      topic: Topic 52
      hlr:
        - RPI_06
        - RPI_07
        - RPRC_19a
    legalText: |
      When an intermediary requests attestations from a wallet unit, the wallet 
      unit shall display both the identity of the intermediary and the identity 
      of the relying party on whose behalf the intermediary is acting.
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-002
    category: contracts
    requirement: Ensure RP's intended data requests are accurately communicated to wallet
    explanation: |
      The intermediary must not modify, expand, or alter the RP's registered
      data request when forwarding to wallets. Only the attributes registered
      by the RP with its Registrar may be requested.

      **Request scope guarantee (RPI_06 + Art 5b(3)):**
      The intermediary SHALL include in the request only those attributes that
      the intermediated RP has registered for the selected intended use. The
      wallet can verify this: per RPRC_21, the wallet may query the Registrar
      using the intended-use identifier from RPRC_19a to retrieve the list of
      attributes the RP is authorised to request. Any discrepancy between the
      RPRC_19a request and the registered attribute set is a compliance
      violation.

      **Prohibited intermediary behaviours:**
      - Adding attributes beyond the RP's registration
        ("attribute expansion")
      - Removing attributes the RP expects ("attribute suppression")
      - Modifying attribute type identifiers or namespaces
      - Requesting attributes for the intermediary's own purposes under
        the RP's identity

      This is a MUST NOT obligation because over-requesting undermines user
      consent and may trigger DPA complaints via the wallet's reporting
      mechanism.
    legalBasis:
      regulation: 2014/910
      article: Article 5b
      paragraph: "3"
    legalText: |
      Relying parties shall not request users to provide any data other than
      that indicated pursuant to paragraph 2, point (c).
    arfReference:
      topic: Topic 52
      hlr: RPI_06
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST NOT
  - id: VEND-INT-003
    category: usage
    requirement: Forward presentation requests without modification of requested attributes
    explanation: |
      The intermediary must accurately relay the RP's attribute request to the
      wallet without adding, removing, or modifying the requested attributes.
      The request must match what the RP registered with supervisory
      authorities.

      **Differentiation from VEND-INT-002:**
      While VEND-INT-002 addresses the **scope** constraint (only registered
      attributes may be requested), this requirement addresses the
      **forwarding integrity** guarantee: the technical relay mechanism must
      preserve the request exactly as constructed.

      **Technical relay requirements (RPI_06):**
      When the intermediated RP triggers a presentation request, the
      intermediary SHALL construct the OID4VP or ISO 18013-5 request
      containing:
      - The intermediary's own access certificate (RPI_01)
      - The RP's registration certificate, if available (RPI_03)
      - The RPRC_19a extension fields for the intermediated RP (RPI_05)
      - The exact set of requested attributes as specified by the RP

      The product must ensure no transformation, filtering, or enrichment
      occurs between the RP's internal request and the wallet-facing
      protocol message. This is especially important for selective
      disclosure: the attribute identifiers and namespaces must be
      bit-exact with the RP's registration.
    legalBasis:
      regulation: 2014/910
      article: Article 5b
      paragraph: "3"
    legalText: |
      Relying parties shall not request users to provide any data other than
      that indicated pursuant to paragraph 2, point (c).
    arfReference:
      topic: Topic 52
      hlr: RPI_06
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-004
    category: usage
    requirement: Forward wallet presentations to RP without modification
    explanation: |
      The intermediary must relay the wallet's presentation to the RP exactly
      as received, without altering, extracting, or processing the credential
      data. The presentation integrity must be preserved.

      **Forwarding after verification (RPI_08 + RPI_09):**
      After receiving a presentation from a Wallet Unit, the intermediary
      SHALL first perform the verifications specified in RPI_09 (authenticity,
      revocation status, device binding, user binding, combined presentation
      validity). Only if all verifications succeed SHALL the intermediary
      forward the attributes to the requesting RP. If any verification
      fails, the intermediary SHALL NOT forward any attributes.

      **No-storage mandate (Article 5b(10)):**
      The intermediary is deemed a Relying Party and SHALL NOT store data
      about the content of the transaction. This means:
      - No persistent storage of attestation payloads
      - No caching of attribute values between sessions
      - No logging of individual attribute content
      - Memory-only processing with secure erasure after forwarding

      **Integrity preservation:**
      The presentation payload must be forwarded without modification so
      that the RP can independently verify signatures and selective-
      disclosure proofs if it chooses to do so.
    legalBasis:
      regulation: 2014/910
      article: Article 5b
      paragraph: "10"
    legalText: |
      Intermediaries acting on behalf of relying parties shall be deemed to be
      relying parties and shall not store data about the content of the transaction.
    arfReference:
      topic: Topic 52
      hlr:
        - RPI_08
        - RPI_09
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST NOT
  - id: VEND-INT-005
    category: usage
    requirement: Support both remote and proximity presentation protocols
    explanation: |
      If the RP requires both remote and proximity (offline) presentation
      scenarios, the intermediary must support the relevant protocols for
      each mode.

      **Remote presentations:**
      - OpenID for Verifiable Presentations (OID4VP) per ISO/IEC TS
        18013-7:2024
      - SD-JWT VC credential format with HAIP profile
      - Both same-device (app-to-app) and cross-device (QR code) flows
      - `direct_post` and `direct_post.jwt` response modes

      **Proximity presentations:**
      - ISO/IEC 18013-5:2021 device retrieval protocol
      - BLE as the mandatory transport, NFC as optional
      - Device engagement via QR code or NFC tap
      - mDoc credential format

      **Intermediary-specific considerations:**
      For proximity flows, the intermediary's deployment must include
      hardware (BLE/NFC readers) at the RP's physical locations. The
      intermediary must handle the additional complexity of performing
      RPI_09 verification on-site before forwarding to the RP backend.
      For remote flows, the intermediary must correctly route the
      `redirect_uri` / `response_uri` callbacks through its own
      infrastructure while preserving the RP's session context.

      The obligation is conditional: if the RP only uses remote flows,
      only OID4VP is required. If the RP only uses proximity flows,
      only ISO 18013-5 is required. If both modes are used, both
      MUST be supported.
    legalBasis:
      regulation: 2024/2982
      article: Article 5
      paragraph: "1"
    legalText: |
      Wallet providers shall ensure that wallet solutions support protocols
      and interfaces for the presentation of person identification data and
      electronic attestations of attributes.
    annexReference: |
      Annex to 2024/2982:
      - ISO/IEC 18013-5:2021 (proximity)
      - ISO/IEC TS 18013-7:2024 (remote)
    arfReference:
      topic: Topic 24
      hlr: ProxId_01a
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-006
    category: usage
    requirement: Forward attributes only to the requesting RP after verification
    explanation: |
      After receiving attestation data from a wallet, the intermediary must
      perform all agreed verifications (RPI_09) and forward the attributes
      ONLY to the specific RP on whose behalf the request was made. If any
      verification fails, no attributes may be forwarded.

      **Verification gate (RPI_09):**
      Before forwarding, the intermediary SHALL verify (as agreed with the
      RP):
      - Authenticity of the PID or attestation (signature validation)
      - Revocation status
      - Device binding (WSCD key proof-of-possession)
      - User binding
      - Combined presentation validity (if multiple attestations)
      - Wallet Unit authenticity and revocation status

      **Conditional forwarding (RPI_08):**
      If ALL verifications succeed → forward attributes only to the
      requesting RP. If ANY verification fails → forward NOTHING. The
      intermediary must never partially forward verified attributes.

      **Routing isolation:**
      When serving multiple RPs, the intermediary must enforce strict
      routing isolation to prevent attributes from being delivered to
      the wrong RP. This requires per-session RP binding from request
      initiation through to attribute delivery.

      **Immediate deletion (RPI_10):**
      After forwarding (or after verification failure), the intermediary
      SHALL delete all PIDs, attestations, and user attributes completely
      and immediately (see also VEND-INT-021).
    legalBasis:
      regulation: 2014/910
      article: Article 5b
      paragraph: "10"
    legalText: |
      Intermediaries acting on behalf of relying parties shall be deemed to be
      relying parties and shall not store data about the content of the transaction.
    arfReference:
      topic: Topic 52
      hlr:
        - RPI_08
        - RPI_09
        - RPI_10
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-007
    category: usage
    requirement: Maintain up-to-date Trusted Lists for PID Providers
    explanation: |
      The intermediary must maintain current copies of the Trusted Lists
      containing PID Provider trust anchors (public keys/certificates).
      These lists are published by Member States and the Commission and
      must be refreshed regularly to capture additions, modifications,
      and revocations.

      **Signature validation requirement (OIA_12):**
      For both proximity and remote presentation flows, the intermediary
      SHALL validate the signature of a PID using a trust anchor provided
      in a PID Provider Trusted List made available in accordance with
      Topic 31 (notification and publication). This is a prerequisite for
      the RPI_09 verification gate that determines whether attributes
      may be forwarded to the RP.

      **Trust list discovery and refresh:**
      Member States publish Trusted Lists in a standardised format. The
      EU Commission publishes a List of Trusted Lists (LOTL) that
      aggregates the Member State lists. The intermediary should:
      - Bootstrap from the LOTL to discover all Member State lists
      - Refresh lists at intervals aligned with the lists' own
        `nextUpdate` timestamps (typically 24-72 hours)
      - Handle list signature verification (the list itself is signed)
      - Maintain a fallback if a Member State list is temporarily
        unavailable

      **Intermediary-specific concern:**
      Because intermediaries serve multiple RPs potentially operating
      across different Member States, they may need to maintain Trusted
      Lists from all 27 Member States simultaneously, rather than only
      the subset relevant to a single RP's market.
    legalBasis:
      regulation: 2014/910
      article: Article 22
      paragraph: "1"
    legalText: |
      Each Member State shall establish, maintain and publish trusted lists,
      including information related to the qualified trust service providers
      for which it is responsible.
    arfReference:
      topic: Topic 1
      hlr: OIA_12
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-008
    category: usage
    requirement: Maintain up-to-date Trusted Lists for Attestation Providers
    explanation: |
      The intermediary must maintain current copies of Trusted Lists for qualified 
      and non-qualified electronic attestation of attributes (QEAA/EAA) providers. 
      These trust anchors are essential for validating attestation signatures.
    legalBasis:
      regulation: 2014/910
      article: Article 22
      paragraph: "1"
    arfReference:
      topic: Topic 1
      hlr: OIA_13
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-009
    category: usage
    requirement: Obtain trust anchors only from official Trusted List sources
    explanation: |
      Trust anchors for verification must be obtained exclusively from official 
      EU and Member State Trusted Lists, not from third-party aggregators or 
      unofficial sources. This ensures the authenticity of verification keys.
    arfReference:
      topic: Topic 1
      hlr: OIA_14
    legalBasis:
      regulation: 2014/910
      article: Article 32
      paragraph: ""
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-010
    category: usage
    requirement: Validate attestation signatures using official trust anchors
    explanation: |
      The intermediary must verify the cryptographic signatures on attestations 
      and PIDs using the public keys from official Trusted Lists. Invalid or 
      untrusted signatures must result in rejection.
    legalBasis:
      regulation: 2024/2979
      article: Article 8
      paragraph: ""
    legalText: |
      The validity of attestations shall be verified using the trust anchors 
      published in official Trusted Lists.
    arfReference:
      topic: Topic 1
      hlr: OIA_12
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-011
    category: usage
    requirement: Verify attestation revocation status before acceptance (recommended)
    explanation: |
      Before accepting a presentation as valid, the intermediary should check the 
      revocation status of the attestation. This may involve checking validity 
      status lists, OCSP responses, or other revocation mechanisms as specified 
      by the issuer. Note: Per ARF VCR_13, revocation verification is recommended 
      but not mandatory.
    legalBasis:
      regulation: 2024/2979
      article: Article 3
      paragraph: ""
    arfReference:
      topic: Topic 7
      hlr: VCR_13
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: SHOULD
  - id: VEND-INT-012
    category: usage
    requirement: Verify the wallet unit's device binding
    explanation: |
      The intermediary must verify that the presentation is bound to the wallet 
      unit's secure cryptographic device (WSCD), confirming that the presenter 
      controls the private key associated with the attestations.
    legalBasis:
      regulation: 2024/2979
      article: Article 3
      paragraph: ""
    arfReference:
      topic: Topic 52
      hlr: RPI_09
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-013
    category: security
    requirement: Verify presentation freshness and prevent replay attacks
    explanation: |
      The intermediary must verify that presentations are fresh and not replayed. 
      This includes checking nonces, timestamps, or session binding, and implementing 
      mechanisms to detect replay of previously received presentations. Stale or 
      replayed presentations must be rejected.
    legalBasis:
      - regulation: 2024/2979
        article: Article 3
        paragraph: ""
      - regulation: 2014/910
        article: Article 5b
        paragraph: "9"
    arfReference:
      topic: Topic 52
      hlr: RPI_09
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-014
    category: security
    requirement: Ensure secure channel for transmission to RP
    explanation: |
      The intermediary must establish and maintain a secure, encrypted channel 
      when forwarding wallet presentations to the RP. Transport layer security 
      (TLS 1.3 or equivalent) is required.
    legalBasis:
      regulation: 2014/910
      article: Article 5b
      paragraph: "10"
    arfReference:
      topic: Topic 52
      hlr: RPI_08
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-016
    category: security
    requirement: Implement secure key management for verification operations
    explanation: |
      The intermediary must implement secure storage and handling of any 
      cryptographic material used in verification operations. Keys must be 
      protected against unauthorized access, modification, and extraction.
    legalBasis:
      regulation: 2024/2979
      article: Article 3
      paragraph: ""
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-017
    category: security
    requirement: Protect verification results integrity
    explanation: |
      The verification result communicated to the RP must be protected against 
      tampering. The RP must be able to trust that the intermediary's verification 
      outcome is authentic and unmodified.
    legalBasis:
      regulation: 2014/910
      article: Article 5b
      paragraph: "10"
    arfReference:
      topic: Topic 52
      hlr: RPI_08
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-018
    category: security
    requirement: Maintain audit logs of verification operations
    explanation: |
      The intermediary should maintain logs of verification operations including 
      verification timestamps, outcomes, and any errors. These logs support 
      dispute resolution and compliance auditing while respecting privacy 
      (no attestation content should be logged).
    legalBasis:
      regulation: 2016/679
      article: Article 32
      paragraph: 1(d)
    legalText: |
      The controller and processor shall implement measures to ensure a process 
      for regularly testing, assessing and evaluating the effectiveness of 
      technical and organisational measures for ensuring the security of processing.
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    notes: |
      Logs must not contain attestation content (due to no-storage mandate) 
      but may contain verification metadata (pass/fail, timestamp, error codes).
    obligation: MUST
  - id: VEND-INT-019
    category: usage
    requirement: Do not extract or log individual attribute values from presentations
    explanation: |
      Beyond the no-storage mandate, intermediaries must not extract, log, or 
      analyze individual attribute values from wallet presentations. The 
      presentation should be treated as an opaque payload for forwarding.
    legalBasis:
      regulation: 2014/910
      article: Article 5b
      paragraph: "10"
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST NOT
  - id: VEND-INT-020
    category: usage
    requirement: Do not correlate or link user presentations across different RPs
    explanation: |
      Intermediaries serving multiple RPs must not correlate wallet user activity 
      across different RP interactions. Each RP relationship must be treated 
      independently to preserve user unlinkability.
    legalBasis:
      regulation: 2014/910
      article: Article 5a
      paragraph: 16(a)
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST NOT
  - id: VEND-INT-021
    category: usage
    requirement: Delete attestation data immediately after forwarding to RP
    explanation: |
      The intermediary must completely delete all PIDs, attestations, and user 
      attributes immediately after sending them to the intermediated RP. If 
      forwarding fails or is not performed (e.g., due to verification failure), 
      deletion must still occur immediately after completing all necessary 
      verifications.
    arfReference:
      topic: Topic 52
      hlr: RPI_10
    legalBasis:
      regulation: 2014/910
      article: Article 5b
      paragraph: "10"
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-022
    category: contracts
    requirement: Specify RP details in each presentation request to wallet
    explanation: |
      When requesting attestations from a wallet, the intermediary must include 
      complete information about the intermediated RP via the RPRC_19a extension 
      in the presentation request. The required fields are:

      - User-friendly name of the intermediated RP
      - Unique identifier of the intermediated RP
      - URL of the Registrar where the RP is registered
      - Intended use identifier (selecting the applicable registered use)
      - User-friendly description of the intended use

      This data enables the wallet to (a) display accurate RP information to 
      the user per RPI_07, (b) verify that requested attributes match what the 
      RP registered per RPRC_21, and (c) detect that the request is from an 
      intermediary rather than a direct RP (by comparing the RPRC_19a identity 
      with the access certificate identity).
    legalBasis:
      regulation: 2025/848
      article: Annex I
      paragraph: 9-10
    legalText: |
      For each intended use, a list of the data, including attestations and 
      attributes, that the relying party intends to request, a user-friendly 
      name and a technical name, the attestation type and a description of 
      intended use of the data.
    arfReference:
      topic: Topic 52
      hlr:
        - RPI_05
        - RPRC_19a
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-023
    category: usage
    requirement: Support mandatory credential formats based on supported use cases
    explanation: |
      Relying Party connectors and intermediaries must support the credential formats 
      relevant to their operational use cases:

      **Remote Presentations (online services):**
      - SD-JWT-VC format (Selective Disclosure JSON Web Token)
      - OpenID4VP protocol for presentation exchange

      **Proximity Presentations (in-person verification):**
      - ISO/IEC 18013-5:2021 (mDoc) format
      - BLE/NFC protocols per ISO/IEC 18013-5 and 18013-7

      If the RP or intermediary supports BOTH remote and proximity use cases, 
      then BOTH formats MUST be supported. The requirement is use-case-dependent, 
      but within each use case the format is mandatory.

      Note: This differs from Issuers, who must unconditionally support both formats.
    legalBasis:
      regulation: 2024/2979
      article: Article 8
      paragraph: ""
    annexReference: |
      Annex II of 2024/2979:
      - ISO/IEC.18013-5:2021
      - 'Verifiable Credentials Data Model 1.1', W3C Recommendation
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    arfReference:
      topic: Topic 3
      hlr: PID_02
    notes: |
      Per ARF RPRC_20a: "Relying Party Instances and Wallet Units SHALL support 
      the extension for [ISO/IEC 18013-5] or the extension for [OpenID4VP]..."

      The "or" indicates use-case dependency:
      - Online-only RPs: SD-JWT-VC / OpenID4VP required
      - In-person-only RPs (e.g., age verification at venue): mDoc / ISO 18013-5 required
      - Mixed-mode RPs: BOTH formats required

      This contrasts with VEND-ISS-005 where issuers must unconditionally 
      support both formats per ISSU_12.
    obligation: MUST
  - id: VEND-INT-024
    category: usage
    requirement: Support selective disclosure in both credential formats
    explanation: |
      The intermediary's verification implementation must correctly handle 
      selectively disclosed attributes in both mDoc and VC formats. Verification 
      must succeed even when only a subset of attributes is presented.
    legalBasis:
      regulation: 2024/2982
      article: Article 5
      paragraph: "4"
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    arfReference:
      topic: Topic 12
      hlr: ARB_02
    obligation: MUST
  - id: VEND-INT-025
    category: registration
    requirement: Consider certification for cryptographic components
    explanation: |
      Depending on the assurance level required by the RP, the intermediary may 
      need to demonstrate that its cryptographic implementations meet recognized 
      standards (e.g., FIPS 140-2/3, Common Criteria). This is especially relevant 
      for high-assurance use cases.
    legalBasis:
      regulation: 2019/881
      article: Article 47
      paragraph: ""
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    notes: |
      This is a conditional requirement based on the RP's risk assessment and 
      the sensitivity of the use case. Not all intermediaries will require 
      certification.
    obligation: MUST
  - id: VEND-INT-026
    category: usage
    requirement: Comply with embedded disclosure policies in attestations
    explanation: |
      Electronic attestations of attributes may contain embedded disclosure 
      policies that specify conditions the relying party must meet to access 
      the attestation. The intermediary must verify RP compliance with these 
      policies and ensure the wallet can inform the user of the result.
    legalBasis:
      regulation: 2024/2979
      article: Article 10
      paragraph: "3"
    legalText: |
      Wallet instances shall verify whether the wallet-relying party complies 
      with the requirements of the embedded disclosure policy and inform the 
      wallet user of the result.
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-027
    category: usage
    requirement: Support WebAuthn specification for pseudonym generation
    explanation: |
      When the intermediary supports pseudonymous authentication from wallet 
      units, it must support the WebAuthn specification as mandated in 
      Annex V of the Integrity regulation. This enables privacy-preserving 
      authentication without revealing user identity.
    legalBasis:
      regulation: 2024/2979
      article: Article 14
      paragraph: "1"
    legalText: |
      Wallet units shall support the generation of pseudonyms for wallet users 
      in compliance with the technical specifications set out in Annex V.
    annexReference: |
      Annex V of 2024/2979:
      - 'Web Authentication', W3C Recommendation
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-028
    category: usage
    requirement: Support relying-party-specific pseudonyms
    explanation: |
      Wallet units generate unique pseudonyms per relying party, ensuring 
      unlinkability across different RPs. The intermediary must correctly 
      handle these RP-specific pseudonyms in verification flows.
    legalBasis:
      regulation: 2024/2979
      article: Article 14
      paragraph: "2"
    legalText: |
      A pseudonym shall be relying-party specific, meaning that only wallets 
      and relying parties can link different transactions to the same pseudonym.
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-029
    category: usage
    requirement: Use valid Wallet-Relying Party Access Certificate
    explanation: |
      The intermediary must use a valid Wallet-Relying Party Access Certificate 
      (issued by its Registrar) when interacting with wallet units. The 
      certificate identifies the intermediary and enables the wallet to verify 
      its registration status.
    legalBasis:
      regulation: 2024/2982
      article: Article 3
      paragraph: "1"
    legalText: |
      Wallet providers shall ensure that wallet solutions support protocols 
      and interfaces which allow wallet-relying parties to present a valid 
      wallet-relying party access certificate.
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    arfReference:
      topic: Topic 6
      hlr: RPA_01
    obligation: MUST
  - id: VEND-INT-030
    category: usage
    requirement: Implement TS7 data deletion request interface for GDPR Article 17 compliance
    explanation: |
      The intermediary must implement the common data deletion request interface 
      specified in Technical Specification 7 (TS7). When a user requests erasure 
      of their data from an RP (via the wallet), the intermediary must:
      1. Authenticate the requesting user using appropriate mechanisms (DATA_DLT_07)
      2. Correctly process or relay the deletion request per TS7 (DATA_DLT_08)
      3. Respond within GDPR mandated timeframes (without undue delay)

      Note: The intermediary's no-storage mandate (VEND-INT-021) means minimal 
      personal data will be retained, but any logs or metadata must still be 
      subject to erasure requests.
    legalBasis:
      regulation: 2016/679
      article: Article 17
      paragraph: "1"
    legalText: |
      The data subject shall have the right to obtain from the controller the 
      erasure of personal data concerning him or her without undue delay and 
      the controller shall have the obligation to erase personal data without 
      undue delay.
    arfReference:
      topic: Topic 48
      hlr:
        - DATA_DLT_07
        - DATA_DLT_08
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-031
    category: contracts
    requirement: Support user reporting to data protection authorities
    explanation: |
      Wallet units allow users to report RPs to data protection authorities 
      if they suspect unlawful data requests. The intermediary's identity 
      (as the entity making the request on behalf of the RP) will be visible 
      to users and may be included in such reports.
    legalBasis:
      regulation: 2024/2982
      article: Article 7
      paragraph: "1"
    legalText: |
      Wallet providers shall ensure that wallet units allow wallet users to 
      easily report wallet-relying parties to supervisory authorities 
      established under Article 51 of Regulation (EU) 2016/679.
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    obligation: MUST
  - id: VEND-INT-032
    category: usage
    requirement: Include intermediary access certificate and RP registration certificate in requests
    explanation: |
      When requesting attestations from a wallet on behalf of an intermediated RP, the 
      intermediary must include both: (1) its own access certificate (proving its identity 
      as a registered intermediary), and (2) the registration certificate of the 
      intermediated RP, if the RP has one. This enables the wallet to verify both 
      the intermediary and the ultimate service provider.
    arfReference:
      topic: Topic 52
      hlr: RPI_06
    legalBasis:
      regulation: 2025/848
      article: Article 8
      paragraph: "2"
    legalText: |
      When requested by an intermediated Relying Party, an intermediary SHALL request 
      a presentation of attributes from a specific Wallet Unit. In the request, the 
      intermediary SHALL include the intermediary's access certificate and the 
      registration certificate of the Relying Party, if available.
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    notes: |
      This is the technical implementation of RPI_06. The access certificate comes from 
      the intermediary's own registration. The RP registration certificate is obtained 
      during the intermediary's registration of each intermediated RP (per RPI_03).
    obligation: MUST
  - id: VEND-INT-033
    category: contracts
    requirement: Ensure intermediary-RP contractual relationship is registered
    explanation: |
      Before the intermediary can act on behalf of an RP, the contractual relationship 
      between them must be registered with the relevant Registrar. The wallet verifies 
      this registration when processing requests (per RPI_07a). If the relationship 
      is not registered, the wallet will warn the user that the intermediary's 
      authority to act for the RP cannot be verified.
    arfReference:
      topic: Topic 52
      hlr: RPI_04
    legalBasis:
      regulation: 2025/848
      article: Article 6
      paragraph: "5"
    legalText: |
      When registering an intermediated Relying Party, an intermediary SHALL provide 
      legally valid evidence that this Relying Party will indeed use the services of 
      this intermediary to interact with Wallet Units. The Registrar SHALL verify 
      this evidence and register the relationship between the intermediary and the 
      intermediated Relying Party.
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    notes: |
      This corresponds to ARF RPI_04 and supports wallet verification per RPI_07a. 
      The intermediary must ensure this registration is complete BEFORE accepting 
      intermediation requests from an RP, otherwise wallet users will see verification 
      failures.
    obligation: MUST
  - id: VEND-INT-034
    category: usage
    requirement: Support attestation status list verification mechanisms (recommended)
    explanation: |
      The intermediary should support attestation status verification using the mechanisms 
      specified in ARF Topic 7 (Attestation Revocation). This includes checking 
      Attestation Status Lists or Attestation Revocation Lists published by PID/EAA 
      providers to verify that attestations have not been revoked. Note: Per ARF VCR_13, 
      revocation verification is recommended but not mandatory.
    arfReference:
      topic: Topic 7
      hlr: VCR_13
    legalBasis:
      regulation: 2024/2979
      article: Article 3
      paragraph: ""
    roles:
      - relying_party
    productCategories:
      - connector
    deadline: "2027-11-21"
    notes: |
      This covers ARF Topic 7 (VCR_*) verification requirements for attestation 
      revocation. Attestation Status Lists (VCR_11) are the primary mechanism 
      for efficient batch revocation checking without per-credential queries.
    obligation: SHOULD
