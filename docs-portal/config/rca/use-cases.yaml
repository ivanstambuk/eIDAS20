# RCA Configuration: Use Cases
# Source: EC Use Case Manuals
# https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/896827987/Use+case+manuals
# Last synced: 2026-02-19

categories:
  core:
    label: "Core functionality"
    order: 1
  banking:
    label: "Banking & payment"
    order: 2
  travel:
    label: "Travel"
    order: 3
  health:
    label: "Health & social security"
    order: 4
  consumer:
    label: "Consumer"
    order: 5
  education:
    label: "Education"
    order: 6
  identification:
    label: "Identification"
    order: 7
  legal:
    label: "Legal representation"
    order: 8

useCases:
  # === Core functionality ===
  pid-online:
    name: "PID-based identification in online services"
    description: "Secure identification to an online service using the PID stored in an EUDI Wallet."
    category: core
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/930451131/PID+Identification+Manual"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/930451131/04_Use%20Case_Manual_PID-based%20identification%201.pdf"
    # PID issuance via OID4VCI (TS6), online verification via OID4VP, dual-format (W3C VC + ISO mdoc)
    technicalSpecs:
      - TS6
      - OpenID4VP
      - ISO 18013-5
      - ISO 18013-7

  pseudonym:
    name: "Use of a pseudonym in online services"
    description: "Interact with digital platforms without revealing your full identity, unless legally or functionally required to."
    category: core
    status: coming_soon
    ecManualUrl: null
    pdfManualUrl: null

  esignature:
    name: "eSignature"
    description: "Create qualified electronic signatures with the same legal validity as a handwritten signature."
    category: core
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/930452287/eSignature"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/930452287/07_Use%20Case_Manual_eSignature.pdf"
    # Remote QES protocol (TS8), ETSI validation profiles, rQSCD implementing regulation
    technicalSpecs:
      - TS8
      - ETSI TS 119 102-2
      - IR 2025/1567

  # === Banking & payment ===
  payment-auth:
    name: "Payment authentication"
    description: "Enables online payments to be authenticated via an EUDI Wallet."
    category: banking
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/935397429/Payment+Authentication"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/935397429/11_Use%20Case_Manual_Payment%20Authentication.pdf"
    # Links to TS12 for PSD2 SCA requirements
    technicalSpecs:
      - TS12

  open-bank-account:
    name: "Open bank account"
    description: "Enables individuals to open a bank account online using their EUDI Wallet."
    category: banking
    status: coming_soon
    ecManualUrl: null
    pdfManualUrl: null

  # === Travel ===
  mdl:
    name: "Mobile Driving Licence (mDL)"
    description: "Proof of an individual's right to drive a certain kind of vehicle."
    category: travel
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/display/EUDIGITALIDENTITYWALLET/The+mobile+Driving+License+manual"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/929202846/01_Use%20Case_Manual_Mobile%20Driving%20Licence%201.pdf"
    # ISO mdoc format, proximity (18013-5) + remote (18013-7), OID4VCI issuance (TS6)
    technicalSpecs:
      - TS6
      - ISO 18013-5
      - ISO 18013-7

  dtc:
    name: "Digital Travel Credential (DTC)"
    description: "A digital representation of the user's identity document such as an identity card, passport or another travel document."
    category: travel
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/930451772/Travel+Credentials"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/930451772/06_Use%20Case_Manual_Digital%20Travel%20Credential.pdf"
    # ICAO 9303 for DTC data structures, ISO 23220-2 for mobile credential interface
    technicalSpecs:
      - ICAO 9303
      - ISO 23220-2

  epc:
    name: "European Parking Card (EPC)"
    description: "Issued to persons with disabilities, recognising the right to certain reserved parking conditions and facilities."
    category: travel
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/930452118/European+Parking+Card"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/930452118/03_Use%20Case_Manual_European%20Parking%20Card.pdf"
    # TBD — implementing acts for EPC under Directive 2024/2841 are pending
    technicalSpecs: []

  vrc:
    name: "Vehicle Registration Certificate (VRC)"
    description: "Proves the registration and legal compliance of a vehicle with national and European road transport regulations."
    category: travel
    status: coming_soon
    ecManualUrl: null
    pdfManualUrl: null

  # === Health & social security ===
  disability-card:
    name: "European Disability Card"
    description: "Serves as proof of recognised disability status/entitlement to disability services."
    category: health
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/930452528/Disability+Card"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/930452528/08_Use%20Case_Manual_Disability%20Card.pdf"
    # TBD — implementing acts for Disability Card under Directive 2024/2841 are pending
    technicalSpecs: []

  eprescription:
    name: "e-Prescription"
    description: "Identify yourself in order to access e-prescriptions stored and presented via an EUDI Wallet."
    category: health
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/930452930/ePrescription"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/930452930/09_Use%20Case_Manual_ePrescription.pdf"
    # Health ID attestation (ISO mdoc), OID4VCI issuance (TS6), proximity+remote, MyHealth@EU
    technicalSpecs:
      - TS6
      - ISO 18013-5
      - ISO 18013-7
      - MyHealth@EU

  ehic:
    name: "European Health Insurance Card (EHIC)"
    description: "Grants access to necessary healthcare when in another Member State."
    category: health
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/930453001/EHIC"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/930453001/10_Use%20Case_Manual_European%20Health%20Insurance%20Card%20%28EHIC%29.pdf"
    # SD-JWT-VC (IETF) + W3C VC Data Model 2.0, OID4VCI issuance (TS6), DC4EU pilot
    technicalSpecs:
      - TS6
      - SD-JWT-VC
      - W3C VC Data Model 2.0

  public-warnings:
    name: "Public warnings"
    description: "Enables trusted public authorities to issue real-time or scheduled warnings and alerts, like for natural disasters."
    category: health
    status: coming_soon
    ecManualUrl: null
    pdfManualUrl: null

  # === Consumer ===
  age-verification:
    name: "Age verification"
    description: "Prove you are above a specific age threshold (e.g., over 16, 18, or 21) using a verifiable digital credential."
    category: consumer
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/930450954/The+Age+Verification+Manual"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/930450954/Use%20Case_Manual_Age%20verification.pdf"
    # ISO mdoc for boolean age claims, ZKP (TS4), OID4VP verification, W3C DC API
    technicalSpecs:
      - TS4
      - OpenID4VP
      - ISO 18013-5
      - ISO 23220-2
      - W3C DC API

  ticket-pass:
    name: "Ticket or pass"
    description: "Store, manage, and present digital tickets and access passes, like boarding passes or event tickets."
    category: consumer
    status: coming_soon
    ecManualUrl: null
    pdfManualUrl: null

  # === Education ===
  edu-credentials:
    name: "Educational credentials"
    description: "Store, manage, and present digitally verifiable education-related credentials, like diplomas and certificates."
    category: education
    status: coming_soon
    ecManualUrl: null
    pdfManualUrl: null

  student-card:
    name: "European student card"
    description: "Enables students to store and present their student status."
    category: education
    status: coming_soon
    ecManualUrl: null
    pdfManualUrl: null

  # === Identification ===
  proximity-id:
    name: "Identification in proximity scenarios"
    description: "Secure in-person identification for services where the transaction requires strong assurance of identity."
    category: identification
    status: published
    ecManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/930451396/Identification+in+proximity+scenarios"
    pdfManualUrl: "https://ec.europa.eu/digital-building-blocks/sites/download/attachments/930451396/05_Use%20Case_Manual_The%20identification%20in%20proximity%20scenarios.pdf"
    # NFC/BLE proximity via ISO 18013-5, OID4VP for credential exchange
    technicalSpecs:
      - OpenID4VP
      - ISO 18013-5

  # === Legal representation ===
  representation:
    name: "Natural or legal person representation"
    description: "Enables users to act on behalf of another individual or an organisation using digitally verifiable credentials."
    category: legal
    status: coming_soon
    ecManualUrl: null
    pdfManualUrl: null
