# Custom Internal Dictionary
# ═══════════════════════════════════════════════════════════════════════════════
#
# This file contains curated terminology definitions for concepts that are
# commonly used in eIDAS 2.0 regulations but are NOT formally defined in
# the legal texts (i.e., not in a "Definitions" article).
#
# These terms are integrated into the terminology system WITHOUT "View Source"
# links - they blend in seamlessly with other terminology definitions.
#
# GUIDELINES:
#   1. Only add terms that are NOT already defined in regulations/implementing acts
#   2. Mark source inspiration for documentation purposes (not displayed in UI)
#   3. Use clear, concise definitions aligned with regulatory context
#   4. Verify no duplicates before adding new terms
#
# SOURCE TAGS (for internal documentation only):
#   - arf: Definition adapted from ARF Annex 1 Section A.4
#   - synthesized: Definition synthesized from regulatory context
#   - gdpr: Definition adapted from GDPR (with article reference)
#   - enisa: Definition adapted from ENISA terminology
#   - privacy-research: Definition from academic privacy literature
#
# CAPITALIZATION RULES:
#   Use LOWERCASE for common nouns and technical terms:
#     ✓ attestation, attestation provider, attestation type
#     ✓ intermediary, holder, verifier, notification
#     ✓ selective disclosure, unlinkability, data minimisation
#     ✓ namespace, keystore, pseudonym, zero knowledge proof
#     ✓ Latin terms: mutatis mutandis, inter alia, ex ante, ex post
#
#   Use CAPITALIZED for proper nouns & named entities:
#     ✓ Official EU terms: Member State, Third Country
#     ✓ Formal eIDAS terms: Relying Party, Wallet Unit
#     ✓ Named documents: PID Rulebook, mDL Rulebook, Attestation Rulebook
#     ✓ PKI formal terms: Certificate Authority, Certificate Policy,
#       Public Key Infrastructure, Trust Anchor
#     ✓ Formal ARF terms: Attestation Revocation List, Attestation Status List,
#       Technical Validity Period, Administrative Validity Period
#     ✓ Compound terms with formal parts: Relying Party Instance,
#       Holder Wallet Unit, Verifier Wallet Unit
#     ✓ Acronym expansions: SUA Attestation (Strong User Authentication)
#
#   Rule of thumb: If unsure, check how the term is written in the ARF or
#   EU legal texts. Common technical terms should be lowercase.
#
# SUPPORTED FIELDS PER TERM:
#   - term:        (required) The display name of the term
#   - definition:  (required) Single-line or multi-line (use >- for multi-line)
#   - source:      (recommended) Attribution text shown in the UI
#   - note:        (optional) Internal documentation only, not in output
#   - aliases:     (optional) List of abbreviation aliases (e.g., mDL, EHIC)
#                  These are injected into the search index so users can find
#                  the term by its abbreviation. Example:
#                    aliases:
#                      - EHIC
#
# ═══════════════════════════════════════════════════════════════════════════════

version: "1.0"
created: "2026-01-24"
last_updated: "2026-02-20"

terms:
  # ═══════════════════════════════════════════════════════════════════════════
  # Wallet Ecosystem Concepts
  # ═══════════════════════════════════════════════════════════════════════════

  - term: intermediary
    definition: >-
      A Relying Party that offers services to other (intermediated) Relying 
      Parties to, on their behalf, connect to Wallet Units and request the 
      User attributes that these intermediated Relying Parties need.
    source: ARF Annex 1, Section A.4
    note: See ARF Topic 52 - Relying Party intermediaries

  - term: Intermediated Relying Party
    definition: >-
      A Relying Party that uses an Intermediary to connect to Wallet Units 
      on its behalf, rather than connecting directly to the Wallet.
    source: Synthesized from ARF Topic 52
    note: Derived from ARF Topic 52 context

  - term: selective disclosure
    definition: >-
      The capability enabling the User to present a subset of the attributes
      included in a PID or attestation, rather than disclosing the entire
      credential. This is one of the ways in which wallets help to comply
      with the data protection principles enshrined in the GDPR, in
      particular the principles of data minimisation (Article 5(1)(c)) and
      purpose limitation. More generally, this feature allows users to have
      control over their personal data. For example, a user could share
      their date of birth without revealing their place of birth, allowing
      for greater privacy while still enabling access to digital services.
    source: ARF Annex 1, Section A.4; EUDIW FAQ
    note: Core privacy feature of EUDIW, referenced in eIDAS Recital 59

  - term: attestation
    definition: >-
      A collective term for a QEAA (Qualified Electronic Attestation of 
      Attributes), PuB-EAA (Public Sector Body EAA), or non-qualified EAA.
    source: ARF Annex 1, Section A.4
    note: Generic term for credential types

  - term: attestation provider
    definition: >-
      A collective term for QEAA Provider, PuB-EAA Provider, or non-qualified 
      EAA Provider—entities that issue electronic attestations of attributes.
    source: ARF Annex 1, Section A.4
    note: Generic term for issuer roles

  - term: Wallet Unit Attestation
    definition: >-
      A cryptographically signed or sealed data object, issued by the Wallet
      Provider for each Wallet Unit, that describes the components of the wallet
      unit and enables authentication and validation of those components.
      The WUA is a JWT containing public keys (whose corresponding private keys
      are protected by a WSCD), a revocation handle (status list URI + index),
      and an eudi_wallet_info claim with general_info (wallet provider name,
      solution ID, version, certification info) and key_storage_info (storage
      type, certification). It is signed using a certificate listed in the
      Trusted List. The WUA is presented only to PID Providers and Attestation
      Providers during issuance via OID4VCI (as a key_attestation element in
      the CredentialRequest), enabling them to verify that they are issuing
      credentials to a genuine, certified wallet unit and to make informed
      decisions about key binding based on WSCA/WSCD capabilities. To ensure
      User privacy, the Wallet Unit does not present the WUA to Relying Parties
      (ARF §6.5.3.4); data related to the User device must not be released
      to them (AS-WP-09-030). Instead, Relying Parties verify the Wallet Unit
      indirectly through transitive trust: the PID/attestation signature
      (verified against the Provider Trusted List), device key binding
      (mdoc DeviceAuth or SD-JWT Key Binding JWT), and cascaded revocation
      (if a WUA is revoked, the PID Provider must revoke the PID per
      CIR 2024/2977 Art. 5(4)(b)). Only the Wallet Provider may revoke a WUA,
      and privacy-preserving techniques (such as once-only attestations, batch
      issuance, or limited lifetimes) must be employed to prevent colluding
      PID Providers or Attestation Providers from correlating WUA presentations
      across issuance sessions (ARF Topic A).
    source: Synthesized from CIR 2024/2979 Art. 3(2), 6, 7, Rec. 8-9; CIR 2024/2982 Art. 3(8), 4(3)(b); CIR 2024/2977 Art. 3(9), 5(4)(b); CIR 2025/0847 Art. 5(1); ARF §6.5.3.4; TS3 v1.3
    note: Enriched functional definition; WUA is issuance-only (TS3 v1.0 removed presentation references); the terse legal definition appears in Art. 2 of four implementing acts

  - term: wallet provider
    definition: >-
      A natural or legal person who provides wallet solutions and bears
      end-to-end responsibility for the lifecycle of every wallet unit issued
      under those solutions. Wallet providers must obtain certification of their
      wallet solutions under national certification schemes before deployment
      (CIR 2024/2981). Their core obligations include: (1) issuing and signing
      wallet unit attestations (WUAs) for each wallet unit, using certificates
      listed in the Trusted List (CIR 2024/2979 Art. 3(2), 6); (2) ensuring
      the integrity, authenticity, and confidentiality of communication between
      wallet instances and wallet secure cryptographic applications (CIR 2024/2979
      Art. 4(2)); (3) guaranteeing that wallet units support standard protocols
      and interfaces for PID and EAA issuance, attribute presentation (both
      remote and proximity), selective disclosure, data erasure requests, and
      relying party reporting (CIR 2024/2982 Art. 3-8); (4) maintaining
      transaction logs with integrity, authenticity, and confidentiality, and
      enabling wallet users to export logged information (CIR 2024/2979
      Art. 10); (5) being the sole entity capable of revoking WUAs, with
      obligations to publish revocation status in a privacy-preserving manner
      and inform affected users within 24 hours (CIR 2024/2979 Art. 7);
      (6) ensuring wallet users who are natural persons have free-of-charge
      access to signature creation applications for non-professional purposes
      (CIR 2024/2979 Art. 12(3)); and (7) processing embedded disclosure
      policies attached to attestations (CIR 2024/2979 Art. 11).
    source: Synthesized from CIR 2024/2979 Art. 3-12; CIR 2024/2981 Art. 3-5; CIR 2024/2982 Art. 3-8; CIR 2025/0847 Art. 5; eIDAS Art. 5a
    note: Enriched functional definition; the terse legal definition ("a natural or legal person who provides wallet solutions") appears in Art. 2 of nine implementing acts

  - term: wallet user
    definition: >-
      A user who is in control of the wallet unit — the natural or legal person
      (or a natural person representing another) who operates a wallet unit to
      store, manage, and present person identification data and electronic
      attestations of attributes. The wallet user's rights and protections
      include: (1) full control over which attributes are shared with relying
      parties, with the ability to selectively disclose a subset of attributes
      from any PID or attestation (CIR 2024/2982 Art. 5(4)); (2) the right to
      request erasure of personal data from relying parties via standardised
      wallet interfaces (CIR 2024/2982 Art. 6, GDPR Art. 17); (3) the ability
      to report relying parties to data protection authorities directly through
      the wallet dashboard (CIR 2024/2982 Art. 7); (4) access to a transaction
      log recording all interactions, with the ability to export logged data
      (CIR 2024/2979 Art. 10); (5) transparent notification within 24 hours if
      their wallet unit attestation is revoked by the wallet provider, including
      the reason and consequences (CIR 2024/2979 Art. 7(3)); (6) the right to
      verify the identity and registration status of relying parties before
      sharing data (eIDAS Art. 5a(4)(a), Art. 5b(8)); and (7) free-of-charge
      access to qualified electronic signature creation for non-professional
      purposes (CIR 2024/2979 Art. 12(3), eIDAS Art. 5a(2)).
    source: Synthesized from CIR 2024/2979 Art. 7(3), 10, 12(3); CIR 2024/2982 Art. 5(4), 6, 7; eIDAS Art. 5a(2), 5a(4), 5a(16); ARF Annex 1 Section A.3
    note: Enriched functional definition; the terse legal definition ("a user who is in control of the wallet unit") appears in Art. 2 of nine implementing acts

  - term: wallet instance
    definition: >-
      The application installed and configured on a wallet user's device or
      environment, which is part of a wallet unit (together with a WSCA and
      WSCD), and that the wallet user uses to interact with the wallet unit.
      The wallet instance serves as the primary interface for all wallet
      operations: (1) it presents wallet unit attestations (WUAs) to PID
      providers and attestation providers during issuance for trust
      establishment (CIR 2024/2982 Art. 3) — WUAs are not presented to
      relying parties (ARF §6.5.3.4, AS-WP-09-030); (2) it manages the issuance flow for receiving
      person identification data and electronic attestations of attributes,
      verifying that issuers hold valid wallet-relying party access certificates
      before accepting credentials (CIR 2024/2982 Art. 4(2)); (3) it handles
      attribute presentation (both remote and proximity), ensuring selective
      disclosure and user consent (CIR 2024/2982 Art. 5); (4) it interfaces
      with the WSCA, which in turn uses the WSCD, to perform cryptographic
      operations such as signing, key generation, and proof-of-possession
      (CIR 2024/2979 Art. 4-5); (5) it maintains the transaction dashboard
      where users review interaction logs and manage their credentials
      (CIR 2024/2980); and (6) it supports qualified electronic signature and
      seal creation by interfacing with local, external, or remote QSCDs
      (CIR 2024/2979 Art. 12). The wallet provider must ensure the integrity,
      authenticity, and confidentiality of communication between wallet
      instances and WSCAs (CIR 2024/2979 Art. 4(2)).
    source: Synthesized from CIR 2024/2979 Art. 4-5, 10, 12; CIR 2024/2980 Art. 3-5; CIR 2024/2982 Art. 3-7; ARF Annex 1 Section A.3
    note: Enriched functional definition; the legal definition appears in Art. 2 of nine implementing acts

  - term: electronic attestation of attributes
    definition: >-
      An attestation in electronic form that allows attributes to be
      authenticated — a verifiable digital credential containing a set of
      attributes (characteristics, qualities, rights, or permissions) about a
      natural or legal person. Electronic attestations of attributes (EAAs) are
      the general credential type in the EUDI Wallet ecosystem and exist in
      three tiers: (1) Qualified EAAs (QEAAs), issued by qualified trust
      service providers and meeting the requirements of eIDAS Annex V, with
      the same legal effect as legally issued paper attestations (eIDAS
      Art. 45f); (2) EAAs issued by or on behalf of public sector bodies
      (PuB-EAAs), issued from authentic sources with equivalent recognition
      (eIDAS Art. 45f); and (3) non-qualified EAAs, which may be issued by
      any provider. Providers issuing EAAs to wallet units must identify
      themselves using wallet-relying party access certificates (CIR 2024/2977
      Art. 4(2)) and ensure that attestations contain the information necessary
      for authentication and validation (CIR 2024/2977 Art. 4(3)). EAAs shall
      be cryptographically bound to the wallet unit using the standards in
      CIR 2024/2979 Annex II, and providers may embed disclosure policies
      specifying conditions that relying parties must meet to access the
      attestation (CIR 2024/2979 Art. 11, CIR 2024/2982 Art. 2(13)). Wallet
      users can selectively disclose individual attributes from an EAA without
      revealing the full credential (CIR 2024/2982 Art. 5(4)). The Commission
      informally refers to EAAs as 'digital documents' in its public-facing
      communications.
    source: Synthesized from eIDAS Art. 3(44-46), 45d-45g; CIR 2024/2977 Art. 4; CIR 2024/2979 Art. 8, 11, Annex II; CIR 2024/2982 Art. 2(13), 5(4); ARF Annex 1 Section A.2; EUDIW FAQ
    note: Enriched functional definition; the terse legal definition ("an attestation in electronic form that allows attributes to be authenticated") appears in eIDAS Art. 3(44)

  - term: relying party
    definition: >-
      A natural or legal person that relies upon electronic identification,
      European Digital Identity Wallets or other electronic identification
      means, or upon a trust service. Relying parties that specifically
      intend to interact with EUDI Wallet Units are termed wallet-relying
      parties and are subject to additional registration, authentication,
      and data-minimisation obligations (see wallet-relying party).
      Intermediaries acting on behalf of relying parties are deemed to be
      relying parties themselves and shall not store personal data exchanged
      during the interaction (eIDAS Art. 5b(10)). Public sector relying
      parties shall accept wallets within 24 months of the implementing
      acts entering into force; private sector relying parties in regulated
      sectors shall accept them within 36 months, upon voluntary user
      request (eIDAS Art. 5b(10), 5c(2)).
    source: eIDAS Art. 3(6), 5b, 5c
    note: Enriched functional definition; detailed wallet-specific obligations are under wallet-relying party

  - term: attribute
    definition: >-
      A characteristic, quality, right, or permission of a natural or legal
      person or of an object. In the EUDI Wallet ecosystem, attributes are
      the fundamental units of information that are issued, stored, and
      presented through electronic attestations. They encompass a wide range
      of data: from person identification data (name, date of birth, nationality)
      to professional qualifications, health credentials, driving licences,
      and organisational permissions. Attributes are structured within
      namespaces that define their identifier, syntax, and semantics (ARF
      Annex 1 Section A.4), and are governed by attestation rulebooks that
      specify their encoding formats and issuance requirements (ARF Topic 12).
      During presentation, wallet users may selectively disclose individual
      attributes rather than the entire attestation (CIR 2024/2982 Art. 5(4)),
      and relying parties shall not request attributes beyond those registered
      for their intended purpose (eIDAS Art. 5b(3)). Attributes may be issued
      from authentic sources — repositories held by public or private entities
      recognised as authoritative for that information (eIDAS Art. 3(47)).
    source: Synthesized from eIDAS Art. 3(43, 44, 47), 5b(3); CIR 2024/2982 Art. 5(4); ARF Annex 1 Section A.2, A.4 (namespace, attestation type)
    note: Enriched functional definition; the terse legal definition ("a characteristic, quality, right or permission") appears in eIDAS Art. 3(43)

  - term: qualified trust service provider
    definition: >-
      A trust service provider who provides one or more qualified trust services
      and is granted the qualified status by the supervisory body. Qualified
      trust service providers (QTSPs) occupy the highest tier of trust in the
      eIDAS framework and must: (1) undergo an initial conformity assessment by
      an accredited conformity assessment body before commencing operations, then
      be assessed at least every 24 months thereafter (eIDAS Art. 20(1));
      (2) submit a conformity assessment report to the supervisory body, which
      grants or withdraws qualified status (eIDAS Art. 21(1)); (3) be listed
      in the national Trusted List published by the Member State as providing
      qualified trust services (eIDAS Art. 22); (4) bear financial liability
      for damage caused to any person due to failure to comply with eIDAS
      obligations, with the burden of proof placed on the QTSP to demonstrate
      it did not act negligently (eIDAS Art. 13); (5) use trustworthy systems
      and products protected against modification, ensure that personal data
      can be processed only with consent or other legal basis, and take
      appropriate measures against forgery and theft (eIDAS Art. 24(2));
      (6) maintain a termination plan to ensure continuity of service and
      inform the supervisory body at least three months before ceasing
      operations (eIDAS Art. 24(2)(h-i)); and (7) in the context of the
      EUDI Wallet, issue qualified electronic attestations of attributes
      (QEAAs), qualified certificates for electronic signatures and seals,
      and other qualified trust services (eIDAS Art. 45d-45e).
    source: Synthesized from eIDAS Art. 3(18, 20), 13, 20-24, 45d-45e; ARF Annex 1 Section A.2
    note: Enriched functional definition; the terse legal definition ("a trust service provider who provides one or more qualified trust services and is granted the qualified status by the supervisory body") appears in eIDAS Art. 3(20)

  - term: trust service provider
    definition: >-
      A natural or a legal person who provides one or more trust services,
      either as a qualified or as a non-qualified trust service provider. Trust
      service providers (TSPs) form the backbone of the eIDAS trust
      infrastructure, offering services such as electronic signatures, seals,
      time stamps, registered delivery, website authentication certificates,
      and electronic attestations of attributes. Their obligations include:
      (1) taking appropriate technical and organisational measures to manage
      risks to the security of their services, and notifying the supervisory
      body and affected persons of any security breach without undue delay
      (eIDAS Art. 19); (2) where qualified, undergoing mandatory conformity
      assessments at least every 24 months (eIDAS Art. 20); (3) ensuring
      that qualified trust services are listed in national Trusted Lists
      (eIDAS Art. 22); (4) verifying the identity of applicants before issuing
      qualified certificates (eIDAS Art. 24(1)); and (5) in the EUDI Wallet
      context, identifying themselves to wallet units using wallet-relying
      party access certificates when issuing attestations (CIR 2024/2977
      Art. 4(2)). Non-qualified TSPs are subject to lighter supervisory
      requirements but must still comply with baseline security and
      notification obligations. The distinction between qualified and
      non-qualified status determines the legal effect of services provided
      (eIDAS Art. 24 vs. Art. 19).
    source: Synthesized from eIDAS Art. 3(19), 19-24; CIR 2024/2977 Art. 4(2); ARF Annex 1 Section A.2
    note: Enriched functional definition; the terse legal definition ("a natural or a legal person who provides one or more trust services") appears in eIDAS Art. 3(19)

  - term: qualified electronic attestation of attributes
    definition: >-
      An electronic attestation of attributes which is issued by a qualified
      trust service provider and meets the requirements laid down in Annex V
      of the eIDAS Regulation. Qualified EAAs (QEAAs) represent the highest
      tier of verifiable credentials in the EUDI Wallet ecosystem and carry
      enhanced legal effects: they shall have the same legal effect as
      lawfully issued attestations in paper form (eIDAS Art. 45f(1)), and
      QEAAs issued in one Member State shall be recognised in all other Member
      States (eIDAS Art. 45f(2)). To achieve qualified status, the issuing
      QTSP must: (1) verify the attributes against authentic sources or
      equivalent authoritative records (eIDAS Annex V); (2) verify the
      identity of the person to whom the attestation is issued (eIDAS
      Art. 45d(2)); (3) include mandatory metadata such as the issuer
      identity, issuance and expiry dates, attestation type, and the scheme
      under which it was issued (eIDAS Annex V); (4) cryptographically bind
      the attestation to the wallet unit using standards from CIR 2024/2979
      Annex II; and (5) provide mechanisms for verifying the attestation's
      validity status, including revocation checking (eIDAS Art. 45e).
      QTSPs issuing QEAAs must hold a valid wallet-relying party access
      certificate to identify themselves to wallet units during issuance
      (CIR 2024/2977 Art. 4(2)).
    source: Synthesized from eIDAS Art. 3(46), 45d-45f, Annex V; CIR 2024/2977 Art. 4(2-3); CIR 2024/2979 Art. 8, Annex II; ARF Annex 1 Section A.2
    note: Enriched functional definition; the terse legal definition ("an electronic attestation of attributes which is issued by a qualified trust service provider and meets the requirements laid down in Annex V") appears in eIDAS Art. 3(46)

  - term: cryptographic binding
    definition: >-
      The method used to link person identification data or electronic
      attestations of attributes to a wallet unit, ensuring that a credential
      can only be presented by the wallet unit to which it was issued. This is
      achieved by cryptographically tying the attestation to public keys whose
      corresponding private keys are protected within the wallet unit's WSCD
      (wallet secure cryptographic device). Specifically: (1) during issuance,
      the PID provider or attestation provider binds the credential to one or
      more public keys generated by the wallet unit's WSCA and protected by
      its WSCD (CIR 2024/2979 Art. 5, 6); (2) during presentation, the wallet
      unit proves possession of the corresponding private keys to the relying
      party, demonstrating that the credential has not been transferred to
      another device (CIR 2024/2982 Art. 5(3)); (3) the binding must follow
      the cryptographic standards listed in CIR 2024/2979 Annex II, which
      specify the acceptable signature schemes, key types, and binding
      mechanisms; and (4) the binding mechanism must be resistant to attackers
      with high attack potential, as required by the national certification
      schemes (CIR 2024/2981 Annex IV). Cryptographic binding is distinct
      from device binding (which ties credentials to the physical device) and
      is the primary mechanism preventing credential cloning, transfer, and
      replay attacks in the EUDI Wallet ecosystem.
    source: Synthesized from CIR 2024/2979 Art. 2(3), 5, 6, Annex II; CIR 2024/2982 Art. 5(3); CIR 2024/2981 Annex IV; ARF Annex 1 Section A.3
    note: Enriched functional definition; the terse legal definition ("the method to link person identification data or electronic attestations of attributes to a wallet unit") appears in CIR 2024/2979 Art. 2(3)

  - term: wallet secure cryptographic device
    definition: >-
      A tamper-resistant device that provides an environment that is linked to
      and used by the wallet secure cryptographic application (WSCA) to protect
      critical assets and provide cryptographic functions for the secure
      execution of critical operations. The WSCD is the hardware root of trust
      in the EUDI Wallet architecture. Its key properties and requirements
      include: (1) it protects cryptographic private keys throughout their
      entire lifecycle — generation, storage, and use — such that private keys
      are never exposed outside the WSCD boundary (CIR 2024/2979 Art. 4-5);
      (2) it must be resistant to attackers with high attack potential, as
      assessed under the requirements of assurance level high in Implementing
      Regulation 2015/1502 (CIR 2024/2981 Annex IV); (3) it must be certified
      to at least Common Criteria EAL4 with advanced methodical vulnerability
      analysis comparable to AVA_VAN.5, or equivalent (CIR 2024/2981 Rec. 7);
      (4) it may take several physical forms including embedded secure elements
      (eSE) in user devices, external smartcards, or remote HSM-based
      implementations (ARF Topic 9); (5) when not provided by the wallet
      provider (e.g. an eSE embedded in the user's phone), the wallet solution
      must establish and verify assumptions about the WSCD's security
      properties as part of its certification (CIR 2024/2981 Annex IV);
      and (6) cryptographic operations performed in the WSCD are not required
      to be fully self-contained, but the WSCD must guarantee protection of
      those operations against high-potential attacks (CIR 2024/2981 Annex IV).
    source: Synthesized from CIR 2024/2979 Art. 2(12), 4-5; CIR 2024/2981 Rec. 7, Annex IV; ARF Annex 1 Section A.3 (Topic 9)
    note: Enriched functional definition; the legal definition appears in Art. 2 of nine implementing acts

  - term: wallet secure cryptographic application
    definition: >-
      An application that manages critical assets by being linked to and using
      the cryptographic and non-cryptographic functions provided by the wallet
      secure cryptographic device (WSCD). The WSCA is the software layer that
      mediates between the wallet instance and the WSCD, orchestrating all
      security-critical operations. Its key roles include: (1) managing
      cryptographic keys — requesting key generation within the WSCD,
      maintaining references to keys, and invoking signing and decryption
      operations (CIR 2024/2979 Art. 4-5); (2) protecting critical assets
      beyond just keys, including wallet unit attestation data, user
      authentication secrets, and attestation-binding proofs (CIR 2024/2979
      Rec. 6); (3) supporting the presentation of electronic attestations of
      attributes, which is identified as a crucial WSCA functionality
      (CIR 2024/2979 Rec. 6); (4) being subject to certification under
      national certification schemes, where it must demonstrate resistance
      against attackers with high attack potential (CIR 2024/2981 Annex IV);
      (5) when provided as a Java Card applet to embedded secure elements,
      following the technical specifications listed in CIR 2024/2979 Annex I
      (CIR 2024/2979 Art. 4(2)); and (6) the wallet provider must ensure the
      integrity, authenticity, and confidentiality of all communication between
      wallet instances and WSCAs (CIR 2024/2979 Art. 4(2)).
    source: Synthesized from CIR 2024/2979 Art. 2(11), 4-5, Rec. 6, Annex I; CIR 2024/2981 Annex IV; ARF Annex 1 Section A.3
    note: Enriched functional definition; the legal definition appears in Art. 2 of nine implementing acts

  - term: person identification data
    definition: >-
      A set of data that is issued in accordance with Union or national law
      and that enables the establishment of the identity of a natural or legal
      person, or of a natural person representing another natural person or
      a legal person. Person identification data (PID) is the foundational
      credential in the EUDI Wallet ecosystem — every wallet unit must
      contain at least one valid PID before it can be used for other
      operations (eIDAS Art. 5a(4)(d)). Key aspects include: (1) PID is
      issued exclusively by Member States (or entities mandated by them)
      and constitutes the authoritative digital identity of the holder
      (eIDAS Art. 5a(12)); (2) it must be issued free of charge to every
      natural person who requests it (eIDAS Art. 5a(16)); (3) PID must be
      cryptographically bound to the wallet unit via the WSCD, preventing
      transfer to another wallet (CIR 2024/2979 Art. 5-6); (4) PID
      providers must identify themselves to the wallet unit using
      wallet-relying party access certificates before issuance
      (CIR 2024/2977 Art. 4(2)); (5) the minimum mandatory PID attributes
      include current family name(s), current first name(s), date of birth,
      and a unique persistent identifier, with optional attributes such as
      nationality, address, and document metadata specified by the
      Commission (eIDAS Art. 5a(13)); and (6) PID supports selective
      disclosure, allowing users to present only a subset of their identity
      attributes (CIR 2024/2982 Art. 5(4)).
    source: Synthesized from eIDAS Art. 3(3), 5a(4)(d), 5a(12-16); CIR 2024/2977 Art. 4(2); CIR 2024/2979 Art. 5-6; CIR 2024/2982 Art. 5(4); ARF Annex 1 Section A.2
    note: Enriched functional definition; the terse legal definition appears in eIDAS Art. 3(3)

  - term: wallet-relying party access certificate
    definition: >-
      A certificate for electronic seals or signatures authenticating and
      validating the wallet-relying party, issued by a provider of
      wallet-relying party access certificates. These certificates are the
      trust anchor through which relying parties prove their identity and
      authorisation to wallet units during all interactions. Key aspects
      include: (1) they are mandatory — any entity wishing to request
      attributes from or issue attestations to a wallet unit must present
      a valid access certificate (CIR 2024/2977 Art. 3(12), CIR 2024/2982
      Art. 2(10-11)); (2) they are issued exclusively by providers mandated
      by Member States (access certificate authorities), creating a
      government-anchored chain of trust (CIR 2024/2977 Art. 3(13));
      (3) the certificate must contain the relying party's registered
      identity and the specific attributes they are authorised to request,
      enabling the wallet to enforce data minimisation at the protocol
      level (CIR 2024/2982 Art. 5(2)); (4) wallet instances must verify
      the validity and revocation status of access certificates before
      accepting issuance requests or sharing attributes (CIR 2024/2982
      Art. 4(2), 5(2)); and (5) the technical format and content
      requirements for access certificates are specified in CIR 2024/2977
      Art. 3 and the standards listed in CIR 2024/2979 Annex II.
    source: Synthesized from CIR 2024/2977 Art. 2(12-13), 3; CIR 2024/2979 Art. 2(14), Annex II; CIR 2024/2982 Art. 2(10-11), 4(2), 5(2)
    note: Enriched functional definition; the legal definition appears in Art. 2 of five implementing acts

  - term: wallet-relying party
    definition: >-
      A relying party that intends to rely upon wallet units. This term
      distinguishes entities that interact specifically with EUDI Wallets
      from the broader eIDAS concept of relying party. Wallet-relying
      parties encompass three functional roles: (1) PID providers that
      issue person identification data to wallet units (CIR 2024/2982
      Art. 2(1)); (2) attestation providers that issue electronic
      attestations of attributes (including QEAAs and PuB-EAAs) to wallet
      units (CIR 2024/2982 Art. 2(1)); and (3) verifiers that request and
      validate attributes from wallet units during presentation flows
      (CIR 2024/2982 Art. 5). All wallet-relying parties must: register
      with their Member State (eIDAS Art. 5b(1)); obtain a wallet-relying
      party access certificate from a mandated provider (CIR 2024/2977
      Art. 3(12-13)); authenticate themselves to wallet units using that
      certificate (CIR 2024/2982 Art. 5(2)); and comply with embedded
      disclosure policies attached to attestations (CIR 2024/2979 Art. 11).
      The wallet must enable its user to verify the identity of the
      wallet-relying party before proceeding with any data exchange (eIDAS
      Art. 5a(4)(a), CIR 2024/2982 Art. 5(5)).
    source: Synthesized from eIDAS Art. 5a(4)(a), 5b; CIR 2024/2977 Art. 3(12-13); CIR 2024/2979 Art. 11; CIR 2024/2982 Art. 2(1, 10-14), 5
    note: Enriched functional definition; the legal definition appears in Art. 2 of six implementing acts

  - term: embedded disclosure policy
    definition: >-
      A set of rules, embedded in an electronic attestation of attributes by
      its provider, that indicates the conditions that a wallet-relying party
      has to meet to access the electronic attestation of attributes. Embedded
      disclosure policies are a privacy-by-design mechanism that allows
      attestation providers to enforce access controls beyond what the wallet
      user alone decides. Key aspects include: (1) the policy is embedded at
      issuance time and travels with the attestation throughout its lifecycle
      (CIR 2024/2979 Art. 11); (2) wallet providers must implement
      mechanisms to evaluate and enforce these policies during presentation
      flows, ensuring that relying parties meet the specified conditions
      before attributes are disclosed (CIR 2024/2979 Art. 11); (3) the
      conditions may restrict which categories of relying parties may access
      the attestation, based on their registered purpose or sector
      (CIR 2024/2982 Art. 2(13)); (4) the wallet instance must inform the
      user about the embedded policy and its implications before presenting
      the attestation (CIR 2024/2982 Art. 5(5)); and (5) embedded
      disclosure policies work in conjunction with, not as a replacement
      for, the user's own consent — the user retains final control over
      whether to share the attestation (CIR 2024/2982 Art. 5(4)).
    source: Synthesized from CIR 2024/2979 Art. 2(9), 11; CIR 2024/2981 Art. 2(14); CIR 2024/2982 Art. 2(13), 5(4-5)
    note: Enriched functional definition; the legal definition appears in Art. 2 of three implementing acts

  - term: electronic signature
    definition: >-
      Data in electronic form which is attached to or logically associated
      with other data in electronic form and which is used by the signatory
      to sign. The eIDAS Regulation establishes a three-tier hierarchy of
      electronic signatures with increasing legal strength: (1) simple
      electronic signatures, which shall not be denied legal effect solely
      because they are in electronic form (eIDAS Art. 25(1)); (2) advanced
      electronic signatures, which must be uniquely linked to and capable
      of identifying the signatory, created using data under the signatory's
      sole control, and linked to the signed data so that any subsequent
      change is detectable (eIDAS Art. 26); and (3) qualified electronic
      signatures, created by a qualified signature creation device and based
      on a qualified certificate, which have the legal effect equivalent to
      handwritten signatures across all Member States (eIDAS Art. 25(2-3)).
      In the EUDI Wallet context, wallet users who are natural persons must
      have free-of-charge access to qualified electronic signature creation
      for non-professional purposes (eIDAS Art. 5a(2)), with the wallet
      interfacing with local, external, or remote QSCDs for key operations
      (CIR 2024/2979 Art. 12).
    source: Synthesized from eIDAS Art. 3(10-12), 25-26; CIR 2024/2979 Art. 12; eIDAS Art. 5a(2)
    note: Enriched functional definition; the terse legal definition appears in eIDAS Art. 3(10)

  - term: electronic seal
    definition: >-
      Data in electronic form, which is attached to or logically associated
      with other data in electronic form to ensure the latter's origin and
      integrity. Electronic seals are the organisational counterpart of
      electronic signatures — where signatures are for natural persons,
      seals are for legal persons (organisations). The eIDAS Regulation
      establishes a parallel three-tier hierarchy: (1) simple electronic
      seals, which shall not be denied legal effect solely because they are
      in electronic form (eIDAS Art. 35(1)); (2) advanced electronic seals,
      which must be uniquely linked to and capable of identifying the
      creator, created using data under the creator's high degree of
      confidence, and linked to the sealed data so that changes are
      detectable (eIDAS Art. 36); and (3) qualified electronic seals,
      which enjoy a presumption of integrity and correctness of origin
      across all Member States (eIDAS Art. 35(2)). In the EUDI Wallet
      ecosystem, electronic seals play critical infrastructure roles:
      wallet unit attestations are signed or sealed by wallet providers
      (CIR 2024/2979 Art. 3(2)), wallet-relying party access certificates
      are certificates for seals or signatures (CIR 2024/2977 Art. 3(12)),
      and attestation providers seal the credentials they issue to wallet
      units (CIR 2024/2977 Art. 4).
    source: Synthesized from eIDAS Art. 3(25-27), 35-36; CIR 2024/2979 Art. 3(2); CIR 2024/2977 Art. 3(12), 4
    note: Enriched functional definition; the terse legal definition appears in eIDAS Art. 3(25)

  - term: qualified electronic signature
    definition: >-
      An advanced electronic signature that is created by a qualified
      electronic signature creation device, and which is based on a
      qualified certificate for electronic signatures. Qualified electronic
      signatures represent the highest level of electronic signing under
      eIDAS and carry the legal equivalence of handwritten signatures
      (eIDAS Art. 25(2)). A QES issued in one Member State shall be
      recognised as such in all other Member States (eIDAS Art. 25(3)).
      In the EUDI Wallet context: (1) every wallet must provide access to
      qualified electronic signature creation functionality for natural
      persons, free of charge for non-professional purposes (eIDAS
      Art. 5a(2)); (2) the wallet may use a local QSCD (embedded in the
      user's device), an external QSCD (e.g. a smartcard), or a remote
      QSCD managed by a qualified trust service provider (CIR 2024/2979
      Art. 12); (3) the QSCD must meet the requirements of eIDAS Annex II
      and be certified accordingly (eIDAS Art. 29-30); and (4) the wallet
      provider must ensure the registration of the user's identity by a
      QTSP before issuing qualified certificates for signatures
      (eIDAS Art. 24(1)).
    source: Synthesized from eIDAS Art. 3(12), 25-26, 28-30, Annex II; CIR 2024/2979 Art. 12; eIDAS Art. 5a(2)
    note: Enriched functional definition; the legal definition appears in eIDAS Art. 3(12)

  - term: qualified electronic seal
    definition: >-
      An advanced electronic seal, which is created by a qualified electronic
      seal creation device, and that is based on a qualified certificate for
      electronic seal. Qualified electronic seals are the organisational
      equivalent of qualified electronic signatures — they provide the
      strongest level of integrity and origin assurance for data sealed by
      legal persons. A QESeal enjoys a presumption of integrity of the data
      and of correctness of the origin of the data to which it is linked
      (eIDAS Art. 35(2)), and when issued in one Member State it shall be
      recognised in all others (eIDAS Art. 35(3)). In the EUDI Wallet
      ecosystem, qualified electronic seals are integral to the trust
      infrastructure: (1) wallet unit attestations (WUAs) are signed or
      sealed by wallet providers using qualified certificates
      (CIR 2024/2979 Art. 3(2)); (2) PID providers and attestation
      providers seal the credentials they issue (CIR 2024/2977 Art. 4);
      and (3) wallet-relying party access certificates may be certificates
      for electronic seals (CIR 2024/2977 Art. 3(12)).
    source: Synthesized from eIDAS Art. 3(27), 35-36, 38-40, Annex III; CIR 2024/2979 Art. 3(2); CIR 2024/2977 Art. 3(12), 4
    note: Enriched functional definition; the legal definition appears in eIDAS Art. 3(27)

  - term: qualified trust service
    definition: >-
      A trust service that meets the applicable requirements laid down in the
      eIDAS Regulation. Qualified status is the regulatory quality mark that
      elevates a trust service to the highest tier of legal recognition. To
      achieve and maintain qualified status: (1) the trust service provider
      must undergo a conformity assessment by an accredited conformity
      assessment body (eIDAS Art. 20-21); (2) the service must be listed
      in the national Trusted List published by the Member State (eIDAS
      Art. 22); (3) the service must comply with the specific requirements
      laid down for each service type — qualified certificates for
      electronic signatures (eIDAS Art. 28, Annex I), qualified
      certificates for electronic seals (eIDAS Art. 38, Annex III),
      qualified time stamps (eIDAS Art. 42), qualified electronic
      registered delivery (eIDAS Art. 44), qualified website authentication
      certificates (eIDAS Art. 45a), qualified electronic attestations of
      attributes (eIDAS Art. 45d-45e), qualified electronic archiving
      (eIDAS Art. 45g), and qualified electronic ledgers (eIDAS Art. 45i);
      and (4) qualified trust services shall be recognised across all
      Member States without additional requirements, ensuring cross-border
      interoperability. The distinction between qualified and non-qualified
      services fundamentally affects legal effect: qualified electronic
      signatures have handwritten-equivalent status (eIDAS Art. 25(2)),
      qualified seals enjoy a presumption of integrity (eIDAS Art. 35(2)),
      and QEAAs have the legal effect of lawfully issued paper attestations
      (eIDAS Art. 45f(1)).
    source: Synthesized from eIDAS Art. 3(17), 20-24, 25(2), 35(2), 45f(1); eIDAS Annexes I, III
    note: Enriched functional definition; the extremely terse legal definition ("a trust service that meets the applicable requirements laid down in this Regulation") appears in eIDAS Art. 3(17)

  - term: validation
    definition: >-
      The process of verifying and confirming that data in electronic form
      are valid in accordance with the eIDAS Regulation. In the EUDI Wallet
      ecosystem, validation is a multi-layered operation that occurs at
      several points: (1) wallet instance validation — the wallet verifies
      the wallet-relying party access certificate presented by relying
      parties or issuers, checking its authenticity, validity period, and
      revocation status before proceeding (CIR 2024/2982 Art. 4(2), 5(2));
      (2) WUA validation — PID providers and attestation providers validate
      the wallet unit attestation during issuance to confirm they are
      interacting with a genuine, certified wallet unit (CIR 2024/2982
      Art. 3); relying parties do not receive or validate WUAs directly but
      rely on transitive trust through the issuer's verification; (3) attestation
      validation — relying parties verify the cryptographic binding,
      issuer signatures/seals, validity period, and revocation status of
      PIDs and EAAs received from wallets (eIDAS Art. 5b(9), CIR 2024/2982
      Art. 5(3)); (4) signature/seal validation — qualified validation
      services for electronic signatures and seals confirm the qualified
      status and validity of signatures/seals at a given time (eIDAS
      Art. 33, 40); and (5) validation must be performed in accordance
      with the cryptographic standards listed in CIR 2024/2979 Annex II,
      using the trust anchors published in national Trusted Lists
      (eIDAS Art. 22).
    source: Synthesized from eIDAS Art. 3(41), 22, 33, 40, 5b(9); CIR 2024/2979 Annex II; CIR 2024/2982 Art. 3, 4(2), 5(2-3)
    note: Enriched functional definition; the terse legal definition ("the process of verifying and confirming that data in electronic form are valid") appears in eIDAS Art. 3(41)

  - term: transaction
    definition: >-
      A discrete interaction between a user and another party, carried out
      through the European Digital Identity Wallet or within the broader scope
      of electronic identification and trust services. In the Regulation's
      title and subject-matter clause, the full phrase "electronic transaction"
      denotes the entire domain of interactions in the internal market that
      require secure electronic identification, authentication, or trust
      services (eIDAS Art. 1(b)); each individual wallet operation is a
      species of this broader category. In the EUDI Wallet context, the term
      takes on specific operational meaning: (1) dashboard logging — the
      wallet must provide "a log of all transactions" recording the time
      and date, counterpart identification, personal data requested, and
      data shared (eIDAS Art. 5a(4)(d); Reg. 2024/1183 Recital 13); each
      discrete wallet operation — issuance, presentation, signing, or
      pseudonym exchange — constitutes a logged transaction; (2) anti-tracking —
      providers of electronic attestations of attributes must prevent the
      collection of data that allows "transactions or user behaviour" to be
      tracked across relying parties (eIDAS Art. 5a(16)(a)); (3) intermediary
      data protection — intermediaries involved in the presentation of
      attestations of attributes shall not store data about the content of
      the transaction (eIDAS Art. 5b(10)); (4) liability — liability arises
      for failures "in a cross-border transaction" (eIDAS Art. 11a).
      In the ARF, the term takes on further technical precision: "remote
      presentation transaction flows" (ARF §4.4.3) and "Wallet-to-Wallet
      transaction flows" (ARF §6.6.4.2) describe specific protocol-level
      message exchanges for credential presentation.
    source: Synthesized from eIDAS Art. 1(b), 5, 5a(4)(d), 5a(16)(a), 5b(10), 11a; Reg. 2024/1183 Recital 13; ARF §4.4.3, §6.6.4.2
    note: >-
      The full phrase "electronic transaction" appears in the Regulation's
      title, Art. 1(b), Art. 5, and original eIDAS 1.0 Recitals (1), (2),
      (17), (63), and functions as the domain-scoping term for the entire
      Regulation. The bare form "transaction" is used operationally in the
      EUDI Wallet provisions (Art. 5a, 5b, 11a) to denote individual logged
      interactions. The two forms are in a genus–species relationship:
      "electronic transaction" is the class, and each wallet "transaction"
      is an instance. Not to be confused with "session" — a transaction may
      comprise multiple protocol exchanges within a single session, or a
      single session may involve multiple transactions.

  - term: Relying Party Instance
    definition: >-
      A software and/or hardware module with the capability to interact with 
      a Wallet Unit and to perform Relying Party authentication, that is 
      controlled by a Relying Party.
    source: ARF Annex 1, Section A.4
    note: Technical component of RP infrastructure

  # ═══════════════════════════════════════════════════════════════════════════
  # Privacy & Security Concepts
  # ═══════════════════════════════════════════════════════════════════════════

  - term: pseudonym
    definition: >-
      A unique, wallet-specific identifier that can be chosen by the user
      and used for interactions with a specific relying party. Pseudonyms
      help prevent user tracking across services while enabling seamless
      authentication. In accordance with the state of the art, pseudonym
      generation follows WebAuthn standards and is designed to limit data
      exposure during transactions. The underlying technical property is
      that a pseudonym does not allow inference of the User's attributes
      or person identification data, without additional information kept
      separately by the issuer of the data.
    source: ARF Annex 1, Section A.4; CIR 2024/2979 Art. 14; EUDIW FAQ
    note: Distinct from GDPR pseudonymisation; see eIDAS Article 5a(4)(b). WebAuthn alignment per CIR 2024/2979 Art. 14.

  - term: unlinkability
    definition: >-
      A privacy-preserving property ensuring that an observer cannot 
      sufficiently determine whether multiple items of interest (such as 
      attribute presentations, issuance sessions, or other wallet 
      interactions) are related or originate from the same user. This 
      prevents tracking and profiling of user behaviour. EDPS identifies 
      four dimensions of unlinkability:
      (1) Unlinkability w.r.t. Relying Parties - RPs should not be able 
      to determine whether multiple presentations correspond to the same 
      user, even when colluding with other RPs;
      (2) Unlinkability w.r.t. Identity Providers - IdPs should not learn 
      about wallet activity such as which RPs the user presents to 
      (also called 'unobservability');
      (3) Unlinkability w.r.t. Revocation Managers - entities managing 
      credential status should not learn which RPs the wallet interacts 
      with and when;
      (4) Unlinkability w.r.t. Colluding IdPs and RPs - presentations 
      should remain unlinkable even when IdPs and RPs share information.
    source: Privacy research (Pfitzmann/Hansen terminology); EDPS TechDispatch #3/2025; eIDAS Article 5a(16)(b)
    note: Core privacy goal of EUDIW design; see EDPS 2024 comments flagging ISO/IEC 18013-5 limitations

  - term: data minimisation
    definition: >-
      The principle that personal data collected and processed shall be 
      adequate, relevant and limited to what is necessary in relation to 
      the purposes for which they are processed.
    source: GDPR Article 5(1)(c)
    note: Frequently referenced in eIDAS 2.0 context

  - term: keystore
    definition: >-
      A hardware-backed repository and service in which non-critical 
      cryptographic assets are generated, stored, and used exclusively 
      inside a dedicated hardware security boundary. Examples include 
      Secure Elements, TPMs, TEEs, secure enclaves, or remote HSMs.
    source: ARF Annex 1, Section A.4
    note: Distinct from WSCA/WSCD which handle critical cryptographic assets

  # ═══════════════════════════════════════════════════════════════════════════
  # Attestation Technical Concepts
  # ═══════════════════════════════════════════════════════════════════════════

  - term: Attestation Rulebook
    definition: >-
      A document describing the attestation type, namespace(s), and other 
      features for a specific attestation type within the EUDIW ecosystem.
    source: ARF Annex 1, Section A.4
    note: See ARF Topic 12 - Attestation rulebooks

  - term: namespace
    definition: >-
      A specification of the attribute identifier, syntax and semantics of 
      attributes that can be used in an attestation, having an identifier 
      that is unique within the EUDI Wallet ecosystem.
    source: ARF Annex 1, Section A.4
    note: See ARF Topic 12 - Attestation rulebooks

  - term: Technical Validity Period
    definition: >-
      The dates (and possibly times) from and up to which an attestation is 
      technically valid, represented as metadata of the attestation. All 
      PIDs and attestations have a technical validity period, which is 
      typically much shorter than the administrative validity period.
    source: ARF Annex 1, Section A.4
    note: Related to cryptographic binding expiry; chosen based on risk analysis

  - term: Administrative Validity Period
    definition: >-
      The date(s) from and/or up to which the attributes in an attestation 
      are valid, represented as attribute(s) in the attestation. Some 
      attestations (e.g., diplomas) do not have an administrative validity 
      period.
    source: ARF Annex 1, Section A.4
    note: Reflects real-world attribute validity, distinct from technical validity

  - term: SUA Attestation
    definition: >-
      An attestation used for strong user authentication in the context of 
      electronic payments, such that when a Relying Party sends a 
      presentation request to a Wallet Unit, it includes transactional 
      data in the request.
    source: ARF Annex 1, Section A.4
    note: See ARF Topic 20 - Strong User Authentication for electronic payments

  - term: Strong Customer Authentication
    definition: >-
      Authentication based on the use of two or more elements categorised as 
      knowledge (something only the user knows), possession (something only 
      the user possesses), and inherence (something the user is) that are 
      independent, in that the breach of one does not compromise the reliability 
      of the others, and is designed in such a way as to protect the 
      confidentiality of the authentication data. Abbreviated as SCA. This is 
      the PSD2-specific term for strong authentication in payment services, 
      defined in PSD2 Article 4(30) and elaborated in the RTS on SCA 
      (Commission Delegated Regulation (EU) 2018/389). SCA goes beyond 
      basic two-factor authentication by additionally requiring Dynamic 
      Linking (binding the authentication to a specific transaction amount 
      and payee), authentication code generation, and transaction monitoring, 
      as mandated by PSD2 Article 97 and the RTS. While functionally 
      equivalent to Strong User Authentication (SUA) in its core two-factor
      requirement — the European Commission explicitly considers SCA and SUA
      as synonyms, both referring to the same underlying multi-factor
      authentication concept — SCA applies exclusively to payment services
      and imposes stricter obligations. The EUDI Wallet bridges the gap between SUA and 
      SCA through dedicated SCA Attestations, specified in Technical 
      Specification 12 (TS12), which are issued by Payment Service Providers 
      into Wallet Units and enable Dynamic Linking via transactional data 
      signing.
    source: synthesized from PSD2 Article 4(30), RTS 2018/389, and TS12
    note: >-
      PSD2 term; distinct from eIDAS "strong user authentication" (see DEC-252).
      The Dutch Payments Association (Betaalvereniging Nederland) assessed that 
      full SCA compliance requires payment-specific mechanisms beyond the 
      EUDIW's native SUA capabilities, which TS12 and SCA Attestations address.

  - term: Strong User Authentication
    definition: >-
      Authentication based on the use of at least two authentication factors 
      from different categories of either knowledge (something only the user 
      knows), possession (something only the user possesses), or inherence 
      (something the user is), that are independent, in that the breach of one 
      does not compromise the reliability of the others, and is designed in 
      such a way as to protect the confidentiality of the authentication data.
      Abbreviated as SUA. Defined in eIDAS 2.0 Article 3(51), this is the 
      generic cross-sector term for strong authentication in the European 
      Digital Identity Framework. Article 5f(2) mandates that private relying 
      parties in regulated sectors (banking, transport, energy, health, 
      telecommunications, etc.) must accept the EUDI Wallet where strong user 
      authentication for online identification is required by EU or national
      law or by contractual obligation. The EUDI Wallet natively satisfies
      SUA requirements through its LoA High assurance level. The European
      Commission considers SUA and the PSD2-specific SCA to be synonyms,
      both referring to the same underlying multi-factor authentication
      concept. For the payment services sector specifically, SCA applies
      with additional requirements such
      as Dynamic Linking and authentication codes beyond the base SUA 
      two-factor model.
    source: synthesized from eIDAS 2.0 Article 3(51) and Article 5f(2)
    note: >-
      eIDAS 2.0 generic term; see Strong Customer Authentication for the 
      PSD2-specific variant. See also DEC-252 for the SUA/SCA terminology 
      distinction and DEC-253 for the decision not to import PSD2 into 
      the portal.

  # ═══════════════════════════════════════════════════════════════════════════
  # Rulebooks & Governance Documents
  # ═══════════════════════════════════════════════════════════════════════════

  - term: PID Rulebook
    definition: >-
      A technical specification document that describes the attestation scheme, 
      namespace, attribute definitions, encoding formats, and other detailed 
      requirements for Person Identification Data (PID) within the EUDI Wallet 
      ecosystem. All PIDs and PID Providers must comply with its requirements.
    source: ARF Annex 3.1, Topic 3
    note: Specifies ISO/IEC 18013-5 mdoc and SD-JWT VC formats for PIDs

  - term: mDL Rulebook
    definition: >-
      A technical specification document that describes the attestation scheme, 
      namespace, attribute definitions, encoding formats, and other detailed 
      requirements for mobile Driving Licences (mDL) used within the EUDI Wallet 
      ecosystem, compliant with ISO/IEC 18013-5.
    source: ARF Annex 3.2
    note: Specifies mobile Driving Licence attributes and formats

  # ═══════════════════════════════════════════════════════════════════════════
  # Infrastructure & PKI Concepts
  # ═══════════════════════════════════════════════════════════════════════════

  - term: Certificate Authority
    definition: >-
      An entity which is trusted by one or more parties in the EUDI Wallet 
      ecosystem to create and seal certificates. Certificate Authorities 
      issue digital certificates that bind public keys to the identities 
      of entities within the trust framework.
    source: ARF Annex 1, Section A.4
    note: Abbreviated as CA; foundational element of the EUDIW trust infrastructure

  - term: Public Key Infrastructure
    definition: >-
      Systems, software, and communication protocols that are used by EUDI 
      Wallet ecosystem components to distribute, manage, and control public 
      keys. A PKI publishes public keys and establishes trust within an 
      environment by validating and verifying the public keys mapping to 
      an entity.
    source: ARF Annex 1, Section A.4
    note: Abbreviated as PKI; essential for the cryptographic trust model

  - term: Certificate Policy
    definition: >-
      A named set of rules that indicates the applicability of a certificate 
      to a particular community and/or class of application with common 
      security requirements. Certificate policies define how certificates 
      may be used and under what conditions.
    source: ARF Annex 1, Section A.4
    note: Abbreviated as CP; based on X.509 and RFC 3647

  - term: Trust Anchor
    definition: >-
      An authoritative entity represented by a public key and associated data. 
      Trust anchors are the root of trust in a trust hierarchy, used to 
      validate certificate chains and establish the authenticity of 
      entities within the EUDI Wallet ecosystem.
    source: ARF Annex 1, Section A.4 (RFC 5914)
    note: Foundational concept for trust chain validation

  # ═══════════════════════════════════════════════════════════════════════════
  # Revocation & Status Mechanisms
  # ═══════════════════════════════════════════════════════════════════════════

  - term: Attestation Revocation List
    definition: >-
      A mechanism provided by a PID Provider or an Attestation Provider 
      (or a trusted party acting on its behalf) for communicating the 
      revocation status of PIDs and attestations, by publishing a list 
      of identifiers of revoked PIDs or attestations.
    source: ARF Annex 1, Section A.4
    note: See ARF Topic 7 - Attestation revocation and revocation checking

  - term: Attestation Status List
    definition: >-
      A mechanism provided by a PID Provider or an Attestation Provider 
      (or a trusted party acting on its behalf) for communicating the 
      revocation status of PIDs and attestations, by publishing status 
      information (Valid or Invalid) for all relevant PIDs or attestations. 
      The list may contain all PIDs or attestations whose validity period 
      is not over yet at the time of publication.
    source: ARF Annex 1, Section A.4
    note: See ARF Topic 7 - Alternative to Revocation Lists with explicit status

  - term: attestation type
    definition: >-
      An identifier for a type of attestation that is unique within the 
      context of the EUDI Wallet ecosystem. Attestation types are used 
      to categorize and identify different kinds of attestations, enabling 
      Relying Parties to request specific types of credentials.
    source: ARF Annex 1, Section A.4
    note: See ARF Topic 12 - Attestation rulebooks

  # ═══════════════════════════════════════════════════════════════════════════
  # Credential Ecosystem Roles
  # ═══════════════════════════════════════════════════════════════════════════

  - term: holder
    definition: >-
      An entity that possesses one or more verifiable credentials, stores 
      them in a digital wallet, and has sole authority over when, where, 
      and with whom those credentials are shared. The Holder generates 
      verifiable presentations from their credentials when requested by 
      a Verifier. In the EUDI Wallet ecosystem, the Holder is the Wallet User.
    source: W3C Verifiable Credentials Data Model
    note: ARF Annex 1 uses this term specifically for wallet-to-wallet interactions (Topic 30)

  - term: verifier
    definition: >-
      An entity that requests and receives verifiable credentials or 
      presentations from a Holder, then validates the cryptographic proofs 
      and attribute claims. In the EUDI Wallet ecosystem, Verifiers are 
      typically Relying Parties, but in wallet-to-wallet interactions, 
      another Wallet User can act as a Verifier.
    source: W3C Verifiable Credentials Data Model
    note: ARF Annex 1 uses this term specifically for wallet-to-wallet interactions (Topic 30)

  - term: Holder Wallet Unit
    definition: >-
      A Wallet Unit used by a Holder in the context of Wallet-to-Wallet 
      interactions. The Holder Wallet Unit presents PIDs or attestations 
      to a Verifier Wallet Unit.
    source: ARF Annex 1, Section A.4
    note: See ARF Topic 30 - Presentation side of W2W flow

  - term: Verifier Wallet Unit
    definition: >-
      A Wallet Unit used by a Verifier in the context of Wallet-to-Wallet 
      interactions. The Verifier Wallet Unit requests and receives PIDs 
      or attestations from a Holder Wallet Unit.
    source: ARF Annex 1, Section A.4
    note: See ARF Topic 30 - Verification side of W2W flow

  # ═══════════════════════════════════════════════════════════════════════════
  # Governance & Notification
  # ═══════════════════════════════════════════════════════════════════════════

  - term: notification
    definition: >-
      The act of transferring information to the European Commission, 
      typically in the context of Member States notifying the Commission 
      about their designated PID Providers, Wallet Providers, Attestation 
      Providers, and Access Certificate Authorities.
    source: ARF Annex 1, Section A.4
    note: See ARF Topic 31 - Provider notification and publication

  # ═══════════════════════════════════════════════════════════════════════════
  # EU & Institutional Concepts
  # ═══════════════════════════════════════════════════════════════════════════

  - term: Member State
    definition: >-
      A country that is a member of the European Union. In the context of 
      eIDAS 2.0, Member States are responsible for designating PID Providers, 
      certifying Wallet Solutions, maintaining Trusted Lists, and ensuring 
      the cross-border interoperability of European Digital Identity Wallets.
    source: Treaty on European Union, Article 1
    note: Currently 27 EU countries; eIDAS also applies to EEA states

  - term: Third Country
    definition: >-
      A country that is not a member of the European Union. Third countries 
      are relevant in the context of cross-border data transfers, recognition 
      of trust services, and potential mutual recognition agreements for 
      electronic identification.
    source: EU legal terminology
    note: Relevant for GDPR adequacy decisions and trust service recognition

  - term: TFEU
    definition: >-
      Treaty on the Functioning of the European Union. One of the two core 
      treaties of the EU (together with TEU), establishing the constitutional 
      basis for EU law. The TFEU lays down the competences, procedures, and 
      institutions through which the EU exercises its powers. Key provisions 
      include Article 114 (single market harmonisation, basis for eIDAS) and 
      Article 218 (international agreements). Entered into force in 2009 with 
      the Treaty of Lisbon.
    source: Treaty of Lisbon, 2009
    note: Referenced 4 times in eIDAS 2.0; formerly the EC Treaty (TEC)

  - term: TEU
    definition: >-
      Treaty on European Union. One of the two core treaties of the EU (together 
      with TFEU), establishing the fundamental principles, values, and objectives 
      of the European Union. The TEU sets out the EU's institutional framework 
      and provisions on common foreign and security policy. Article 4(3) establishes 
      the principle of sincere cooperation between the EU and Member States.
    source: Maastricht Treaty (1992), as amended by Lisbon (2009)
    note: Foundational treaty; complements the more detailed TFEU

  - term: European Digital Identity Cooperation Group
    definition: >-
      A group established by the Commission pursuant to Article 46e(1) of the 
      eIDAS Regulation to support and facilitate Member States' cross-border 
      cooperation and exchange of information on trust services, European Digital 
      Identity Wallets, and notified electronic identification schemes. The 
      Cooperation Group is composed of representatives appointed by Member States 
      and the Commission, and has tasks including issuing opinions on national 
      certification schemes, organising peer reviews, and coordinating with the 
      NIS Cooperation Group on cybersecurity matters.
    source: eIDAS Regulation Article 46e
    note: Often abbreviated as "Cooperation Group" in legislation

  # ═══════════════════════════════════════════════════════════════════════════
  # Advanced Privacy Technologies
  # ═══════════════════════════════════════════════════════════════════════════

  - term: zero knowledge proof
    definition: >-
      A cryptographic method by which one party (the prover) can prove to 
      another party (the verifier) that a statement is true, without 
      revealing any information beyond the validity of the statement itself. 
      In the EUDIW context, ZKPs can enable proving properties about 
      attributes (e.g., "age is over 18") without disclosing the actual 
      attribute value.
    source: Privacy research; cryptographic literature
    note: Abbreviated as ZKP; enables advanced privacy-preserving presentations
    aliases:
      - ZKP

  - term: anonymous credentials
    definition: >-
      A family of privacy-preserving cryptographic mechanisms that support 
      both selective disclosure and unlinkability requirements. Anonymous 
      credentials enable authentication without identification when 
      identification is not strictly necessary, using advanced cryptographic 
      techniques such as Camenisch-Lysyanskaya (CL) signatures or BBS+ 
      signatures to provide mathematical proof of a claim without disclosing 
      any additional information. The term 'anonymous' refers to the ability 
      to minimise data disclosure, not necessarily full anonymity in the 
      broader context.
    source: EDPS TechDispatch #3/2025; cryptographic literature (Chaum, Camenisch)
    note: Not yet adopted in EUDIW first implementation; EDPS recommends adoption for full unlinkability

  - term: device binding
    definition: >-
      A security feature ensuring that credentials are cryptographically 
      tied to the specific wallet device that requests their issuance or 
      verification. Device binding prevents credentials from being 
      transferred to unauthorised devices, protecting against theft or 
      cloning. High assurance is achieved by cryptographically linking a 
      device's public key to a private key stored in a secure element.
    source: EDPS TechDispatch #3/2025; ARF WSCD requirements
    note: Essential for WSCD security; implements eIDAS High LoA requirements

  - term: secure element
    definition: >-
      A microprocessor chip engineered to store sensitive data and perform 
      critical cryptographic operations while offering lower exposure to 
      threats. Secure elements act as hardware vaults, protecting 
      applications and cryptographic key material from malware attacks on 
      the host operating system. Examples include SIM cards, embedded SIMs 
      (eSIMs), embedded secure elements (eSEs), and external security tokens 
      or smart cards.
    source: EDPS TechDispatch #3/2025; ARF Annex 1
    note: Abbreviated as SE; core component for implementing WSCD with High LoA
    aliases:
      - SE

  - term: trusted execution environment
    definition: >-
      An isolated environment within a device's main processor designed to 
      protect sensitive operations and data from the rest of the device's 
      processing components, including the operating system and other 
      applications. TEEs are often used in combination with secure elements 
      to provide cryptographic isolation for wallet operations. While TEEs 
      offer improved security over general-purpose environments, research 
      has demonstrated that incorrectly designed TEEs may remain vulnerable 
      to side-channel attacks.
    source: EDPS TechDispatch #3/2025; cryptographic literature
    note: Abbreviated as TEE; software-based alternative to hardware secure elements
    aliases:
      - TEE

  - term: level of assurance
    definition: >-
      The degree of confidence in the claimed identity of a person when
      using electronic identification. In the eIDAS framework, three levels
      are defined: (1) Low - provides limited confidence, suitable for
      reducing risk of misuse or alteration; (2) Substantial - provides
      substantial confidence, suitable for controlling access to
      medium-value services; (3) High - provides high confidence in the
      claimed identity, suitable for high-value or high-risk services.
      The EUDIW must comply with High LoA standards for storing and
      presenting qualified attestations. EUDI Wallets will be certified
      against level of assurance 'high' requirements by accredited public
      or private bodies designated by Member States, ensuring high
      standards for privacy and security.
    source: eIDAS Regulation Article 8, Implementing Regulation 2015/1502; EDPS TechDispatch #3/2025; EUDIW FAQ
    note: Abbreviated as LoA; determines security requirements for wallets and trust services
    aliases:
      - LoA

  # ═══════════════════════════════════════════════════════════════════════════
  # Latin Legal Terms
  # ═══════════════════════════════════════════════════════════════════════════

  - term: mutatis mutandis
    definition: >-
      Latin: "with the necessary changes having been made." A legal term 
      indicating that a provision or requirement from one context applies 
      to another context with the necessary adaptations. When legislation 
      states that Article X applies "mutatis mutandis" to another situation, 
      it means the same rules apply with appropriate modifications for the 
      different context.
    source: EU legal terminology
    note: Used 15+ times in eIDAS 2.0 to apply signature rules to seals, etc.

  - term: inter alia
    definition: >-
      Latin: "among other things." Used in legal texts to indicate that the 
      listed items are examples or part of a larger set, not an exhaustive 
      enumeration. When legislation mentions "inter alia" before a list, 
      there may be additional relevant items not explicitly mentioned.
    source: EU legal terminology
    note: Common in GDPR, ePrivacy, and other EU regulations

  - term: ex ante
    definition: >-
      Latin: "from before." Refers to actions, assessments, or controls 
      performed before an event or activity takes place. In regulatory 
      contexts, ex ante supervision means proactive oversight conducted 
      before potential harm occurs, such as pre-approval requirements 
      or preventive audits.
    source: EU legal terminology
    note: Used in eIDAS for supervisory activities; contrasts with ex post

  - term: ex post
    definition: >-
      Latin: "from after." Refers to actions, assessments, or controls 
      performed after an event or activity has occurred. In regulatory 
      contexts, ex post supervision means reactive oversight triggered 
      by evidence of non-compliance, incidents, or complaints received 
      after the fact.
    source: EU legal terminology
    note: Used in eIDAS/NIS2 for reactive supervisory activities

  # ═══════════════════════════════════════════════════════════════════════════
  # EU Legal Phrases
  # Common formulaic expressions used throughout EU legislation
  # ═══════════════════════════════════════════════════════════════════════════

  - term: without prejudice to
    definition: >-
      A legal phrase meaning "this provision applies, but it does not affect, 
      override, or diminish the rights, obligations, or provisions established 
      by [the referenced provision]." It signals that both rules coexist and 
      the referenced provision maintains its full force. Example: "Without 
      prejudice to paragraph 1" means paragraph 1 still fully applies.
    source: EU legal terminology
    note: Used 81 times across eIDAS 2.0 regulations

  - term: pursuant to
    definition: >-
      A legal phrase meaning "in accordance with" or "as authorized by." 
      It indicates that an action is taken based on the authority granted 
      by a specific legal provision. Example: "pursuant to Article 24" 
      means the action is authorized or required by that article.
    source: EU legal terminology
    note: Used 612 times across eIDAS 2.0 regulations

  - term: notwithstanding
    definition: >-
      A legal phrase meaning "despite" or "regardless of." It creates an 
      exception to a general rule, signaling that the provision it introduces 
      applies even though it may conflict with another provision. Example: 
      "Notwithstanding Article 5" means this provision applies even if 
      Article 5 would otherwise prevent it.
    source: EU legal terminology
    note: Creates explicit exceptions to general rules

  - term: for the purposes of
    definition: >-
      A legal phrase that introduces a definition or scope limitation specific 
      to a particular context. It signals that the meaning or application of 
      a term is limited to the specific article, section, or regulation being 
      discussed. Example: "For the purposes of this Article, 'provider' means..."
    source: EU legal terminology
    note: Used 93 times to scope definitions contextually

  - term: without undue delay
    definition: >-
      A legal phrase requiring action as soon as reasonably possible under 
      the circumstances, without unnecessary or unjustified postponement. 
      It imposes a flexible but enforceable time obligation, allowing for 
      reasonable delays caused by circumstances beyond control. Often paired 
      with a maximum deadline: "without undue delay and in any event within 
      24 hours."
    source: EU legal terminology
    note: Used 119 times; key for incident notification deadlines

  - term: where applicable
    definition: >-
      A legal phrase indicating that a provision applies only in certain 
      circumstances or to certain entities. It creates conditional 
      applicability, meaning the requirement only takes effect when the 
      relevant conditions are met. Used to provide flexibility for diverse 
      situations across Member States.
    source: EU legal terminology
    note: Used 200 times for conditional requirements

  - term: insofar as
    definition: >-
      A legal phrase meaning "to the extent that" or "in so far as." It 
      creates a proportional or conditional scope, indicating that a 
      provision applies only to the degree that certain conditions are 
      met. Example: "insofar as necessary for the provision of the service" 
      limits the scope to what is strictly needed.
    source: EU legal terminology
    note: Creates proportional/conditional scope limitations

  - term: by way of derogation
    definition: >-
      A legal phrase introducing an exception or deviation from a general 
      rule. It signals that the provision temporarily or conditionally sets 
      aside the normal rules under specific circumstances. Unlike "notwithstanding," 
      a derogation is typically a formally recognized exception with specific 
      conditions for its application.
    source: EU legal terminology
    note: Used for formal exceptions to general provisions

  - term: shall be deemed
    definition: >-
      A legal phrase creating a legal fiction or presumption. It establishes 
      that something is legally treated as true or equivalent to something 
      else, regardless of actual facts. Example: "shall be deemed to comply" 
      means the entity is legally presumed compliant if certain conditions 
      are met, even without further verification.
    source: EU legal terminology
    note: Creates legal presumptions and fictions

  # ═══════════════════════════════════════════════════════════════════════════
  # Fundamental EU Legal Concepts
  # Core terms used extensively but not formally defined in eIDAS
  # ═══════════════════════════════════════════════════════════════════════════

  - term: natural person
    definition: >-
      An individual human being, as opposed to a legal person (organization or 
      entity). In EU law, natural persons are the subjects of fundamental rights 
      protections, including data protection under GDPR. The term distinguishes 
      human individuals who can hold rights and bear obligations from artificial 
      legal entities. GDPR explicitly protects "personal data" relating to 
      identified or identifiable natural persons.
    source: GDPR Article 4(1), TFEU
    note: Fundamental EU concept; foundation of GDPR data subject definition

  - term: legal person
    definition: >-
      An entity that has legal personality under applicable law, such as a 
      company, corporation, association, or other organization. Legal persons 
      can enter into contracts, own property, sue and be sued, independent of 
      their members or shareholders. In EU law, legal persons are typically 
      excluded from GDPR's personal data protections but can be controllers, 
      processors, relying parties, or trust service providers.
    source: TFEU Article 263(4), various EU directives
    note: Contrasts with natural person; includes companies and organizations

  - term: Union law
    definition: >-
      The legal framework of the European Union, comprising primary law 
      (founding treaties) and secondary law (regulations, directives, decisions). 
      Union law has supremacy over conflicting national law in areas where 
      Member States have transferred competence to the EU. Regulations apply 
      directly, while directives require transposition into national law.
    source: CJEU jurisprudence (Costa v. ENEL), EU Treaties
    note: Supranational law with primacy principle over national law

  - term: national law
    definition: >-
      The domestic legal system of each individual EU Member State, created 
      and enforced by that state's legislative, executive, and judicial bodies. 
      Where EU law applies, national law must conform to it (supremacy principle). 
      However, Member States retain competence in areas not transferred to the 
      EU. Many EU directives require implementation through national law.
    source: EU constitutional principles
    note: Member State domestic law; must conform to Union law where applicable

  - term: certification
    definition: >-
      The formal process by which an authorized body (conformity assessment body 
      or certification body) attests that a product, service, process, or 
      organization meets specified requirements or standards. In eIDAS context, 
      certification confirms that trust services, wallets, or devices comply with 
      regulatory requirements. Certification typically involves conformity 
      assessment, documentation review, and ongoing surveillance.
    source: eIDAS, Cybersecurity Act, EU product legislation
    note: Distinct from "certificate" (the document) and "certification body" (the entity)

  - term: recertification
    definition: >-
      The process of renewing or revalidating a certification after it expires, 
      or when significant changes occur that may affect compliance. Recertification 
      ensures continued adherence to applicable requirements over time. In eIDAS, 
      qualified electronic signature creation devices must be recertified 
      periodically (typically every 5 years, with vulnerability assessments 
      every 2 years per Article 30).
    source: eIDAS Article 30, general EU certification practice
    note: Required when certifications expire or significant changes occur

  # ═══════════════════════════════════════════════════════════════════════════
  # Fixed Legal Formulas (Compound Phrases)
  # Common EU legislative compound phrases that appear as fixed units (DEC-247)
  # ═══════════════════════════════════════════════════════════════════════════

  - term: natural or legal person
    definition: >-
      A fixed legal phrase indicating that a provision applies to any person, 
      whether an individual human being (natural person) or an entity with 
      legal personality such as a company or organization (legal person). 
      This formulation ensures universal applicability of rights, obligations, 
      or eligibility criteria to both individuals and organizations.
    source: EU legal drafting convention
    note: 131 occurrences; fundamental EU legislative formula

  - term: Union or national law
    definition: >-
      A fixed legal phrase indicating that provisions from either EU-level 
      legislation (Union law) or Member State domestic legislation (national 
      law) may apply to a given situation. This formulation acknowledges the 
      dual-layer legal structure of the EU, where both supranational and 
      national rules may govern the same subject matter.
    source: EU legal drafting convention
    note: 50 occurrences; signals dual legal source applicability

  - term: public or private
    definition: >-
      A fixed legal phrase indicating that a provision applies regardless of 
      whether the entity or sector involved is part of government/public 
      administration (public) or commercial/non-governmental (private). 
      Used to ensure equal treatment and applicability across all sectors.
    source: EU legal drafting convention
    note: 19 occurrences; sector-neutral applicability formula

  - term: directly or indirectly
    definition: >-
      A fixed legal phrase extending the scope of a provision to cover both 
      immediate effects (direct) and consequential or mediated effects 
      (indirect). In regulatory contexts, this ensures that obligations or 
      prohibitions cannot be circumvented through intermediaries, subsidiaries, 
      or layered arrangements.
    source: EU legal drafting convention
    note: 12 occurrences; prevents circumvention through indirection

  # ═══════════════════════════════════════════════════════════════════════════
  # EU Document Types
  # Formal categories of EU legal and policy instruments
  # ═══════════════════════════════════════════════════════════════════════════

  - term: Commission Communication
    definition: >-
      A non-binding policy document issued by the European Commission to outline 
      strategic intentions, policy priorities, or interpretive guidance. Unlike 
      Regulations (directly binding) or Directives (require transposition), 
      Communications are "soft law" instruments that signal the Commission's 
      policy direction without creating legal obligations. Examples include 
      "Shaping Europe's Digital Future" (COM(2020)67) which set the strategic 
      vision for the European Digital Identity Framework. While not legally 
      binding, Communications heavily influence subsequent legislation and 
      the interpretation of existing EU law.
    source: TFEU Article 288 (by exclusion), EU institutional practice
    note: Distinct from "electronic communication" - this is a document type

  # ═══════════════════════════════════════════════════════════════════════════
  # W3C / Technical Standards Terminology
  # Terms from technical standards used in the EUDI Wallet ecosystem
  # ═══════════════════════════════════════════════════════════════════════════

  - term: verifiable credential
    definition: >-
      A tamper-evident credential that has authorship that can be 
      cryptographically verified. Verifiable credentials can be used to 
      represent information found in physical credentials such as passports, 
      licenses, and diplomas. In the EUDI Wallet ecosystem, PIDs and 
      attestations are issued as verifiable credentials following the 
      W3C Verifiable Credentials Data Model or ISO mDL standards.
    source: W3C Verifiable Credentials Data Model v2.0
    note: ARF supports both SD-JWT VC and mDL (ISO 18013-5) credential formats

  - term: hardware security module
    definition: >-
      A physical computing device that safeguards and manages cryptographic 
      keys, performs encryption and decryption functions, and provides 
      strong authentication. HSMs are used in the EUDI Wallet ecosystem 
      for secure key storage in remote signing services, as part of 
      WSCD implementations, and by trust service providers for 
      cryptographic operations.
    source: NIST SP 800-57, CIR 2024/2981 (WSCD requirements)
    note: ARF references HSMs as one option for implementing WSCD functionality

  - term: data protection authority
    definition: >-
      An independent public authority established by a Member State 
      responsible for monitoring the application of data protection 
      legislation, handling complaints, and promoting awareness of 
      data subjects' rights. Under the EUDI Wallet framework, DPAs 
      supervise the processing of personal data by Wallet Providers, 
      Relying Parties, and other ecosystem participants.
    source: GDPR Article 51
    note: Users can report Relying Parties to their DPA via the wallet dashboard

  - term: intended use
    definition: >-
      A formally registered declaration at the Registrar specifying why a
      Relying Party requests data and which data elements it needs. Each
      intended use has a unique identifier (AS-MS-27-039) and a user-friendly
      description shown to wallet users for informed consent (EW-DM-44-018
      field (c)). Intended uses are bound to registration certificates —
      one certificate per intended use — and the wallet may verify that
      requested attributes match the registered scope (EW-DM-44-021). An RP
      may register multiple intended uses.
    source: Synthesized from IR 2025/848 Art 5, ARF Topic 27 (AS-MS-27-038, AS-MS-27-039), Topic 33 (EW-DM-44-018, EW-DM-44-021)
    note: No single regulation defines this term explicitly; assembled from multiple sources

  - term: presentation request
    definition: >-
      A protocol message sent by a Relying Party (or its RP Instance) to
      a Wallet Unit, asking the user to share specific attributes from
      their PID or attestations. The request must be authenticated using
      the RP's wallet-relying party access certificate (CIR 2024/2982
      Art 5(2)), must specify only the attributes registered for the
      RP's intended use (eIDAS Art 5b(3)), and must be presented to
      the wallet user for informed consent before any data is disclosed
      (CIR 2024/2982 Art 5(4-5)). Presentation requests may be
      transmitted remotely via OID4VP or in proximity via ISO 18013-5.
    source: Synthesized from eIDAS Art 5b(3), CIR 2024/2982 Art 5, ARF Topic 33
    note: The protocol-level message; the broader interaction is a presentation flow

  - term: proximity flow
    definition: >-
      A presentation interaction where the Relying Party and the Wallet
      Unit communicate in close physical range — typically via BLE, NFC,
      or QR code — without requiring internet connectivity for the
      data exchange itself. Proximity flows follow ISO/IEC 18013-5 and
      are designed for in-person verification scenarios such as border
      control, age verification, or physical access. Support for
      proximity flows is not mandatory per the ARF but may be required
      by specific Attestation Rulebooks (EW-DM-12-003).
    source: Synthesized from ARF Topic 6, ISO/IEC 18013-5, CIR 2024/2982 Art 5
    note: Contrasted with remote flow; also called proximity presentation

  - term: remote flow
    definition: >-
      A presentation interaction where the Relying Party and the Wallet
      Unit communicate over the internet, typically using the OID4VP
      (OpenID for Verifiable Presentations) protocol. Remote flows are
      the default interaction model for online services — the RP sends
      a presentation request via HTTPS and receives the VP Token
      containing the disclosed attributes. All EUDI Wallet Units must
      support remote flows as the baseline presentation mechanism.
    source: Synthesized from ARF Topic 6, OID4VP specification, CIR 2024/2982 Art 5
    note: Contrasted with proximity flow; also called remote presentation

  # ═══════════════════════════════════════════════════════════════════════════
  # EC Use Case Terms
  # Terms and abbreviations from the European Commission's EUDIW use case
  # manuals. Each links to the official EC use case manual page.
  # Source: https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/896827987/Use+case+manuals
  # ═══════════════════════════════════════════════════════════════════════════

  - term: Mobile Driving Licence
    definition: >-
      An EUDI Wallet use case enabling users to store and present a digital
      proof of their right to drive a certain kind of vehicle. The mDL follows
      the ISO/IEC 18013-5 (proximity) and ISO 18013-7 (remote) standards,
      using the mdoc data format. Issuance follows OpenID4VCI (ARF Annex 4).
      See the EC use case manual for full details.
    source: EC Use Case Manual #01
    note: One of the 19 EUDIW use cases defined by the European Commission; Published
    aliases:
      - mDL

  - term: Digital Travel Credential
    definition: >-
      An EUDI Wallet use case providing a digital representation of the
      user's identity document such as a passport or identity card, enabling
      streamlined border control and travel processes. The DTC follows
      ICAO 9303 and ISO/IEC TS 23220-2:2024 standards. Verification uses
      PKI-based signature validation against passport and identity card
      trusted lists.
    source: EC Use Case Manual #06
    note: One of the 19 EUDIW use cases defined by the European Commission; Published
    aliases:
      - DTC

  - term: European Health Insurance Card
    definition: >-
      An EUDI Wallet use case enabling users to store and present a digital
      version of the EHIC, granting access to necessary healthcare when in
      another Member State. The digital EHIC uses SD-JWT-VC (IETF) and
      W3C VC Data Model 2.0 formats, with issuance via OID4VCI (ES256).
      Piloted under the DC4EU Large-Scale Pilot framework.
    source: EC Use Case Manual #10
    note: One of the 19 EUDIW use cases defined by the European Commission; Published
    aliases:
      - EHIC

  - term: European Parking Card
    definition: >-
      An EUDI Wallet use case enabling persons with disabilities to store
      and present a digital European Parking Card, recognising the right to
      certain reserved parking conditions and facilities across Member States.
      The EPC is governed by Directive 2024/2841 and its implementing acts
      are pending.
    source: EC Use Case Manual #03
    note: One of the 19 EUDIW use cases defined by the European Commission; Published
    aliases:
      - EPC

  - term: European Disability Card
    definition: >-
      An EUDI Wallet use case enabling users to store and present a digital
      proof of recognised disability status, granting entitlement to
      disability services across Member States. The EDC is governed by
      Directive 2024/2841 and its implementing acts are pending. Closely
      related to the European Parking Card (EPC) use case.
    source: EC Use Case Manual #08
    note: One of the 19 EUDIW use cases defined by the European Commission; Published
    aliases:
      - EDC

  - term: e-Prescription
    definition: >-
      An EUDI Wallet use case enabling users to identify themselves in order
      to access electronic prescriptions stored and presented via the wallet.
      Uses ISO 18013-5 mdoc format for the Health ID attestation, with
      issuance via OpenID4VCI and verification via ISO 18013-5 (proximity)
      and ISO 18013-7 (remote). Integrates with the cross-border digital
      health infrastructure MyHealth@EU.
    source: EC Use Case Manual #09
    note: One of the 19 EUDIW use cases defined by the European Commission; Published

  - term: Vehicle Registration Certificate
    definition: >-
      An EUDI Wallet use case enabling users to store and present a digital
      proof of the registration and legal compliance of a vehicle with
      national and European road transport regulations. This use case is
      currently in the "coming soon" stage, with its manual not yet published.
    source: EC EUDIW Use Case Portal
    note: One of the 19 EUDIW use cases defined by the European Commission; Coming soon
    aliases:
      - VRC

  # --- Domain terms referenced in EC use case manuals ---

  - term: Payment Service Provider
    definition: >-
      An entity authorised to provide payment services such as credit
      transfers, direct debits, card-based payments, and payment initiation
      services. In the EUDI Wallet payment authentication use case, the PSP
      (e.g. a bank) issues dedicated payment-authentication credentials
      (SCA Attestations) to the wallet, enabling Strong Customer
      Authentication (SCA) as required by PSD2 Article 97, without the user
      needing to leave the merchant's checkout flow.
    source: EC Payment Authentication Manual; PSD2 (Directive 2015/2366) Art. 4(11)
    note: The PSP is the counterpart that verifies the SCA Attestation during payment flows
    aliases:
      - PSP

  - term: MyHealth@EU
    definition: >-
      The EU cross-border digital health infrastructure enabling the secure
      exchange of health data — including electronic prescriptions and
      dispensation records — between Member States. The e-Prescription EUDI
      Wallet use case integrates with MyHealth@EU to enable cross-border
      access to prescriptions. Interoperability obligations for electronic
      prescriptions are defined in the European Health Data Space (EHDS)
      Regulation.
    source: EC ePrescription Manual; EHDS Regulation Art. 23
    note: Operational since before eIDAS 2.0; now being extended with EUDI Wallet integration

  - term: European Health Data Space
    definition: >-
      An EU regulatory framework (Regulation on the EHDS) establishing rules
      for the access to and exchange of electronic health data across the
      Union. The EHDS defines interoperability requirements for health data
      systems, including electronic prescriptions, and provides the legal
      basis for issuance rules related to health-related attestations in
      the EUDI Wallet ecosystem. The e-Prescription use case manual
      references EHDS Art. 16 on identification management as a potential
      basis for health credential issuance.
    source: EC ePrescription Manual; EHDS Regulation
    note: Complements eIDAS 2.0 for the health sector
    aliases:
      - EHDS

  - term: Know Your Customer
    definition: >-
      A regulatory process by which financial institutions verify the
      identity of their clients before or during business relationships.
      In the EUDI Wallet context, the payment authentication use case
      enables PSPs to perform KYC checks by requesting PID attributes
      and other verified credentials directly from the wallet, streamlining
      onboarding while maintaining compliance with Anti-Money Laundering
      (AML) directives.
    source: EC Payment Authentication Manual; AML Directive (Directive 2015/849)
    note: KYC is a key driver for EUDI Wallet adoption in the financial sector
    aliases:
      - KYC

  # ═══════════════════════════════════════════════════════════════════════════
  # EUDIW FAQ Terminology Enrichments
  # Terms and enriched definitions sourced from the European Commission's
  # EUDIW FAQ (ec_eudiw_faq.md). Added 2026-02-20.
  # ═══════════════════════════════════════════════════════════════════════════

  # --- New terms ---

  - term: wallet certification
    definition: >-
      The formal process by which EU Digital Identity Wallets are evaluated
      to ensure they meet functional and cybersecurity standards. Wallets
      are certified by accredited conformity assessment bodies operating
      under national certification schemes designated by Member States.
      These bodies evaluate wallet solutions against functional and
      cybersecurity requirements, conduct testing and assessments, and
      issue certificates of conformity. They operate under the oversight
      of national certification scheme owners and ensure alignment with
      EU standards. This process ensures that the security, reliability
      and interoperability of the wallets are assessed in order to foster
      trust among users and service providers.
    source: EUDIW FAQ; CIR 2024/2981; CIR 2025/849
    note: Distinct from generic 'certification' — specifically about the EUDIW certification process

  - term: SCA Attestation
    definition: >-
      A dedicated attestation issued by a Payment Service Provider (PSP)
      into a wallet user's wallet unit, enabling Strong Customer
      Authentication (SCA) for payment transactions as required by PSD2
      Article 97. The SCA Attestation is device-bound, ensuring usage is
      linked to the user's cryptographic keys on that device, and requires
      multi-factor authentication to activate the signing key. The process
      works as follows: (1) the user registers their wallet with the PSP
      through an existing PSD2-compliant method; (2) the wallet generates
      a cryptographic key pair, with the private key securely stored and
      the public key shared with the PSP; (3) the PSP issues the SCA
      Attestation into the wallet; (4) for each payment, the wallet
      presents the SCA Attestation together with transaction-specific
      details for the user to confirm; (5) the confirmation is
      cryptographically bound to the transaction, ensuring dynamic
      linking to the specific amount and payee. The PSP acts as both
      issuer and verifier of the SCA Attestation, retaining full control
      over the authentication decision without delegating to a third party.
    source: EUDIW FAQ; TS12; EC Payment Authentication Manual
    note: >-
      Distinct from SUA Attestation. The SCA Attestation is the
      payment-specific credential that bridges the EUDIW's native SUA
      capability with PSD2's stricter SCA requirements including dynamic
      linking.

  - term: Large Scale Pilot
    definition: >-
      EU-funded pilot projects, co-funded under the Digital Europe
      Programme, that test EUDI Wallets in a diverse range of everyday
      use cases. Examples include providing identification to online and
      offline public and private services, displaying mobile driving
      licences, authorising payments, exchanging diplomas, signing
      documents electronically, and presenting medical prescriptions.
      The results of the pilots inform Member States' wallet development
      and help identify implementation challenges before deployment.
    source: EUDIW FAQ; Digital Europe Programme
    note: Four EU LSPs — POTENTIAL, EWC, NOBID, DC4EU
    aliases:
      - LSP

  - term: digital document
    definition: >-
      A user-friendly synonym for Electronic Attestation of Attributes
      (EAA), used by the European Commission in public-facing
      communications. Digital documents are digital credentials that can
      be added to, stored in, and presented with the EU Digital Identity
      Wallet. They contain important information about the holder, such
      as a university diploma, a boarding pass, or a driver's licence.
      The Commission distinguishes between digital documents (EAAs),
      which the wallet stores, and digital assets (songs, films, NFTs),
      which the wallet does not store.
    source: EUDIW FAQ
    note: >-
      The Commission states: "For the sake of simplicity, we refer to
      EAAs as digital documents throughout this website."

  - term: digital asset
    definition: >-
      A digital object such as a document, song, film, or Non-Fungible
      Token (NFT). Digital assets are distinct from digital documents
      (Electronic Attestations of Attributes): the EU Digital Identity
      Wallet stores and presents person identification data and digital
      documents (EAAs) but not digital assets. There are no plans or
      provisions in the regulation for the wallet to store digital
      assets or NFTs.
    source: EUDIW FAQ
    note: Disambiguation term; clarifies what the wallet does NOT store

  - term: Very Large Online Platform
    definition: >-
      An online platform that reaches at least 45 million average monthly
      active recipients of the service in the Union, as designated under
      Article 33 of the Digital Services Act (Regulation (EU) 2022/2065).
      Under Article 5f(3) of the eIDAS Regulation, providers of VLOPs
      that require user authentication for accessing their online services
      must facilitate and accept the use of EU Digital Identity Wallets.
      Whenever VLOPs require user authentication — such as logging in,
      account creation, or identity verification — they shall enable users
      upon request to voluntarily use EU Digital Identity Wallets for such
      purposes. To support user privacy, the wallets support the WebAuthn
      standard, acting as passkey providers to enable secure, passwordless
      authentication and the use of relying party-specific pseudonyms
      when interacting with VLOPs.
    source: EUDIW FAQ; eIDAS Art. 5f(3); DSA (Regulation 2022/2065) Art. 33
    note: Regulatory cross-link between eIDAS 2.0 and the Digital Services Act
    aliases:
      - VLOP

  # --- Enriched definitions for existing regulation-defined terms ---

  - term: Wallet Solution
    definition: >-
      A combination of software, hardware, services, settings, and
      configurations — including wallet instances, one or more wallet
      secure cryptographic applications and one or more wallet secure
      cryptographic devices — provided by a wallet provider. In simple
      terms, the wallet solution is the master template from which
      individual wallet units are created for each user. Wallet solutions
      must be certified under national certification schemes before
      deployment (CIR 2024/2981), and the wallet provider bears
      end-to-end responsibility for all wallet units derived from a
      given wallet solution.
    source: Synthesized from CIR 2024/2979 Art. 2(11); EUDIW FAQ
    note: Enriched functional definition; the 'master template' analogy comes from the EUDIW FAQ

  - term: Wallet Unit
    definition: >-
      A unique configuration of a wallet solution that includes wallet
      instances, wallet secure cryptographic applications and wallet
      secure cryptographic devices provided by a wallet provider to an
      individual wallet user. In simple terms, the wallet unit is the
      individual version of the wallet solution customised for each
      user. Each wallet unit receives its own wallet unit attestation
      (WUA) from the wallet provider, and must contain at least one
      valid PID before it can be used for other operations such as
      receiving attestations or presenting attributes to relying parties.
    source: Synthesized from CIR 2024/2979 Art. 2(2); EUDIW FAQ
    note: Enriched functional definition; the 'individual version customised for each user' analogy comes from the EUDIW FAQ

  - term: Provider of Person Identification Data
    definition: >-
      An entity responsible for issuing and revoking person identification
      data and ensuring that the PID of a user is cryptographically bound
      to a wallet unit. PID providers can be public sector bodies (e.g. a
      Ministry or national register) or recognised private entities
      entrusted with the provision of personal information — such as name
      and date of birth — to be used for identification. PID providers
      must identify themselves to the wallet unit using wallet-relying
      party access certificates before issuance (CIR 2024/2977 Art. 4(2)),
      and they validate the wallet unit attestation (WUA) during the
      issuance process to confirm they are interacting with a genuine,
      certified wallet unit (CIR 2024/2982 Art. 3).
    source: Synthesized from CIR 2024/2977 Art. 2(4); EUDIW FAQ
    note: The EUDIW FAQ clarifies these can be public or private entities
    aliases:
      - PID Provider

  - term: European Digital Identity Wallet
    definition: >-
      A personal digital wallet, in the form of a mobile application,
      allowing citizens to digitally prove who they are, as well as store
      and manage identity data and official documents in digital form.
      These may include a driving licence, educational qualifications,
      health insurance cards, or travel credentials. With EU Digital
      Identity Wallets, all European citizens will be able to prove
      their identity across the EU where necessary to access public and
      private digital services, to share digital documents, or to prove
      a specific personal attribute (such as age) without revealing their
      full identity or other personal details. Citizens will at all times
      have full control of the data they share and with whom. Wallets
      will be free of charge for natural persons, including electronic
      signatures for non-professional purposes. Member States have the
      choice to offer wallets directly, mandate another organisation, or
      recognise an independent provider.
    source: Synthesized from eIDAS Art. 5a; EUDIW FAQ
    note: Enriched functional definition; user-friendly description from the EUDIW FAQ complements the terse legal definition in eIDAS Art. 3(42a)
    aliases:
      - EUDIW

  # ═══════════════════════════════════════════════════════════════════════════
  # EC Use Case Terms — Additional Published Use Cases
  # Use cases with published manuals that were missing from the dictionary.
  # Added 2026-02-20 from comprehensive analysis of all 11 EC manuals.
  # ═══════════════════════════════════════════════════════════════════════════

  - term: Age Verification
    definition: >-
      An EUDI Wallet use case enabling users to prove they are above a specific
      age threshold (e.g. over 16, 18, or 21) without revealing their exact
      date of birth or other personal details. Age verification uses ISO mdoc
      format (ISO/IEC 18013-5 + 23220-2) with boolean age_over claims derived
      from PID attributes. Verification is supported via the W3C Digital
      Credentials API and OpenID4VP. The EC has flagged Zero-Knowledge Proof
      (ZKP) support as an upcoming capability, which would enable
      cryptographic proof of age without disclosing any additional PID data.
      Age attestation providers are verified against a Commission-maintained
      trusted list.
    source: EC Use Case Manual #02
    note: One of the 19 EUDIW use cases defined by the European Commission; Published

  - term: PID-based Identification
    definition: >-
      An EUDI Wallet use case enabling users to securely identify themselves
      to online services using the Person Identification Data (PID) stored in
      their wallet. The relying party verifies the user's PID to grant access
      to the service. PID-based identification supports both W3C Verifiable
      Credentials and ISO 18013-5/7 mdoc (dual mode), with issuance via
      OpenID4VCI and presentation via OpenID4VP. This is the foundational
      identification use case for the EUDI Wallet — every wallet unit must
      contain at least one valid PID before it can be used for any other
      operations.
    source: EC Use Case Manual #04
    note: One of the 19 EUDIW use cases defined by the European Commission; Published

  - term: Identification in Proximity Scenarios
    definition: >-
      An EUDI Wallet use case enabling relying parties to identify users in
      physical, face-to-face scenarios using short-range communication
      technologies (NFC, BLE, QR code). Use cases include allowing access to
      premises, law enforcement identity checks, and any situation requiring
      strong assurance of identity in person. Proximity identification uses
      PID attributes in ISO mdoc format, with verification via ISO 18013-5.
      The manual distinguishes supervised flows (e.g. border control, police
      checks with human oversight) from unsupervised flows (e.g. kiosks,
      turnstiles with automated verification). Offline verification — without
      internet connectivity for the data exchange itself — is a key design
      requirement.
    source: EC Use Case Manual #05
    note: One of the 19 EUDIW use cases defined by the European Commission; Published

  - term: eSignature
    definition: >-
      An EUDI Wallet use case enabling users to create qualified electronic
      signatures (QES) with the same legal validity as handwritten signatures.
      The wallet supports two creation paths: (1) wallet-driven, where the
      wallet interfaces directly with a local or embedded QSCD; and
      (2) QTSP-driven, where the wallet connects to a remote QSCD managed by
      a qualified trust service provider (rQSCD, governed by IR 2025/1567).
      The use case supports ETSI signature profiles (PAdES, XAdES, CAdES)
      and the ASiC container format for long-term archival validation.
      Verification follows EU Trusted Lists and ETSI TS 119 102-2 validation
      protocols. Wallet users who are natural persons have free-of-charge
      access to qualified signature creation for non-professional purposes.
    source: EC Use Case Manual #07
    note: One of the 19 EUDIW use cases defined by the European Commission; Published. Distinct from the 'qualified electronic signature' term which defines the credential type rather than the use case.

  - term: Payment Authentication
    definition: >-
      An EUDI Wallet use case enabling the authentication of payment requests
      through EUDI Wallets for both online and in-store transactions. The use
      case leverages existing payment infrastructures such as SEPA Credit
      Transfer (SCT), including instant and traditional account-to-account
      payments, and card payments. The wallet enables Strong Customer
      Authentication (SCA) as required by PSD2 Article 97 via dedicated SCA
      Attestations issued by Payment Service Providers. Online transactions
      support enriched checkouts where identity attributes (e.g. age) or
      attestations (e.g. driving licence) can be shared alongside payment
      authentication. The use case operates in VC mode using OID4VCI for
      issuance and OID4VP for presentation, with proximity ("contactless")
      scenarios via ISO/IEC 18013-5 planned for the future. Compatibility
      with EMV 3-D Secure for online card transactions and SEPA Instant
      Credit Transfer flows for bank transfers is maintained.
    source: EC Use Case Manual #11
    note: One of the 19 EUDIW use cases defined by the European Commission; Published

  # ═══════════════════════════════════════════════════════════════════════════
  # EC Use Case Terms — Coming Soon Use Cases
  # Use cases announced by the EC but without published manuals yet.
  # Added 2026-02-20 for terminology completeness.
  # ═══════════════════════════════════════════════════════════════════════════

  - term: Use of a Pseudonym in Online Services
    definition: >-
      An EUDI Wallet use case (coming soon) enabling users to interact with
      digital platforms without revealing their full identity, using
      wallet-generated pseudonyms. Pseudonyms follow the WebAuthn standard
      and are relying party-specific, preventing cross-service tracking
      while enabling secure, passwordless authentication.
    source: EC EUDIW Use Case Portal
    note: One of the 19 EUDIW use cases defined by the European Commission; Coming soon

  - term: Educational Credentials
    definition: >-
      An EUDI Wallet use case (coming soon) enabling users to store, manage,
      and present digitally verifiable education-related credentials such as
      university diplomas, professional qualifications, and training
      certificates.
    source: EC EUDIW Use Case Portal
    note: One of the 19 EUDIW use cases defined by the European Commission; Coming soon

  - term: Natural or Legal Person Representation
    definition: >-
      An EUDI Wallet use case (coming soon) enabling users to act on behalf
      of another individual or an organisation using mandates or powers of
      representation stored in the wallet. This use case ensures legal
      certainty in delegated transactions.
    source: EC EUDIW Use Case Portal
    note: One of the 19 EUDIW use cases defined by the European Commission; Coming soon

  - term: Ticket or Pass
    definition: >-
      An EUDI Wallet use case (coming soon) enabling users to store, manage,
      and present digital tickets or passes for events, transport, or other
      services directly from their wallet.
    source: EC EUDIW Use Case Portal
    note: One of the 19 EUDIW use cases defined by the European Commission; Coming soon

  - term: Public Warnings
    definition: >-
      An EUDI Wallet use case (coming soon) enabling trusted public
      authorities to send critical alerts and public safety warnings
      directly to citizens through their EUDI Wallets.
    source: EC EUDIW Use Case Portal
    note: One of the 19 EUDIW use cases defined by the European Commission; Coming soon

  - term: European Student Card
    definition: >-
      An EUDI Wallet use case (coming soon) enabling students to store and
      present their student status digitally, facilitating cross-border
      academic mobility and access to student services across Member States.
    source: EC EUDIW Use Case Portal
    note: One of the 19 EUDIW use cases defined by the European Commission; Coming soon

  - term: Open Bank Account
    definition: >-
      An EUDI Wallet use case (coming soon) enabling individuals to open a
      bank account online using their EUDI Wallet for identity verification
      and Know Your Customer (KYC) procedures, streamlining the onboarding
      process for financial services.
    source: EC EUDIW Use Case Portal
    note: One of the 19 EUDIW use cases defined by the European Commission; Coming soon

  # ═══════════════════════════════════════════════════════════════════════════
  # Technical Protocol & Format Terms (from EC Use Case Manuals)
  # Core protocols and credential formats referenced across multiple manuals
  # but not previously defined as standalone dictionary entries.
  # Added 2026-02-20.
  # ═══════════════════════════════════════════════════════════════════════════

  - term: OpenID for Verifiable Presentations
    definition: >-
      An OpenID-based protocol enabling wallet units to present verifiable
      credentials and attestations to relying parties over the internet.
      OID4VP is the primary presentation protocol for remote flows in the
      EUDI Wallet ecosystem — all wallet units must support it as the
      baseline presentation mechanism. It defines how relying parties
      construct presentation requests, how wallet units respond with VP
      Tokens containing disclosed attributes, and how selective disclosure
      is achieved. OID4VP works in conjunction with OID4VCI (for issuance)
      and can be combined with ISO 18013-5 for proximity scenarios. The
      protocol is specified in CIR 2024/2982 Art. 5 and referenced in
      every published EC Use Case Manual.
    source: Synthesized from ARF Topic 6; CIR 2024/2982 Art. 5; EC Use Case Manuals (all)
    note: Core EUDIW protocol; referenced in 9 of 11 published use case manuals
    aliases:
      - OID4VP

  - term: OpenID for Verifiable Credential Issuance
    definition: >-
      An OpenID-based protocol enabling PID providers and attestation
      providers to issue verifiable credentials into wallet units. OID4VCI
      defines the issuance flow: the wallet unit presents its Wallet Unit
      Attestation (WUA), the provider verifies it, and then issues the
      credential cryptographically bound to the wallet's key material.
      OID4VCI is the standard issuance protocol for the EUDI Wallet
      ecosystem, used for PIDs, mDLs, health attestations, SCA
      Attestations, and other credential types. It operates via standard
      HTTPS endpoints with OAuth 2.0-based authorisation.
    source: Synthesized from ARF Annex 4; CIR 2024/2982 Art. 3-4; EC Use Case Manuals (all)
    note: Core EUDIW protocol; referenced in 8 of 11 published use case manuals
    aliases:
      - OID4VCI

  - term: SD-JWT VC
    definition: >-
      Selective Disclosure JSON Web Token for Verifiable Credentials — a
      credential format specified by the IETF that combines the compact,
      widely deployed JWT format with built-in selective disclosure
      capabilities. In the EUDI Wallet ecosystem, SD-JWT VC is one of the
      two primary credential formats (alongside mdoc). It is used for the
      EHIC (per DC4EU pilot), SCA Attestations (per TS12), and is
      supported for PIDs. Each attribute in the credential can be
      individually disclosed or withheld during presentation, enabling
      data minimisation without requiring advanced cryptographic
      techniques. Proof of possession is achieved via Key Binding JWT
      (KB-JWT). The ARF specifies support for both SD-JWT VC and mdoc
      formats.
    source: Synthesized from IETF SD-JWT specification; ARF Annex 2; EC EHIC Manual; EC Payment Auth Manual
    note: One of the two core credential formats in the EUDIW ecosystem

  - term: mdoc
    definition: >-
      Mobile Document — an ISO-standard credential format defined by
      ISO/IEC 18013-5 for proximity presentation and ISO 18013-7 for
      remote presentation. In the EUDI Wallet ecosystem, mdoc is one of
      the two primary credential formats (alongside SD-JWT VC). It uses
      CBOR encoding (Concise Binary Object Representation) and is the
      native format for mobile Driving Licences, PIDs, Health ID
      attestations (ePrescription), and age verification credentials.
      Mdoc supports selective disclosure through the IssuerAuth mechanism,
      where individual data elements within namespaces can be selectively
      included in device responses. Device authentication uses
      DeviceAuth signatures bound to the WSCD. The ARF specifies support
      for both mdoc and SD-JWT VC formats.
    source: Synthesized from ISO/IEC 18013-5; ARF Annex 3; EC mDL, Age Verification, ePrescription Manuals
    note: One of the two core credential formats in the EUDIW ecosystem

  - term: European Social Security Pass
    definition: >-
      A legislative initiative (ESSPASS) included in the European
      Commission's 2026 Work Programme, scheduled for Q3 2026, that aims
      to digitise social security coordination attestations and facilitate
      the exercise of social security rights for people working or moving
      within the EU. ESSPASS is part of a broader "Fair labour mobility
      package" and builds upon the digital EHIC piloted under the DC4EU
      project. It would provide a legal basis for issuing social security
      documents — including the EHIC, the Portable Document A1, and other
      coordination forms — as digital attestations in EUDI Wallets.
    source: EC EHIC Manual; European Commission 2026 Work Programme
    note: Upcoming legislation that would complement eIDAS 2.0 for the social security sector
    aliases:
      - ESSPASS

  - term: Digital Credentials API
    definition: >-
      A W3C web platform API enabling web browsers to mediate the
      presentation of verifiable credentials between relying party
      websites and digital wallets. In the EUDI Wallet ecosystem, the
      Digital Credentials API is specifically referenced in the Age
      Verification use case as the browser-side mechanism for requesting
      age attestation presentation via OpenID4VP. The API provides a
      standardised interface for credential requests, allowing websites
      to invoke wallet-based credential presentation without requiring
      custom protocol integration. It complements QR code and deep-link
      based invocation methods.
    source: EC Age Verification Manual; W3C Digital Credentials API specification
    note: Browser-side API for web-based credential presentation; distinct from the credentials themselves

  - term: EMV 3-D Secure
    definition: >-
      An industry security protocol for authenticating online card
      payments, managed by EMVCo. In the EUDI Wallet ecosystem, the
      Payment Authentication use case is designed for compatibility with
      EMV 3-D Secure flows for online card transactions. This enables
      EUDI Wallet-based Strong Customer Authentication to be integrated
      into existing card payment infrastructure without disrupting
      established merchant checkout processes. The wallet's SCA
      Attestation can serve as the authentication token within the 3-D
      Secure message flow.
    source: EC Payment Authentication Manual; EMVCo specifications
    note: Interoperability bridge between EUDIW SCA and existing card payment infrastructure
