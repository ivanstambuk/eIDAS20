# ═══════════════════════════════════════════════════════════════════════════════
# Canonical Casing Map — Terminology Display Name Overrides
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
# Every term that needs non-default casing is listed here.
# The build pipeline preserves original source casing by default.
# This file provides OVERRIDES for:
#   - Proper concepts that should be Title Case
#   - Acronyms with special casing (AdES, CAdES, etc.)
#   - Legal phrases that must stay lowercase
#   - Generic terms starting with acronyms (ICT risk → preserve ICT)
#
# FORMAT:
#   term-id: "Display Name"
#
# Terms NOT listed here keep their original extracted casing unchanged.
#
# ═══════════════════════════════════════════════════════════════════════════════

